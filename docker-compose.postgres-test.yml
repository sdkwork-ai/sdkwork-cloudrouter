services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdkwork_claw_test
      POSTGRES_USER: sdkwork_claw_test
      POSTGRES_PASSWORD: sdkwork_claw_test_password
    ports:
      - "${SDKWORK_CLAW_POSTGRES_TEST_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sdkwork_claw_test -d sdkwork_claw_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s
