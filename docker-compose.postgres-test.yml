# Bounded json-file log rotation: unbounded container logs eventually fill
# the host disk on long-lived deployments (OPERATIONS_SPEC.md §2.3).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdkwork_ai_test
      POSTGRES_USER: sdkwork_ai_test
      POSTGRES_PASSWORD: sdkwork_ai_test_password
    ports:
      - "${SDKWORK_CLOUDROUTER_POSTGRES_TEST_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sdkwork_ai_test -d sdkwork_ai_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"