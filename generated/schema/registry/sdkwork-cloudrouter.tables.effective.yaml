    quantity_aggregation:
      type: string(32)
      constraints: NOT NULL
    unit_size:
      type: decimal
      constraints: NOT NULL
    unit_price:
      type: decimal
      constraints: NOT NULL
    minimum_quantity:
      type: decimal
      constraints: NOT NULL
    quantity_step: decimal
    currency_code:
      type: string(3)
      constraints: NOT NULL
    conditions:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    tiers:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    formula: json
    priority:
      type: int32
      constraints: NOT NULL
    rate_variant:
      type: string(32)
      constraints: NOT NULL DEFAULT 'standard'
    schedule: json
