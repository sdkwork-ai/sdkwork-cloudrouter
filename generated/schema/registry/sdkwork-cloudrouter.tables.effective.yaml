    - organization_id
    - id
  check_constraints:
  - name: ck_cloudrouter_pricing_rule_amounts
    expression: multiplier >= 0 AND markup_amount >= 0 AND (unit_price_override IS
      NULL OR unit_price_override >= 0)
  - name: ck_cloudrouter_pricing_rule_formula
    expression: (formula_mode = 'multiplier_markup' AND unit_price_override IS NULL)
      OR (formula_mode = 'unit_price_override' AND unit_price_override IS NOT NULL
      AND multiplier = 1 AND markup_amount = 0)
  - name: ck_cloudrouter_pricing_rule_conditions_json
