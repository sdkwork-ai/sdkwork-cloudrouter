  required_columns:
  - user_id
  - conversation_id
  - turn_id
  - sequence_no
  - item_type
  - direction
  - status
  unique_constraints:
  - name: uk_ai_chat_item_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_chat_item_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  - name: uk_ai_chat_item_scope_turn_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_id
    - id
  - name: uk_ai_chat_item_scope_conversation_sequence
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - sequence_no
  foreign_keys:
  - name: fk_ai_chat_item_turn
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_id
    references_table: ai_chat_turn
    references_columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - id
    on_delete: CASCADE
  check_constraints:
  - name: ck_ai_chat_item_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_chat_item_sequence
    expression: sequence_no > 0
