- table: cloudrouter_account_rate_card
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: cloudrouter-rating-service
  common_columns: tenant_entity
  columns:
    subject_type:
      type: string(32)
      constraints: NOT NULL
    subject_id: int64
    subject_code: string(160)
    pricing_plan_tenant_id:
      type: int64
      constraints: NOT NULL
    pricing_plan_organization_id:
      type: int64
      constraints: NOT NULL
    pricing_plan_id:
      type: int64
      constraints: NOT NULL
    priority:
      type: int32
      constraints: NOT NULL
    effective_from:
      type: instant
      constraints: NOT NULL
    effective_to: instant
  unique_constraints:
  - name: uk_cloudrouter_account_rate_card_uuid
    columns:
    - uuid
  - name: uk_cloudrouter_account_rate_card_scope_id
    columns:
    - tenant_id
    - organization_id
    - id
  - name: uk_cloudrouter_account_rate_card_subject_id
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_id
    - pricing_plan_tenant_id
    - pricing_plan_organization_id
    - pricing_plan_id
    where: subject_id IS NOT NULL AND deleted_at IS NULL
  - name: uk_cloudrouter_account_rate_card_subject_code
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_code
    - pricing_plan_tenant_id
    - pricing_plan_organization_id
    - pricing_plan_id
    where: subject_code IS NOT NULL AND deleted_at IS NULL
  foreign_keys:
  - name: fk_cloudrouter_account_rate_card_plan
    columns:
    - pricing_plan_tenant_id
    - pricing_plan_organization_id
    - pricing_plan_id
    references_table: cloudrouter_pricing_plan
    references_columns:
    - tenant_id
    - organization_id
    - id
  check_constraints:
  - name: ck_cloudrouter_account_rate_card_subject
    expression: (subject_id IS NOT NULL AND subject_code IS NULL) OR (subject_id IS
      NULL AND subject_code IS NOT NULL)
  - name: ck_cloudrouter_account_rate_card_subject_type
    expression: subject_type IN ('default', 'api_key', 'account_group', 'account',
      'user', 'organization')
  - name: ck_cloudrouter_account_rate_card_interval
    expression: effective_to IS NULL OR effective_to > effective_from
  indexes:
  - name: uq_cloudrouter_account_rate_card_scope_reference
    columns:
    - tenant_id
    - organization_id
    - id
    unique: true
  - name: idx_cloudrouter_account_rate_card_resolve
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_id
    - status
    - priority
    - effective_from
    - id
  - name: idx_cloudrouter_account_rate_card_code
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_code
    - status
    - priority
    - effective_from
    - id
  imported: false
- table: cloudrouter_charge_line
  domain: commerce
  profile: ledger_source_fact
  compliance_level: L3
  system_of_record: true
  write_owner: cloudrouter-charging-service
  common_columns: ledger_source_fact
  columns:
    invocation_id:
      type: string(128)
      constraints: NOT NULL
    rating_decision_id:
      type: int64
      constraints: NOT NULL
    account_id: int64
    charge_status:
      type: string(32)
      constraints: NOT NULL
    product_code:
      type: string(160)
      constraints: NOT NULL
    operation_code:
      type: string(160)
      constraints: NOT NULL
    meter_code:
      type: string(96)
      constraints: NOT NULL
    quantity:
      type: decimal
      constraints: NOT NULL
    reference_amount:
      type: decimal
      constraints: NOT NULL
    cost_amount:
      type: decimal
      constraints: NOT NULL
    amount:
      type: decimal
      constraints: NOT NULL
    currency_code:
      type: string(10)
      constraints: NOT NULL
    charged_at:
      type: instant
      constraints: NOT NULL
    settlement_id: int64
    settled_at: instant
  unique_constraints:
  - name: uk_cloudrouter_charge_line_scope_id
    columns:
    - tenant_id
    - organization_id
    - id
  - name: uk_cloudrouter_charge_line_idempotency
    columns:
    - tenant_id
    - organization_id
    - idempotency_key
  - name: uk_cloudrouter_charge_line_decision
    columns:
    - tenant_id
    - organization_id
    - rating_decision_id
  foreign_keys:
  - name: fk_cloudrouter_charge_line_decision
    columns:
    - tenant_id
    - organization_id
    - rating_decision_id
    references_table: cloudrouter_rating_decision
    references_columns:
    - tenant_id
    - organization_id
    - id
  check_constraints:
  - name: ck_cloudrouter_charge_line_amount
    expression: quantity > 0 AND reference_amount >= 0 AND cost_amount >= 0 AND amount
      > 0
  - name: ck_cloudrouter_charge_line_status
    expression: charge_status IN ('rated', 'pending', 'settled', 'reversed', 'failed')
  - name: ck_cloudrouter_charge_line_currency
    expression: currency_code ~ '^[A-Z]{3}$'
  - name: ck_cloudrouter_charge_line_settlement
    expression: (settlement_id IS NULL AND settled_at IS NULL) OR (settlement_id IS
      NOT NULL AND settled_at IS NOT NULL)
  indexes:
  - name: idx_cloudrouter_charge_line_dashboard
    columns:
    - tenant_id
    - organization_id
    - user_id
    - charge_status
    - charged_at
    - invocation_id
    - id
  - name: idx_cloudrouter_charge_line_settlement
    columns:
    - tenant_id
    - organization_id
    - charge_status
    - settled_at
    - id
  - name: idx_cloudrouter_charge_line_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 7y
      grace_period: 24h
    cleanup:
      owner: cloudrouter-billing-retention-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: cloudrouter-billing-retention-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: retention_until IS NOT NULL AND retention_until <= :now AND legal_hold
        = false
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
  imported: false
