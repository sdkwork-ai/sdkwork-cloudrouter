  - name: fk_pricing_rate_book_dimensions
    columns:
    - tenant_id
    - organization_id
    - price_book_id
    - vendor_code
    - region_code
    - currency_code
    references_table: pricing_price_book
    references_columns:
    - tenant_id
    - organization_id
    - id
    - vendor_code
    - region_code
    - currency_code
  check_constraints:
  - name: ck_pricing_rate_quantities
    expression: unit_size > 0 AND unit_price >= 0 AND minimum_quantity >= 0 AND (quantity_step
      IS NULL OR quantity_step > 0)
  - name: ck_pricing_rate_interval
    expression: effective_to IS NULL OR effective_to > effective_from
  - name: ck_pricing_rate_billability
    expression: billability IN ('chargeable', 'free', 'not_applicable', 'unknown')
  - name: ck_pricing_rate_charge_timing
    expression: charge_timing IN ('request_accepted', 'successful_result', 'usage_reported')
  - name: ck_pricing_rate_calculation_mode
    expression: calculation_mode IN ('per_unit', 'flat', 'graduated', 'volume', 'formula')
  - name: ck_pricing_rate_quantity_aggregation
    expression: quantity_aggregation IN ('sum', 'maximum', 'minimum', 'last', 'distinct_invocation')
  - name: ck_pricing_rate_flat_unit_size
    expression: calculation_mode <> 'flat' OR unit_size = 1
  - name: ck_pricing_rate_chargeable_price
    expression: billability <> 'chargeable' OR unit_price > 0
  - name: ck_pricing_rate_non_chargeable_price
    expression: billability NOT IN ('free', 'not_applicable') OR unit_price = 0
  - name: ck_pricing_rate_currency
    expression: currency_code ~ '^[A-Z]{3}$'
  - name: ck_pricing_rate_conditions_json
    expression: jsonb_typeof(conditions) = 'array'
  - name: ck_pricing_rate_tiers_json
    expression: jsonb_typeof(tiers) = 'array'
  - name: ck_pricing_rate_formula_json
    expression: formula IS NULL OR jsonb_typeof(formula) = 'object'
  - name: ck_pricing_rate_variant
    expression: rate_variant IN ('standard', 'time_window')
  - name: ck_pricing_rate_schedule_json
    expression: schedule IS NULL OR jsonb_typeof(schedule) = 'object'
  - name: ck_pricing_rate_schedule_variant
    expression: (rate_variant = 'standard' AND schedule IS NULL) OR (rate_variant
      = 'time_window' AND schedule IS NOT NULL)
  - name: ck_pricing_rate_calculation_payload
    expression: (calculation_mode IN ('graduated', 'volume')) = (jsonb_array_length(tiers)
      > 0) AND (calculation_mode = 'formula') = (formula IS NOT NULL)
  indexes:
  - name: uq_pricing_rate_scope_reference
    columns:
    - tenant_id
    - organization_id
    - id
    unique: true
  - name: uq_pricing_rate_scope_book_reference
    columns:
    - tenant_id
    - organization_id
    - id
    - price_book_id
    unique: true
  - name: idx_pricing_rate_resolve
    columns:
    - tenant_id
    - organization_id
    - catalog_key
    - product_code
    - operation_code
    - meter_code
    - provider_code
    - region_code
    - billability
    - status
    - priority
    - effective_from
    - id
  imported: false
