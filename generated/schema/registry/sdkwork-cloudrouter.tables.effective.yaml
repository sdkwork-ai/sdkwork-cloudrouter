  common_columns: user_runtime_entity
  api_surfaces:
  - app
  - worker
  columns:
    status:
      type: string(32)
      constraints: NOT NULL DEFAULT 'active'
    conversation_id:
      type: int64
      constraints: NOT NULL
    turn_id:
      type: int64
      constraints: NOT NULL
    runtime_invocation_id: int64
    snapshot_no:
      type: int64
      constraints: NOT NULL
    strategy:
      type: string(64)
      constraints: NOT NULL
    included_item_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    excluded_item_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    included_memory_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    excluded_memory_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    memory_pack:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    memory_token_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    provider_conversation_id: string(128)
    previous_response_id: string(128)
    input_token_estimate:
      type: int64
      constraints: NOT NULL DEFAULT 0
    truncation_reason: string(128)
    context_json:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
  required_columns:
  - user_id
  - conversation_id
  - turn_id
  - snapshot_no
  - strategy
  - included_item_ids
  - excluded_item_ids
  - included_memory_ids
  - excluded_memory_ids
  - memory_pack
  - memory_token_count
  - input_token_estimate
  - context_json
  unique_constraints:
  - name: uk_ai_chat_context_snapshot_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_chat_context_snapshot_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  - name: uk_ai_chat_context_snapshot_scope_turn_no
    columns:
    - tenant_id
    - organization_id
    - user_id
    - turn_id
    - snapshot_no
  foreign_keys:
  - name: fk_ai_chat_context_snapshot_turn
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_id
    references_table: ai_chat_turn
    references_columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - id
    on_delete: CASCADE
  - name: fk_ai_chat_context_snapshot_invocation
    columns:
    - tenant_id
    - organization_id
    - user_id
    - runtime_invocation_id
    references_table: ai_runtime_invocation
    references_columns:
    - tenant_id
    - organization_id
    - user_id
    - id
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_chat_context_snapshot_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_chat_context_snapshot_status
    expression: status IN ('active', 'superseded', 'deleted')
  - name: ck_ai_chat_context_snapshot_values
    expression: snapshot_no > 0 AND memory_token_count >= 0 AND input_token_estimate
      >= 0 AND length(trim(strategy)) > 0
  indexes:
  - name: idx_ai_chat_context_snapshot_conversation_created
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - created_at
    - id
  - name: idx_ai_chat_context_snapshot_invocation
    columns:
    - tenant_id
    - organization_id
    - user_id
    - runtime_invocation_id
    - id
  imported: false
- table: ai_chat_conversation
  domain: ai
  profile: user_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: user_runtime_entity
  api_surfaces:
  - app
  - worker
  frontend_routes:
  - /playground
  columns:
    data_scope:
      type: int32
      constraints: NOT NULL DEFAULT 1
    status:
      type: string(32)
      constraints: NOT NULL DEFAULT 'active'
    version:
      type: int64
      constraints: NOT NULL DEFAULT 0
    deleted_at: instant
    deleted_by: int64
    conversation_code:
      type: string(64)
      constraints: NOT NULL
    title:
      type: string(256)
      constraints: NOT NULL
    source_surface:
      type: string(64)
      constraints: NOT NULL DEFAULT 'chat'
    default_provider: string(128)
    default_model: string(128)
    agent_id: string(128)
    agent_session_id: string(128)
    memory_space_id: string(128)
    last_message_preview: string(1024)
    message_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    turn_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    item_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    input_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    output_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    cached_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    reasoning_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    cost_amount_total:
      type: decimal
      constraints: NOT NULL DEFAULT 0
    currency: string(10)
    last_turn_id: int64
    last_item_id: int64
  required_columns:
  - user_id
  - conversation_code
  - title
  - source_surface
  unique_constraints:
  - name: uk_ai_chat_conversation_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_chat_conversation_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  - name: uk_ai_chat_conversation_scope_code
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_code
  check_constraints:
  - name: ck_ai_chat_conversation_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_chat_conversation_status
    expression: status IN ('active', 'archived', 'deleted')
  - name: ck_ai_chat_conversation_non_negative_counts
    expression: message_count >= 0 AND turn_count >= 0 AND item_count >= 0 AND input_token_total
      >= 0 AND output_token_total >= 0 AND cached_token_total >= 0 AND reasoning_token_total
      >= 0 AND cost_amount_total >= 0 AND version >= 0
  - name: ck_ai_chat_conversation_last_ids
    expression: (last_turn_id IS NULL OR last_turn_id > 0) AND (last_item_id IS NULL
      OR last_item_id > 0)
  - name: ck_ai_chat_conversation_currency
    expression: currency IS NULL OR length(trim(currency)) BETWEEN 3 AND 10
  indexes:
  - name: idx_ai_chat_conversation_user_status_updated
    columns:
    - tenant_id
    - organization_id
    - user_id
    - status
    - updated_at
    - id
  imported: false
