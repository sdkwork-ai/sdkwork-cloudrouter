- table: pricing_import_run
  domain: commerce
  profile: event_log
  tenant_scope: tenant_with_global_fallback
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: event_log
  columns:
    source_system:
      type: string(64)
      constraints: NOT NULL
    source_catalog_version:
      type: string(128)
      constraints: NOT NULL
    source_hash:
      type: string(128)
      constraints: NOT NULL
    import_state:
      type: string(32)
      constraints: NOT NULL
    row_count:
      type: int64
      constraints: NOT NULL
    accepted_count:
      type: int64
      constraints: NOT NULL
    rejected_count:
      type: int64
      constraints: NOT NULL
    staged_at:
      type: instant
      constraints: NOT NULL
    activated_at: instant
    failure_summary: string(1024)
  unique_constraints:
  - name: uk_pricing_import_run_uuid
    columns:
    - uuid
  - name: uk_pricing_import_run_scope_id
    columns:
    - tenant_id
    - organization_id
    - id
  - name: uk_pricing_import_run_source
    columns:
    - tenant_id
    - organization_id
    - source_system
    - source_catalog_version
    - source_hash
  check_constraints:
  - name: ck_pricing_import_run_counts
    expression: row_count >= 0 AND accepted_count >= 0 AND rejected_count >= 0 AND
      accepted_count + rejected_count <= row_count
  - name: ck_pricing_import_run_state
    expression: import_state IN ('staging', 'validated', 'activated', 'rejected',
      'failed')
  indexes:
  - name: uq_pricing_import_run_scope_reference
    columns:
    - tenant_id
    - organization_id
    - id
    unique: true
  - name: idx_pricing_import_run_latest
    columns:
    - tenant_id
    - organization_id
    - source_system
    - import_state
    - staged_at
    - id
  - name: idx_pricing_import_run_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 24mo
      archive_retention: 7y
      grace_period: 24h
    cleanup:
      owner: pricing-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: pricing-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: retention_until IS NOT NULL AND retention_until <= :now AND legal_hold
        = false
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
  imported: false
