  foreign_keys:
  - name: fk_cloudrouter_rating_decision_measurement
    columns:
    - tenant_id
    - organization_id
    - measurement_id
    references_table: cloudrouter_usage_measurement
    references_columns:
    - tenant_id
    - organization_id
    - id
  - name: fk_cloudrouter_rating_decision_book
    columns:
    - price_book_tenant_id
    - price_book_organization_id
    - price_book_id
    references_table: pricing_price_book
    references_columns:
    - tenant_id
    - organization_id
    - id
  - name: fk_cloudrouter_rating_decision_rate
    columns:
    - price_book_tenant_id
    - price_book_organization_id
    - rate_id
    - price_book_id
    references_table: pricing_rate
    references_columns:
    - tenant_id
    - organization_id
    - id
    - price_book_id
  - name: fk_cloudrouter_rating_decision_rate_card
    columns:
    - account_rate_card_tenant_id
    - account_rate_card_organization_id
    - account_rate_card_id
    references_table: cloudrouter_account_rate_card
    references_columns:
    - tenant_id
    - organization_id
    - id
  - name: fk_cloudrouter_rating_decision_plan
    columns:
    - pricing_plan_tenant_id
    - pricing_plan_organization_id
    - pricing_plan_id
    references_table: cloudrouter_pricing_plan
    references_columns:
    - tenant_id
    - organization_id
    - id
  - name: fk_cloudrouter_rating_decision_rule
    columns:
    - pricing_plan_tenant_id
    - pricing_plan_organization_id
    - pricing_rule_id
    - pricing_plan_id
    references_table: cloudrouter_pricing_rule
    references_columns:
    - tenant_id
    - organization_id
    - id
    - pricing_plan_id
  check_constraints:
  - name: ck_cloudrouter_rating_decision_quantity
    expression: measured_quantity >= 0 AND rated_quantity >= 0
  - name: ck_cloudrouter_rating_decision_status
    expression: decision_status IN ('rated', 'non_chargeable', 'unrated')
  - name: ck_cloudrouter_rating_decision_billability
    expression: billability IN ('chargeable', 'free', 'not_applicable', 'unknown')
  - name: ck_cloudrouter_rating_decision_strategy
    expression: strategy_code IS NULL OR strategy_code IN ('flat_fee', 'token_usage',
      'api_call', 'image_quantity', 'duration', 'unit_quantity', 'graduated_tier',
      'volume_tier', 'formula')
  - name: ck_cloudrouter_rating_decision_calculation_mode
    expression: calculation_mode IS NULL OR calculation_mode IN ('per_unit', 'flat',
      'graduated', 'volume', 'formula')
  - name: ck_cloudrouter_rating_decision_rate_identity
    expression: (price_book_tenant_id IS NULL AND price_book_organization_id IS NULL
      AND price_book_id IS NULL AND rate_id IS NULL) OR (price_book_tenant_id IS NOT
      NULL AND price_book_organization_id IS NOT NULL AND price_book_id IS NOT NULL
      AND rate_id IS NOT NULL)
  - name: ck_cloudrouter_rating_decision_rate_card_identity
    expression: (account_rate_card_tenant_id IS NULL AND account_rate_card_organization_id
      IS NULL AND account_rate_card_id IS NULL) OR (account_rate_card_tenant_id IS
      NOT NULL AND account_rate_card_organization_id IS NOT NULL AND account_rate_card_id
      IS NOT NULL)
  - name: ck_cloudrouter_rating_decision_plan_identity
    expression: (pricing_plan_tenant_id IS NULL AND pricing_plan_organization_id IS
      NULL AND pricing_plan_id IS NULL AND pricing_rule_id IS NULL) OR (pricing_plan_tenant_id
      IS NOT NULL AND pricing_plan_organization_id IS NOT NULL AND pricing_plan_id
      IS NOT NULL AND pricing_rule_id IS NOT NULL)
  - name: ck_cloudrouter_rating_decision_amount
    expression: (decision_status = 'rated' AND billability = 'chargeable' AND reference_unit_price
      IS NOT NULL AND reference_unit_price >= 0 AND (cost_unit_price IS NULL OR cost_unit_price
      >= 0) AND unit_price IS NOT NULL AND unit_price >= 0 AND reference_amount IS
      NOT NULL AND reference_amount >= 0 AND (cost_amount IS NULL OR cost_amount >=
      0) AND amount IS NOT NULL AND amount >= 0 AND currency_code IS NOT NULL AND
      unit_size > 0 AND strategy_code IS NOT NULL AND calculation_mode IS NOT NULL
      AND price_book_id IS NOT NULL AND rate_id IS NOT NULL AND account_rate_card_id
      IS NOT NULL AND pricing_plan_id IS NOT NULL AND pricing_rule_id IS NOT NULL)
      OR (decision_status = 'non_chargeable' AND billability IN ('free', 'not_applicable')
      AND reference_amount IS NULL AND cost_amount IS NULL AND amount IS NULL AND
      currency_code IS NULL AND price_book_id IS NOT NULL AND rate_id IS NOT NULL)
      OR (decision_status = 'unrated' AND billability IN ('chargeable', 'unknown')
      AND reference_amount IS NULL AND cost_amount IS NULL AND amount IS NULL AND
      currency_code IS NULL)
  - name: ck_cloudrouter_rating_decision_currency
    expression: currency_code IS NULL OR currency_code ~ '^[A-Z]{3}$'
  indexes:
  - name: uq_cloudrouter_rating_decision_scope_reference
    columns:
    - tenant_id
    - organization_id
    - id
    unique: true
  - name: idx_cloudrouter_rating_decision_invocation
    columns:
    - tenant_id
    - organization_id
    - invocation_id
    - decision_status
    - decided_at
    - id
  - name: idx_cloudrouter_rating_decision_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 7y
      grace_period: 24h
    cleanup:
      owner: cloudrouter-billing-retention-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: cloudrouter-billing-retention-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: retention_until IS NOT NULL AND retention_until <= :now AND legal_hold
        = false
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
  imported: false
