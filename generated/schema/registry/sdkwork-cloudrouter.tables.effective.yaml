      constraints: NOT NULL
    rated_quantity:
      type: decimal
      constraints: NOT NULL
    unit_size: decimal
    reference_unit_price: decimal
    cost_unit_price: decimal
    unit_price: decimal
    reference_amount: decimal
    cost_amount: decimal
    amount: decimal
    currency_code: string(10)
    billing_components:
      type: json
      constraints: NOT NULL
    pricing_snapshot:
      type: json
      constraints: NOT NULL
    decided_at:
      type: instant
      constraints: NOT NULL
  unique_constraints:
  - name: uk_cloudrouter_rating_decision_scope_id
    columns:
    - tenant_id
    - organization_id
    - id
  - name: uk_cloudrouter_rating_decision_idempotency
    columns:
    - tenant_id
    - organization_id
    - idempotency_key
  - name: uk_cloudrouter_rating_decision_measurement
    columns:
    - tenant_id
    - organization_id
