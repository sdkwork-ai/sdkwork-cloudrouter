      type: instant
      constraints: NOT NULL
    effective_to: instant
    source_url:
      type: string(2048)
      constraints: NOT NULL
    source_observed_at:
      type: instant
      constraints: NOT NULL
  unique_constraints:
  - name: uk_pricing_rate_uuid
    columns:
    - uuid
  - name: uk_pricing_rate_scope_id
    columns:
    - tenant_id
    - organization_id
    - id
  - name: uk_pricing_rate_book_code
    columns:
    - tenant_id
    - organization_id
    - price_book_id
    - rate_code
  - name: uk_pricing_rate_book_hash
    columns:
    - tenant_id
    - organization_id
    - price_book_id
    - rate_hash
