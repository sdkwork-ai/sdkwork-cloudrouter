  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  description: '定价方案表 - 价格策略


    行业对标:

    - Stripe Pricing Tables (定价表)

    - AWS Pricing Plans (定价方案)

    - OpenAI Model Pricing (模型定价)


    职责:

    - 定义价格计划主表

    - 定义默认倍率、加价和价格基准

    - 支持多种定价模式（倍率、固定价格、阶梯价）


    关键特性:

    - 多定价模式: 支持倍率、固定价格、阶梯价、表达式计费

    - 灵活绑定: 支持绑定账号、分组、租户或SKU

    - 价格基准: 支持官方参考价、接入成本价、销售价


    数据流向:

    1. pricing-service定义定价方案

    2. ai_usage通过pricing_code关联定价方案

    3. ai_pricing_rule提供具体计费规则

    4. 计算最终收费金额

    '
