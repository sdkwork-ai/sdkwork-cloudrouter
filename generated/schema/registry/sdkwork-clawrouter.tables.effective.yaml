- table: ai_config_change_event
  domain: ai
  profile: runtime_coordination_event
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: runtime_coordination_event
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    config_scope:
      type: string(64)
      constraints: NOT NULL
    changed_object_type: string(64)
    changed_object_id: int64
    config_version:
      type: int64
      constraints: NOT NULL
    event_status:
      type: string(32)
      constraints: NOT NULL DEFAULT 'pending'
    event_payload: json
    published_at: instant
    publish_attempts:
      type: int32
      constraints: NOT NULL DEFAULT 0
    last_error_message: string(512)
  unique_constraints:
  - name: uk_ai_config_change_event_uuid
    columns:
    - uuid
  indexes:
  - name: idx_ai_config_change_event_pending
    columns:
    - tenant_id
    - organization_id
    - event_status
    - created_at
    - id
  - name: idx_ai_config_change_event_scope_version
    columns:
    - tenant_id
    - organization_id
    - config_scope
    - config_version
    - id
  - name: idx_ai_config_change_event_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: ai-routing-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: ai-routing-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: retention_until IS NOT NULL AND retention_until <= :now AND legal_hold
        = false
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
  imported: false
