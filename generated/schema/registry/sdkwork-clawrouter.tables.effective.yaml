    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: router-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: router-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: retention_until IS NOT NULL AND retention_until <= :now AND legal_hold
