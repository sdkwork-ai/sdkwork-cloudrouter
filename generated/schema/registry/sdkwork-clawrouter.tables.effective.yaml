    expression: (prompt_tokens IS NULL OR prompt_tokens >= 0) AND (completion_tokens
      IS NULL OR completion_tokens >= 0) AND (cached_tokens IS NULL OR cached_tokens
      >= 0) AND (total_tokens IS NULL OR total_tokens >= 0) AND (request_count IS
