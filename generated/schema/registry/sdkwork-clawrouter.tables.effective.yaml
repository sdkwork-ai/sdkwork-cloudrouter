  api_surfaces:
  - app
  - backend
  - worker
  columns:
    job_name: string(128)
    job_type: enum_int32
    trigger_type: enum_int32
    started_at: instant
    ended_at: instant
    duration_ms: int64
    execution_status: enum_int32
    processed_count: int64
    success_count: int64
    failure_count: int64
    failure_reason: string(1024)
    payload: json
  semantic_contracts:
    model_ranking_refresh:
      job_name: model_ranking_refresh
      job_type:
        code: 20
        meaning: model ranking refresh
      trigger_types:
        scheduled: 1
        manual: 2
      execution_status:
        running: 1
        succeeded: 2
        failed: 3
        empty: 4
        skipped: 5
      payload_contract:
        required_fields:
        - rankScope
        - snapshotDate
        - snapshotPeriod
        - windowStart
        - windowEnd
        - generatedCount
        - sourceCount
        - refreshIntervalSeconds
        - cacheMaxAgeSeconds
        - nextRefreshAt
        - status
        - attemptCount
        - retryCount
        - consecutiveFailureCount
        - alertRecommended
        - sourceTables
        source_tables:
        - ai_usage
        - ai_model
        - ai_model_rank_snapshot
      runtime_contract:
        scheduler_owner: sdkwork-clawrouter-standalone-gateway
        startup_policy:
          run_on_startup_default: true
        timeout:
          default_millis: 300000
        retry:
          max_retry_attempts_default: 1
          max_retry_attempts_max: 5
        concurrency_lock:
          scope:
          - worker_instance
          - tenant_id
          - organization_id
          - rank_scope
          overlap_behavior: audit_skipped
        cache_invalidation:
          invalidate_after_status:
          - succeeded
          - empty
        delayed_alerting:
          alert_after_consecutive_failures_default: 3
