description: Claw Router Schema Registry. Machine-readable source of truth for Claw
  Router-owned runtime tables; generated SQL, manifests, OpenAPI snapshots, SDKs,
  services, and frontends must align to this contract.
modules:
  ai-routing:
    owner: claw-router-platform
    description: AI routing, upstream supplier, upstream account, account-group, policy,
      quota, and runtime coordination tables.
    compliance_level: L2
    tables_count: 23
    tables:
    - ai_upstream_account
    - ai_upstream_account_health_state
    - ai_upstream_account_credential
    - ai_upstream_account_group
    - ai_upstream_account_group_member
    - ai_upstream_account_group_metric_snapshot
    - ai_upstream_account_group_resource
    - ai_upstream_supplier_resource
    - ai_config_version
    - ai_config_change_event
    - ai_model_mapping_rule
    - ai_model_mapping_rule_binding
    - ai_model_mapping_rule_item
    - ai_upstream_supplier
    - ai_upstream_object_route
    - ai_quota_policy
    - ai_routing_decision_log
    - ai_routing_policy
    - ai_routing_profile
    - ai_routing_rule
    - ai_upstream_supplier_endpoint
    - ai_upstream_supplier_endpoint_health_state
    - ai_upstream_supplier_auth_method
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  ai-metering:
    owner: claw-router-platform
    description: AI usage facts and request traces.
    compliance_level: L3
    tables_count: 2
    tables:
    - ai_usage
    - ai_request_trace
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  ai-pricing:
    owner: claw-router-platform
    description: AI pricing plans, bindings, rules, tiers, and import snapshots.
    compliance_level: L2
    tables_count: 5
    tables:
    - ai_pricing_import_snapshot
    - ai_pricing_plan
    - ai_pricing_plan_binding
    - ai_pricing_rule
    - ai_pricing_tier
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  iam-gateway:
    owner: claw-router-platform
    description: Gateway-owned IAM API key, access policy, account-group binding,
      and risk rule tables used by Claw Router runtime.
    compliance_level: L2
    tables_count: 4
    tables:
    - iam_gateway_access_policy
    - iam_gateway_api_key
    - iam_gateway_api_key_account_group
    - iam_gateway_risk_rule
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  ops-runtime:
    owner: claw-router-platform
    description: Claw Router-owned operational runtime tables for audit logs, job
      execution history, gateway health, monitoring snapshots, alerts, and notification
      projections.
    compliance_level: L2
    tables_count: 10
    tables:
    - ops_alert_event
    - ops_audit_log
    - ops_config_snapshot
    - ops_gateway_heartbeat
    - ops_gateway_instance
    - ops_job_execution
    - ops_metric_snapshot
    - ops_notification_message
    - ops_notification_recipient
    - ops_notification_delivery
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
data_flow:
  usage_to_account:
    description: 用量推送到账户模块
    steps:
    - ai_usage写入（claw-router本地）
    - 发布UsageRecorded事件
    - sdkwork-account订阅事件
    - commerce_account_ledger_entry写入（sdkwork-account本地）
  authentication:
    description: API Key验证
    steps:
    - Client请求携带api_key
    - router-service调用sdkwork-iam-sdk
    - iam-service验证iam_api_key（sdkwork-iam本地）
    - 返回验证结果
  monitoring:
    description: 监控数据推送
    steps:
    - router-service记录运行监控和作业审计
    - ops-runtime本地表提供可分页的监控、通知和审计读模型
    - ops_metric_snapshot、ops_job_execution、ops_audit_log写入（claw-router本地）
statistics:
  claw_router_local_tables: 45
  composed_dependency_tables: 19
  total_tables: 64
  table_prefix_distribution:
    ai_: 50
    iam_: 4
    ops_: 10
  module_distribution:
    claw-router: 43
    sdkwork-models: 19
    ai-routing: 23
    ai-metering: 3
    ai-pricing: 5
    iam-gateway: 4
    ops-runtime: 10
compliance:
  financial_tables:
  - ai_usage
  security_tables:
  - iam_gateway_access_policy
  - iam_gateway_api_key
  - iam_gateway_api_key_account_group
  - iam_gateway_risk_rule
  audit_tables:
  - ai_request_trace
  - ai_routing_decision_log
  - ops_audit_log
  - ops_job_execution
  retention_policy:
    financial_data:
      online_retention: 12mo
      archive_retention: 5y
    audit_data:
      online_retention: 12mo
      archive_retention: 5y
    usage_data:
      online_retention: 12mo
      archive_retention: 5y
