[package]
name = "sdkwork-cloudrouter-database-host"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "SDKWork Cloud Router database lifecycle bootstrap."

[lib]
name = "sdkwork_cloudrouter_database_host"
path = "src/lib.rs"

[dependencies]
dotenvy = "0.15"
sdkwork-database-config = { workspace = true }
sdkwork-database-lifecycle = { workspace = true }
sdkwork-database-spi = { workspace = true }
sdkwork-database-sqlx = { workspace = true }
sha2 = "0.10"
hex.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "repair_pricing_migration_history"
path = "examples/repair_pricing_migration_history.rs"

[dev-dependencies]
sqlx.workspace = true
tokio.workspace = true
