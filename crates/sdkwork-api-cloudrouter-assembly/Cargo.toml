[package]
name = "sdkwork-api-cloudrouter-assembly"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Generated API assembly for sdkwork-cloudrouter application HTTP plane."

[lib]
name = "sdkwork_api_cloudrouter_assembly"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
# `feeds_open_runtime.rs` wires the shared rate-limit / idempotency /
# concurrent-admission stores, which `sdkwork-web-bootstrap` gates behind its
# `redis` feature. The standalone gateway already enables it; without the same
# opt-in here this crate fails to compile under its own default feature set
# (E0425), which also keeps the bootstrap route-prefix assertion unreachable.
sdkwork-web-bootstrap = { workspace = true, features = ["redis"] }
sdkwork-web-core.workspace = true
anyhow.workspace = true
sdkwork-cloudrouter-http.workspace = true
sdkwork-cloudrouter-security.workspace = true
sdkwork-cloudrouter-edge-runtime.workspace = true
sdkwork_api_models_assembly.workspace = true
sdkwork-web-contract.workspace = true
sdkwork-iam-database-host.workspace = true
sdkwork-iam-embedded-application-bootstrap.workspace = true
sdkwork-routes-iam-app-api.workspace = true
sdkwork_account_repository_sqlx.workspace = true
sdkwork_account_service_host.workspace = true
tracing.workspace = true
tower.workspace = true
serde_json.workspace = true
sdkwork_api_feeds_assembly.workspace = true
sdkwork-iam-web-adapter.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-routes-agent-open-api.workspace = true
sdkwork-routes-audio-open-api.workspace = true
sdkwork-routes-cloudrouter-app-api.workspace = true
sdkwork-routes-cloudrouter-backend-api.workspace = true
sdkwork-routes-cloudrouter-drive-open-api.workspace = true
sdkwork-routes-cloudrouter-knowledgebase-open-api.workspace = true
sdkwork-routes-cloudrouter-llm-open-api.workspace = true
sdkwork-routes-cloudrouter-memory-open-api.workspace = true
sdkwork-routes-iaas-open-api.workspace = true
sdkwork-routes-image-open-api.workspace = true
sdkwork-routes-paas-open-api.workspace = true
sdkwork-routes-payment-open-api.workspace = true
sdkwork-routes-video-open-api.workspace = true

[lints]
workspace = true
