[package]
name = "sdkwork-commerce-rpc-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SDKWork commerce standalone gRPC host process for local/private deployments."

[[bin]]
name = "sdkwork-commerce-rpc-host"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
sdkwork_commerce_service_host.workspace = true
tokio.workspace = true

[dev-dependencies]
sdkwork_commerce_storage_repository_sqlx.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
