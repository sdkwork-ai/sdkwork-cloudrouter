[package]
name = "sdkwork-commerce-service-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SDKWork commerce local/private Rust runtime composition for first-slice commerce services."

[lib]
path = "src/lib.rs"

[dependencies]
sdkwork_commerce_contract_service.workspace = true
sdkwork_commerce_account_service.workspace = true
sdkwork_commerce_catalog_service.workspace = true
sdkwork_commerce_inventory_service.workspace = true
sdkwork_commerce_order_service.workspace = true
sdkwork_commerce_payment_service.workspace = true
sdkwork_commerce_invoice_service.workspace = true
sdkwork_commerce_promotion_service.workspace = true
sdkwork_commerce_membership_service.workspace = true
sdkwork_commerce_shop_service.workspace = true
sdkwork_commerce_rpc = { workspace = true, features = ["server"] }
sdkwork_commerce_storage_repository_sqlx.workspace = true
sdkwork-database-sqlx.workspace = true
sdkwork-iam-web-adapter.workspace = true
sdkwork_iam_context_service.workspace = true
sdkwork-web-core.workspace = true
sdkwork-rpc-discovery.workspace = true
sdkwork-rpc-server.workspace = true
sdkwork-rpc-client.workspace = true
sdkwork-rpc-core.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite"] }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
