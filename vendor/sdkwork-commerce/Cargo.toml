[workspace]
members = [
    "crates/sdkwork-commerce-bootstrap-manifest",
    "crates/sdkwork-commerce-api-server",
    "crates/sdkwork-commerce-router-composition",
    "crates/sdkwork-commerce-database-host",
    "crates/sdkwork-commerce-service-host",
    "crates/sdkwork-commerce-rpc-host",
    "crates/sdkwork-commerce-rpc",
    "crates/sdkwork-commerce-rpc-proto",
    "crates/sdkwork-commerce-storage-repository-sqlx",
    "crates/sdkwork-commerce-tauri-host",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# SDKWork workspace members - declared once at workspace root
# Keys use Rust snake_case import aliases; package fields point at kebab-case Cargo package names.
sdkwork_commerce_account_service = { path = "../../../sdkwork-account/crates/sdkwork-commerce-account-service", package = "sdkwork-commerce-account-service" }
sdkwork_commerce_account_repository_sqlx = { path = "../../../sdkwork-account/crates/sdkwork-commerce-account-repository-sqlx", package = "sdkwork-commerce-account-repository-sqlx" }
