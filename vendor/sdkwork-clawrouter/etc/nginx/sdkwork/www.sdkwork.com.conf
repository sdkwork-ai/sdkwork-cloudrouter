# SDKWork Claw Router nginx reverse proxy
# Domain: www.sdkwork.com
# Site family: sdkwork
# Site type: web
# Deploy path: /etc/nginx/sites-enabled/sdkwork/www.sdkwork.com.conf
# Upstream: http://127.0.0.1:3900
# Certificate root: /opt/certs/letsencrypt/live

server {
    listen 80;
    listen [::]:80;
    server_name www.sdkwork.com;
    access_log /var/log/nginx/www.sdkwork.com.access.log;
    error_log /var/log/nginx/www.sdkwork.com.error.log;
    client_max_body_size 1100m;

    location ~ ^/([a-zA-Z0-9_-]+)\.txt$ {
        set $filename $1.txt;
        set $host_name $host;
        set $proxy_url http://127.0.0.1:3900/backend/v3/api/net/dns/record/verify?filename=$filename&host=$host_name;
        proxy_pass $proxy_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sdkwork.com;
    access_log /var/log/nginx/www.sdkwork.com.access.log;
    error_log /var/log/nginx/www.sdkwork.com.error.log;

    ssl_certificate /opt/certs/letsencrypt/live/sdkwork.com/fullchain.pem;
    ssl_certificate_key /opt/certs/letsencrypt/live/sdkwork.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SDKWORK_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1100m;

    location ~ ^/([a-zA-Z0-9_-]+)\.txt$ {
        set $filename $1.txt;
        set $host_name $host;
        set $proxy_url http://127.0.0.1:3900/backend/v3/api/net/dns/record/verify?filename=$filename&host=$host_name;
        proxy_pass $proxy_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
