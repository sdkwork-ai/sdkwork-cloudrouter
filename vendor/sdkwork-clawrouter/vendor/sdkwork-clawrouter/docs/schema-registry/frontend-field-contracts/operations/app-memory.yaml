fragment: operations/app-memory
frontend_operations:
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: listMemorySpaces
  operation_scope: app_shell
  operation_id: memory.spaces.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/memory/spaces
  sdk_domain: memory
  openapi_exposed: false
  summary: List memory spaces for Playground
  description: Lists memory spaces through the sdkwork-memory app SDK without Claw Router memory tables.
  read_sources:
  - ai_agent
  query_parameters:
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: createMemorySpace
  operation_scope: app_shell
  operation_id: memory.spaces.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/memory/spaces
  sdk_domain: memory
  openapi_exposed: false
  summary: Create memory space for Playground
  description: Creates a memory space through the sdkwork-memory app SDK.
  read_sources:
  - ai_agent
  write_tables: []
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: retrieveMemorySpace
  operation_scope: app_shell
  operation_id: memory.spaces.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/memory/spaces/{spaceId}
  sdk_domain: memory
  openapi_exposed: false
  summary: Retrieve memory space for Playground
  description: Retrieves one memory space through the sdkwork-memory app SDK.
  read_sources:
  - ai_agent
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: listMemoryEntries
  operation_scope: app_shell
  operation_id: memory.entries.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/memory/spaces/{spaceId}/entries
  sdk_domain: memory
  openapi_exposed: false
  summary: List memory entries for Playground
  description: Lists memory entries in a space through the sdkwork-memory app SDK.
  read_sources:
  - ai_agent
  query_parameters:
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: createMemoryEntry
