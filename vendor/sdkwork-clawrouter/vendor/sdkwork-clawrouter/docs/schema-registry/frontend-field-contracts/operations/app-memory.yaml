  summary: Create memory entry for Playground
  description: Creates a memory entry through the sdkwork-memory app SDK.
  read_sources:
  - ai_agent
  write_tables: []
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: retrieveMemoryEntry
