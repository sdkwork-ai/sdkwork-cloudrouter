fragment: operations/backend-messaging
frontend_operations:
- route: /admin/messaging/providers
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-messaging/src/messagingService.ts
  operation: listMessagingProviderAccounts
  operation_id: providerAccounts.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/messaging/provider_accounts
  sdk_domain: messaging
  summary: List messaging provider accounts
  read_sources: [messaging_provider_capability]
  query_parameters:
  - name: page
    schema: { type: integer, format: int64, minimum: 1 }
  - name: page_size
    schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
  - name: q
    schema: { type: string, maxLength: 128 }
  - name: status
    schema: { type: string, maxLength: 32 }
  - name: channel
    schema: { type: string, maxLength: 32 }
  - name: provider_code
    schema: { type: string, maxLength: 64 }
  response_schema:
    name: MessagingProviderAccountListResponse
    type: object
    additionalProperties: false
    required: [items, total, page, pageSize]
    properties:
      items:
        type: array
        maxItems: 200
        items: &messagingRecordItem
          type: object
          additionalProperties: true
          properties:
            id: { type: string, maxLength: 128 }
            status: { type: string, maxLength: 32 }
            channel: { type: string, maxLength: 32 }
      total: { type: integer, format: int64, minimum: 0 }
      page: { type: integer, format: int64, minimum: 1 }
      pageSize: { type: integer, format: int64, minimum: 1 }
- route: /admin/messaging/providers
