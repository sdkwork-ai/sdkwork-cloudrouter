  read_sources: [messaging_provider_capability]
  write_tables: [messaging_provider_capability]
  request_schema:
    name: MessagingProviderAccountCreateRequest
    type: object
    additionalProperties: false
    required: [providerCode, accountCode, accountName, channel, credential]
    properties:
      providerCode: { type: string, maxLength: 64 }
      accountCode: { type: string, maxLength: 64 }
      accountName: { type: string, maxLength: 128 }
      channel: { type: string, maxLength: 32 }
      deliveryPurpose: { type: string, maxLength: 64 }
      baseUrl: { type: string, maxLength: 512 }
      credential:
        type: object
        required: [secretRef]
        properties:
          secretRef: { type: string, maxLength: 256 }
          authType: { type: string, maxLength: 64 }
  response_schema:
    name: MessagingProviderAccountCreateResponse
    <<: *messagingRecordItem
