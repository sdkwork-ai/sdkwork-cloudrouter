fragment: operations/app-intelligence
frontend_operations:
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/playgroundService.ts
  operation: fetchGenerationHistory
  operation_scope: app_shell
  operation_id: generations.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/generations
  sdk_domain: generations
  openapi_exposed: false
  read_sources:
  - ai_model
  - ai_model_capability
  summary: List Playground generation history
  description: Lists persisted generation records for the active app user through the sdkwork-generations app SDK.
  query_parameters: []
  response_schema:
    name: GenerationHistoryResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: &id001
          name: GenerationHistoryItem
          type: object
          additionalProperties: false
          required:
          - id
          - date
          - prompt
          - type
          - images
          - videos
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            date:
              type: string
              minLength: 1
              maxLength: 32
            prompt:
              type: string
              maxLength: 4096
            type:
              type: string
              enum:
              - text
              - image
              - images
              - video
              - music
              - audio
              - sfx
            modelInfo:
              type: string
              maxLength: 256
            modelCatalogKey:
              type: string
              maxLength: 256
            asset:
              $ref: '#/components/schemas/MediaResource'
            images:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/MediaResource'
            videos:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/MediaResource'
            aspectRatio:
              type: string
              enum:
              - '1:1'
              - '16:9'
              - '9:16'
            durationSeconds:
              type: integer
              minimum: 0
              maximum: 86400
            status:
              type: string
              enum:
              - pending
              - processing
              - completed
              - failed
              - cancelled
            outputText:
              type: string
              maxLength: 262144
            createdAt:
              type: string
              maxLength: 64
            updatedAt:
              type: string
              maxLength: 64
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/playgroundService.ts
  operation: runGeneration
  operation_scope: app_shell
  operation_id: playground.generations.run
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/generations/images/text_to_image
  sdk_domain: generations
  openapi_exposed: false
  summary: Run Playground asset generation through sdkwork-generations
  description: Creates a modality-specific sdkwork-generations command and reads generated results through the generated generations app SDK facade.
  read_sources:
  - ai_model
  - ai_model_capability
  write_tables: &playgroundGenerationsWriteTables
  - ai_usage_fact
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/playgroundGenerationsService.ts
  operation: runPlaygroundAssetGeneration
  operation_scope: app_shell
  operation_id: playground.generations.asset.run
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/generations/images/text_to_image
  sdk_domain: generations
  openapi_exposed: false
  summary: Run non-agent Playground asset generation
  description: Uses an injected sdkwork-generations service facade to create image, video, music, voice, or sound effect commands and map returned results to Playground artifacts.
  read_sources:
  - ai_model
  - ai_model_capability
  write_tables: *playgroundGenerationsWriteTables
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/playgroundGenerationService.ts
  operation: runPlaygroundGeneration
  operation_scope: app_shell
  operation_id: playground.runtime.generation.run
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/runtime/invocations
  sdk_domain: runtime
  openapi_exposed: false
  summary: Run Playground agent generation through runtime SSE
  description: Creates a runtime invocation, streams generation output, and maps completed runtime artifacts into Playground history without legacy agent session or run APIs.
  read_sources:
  - ai_model
  - ai_model_capability
  write_tables: *playgroundGenerationsWriteTables
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/playgroundService.ts
  operation: runAgentGeneration
  operation_scope: app_shell
  operation_id: playground.runtime.generation.run
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/runtime/invocations
  sdk_domain: runtime
  openapi_exposed: false
  summary: Run Playground agent generation alias
  description: Thin PlaygroundService alias that forwards agent generation requests to the runtime SSE pipeline.
  read_sources:
  - ai_model
  - ai_model_capability
  write_tables: *playgroundGenerationsWriteTables
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/playgroundGenerationsService.ts
  operation: fetchPlaygroundGenerationHistoryFromService
  operation_scope: app_shell
  operation_id: generations.workspace.read
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/generations/workspace
  sdk_domain: generations
  openapi_exposed: false
  summary: Map generations workspace runs to Playground history
  description: Reads sdkwork-generations workspace runs through an injected generation service facade and maps them to Playground history items.
  read_sources:
  - ai_model
  - ai_model_capability
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: listModelCatalog
  operation_id: models.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/models
  openapi_exposed: false
  sdk_domain: intelligence
  summary: List model catalog for Playground
  description: Lists standard app model catalog entries used by Playground model pickers and grouped client-side by vendor and modality.
  read_sources:
  - ai_model_vendor
  - ai_model
  - ai_model_capability
  - ai_model_pricing
  query_parameters:
  - name: billing_meter
    schema:
      type: string
  - name: vendor_code
    schema:
      type: string
  - name: vendor_codes
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: modalities
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: capabilities
    schema:
      type: array
      maxItems: 64
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: categories
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: groups
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: q
    schema:
      type: string
  - name: limit
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000
  - name: offset
    schema:
      type: integer
      format: int64
      minimum: 0
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/playgroundService.ts
  operation: fetchModelGroups
  operation_scope: app_shell
  operation_id: playground.models.grouped
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/models
  sdk_domain: intelligence
  openapi_exposed: false
  description: Derived Playground model picker view that reuses the standard app model catalog and groups returned items by vendor and modality bucket client-side.
  read_sources:
  - ai_model_vendor
  - ai_model
  - ai_model_capability
  - ai_model_pricing
  response_schema:
    name: PlaygroundModelGroupsView
    required:
    - groups
    properties:
      groups:
        type: array
        maxItems: 128
        items:
          name: PlaygroundModelGroupView
          type: object
          additionalProperties: false
          required:
          - id
          - vendor
          - llms
          - images
          - videos
          - audios
          - music
          - sfx
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            vendor:
              name: PlaygroundModelVendorView
              type: object
              additionalProperties: false
              required:
              - code
              - name
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
            llms:
              type: array
              maxItems: 1000
              items: &id002
                name: PlaygroundModelOptionView
                type: object
                additionalProperties: false
                required:
                - catalogKey
                - model
                - displayName
                - vendorCode
                - vendorName
                - modalities
                - inputModalities
                - outputModalities
                - capabilities
                - supportsStreaming
                - supportsTools
                - supportsJsonSchema
                properties:
                  catalogKey:
                    type: string
                    minLength: 1
                    maxLength: 256
                  model:
                    type: string
                    minLength: 1
                    maxLength: 256
                  displayName:
                    type: string
                    minLength: 1
                    maxLength: 256
                  description:
                    type: string
                    nullable: true
                    maxLength: 2048
                  vendorCode:
                    type: string
                    minLength: 1
                    maxLength: 64
                  vendorName:
                    type: string
                    minLength: 1
                    maxLength: 128
                  modalities:
                    type: array
                    maxItems: 32
                    items:
                      type: string
                      minLength: 1
                      maxLength: 64
                  inputModalities:
                    type: array
                    maxItems: 32
                    items:
                      type: string
                      minLength: 1
                      maxLength: 64
                  outputModalities:
                    type: array
                    maxItems: 32
                    items:
                      type: string
                      minLength: 1
                      maxLength: 64
                  capabilities:
                    type: array
                    maxItems: 64
                    items:
                      type: string
                      minLength: 1
                      maxLength: 64
                  apiFormat:
                    type: string
                    nullable: true
                    maxLength: 128
                  contextTokens:
                    type: integer
                    format: int64
                    nullable: true
                    minimum: 1
                  maxOutputTokens:
                    type: integer
                    format: int64
                    nullable: true
                    minimum: 1
                  supportsStreaming:
                    type: boolean
                  supportsTools:
                    type: boolean
                  supportsJsonSchema:
                    type: boolean
            images:
              type: array
              maxItems: 1000
              items: *id002
            videos:
              type: array
              maxItems: 1000
              items: *id002
            audios:
              type: array
              maxItems: 1000
              items: *id002
            music:
              type: array
              maxItems: 1000
              items: *id002
            sfx:
              type: array
              maxItems: 1000
              items: *id002
