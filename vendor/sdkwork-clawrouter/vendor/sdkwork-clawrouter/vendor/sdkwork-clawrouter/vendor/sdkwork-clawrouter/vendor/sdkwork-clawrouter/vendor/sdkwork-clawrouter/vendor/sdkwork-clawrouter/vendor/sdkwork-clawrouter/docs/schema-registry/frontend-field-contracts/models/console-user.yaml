fragment: models/console-user
frontend_models:
- route: /console/user
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-user/src/userService.ts
  interface: UserProfile
  fields:
  - name
  - email
  - phone
  - language
  - avatar
  - isVerified
  - status
  - registeredAt
  - lastLogin
  - lastLoginIp
  - passwordLastChanged
  - twoFactorEnabled
  - thirdPartyBound
  data_sources:
  - iam_user
  - iam_user_identity
  - iam_session
