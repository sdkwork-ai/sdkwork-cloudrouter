tables:
- table: integration_service_provider
  domain: integration
  profile: commercial_provider_subject
  compliance_level: L3
  system_of_record: true
  write_owner: service-provider-service
  common_columns: tenant_entity
  frontend_routes:
  - /admin/service-providers
  - /admin/service-providers/dashboard
  - /admin/service-providers/providers
  - /admin/service-providers/relations
  - /admin/service-providers/downstreams
  - /admin/service-providers/members
  - /admin/service-providers/bindings
  api_surfaces:
  - backend
  - worker
  required_columns:
  - uuid
  - provider_no
  - display_name
  columns:
    provider_no: string(64)
    display_name: string(128)
    provider_type: string(64)
    owner_tenant_id: int64
    owner_organization_id: int64
    owner_user_id: int64
    default_currency: string(10)
    default_timezone: string(64)
    risk_level: enum_int32
    suspended_reason_code: string(128)
    activated_at: instant
    suspended_at: instant
  indexes:
  - name: uk_integration_service_provider_no
    unique: true
    columns:
    - tenant_id
    - organization_id
    - provider_no
  - name: idx_integration_service_provider_status
    columns:
    - tenant_id
    - organization_id
    - status
    - risk_level
    - id
  security:
    financial: true
    audit_required: true
