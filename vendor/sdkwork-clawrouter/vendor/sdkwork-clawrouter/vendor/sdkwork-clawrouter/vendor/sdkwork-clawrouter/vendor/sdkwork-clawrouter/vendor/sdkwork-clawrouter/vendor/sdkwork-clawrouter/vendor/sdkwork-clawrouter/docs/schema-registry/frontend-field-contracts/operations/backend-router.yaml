fragment: operations/backend-router
frontend_operations:
- route: /admin/monitor
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-monitor/src/monitorService.ts
  operation: fetchNodes
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/router/monitor/nodes
  read_sources:
  - ops_gateway_instance
  - ops_gateway_heartbeat
  query_parameters: []
  response_schema:
    name: AdminMonitorNodesResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: AdminMonitorNodeItem
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - region
          - status
          - cpu
          - memory
          - uptime
          - ip
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 128
            region:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              enum:
              - online
              - warning
              - offline
            cpu:
              type: number
              minimum: 0
            memory:
              type: number
              minimum: 0
            uptime:
              type: string
              minLength: 1
              maxLength: 64
            ip:
              type: string
              minLength: 1
              maxLength: 128
- route: /admin/monitor
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-monitor/src/monitorService.ts
  operation: fetchAlerts
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/router/monitor/alerts
  read_sources:
  - ops_alert_event
  query_parameters: []
  response_schema:
    name: AdminMonitorAlertsResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: AdminMonitorAlertItem
          type: object
          additionalProperties: false
          required:
          - id
          - severity
          - title
          - message
          - time
          - status
          - source
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            severity:
              type: string
              enum:
              - critical
              - warning
              - info
            title:
              type: string
              minLength: 1
              maxLength: 200
            message:
              type: string
              minLength: 1
              maxLength: 1000
            time:
              type: string
              minLength: 1
              maxLength: 64
            status:
              type: string
              enum:
              - active
              - resolved
            source:
              type: string
              minLength: 1
              maxLength: 128
- route: /admin/monitor
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-monitor/src/monitorService.ts
  operation: fetchPerformanceData
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/router/monitor/performance
  read_sources:
  - ops_metric_snapshot
  query_parameters: []
  response_schema:
    name: AdminMonitorPerformanceResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: AdminMonitorPerformanceItem
          type: object
          additionalProperties: false
          required:
          - time
          - cpu
          - memory
          - network
          properties:
            time:
              type: string
              minLength: 1
              maxLength: 64
            cpu:
              type: number
              minimum: 0
            memory:
              type: number
              minimum: 0
            network:
              type: number
              minimum: 0
- route: /admin/ratelimit
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-ratelimit/src/ratelimitService.ts
  operation: fetchFirewalls
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/router/firewall/rules
  read_sources:
  - iam_gateway_risk_rule
  query_parameters: []
  response_schema:
    name: AdminFirewallRulesResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: AdminFirewallItem
          type: object
          additionalProperties: false
          required: &id006
          - id
          - type
          - value
          - reason
          - time
          properties: &id007
            id:
              type: string
              minLength: 1
              maxLength: 128
            type:
              type: string
              minLength: 1
              maxLength: 64
            value:
              type: string
              minLength: 1
              maxLength: 256
            reason:
              type: string
              minLength: 1
              maxLength: 512
            time:
              type: string
              minLength: 1
              maxLength: 64
- route: /admin/ratelimit
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-ratelimit/src/ratelimitService.ts
  operation: addFirewall
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/router/firewall/rules
  read_sources:
  - iam_gateway_risk_rule
  write_tables:
  - iam_gateway_risk_rule
  - ops_audit_log
  request_schema:
    name: AdminFirewallRuleCreateRequest
    required:
    - type
    - value
    - reason
    properties:
      type:
        type: string
        minLength: 1
        maxLength: 64
        description: Firewall rule category.
      value:
        type: string
        minLength: 1
        maxLength: 256
        description: IP address, CIDR block, domain, or request target expression.
      reason:
        type: string
        minLength: 1
        maxLength: 512
        description: Operator-provided reason for audit records.
  response_schema:
    name: AdminFirewallMutationResponse
    required:
    - item
    properties:
      item:
        name: AdminFirewallItem
        type: object
        additionalProperties: false
        required: *id006
        properties: *id007
        description: Persisted firewall rule snapshot returned by the backend.
- route: /admin/ratelimit
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-ratelimit/src/ratelimitService.ts
  operation: removeFirewall
  kind: delete
  api_surface: backend
  api_method: DELETE
  api_path: /backend/v3/api/router/firewall/rules/{ruleId}
  read_sources:
  - iam_gateway_risk_rule
  write_tables:
  - iam_gateway_risk_rule
  - ops_audit_log
  response_schema:
    name: AdminDeleteResponse
    type: object
    additionalProperties: false
    required:
    - deleted
    properties:
      deleted:
        type: boolean
