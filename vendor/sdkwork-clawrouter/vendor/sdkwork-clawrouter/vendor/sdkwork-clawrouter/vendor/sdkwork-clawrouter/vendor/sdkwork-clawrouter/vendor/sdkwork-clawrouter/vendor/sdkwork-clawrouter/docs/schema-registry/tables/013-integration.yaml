tables:
- table: integration_provider_account
  domain: integration
  profile: provider_account_secret_ref
  compliance_level: L3
  system_of_record: true
  write_owner: integration-service
  common_columns: tenant_entity
  source_tables:
  - ai_provider
  - messaging_provider
  frontend_routes:
  - /admin/channel
  - /admin/channel/secrets
  - /admin/integration/provider-secrets
  api_surfaces:
  - backend
  - worker
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - provider_code
  - account_code
  - account_name
  columns:
    provider_id: int64
    provider_code:
      type: string(64)
      constraints: NOT NULL DEFAULT ''
    account_code:
      type: string(64)
      constraints: NOT NULL DEFAULT ''
    account_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    account_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'official'
    channel_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'official'
    auth_type:
      type: enum_int32
      constraints: NOT NULL DEFAULT 1
    credential_profile:
      type: enum_int32
      constraints: NOT NULL DEFAULT 1
    auth_config:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    secret_ref: string(512)
    secret_hash: string(128)
    masked_label: string(128)
    credential_version:
      type: int64
      constraints: NOT NULL DEFAULT 1
    base_url: string(512)
    region_code: string(64)
    environment:
      type: enum_int32
      constraints: NOT NULL DEFAULT 1
    health_status:
      type: enum_int32
      constraints: NOT NULL DEFAULT 1
    last_latency_ms: int32
    consecutive_error_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    risk_level:
      type: enum_int32
      constraints: NOT NULL DEFAULT 1
    quota_snapshot: json
    last_verified_at: instant
    last_used_at: instant
    last_rotated_at: instant
    next_rotate_at: instant
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  - name: uk_integration_provider_account_code
    columns:
    - tenant_id
    - organization_id
    - account_code
  indexes:
  - name: idx_integration_provider_account_provider
    columns:
    - tenant_id
    - organization_id
    - provider_code
    - account_type
    - status
    - id
  - name: idx_integration_provider_account_secret
    columns:
    - tenant_id
    - organization_id
    - secret_hash
    - status
    - id
  - name: idx_integration_provider_account_health
    columns:
    - tenant_id
    - organization_id
    - status
    - health_status
    - risk_level
    - id
  security:
    sensitivity: SECRET_REF
    stores_secret_plaintext: false
    audit_required: true
