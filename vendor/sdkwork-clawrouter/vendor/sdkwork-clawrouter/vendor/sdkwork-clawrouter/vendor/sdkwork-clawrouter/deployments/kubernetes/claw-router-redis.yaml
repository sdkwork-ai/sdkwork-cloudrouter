apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-clawrouter-redis
  labels:
    app: sdkwork-clawrouter
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdkwork-clawrouter
      component: redis
  template:
    metadata:
      labels:
        app: sdkwork-clawrouter
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sdkwork-clawrouter-redis
spec:
  selector:
    app: sdkwork-clawrouter
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
