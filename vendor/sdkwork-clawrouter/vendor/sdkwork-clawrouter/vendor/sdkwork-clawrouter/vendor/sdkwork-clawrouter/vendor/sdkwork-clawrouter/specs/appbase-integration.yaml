schemaVersion: 1
kind: sdkwork.appbase.integration
standardVersion: 2026-05-21
app:
  key: sdkwork-clawrouter
  role: assembly-layer
  rule: >
    sdkwork-clawrouter composes sdkwork-appbase capabilities through generated
    SDK adapters, app-specific runtime configuration, route registration,
    product seed data, and installer hooks. It must not fork appbase-owned
    stores, SDK clients, or base capability contracts.

integrations:
  - capability: iam
    requiredMaturity: L3
    surfaces:
      - app
      - backend
      - portal
    frontend:
      dependencies:
        - "@sdkwork/auth-pc-react"
        - "@sdkwork/auth-runtime-pc-react"
        - "@sdkwork/iam-contracts"
        - "@sdkwork/iam-core-pc-react"
        - "@sdkwork/iam-react"
        - "@sdkwork/iam-runtime"
        - "@sdkwork/iam-sdk-ports"
        - "@sdkwork/iam-service"
      adapters:
        - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/iam-runtime.ts
        - apps/sdkwork-clawrouter-pc/src/auth/clawRouterAuthController.ts
        - apps/sdkwork-clawrouter-pc/src/auth/clawRouterAuthSettingsService.ts
    contractTests:
      - apps/sdkwork-clawrouter-pc/auth-runtime.test.ts
    verification:
      - python -B -m unittest tests.test_iam_identity_contract_standard
    forbiddenProductForks:
      - apps/sdkwork-clawrouter-pc/src/auth/corePcReactCompat.ts
      - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/iam-sdk-clients.ts
    sdkBoundary: generated-sdk-through-ports

  - capability: foundation
    requiredMaturity: L2
    surfaces:
      - portal
      - runtime
    frontend:
      dependencies:
        - "@sdkwork/appbase-pc-react"
      adapters:
        - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/sdk-clients.ts
        - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/sdk-request-boundary.ts
        - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/app-session-token.ts
    contractTests:
      - apps/sdkwork-clawrouter-pc/auth-runtime.test.ts
      - tests/test_appbase_capability_guardian.py
    verification:
      - python -B -m unittest tests.test_appbase_capability_guardian tests.test_appbase_integration_guardian
    forbiddenProductForks: []
    sdkBoundary: generated-sdk-through-ports

  - capability: notification
    requiredMaturity: L1
    surfaces:
      - app
      - portal
    frontend:
      dependencies:
        - "@sdkwork/notification-pc-react"
      adapters:
        - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/notificationService.ts
    contractTests:
      - tests/test_console_messages_runtime_standard.py
      - tests/test_console_messages_backend_runtime_standard.py
    verification:
      - python -B -m unittest tests.test_console_messages_runtime_standard tests.test_console_messages_backend_runtime_standard
    forbiddenProductForks:
      - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/notification-sdk-clients.ts
    sdkBoundary: generated-sdk-through-ports
