fragment: operations/app-chat
frontend_operations:
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/components/chat/chatService.ts
  operation: fetchSessions
  operation_scope: app_shell
  operation_id: completions.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/chat/conversations
  openapi_exposed: false
  sdk_domain: chat
  summary: Fetch stored Playground chat sessions
  description: Lists stored OpenAI-compatible chat completions for the selected user API key and maps them into Playground session summaries.
  read_sources:
  - ai_request_trace
  - ai_usage_fact
  query_parameters:
  - name: limit
    schema:
      type: integer
      minimum: 1
      maximum: 100
  - name: order
    schema:
      type: string
      enum:
      - asc
      - desc
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/components/chat/chatService.ts
  operation: fetchMessages
  operation_scope: app_shell
  operation_id: completions.messages.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/chat/conversations/{completionId}/messages
  openapi_exposed: false
  sdk_domain: chat
  summary: Fetch stored Playground chat messages
  description: Lists messages for one stored OpenAI-compatible chat completion using the selected user API key.
  read_sources:
  - ai_request_trace
  - ai_usage_fact
  path_params:
  - completionId
  query_parameters:
  - name: limit
    schema:
      type: integer
      minimum: 1
      maximum: 100
  - name: order
    schema:
      type: string
      enum:
      - asc
      - desc
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/components/chat/chatService.ts
  operation: cancelRuntimeInvocation
  operation_scope: app_shell
  operation_id: playground.chatRuntime.cancel
  kind: action
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/runtime/invocations/{invocationId}/complete
  openapi_exposed: false
  sdk_domain: runtime
  summary: Cancel Playground chat runtime invocation
  description: Marks an in-flight Playground chat runtime invocation as cancelled and persists the partial output and usage snapshot through the product runtime boundary.
  read_sources:
  - ai_runtime_invocation
  write_tables:
  - ai_runtime_invocation
  file_targets: []
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/components/chat/chatService.ts
  operation: sendMessage
  operation_scope: app_shell
  operation_id: completions.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/runtime/invocations
  openapi_exposed: false
  sdk_domain: chat
  summary: Send Playground chat message
  description: Creates a stored OpenAI-compatible chat completion through the generated AI SDK and returns a Playground assistant message plus session summary.
  read_sources:
  - ai_request_trace
  - ai_usage_fact
  write_tables:
  - ai_request_trace
  - ai_usage_fact
  request_schema:
    name: PlaygroundChatCompletionCreateRequest
    required:
    - model
    - messages
    - store
    properties:
      model:
        type: string
        minLength: 1
        maxLength: 256
      messages:
        type: array
        maxItems: 256
        items:
          name: PlaygroundChatCompletionMessageInput
          type: object
          additionalProperties: false
          required:
          - role
          - content
          properties:
            role:
              type: string
              enum:
              - user
              - assistant
            content:
              type: string
              minLength: 1
              maxLength: 32768
      store:
        type: boolean
      metadata:
        type: object
        additionalProperties: true
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/components/chat/chatService.ts
  operation: resumeMessage
  operation_scope: app_shell
  operation_id: playground.chatRuntime.resume
  kind: action
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/runtime/invocations/{invocationId}/complete
  openapi_exposed: false
  sdk_domain: runtime
  summary: Resume Playground chat runtime invocation
  description: Resumes streaming runtime events for an existing Playground chat invocation, de-duplicates already seen events, and persists the final assistant turn when the stream reaches a terminal state.
  read_sources:
  - ai_chat_conversation
  - ai_chat_turn
  - ai_runtime_invocation
  - ai_runtime_invocation_event
  write_tables:
  - ai_chat_turn
  - ai_chat_item
  - ai_chat_message
  - ai_chat_message_part
  - ai_runtime_invocation
  - ai_runtime_usage_link
  file_targets: []
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: listChatConversations
  operation_id: conversations.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/chat/conversations
  sdk_domain: chat
  summary: List product chat conversations
  description: Lists first-class chat conversations for the active app user. Playground may consume this API, but the backend path is owned by the product chat domain.
  read_sources:
  - ai_chat_conversation
  - ai_agent_session
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 100
  response_schema:
    name: ChatConversationListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: &id001
          name: ChatConversationItem
          type: object
          additionalProperties: false
          required:
          - id
          - title
          - status
          - sourceSurface
          - messageCount
          - turnCount
          - createdAt
          - updatedAt
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            title:
              type: string
              minLength: 1
              maxLength: 256
            status:
              type: string
              enum:
              - active
              - archived
              - deleted
            sourceSurface:
              type: string
              minLength: 1
              maxLength: 64
            defaultModel:
              type: string
              nullable: true
              maxLength: 128
            defaultProvider:
              type: string
              nullable: true
              maxLength: 128
            agentId:
              type: string
              nullable: true
              maxLength: 128
            agentSessionId:
              type: string
              nullable: true
              maxLength: 128
            memorySpaceId:
              type: string
              nullable: true
              maxLength: 128
            lastMessagePreview:
              type: string
              nullable: true
              maxLength: 2048
            messageCount:
              type: integer
              format: int64
              minimum: 0
            turnCount:
              type: integer
              format: int64
              minimum: 0
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
            updatedAt:
              type: string
              minLength: 1
              maxLength: 64
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: createChatConversation
  operation_id: conversations.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/chat/conversations
  sdk_domain: chat
  summary: Create product chat conversation
  description: Creates a first-class chat conversation that can be linked to agents, memory spaces, and runtime invocations.
  read_sources:
  - ai_agent_session
  write_tables:
  - ai_chat_conversation
  idempotency_required: true
  request_schema:
    name: ChatConversationCreateRequest
    type: object
    additionalProperties: false
    properties:
      title:
        type: string
        maxLength: 256
      sourceSurface:
        type: string
        maxLength: 64
      defaultModel:
        type: string
        maxLength: 128
      defaultProvider:
        type: string
        maxLength: 128
      agentId:
        type: string
        maxLength: 128
      agentSessionId:
        type: string
        maxLength: 128
      memorySpaceId:
        type: string
        maxLength: 128
      metadata:
        type: object
        additionalProperties: true
  response_schema:
    name: ChatConversationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: *id001
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: retrieveChatConversation
  operation_id: conversations.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/chat/conversations/{conversationId}
  sdk_domain: chat
  summary: Retrieve product chat conversation
  description: Returns one tenant-scoped chat conversation using its stable conversation id.
  read_sources:
  - ai_chat_conversation
  - ai_agent_session
  path_params:
  - conversationId
  query_parameters: []
  response_schema: *id001
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: listChatMessages
  operation_id: conversationMessages.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/chat/conversations/{conversationId}/messages
  sdk_domain: chat
  summary: List product chat messages
  description: Lists normalized chat messages for one conversation. Each message exposes stable conversation and turn ids, not internal database surrogate ids.
  read_sources:
  - ai_chat_conversation
  - ai_chat_turn
  - ai_chat_item
  - ai_chat_message
  - ai_chat_message_part
  - ai_runtime_usage_link
  - ai_runtime_artifact
  path_params:
  - conversationId
  query_parameters:
  - name: limit
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000
  - name: order
    schema:
      type: string
      enum:
      - asc
      - desc
  response_schema:
    name: ChatMessageListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 1000
        items: &id002
          name: ChatMessageItem
          type: object
          additionalProperties: false
          required:
          - id
          - conversationId
          - role
          - direction
          - content
          - status
          - createdAt
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            conversationId:
              type: string
              minLength: 1
              maxLength: 128
            turnId:
              type: string
              nullable: true
              maxLength: 128
            role:
              type: string
              enum:
              - system
              - user
              - assistant
              - tool
              - developer
            direction:
              type: string
              enum:
              - input
              - output
            content:
              type: string
              maxLength: 65536
            status:
              type: string
              enum:
              - pending
              - streaming
              - completed
              - failed
              - cancelled
              - deleted
            model:
              type: string
              nullable: true
              maxLength: 128
            provider:
              type: string
              nullable: true
              maxLength: 128
            runtime:
              type: string
              nullable: true
              maxLength: 128
            runtimeInvocationId:
              type: string
              nullable: true
              maxLength: 128
            usageLinkId:
              type: string
              nullable: true
              maxLength: 128
            usage:
              type: object
              nullable: true
              additionalProperties: false
              required:
              - inputTokens
              - outputTokens
              - cachedTokens
              - reasoningTokens
              - totalTokens
              properties:
                inputTokens:
                  type: integer
                  format: int64
                  minimum: 0
                outputTokens:
                  type: integer
                  format: int64
                  minimum: 0
                cachedTokens:
                  type: integer
                  format: int64
                  minimum: 0
                reasoningTokens:
                  type: integer
                  format: int64
                  minimum: 0
                totalTokens:
                  type: integer
                  format: int64
                  minimum: 0
                costAmount:
                  type: string
                  description: Customer-facing runtime usage amount for this chat message. This value is not an upstream, provider, channel, or access-cost field.
                  nullable: true
                  maxLength: 64
                currency:
                  type: string
                  nullable: true
                  maxLength: 16
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: createChatTurn
  operation_id: turns.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/chat/conversations/{conversationId}/turns
  sdk_domain: chat
  summary: Create product chat turn
  description: Creates one conversational turn with input and output item slots. Provider responses from Claude Code, Gemini, Codex, OpenAI-compatible runtimes, or custom runtimes are tracked through runtime invocation, event, usage, and artifact
    tables.
  read_sources:
  - ai_chat_conversation
  - ai_agent_session
  write_tables:
  - ai_chat_turn
  - ai_chat_item
  - ai_chat_message
  - ai_chat_message_part
  - ai_chat_context_snapshot
  - ai_runtime_invocation
  - ai_runtime_invocation_event
  - ai_runtime_usage_link
  - ai_runtime_artifact
  path_params:
  - conversationId
  idempotency_required: true
  request_schema:
    name: ChatTurnCreateRequest
    type: object
    additionalProperties: false
    required:
    - message
    properties:
      message:
        type: string
        minLength: 1
        maxLength: 65536
      mode:
        type: string
        maxLength: 64
      agentId:
        type: string
        maxLength: 128
      agentSessionId:
        type: string
        maxLength: 128
      model:
        type: string
        maxLength: 128
      provider:
        type: string
        maxLength: 128
      metadata:
        type: object
        additionalProperties: true
  response_schema: &id003
    name: ChatTurnCreateResponse
    type: object
    additionalProperties: false
    required:
    - turn
    - messages
    properties:
      turn:
        name: ChatTurnItem
        type: object
        additionalProperties: false
        required:
        - id
        - conversationId
        - status
        - createdAt
        - updatedAt
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          conversationId:
            type: string
            minLength: 1
            maxLength: 128
          status:
            type: string
            enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          model:
            type: string
            nullable: true
            maxLength: 128
          provider:
            type: string
            nullable: true
            maxLength: 128
          agentId:
            type: string
            nullable: true
            maxLength: 128
          agentSessionId:
            type: string
            nullable: true
            maxLength: 128
          createdAt:
            type: string
            minLength: 1
            maxLength: 64
          updatedAt:
            type: string
            minLength: 1
            maxLength: 64
      messages:
        type: array
        maxItems: 16
        items: *id002
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: completeChatTurnResponse
  operation_id: turnResponses.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/chat/conversations/{conversationId}/turns/{turnId}/response
  sdk_domain: chat
  summary: Complete product chat turn response
  description: Saves a normalized assistant output for one chat turn, links it to runtime invocation and usage telemetry, and supports Claude Code, Gemini, Codex, OpenAI-compatible, or custom runtime adapters.
  read_sources:
  - ai_chat_conversation
  - ai_chat_turn
  - ai_chat_item
  - ai_runtime_invocation
  - ai_usage_fact
  write_tables:
  - ai_chat_turn
  - ai_chat_item
  - ai_chat_message
  - ai_chat_message_part
  - ai_runtime_usage_link
  path_params:
  - conversationId
  - turnId
  idempotency_required: true
  request_schema:
    name: ChatTurnResponseRequest
    type: object
    additionalProperties: false
    required:
    - message
    properties:
      message:
        type: string
        minLength: 1
        maxLength: 65536
      status:
        type: string
        enum:
        - completed
        - failed
        - cancelled
        - streaming
      model:
        type: string
        maxLength: 128
      provider:
        type: string
        maxLength: 128
      runtime:
        type: string
        maxLength: 128
        description: Runtime adapter such as claude_code, gemini, codex, openai_compatible, or custom.
      runtimeInvocationId:
        type: string
        maxLength: 128
      usageFactId:
        type: string
        maxLength: 128
      usage:
        type: object
        additionalProperties: false
        properties:
          inputTokens:
            type: integer
            format: int64
            minimum: 0
          outputTokens:
            type: integer
            format: int64
            minimum: 0
          cachedTokens:
            type: integer
            format: int64
            minimum: 0
          reasoningTokens:
            type: integer
            format: int64
            minimum: 0
          totalTokens:
            type: integer
            format: int64
            minimum: 0
          cost:
            type: string
            description: Customer-facing runtime usage amount supplied by the runtime callback. Upstream, provider, channel, and access-cost fields are not part of the app API contract.
            maxLength: 64
          costAmount:
            type: string
            description: Customer-facing runtime usage amount supplied by the runtime callback. Upstream, provider, channel, and access-cost fields are not part of the app API contract.
            maxLength: 64
          currency:
            type: string
            maxLength: 16
      metadata:
        type: object
        additionalProperties: true
  response_schema: *id003
