fragment: operations/backend-ecosystem
frontend_operations:
- route: /admin/prompts
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-core/src/admin-category-options.ts
  operation: listAdminAiCategoryOptions
  operation_scope: app_shell
  operation_id: admin.ai.categories.derive
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/prompts
  openapi_exposed: false
  summary: Derive unified AI category filter options
  description: Derives read-only category filter options from MCP admin list responses; prompt categories are owned by sdkwork-prompts.
  read_sources:
  - ai_mcp_server
  query_parameters: []
  response_schema:
    name: AdminAiCategoryOptionsResponse
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        maxItems: 500
        items:
          name: AdminCategoryOption
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 255
            code:
              type: string
              maxLength: 128
              pattern: '^[A-Za-z0-9_-]+$'
- route: /admin/prompts
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-core/src/admin-category-options.ts
  operation: createAdminAiCategory
  operation_scope: app_shell
  operation_id: admin.ai.categories.create.disabled
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/prompts
  openapi_exposed: false
  summary: Reject AI category create in Claw Router
  description: Category mutation is owned by sdkwork-kernel; Claw Router rejects create requests with an ownership error.
  read_sources:
  - ai_mcp_server
  write_tables: []
- route: /admin/prompts
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-core/src/admin-category-options.ts
  operation: updateAdminAiCategory
  operation_scope: app_shell
  operation_id: admin.ai.categories.update.disabled
  kind: update
  api_surface: backend
  api_method: PATCH
  api_path: /backend/v3/api/prompts/{categoryId}
  openapi_exposed: false
  summary: Reject AI category update in Claw Router
  description: Category mutation is owned by sdkwork-kernel; Claw Router rejects update requests with an ownership error.
  read_sources:
  - ai_mcp_server
  write_tables: []
- route: /admin/prompts
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-core/src/admin-category-options.ts
  operation: deleteAdminAiCategory
  operation_scope: app_shell
  operation_id: admin.ai.categories.delete.disabled
  kind: delete
  api_surface: backend
  api_method: DELETE
  api_path: /backend/v3/api/prompts/{categoryId}
  openapi_exposed: false
  summary: Reject AI category delete in Claw Router
  description: Category mutation is owned by sdkwork-kernel; Claw Router rejects delete requests with an ownership error.
  read_sources:
  - ai_mcp_server
  write_tables: []
