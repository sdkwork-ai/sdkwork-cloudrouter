fragment: shared/entities/platform
x_response_entities:
  app_vip_benefit_item: &id001
    name: AppVipBenefitItem
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - claimed
    properties:
      id:
        type: integer
        format: int64
        minimum: 0
      name:
        type: string
        minLength: 1
        maxLength: 128
      benefitKey:
        type: string
        nullable: true
        maxLength: 128
      type:
        type: string
        nullable: true
        maxLength: 64
      description:
        type: string
        nullable: true
        maxLength: 512
      icon:
        $ref: '#/components/schemas/MediaResource'
        nullable: true
      claimed:
        type: boolean
      usageLimit:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      usedCount:
        type: integer
        format: int64
        nullable: true
        minimum: 0
  app_vip_level_item:
    name: AppVipLevelItem
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - levelValue
    properties:
      id:
        type: integer
        format: int64
        minimum: 0
      name:
        type: string
        minLength: 1
        maxLength: 128
      levelValue:
        type: integer
        format: int64
        minimum: 0
      requiredPoints:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      description:
        type: string
        nullable: true
        maxLength: 512
      icon:
        $ref: '#/components/schemas/MediaResource'
        nullable: true
      badge:
        type: string
        nullable: true
        maxLength: 128
  app_vip_info_response:
    name: AppVipInfoResponse
    type: object
    additionalProperties: false
    required:
    - vipLevel
    - vipLevelName
    - vipStatus
    - benefits
    properties:
      vipLevel:
        type: integer
        format: int64
        minimum: 0
      vipLevelName:
        type: string
        minLength: 1
        maxLength: 128
      vipStatus:
        type: string
        minLength: 1
        maxLength: 64
      effectiveTime:
        type: string
        nullable: true
        maxLength: 64
      expireTime:
        type: string
        nullable: true
        maxLength: 64
      remainingDays:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      totalDays:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      totalSpent:
        type: string
        nullable: true
        pattern: ^\d+(?:\.\d{1,2})?$
      vipPoints:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      growthValue:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      upgradeGrowthValue:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      benefits:
        type: array
        items: *id001
  app_vip_status_response:
    name: AppVipStatusResponse
    type: object
    additionalProperties: false
    required:
    - isVip
    - vipLevel
    properties:
      isVip:
        type: boolean
      vipLevel:
        type: integer
        format: int64
        minimum: 0
      expireTime:
        type: string
        nullable: true
        maxLength: 64
      pointBalance:
        type: integer
        format: int64
        nullable: true
        minimum: 0
  app_vip_package_item: &id002
    name: AppVipPackageItem
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - price
    - pointAmount
    - vipDurationDays
    - sortWeight
    - recommended
    - tags
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      name:
        type: string
        minLength: 1
        maxLength: 128
      description:
        type: string
        nullable: true
        maxLength: 512
      price:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
      originalPrice:
        type: string
        nullable: true
        pattern: ^\d+(?:\.\d{1,2})?$
      pointAmount:
        type: integer
        format: int64
        minimum: 0
      vipDurationDays:
        type: integer
        format: int64
        minimum: 1
        maximum: 36500
      levelName:
        type: string
        nullable: true
        maxLength: 128
      sortWeight:
        type: integer
        format: int64
        minimum: 0
      recommended:
        type: boolean
      tags:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 64
  app_vip_package_group_item:
    name: AppVipPackageGroupItem
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - sortWeight
    - packages
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      name:
        type: string
        minLength: 1
        maxLength: 128
      description:
        type: string
        nullable: true
        maxLength: 512
      sortWeight:
        type: integer
        format: int64
        minimum: 0
      packages:
        type: array
        items: *id002
  app_vip_points_balance_response:
    name: AppVipPointsBalanceResponse
    type: object
    additionalProperties: false
    required:
    - points
    - availablePoints
    - frozenPoints
    properties:
      points:
        type: integer
        format: int64
        minimum: 0
      availablePoints:
        type: integer
        format: int64
        minimum: 0
      frozenPoints:
        type: integer
        format: int64
        minimum: 0
  app_vip_points_history_item:
    name: AppVipPointsHistoryItem
    type: object
    additionalProperties: false
    required:
    - id
    - changeType
    - changeAmount
    - afterBalance
    - sourceType
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      changeType:
        type: string
        minLength: 1
        maxLength: 64
      changeAmount:
        type: integer
        format: int64
      beforeBalance:
        type: integer
        format: int64
        nullable: true
      afterBalance:
        type: integer
        format: int64
        minimum: 0
      sourceType:
        type: string
        minLength: 1
        maxLength: 64
      remark:
        type: string
        nullable: true
        maxLength: 512
      createdAt:
        type: string
        nullable: true
        maxLength: 64
  app_vip_daily_reward_status_response:
    name: AppVipDailyRewardStatusResponse
    type: object
    additionalProperties: false
    required:
    - canClaim
    - claimedToday
    - consecutiveDays
    - totalDays
    properties:
      canClaim:
        type: boolean
      claimedToday:
        type: boolean
      consecutiveDays:
        type: integer
        format: int64
        minimum: 0
      totalDays:
        type: integer
        format: int64
        minimum: 0
  app_vip_daily_reward_response:
    name: AppVipDailyRewardResponse
    type: object
    additionalProperties: false
    required:
    - rewardPoints
    - message
    - consecutiveDays
    properties:
      rewardPoints:
        type: integer
        format: int64
        minimum: 0
      claimedAt:
        type: string
        nullable: true
        maxLength: 64
      message:
        type: string
        minLength: 1
        maxLength: 256
      consecutiveDays:
        type: integer
        format: int64
        minimum: 0
  app_vip_privilege_usage_response:
    name: AppVipPrivilegeUsageResponse
    type: object
    additionalProperties: false
    required:
    - speedUpUsed
    - speedUpLimit
    - priorityQueueUsed
    - priorityQueueLimit
    - exclusiveModelUsed
    - exclusiveModelLimit
    properties:
      speedUpUsed:
        type: integer
        format: int64
        minimum: 0
      speedUpLimit:
        type: integer
        format: int64
        minimum: 0
      priorityQueueUsed:
        type: integer
        format: int64
        minimum: 0
      priorityQueueLimit:
        type: integer
        format: int64
        minimum: 0
      exclusiveModelUsed:
        type: integer
        format: int64
        minimum: 0
      exclusiveModelLimit:
        type: integer
        format: int64
        minimum: 0
  app_vip_purchase_outcome:
    name: AppVipPurchaseOutcome
    type: object
    additionalProperties: false
    required:
    - orderId
    - packageId
    - packageName
    - amount
    - durationDays
    - targetLevelId
    - targetLevelName
    - status
    properties:
      orderId:
        type: string
        minLength: 1
        maxLength: 128
      packageId:
        type: integer
        format: int64
        minimum: 1
      packageName:
        type: string
        minLength: 1
        maxLength: 128
      amount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
      durationDays:
        type: integer
        format: int64
        minimum: 1
        maximum: 36500
      targetLevelId:
        type: integer
        format: int64
        minimum: 0
      targetLevelName:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        minLength: 1
        maxLength: 64
  app_api_key_item:
    name: AppApiKeyItem
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - maskedKey
    - channelGroup
    - channelGroupName
    - quota
    - usedQuota
    - modalities
    - ipLimit
    - created
    - expires
    - status
    - defaultForRuntime
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 128
      maskedKey:
        type: string
        minLength: 1
        maxLength: 256
      copyableKey:
        type: string
        minLength: 1
        maxLength: 256
        description: Full plaintext API key returned only by authenticated owner management responses; public catalog responses omit this field.
      channelGroup:
        type: string
        minLength: 1
        maxLength: 128
      channelGroupName:
        type: string
        minLength: 1
        maxLength: 128
        description: Display name snapshot for the bound channel group so the list view does not need to preload selectable groups.
      rate:
        type: string
        nullable: true
        maxLength: 64
      quota:
        type: string
        minLength: 1
        maxLength: 64
      usedQuota:
        type: string
        minLength: 1
        maxLength: 64
      modalities:
        type: array
        items:
          type: string
          enum:
          - text
          - image
          - video
          - audio
          - music
      ipLimit:
        type: string
        maxLength: 1024
      created:
        type: string
        maxLength: 64
      expires:
        type: string
        maxLength: 64
      status:
        type: string
        enum:
        - enabled
        - disabled
      defaultForRuntime:
        type: boolean
        description: Whether this key is the current console default for backend runtime API key selection.
  app_channel_group:
    name: AppChannelGroup
    type: object
    additionalProperties: false
    required:
    - id
    - code
    - name
    - rate
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      code:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 128
      rate:
        type: string
        nullable: true
        maxLength: 64
  app_api_key_update_request:
    name: UpdateApiKeyRequest
    type: object
    additionalProperties: false
    required: []
    properties:
      name:
        type: string
        maxLength: 128
        description: API key display name.
      channelGroup:
        type: string
        maxLength: 64
        description: API key channel group code to bind to this key.
      quota:
        type: string
        format: decimal
        description: Optional quota limit as a canonical decimal string.
      isUnlimitedQuota:
        type: boolean
        description: Whether the quota is unlimited.
      modalities:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
          - text
          - image
          - video
          - audio
          - music
      ipLimit:
        type: string
        maxLength: 1024
        description: Comma-separated IP or CIDR allowlist, or unrestricted.
      expires:
        type: string
        maxLength: 32
        description: Expiration timestamp in YYYY-MM-DDTHH:mm format, or never.
      defaultForRuntime:
        type: boolean
        description: Marks this API key as the default backend runtime API key for Playground and app runtime calls.
  app_installed_skill_item:
    name: AppInstalledSkillItem
    type: object
    additionalProperties: false
    required:
    - id
    - skillId
    - enabled
    - config
    - installedAt
    - lastEnabledAt
    - skill
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      skillId:
        type: string
        minLength: 1
        maxLength: 128
      enabled:
        type: boolean
      config:
        type: object
        additionalProperties: true
        description: User-scoped runtime configuration for the installed agent skill.
      installedAt:
        type: string
        maxLength: 64
      lastEnabledAt:
        type: string
        maxLength: 64
      skill:
        name: SkillCatalogItem
        type: object
        additionalProperties: false
        required:
        - id
        - name
        - developer
        - description
        - category
        - image
        - rating
        - downloads
        - features
        - lastUpdated
        - clawhubImage
        - version
        - size
        - license
        - frameworks
        - screenshots
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          name:
            type: string
            minLength: 1
            maxLength: 128
          developer:
            type: string
            minLength: 1
            maxLength: 128
          description:
            type: string
            maxLength: 4096
          category:
            type: string
            minLength: 1
            maxLength: 128
          image:
            $ref: '#/components/schemas/MediaResource'
          rating:
            type: number
            minimum: 0
            maximum: 5
          downloads:
            type: string
            maxLength: 64
          features:
            type: array
            maxItems: 64
            items:
              type: string
              minLength: 1
              maxLength: 128
          lastUpdated:
            type: string
            maxLength: 64
          clawhubImage:
            type: string
            maxLength: 512
          version:
            type: string
            maxLength: 64
          size:
            type: string
            maxLength: 64
          license:
            type: string
            maxLength: 128
          frameworks:
            type: array
            maxItems: 32
            items:
              type: string
              minLength: 1
              maxLength: 64
          screenshots:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 2048
          packages:
            type: array
            maxItems: 16
            items:
              name: SkillPackageItem
              type: object
              additionalProperties: false
              required:
              - id
              - version
              - artifactRef
              - artifactSizeBytes
              - frameworks
              - licenseName
              - publishedAt
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                version:
                  type: string
                  maxLength: 64
                artifactRef:
                  type: string
                  maxLength: 512
                artifactSizeBytes:
                  type: integer
                  format: int64
                  minimum: 0
                frameworks:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                licenseName:
                  type: string
                  maxLength: 128
                publishedAt:
                  type: string
                  maxLength: 64
  app_skill_config_request:
    name: AppSkillConfigRequest
    type: object
    additionalProperties: true
    description: Skill runtime configuration request. config.portal is reserved portal metadata and must not be provided by clients.
    not:
      required:
      - portal
    properties:
      config:
        type: object
        additionalProperties: true
        not:
          required:
          - portal
        description: Optional config wrapper. When omitted, the whole request object is treated as skill config. config.portal is reserved portal metadata and must not be provided by clients.
