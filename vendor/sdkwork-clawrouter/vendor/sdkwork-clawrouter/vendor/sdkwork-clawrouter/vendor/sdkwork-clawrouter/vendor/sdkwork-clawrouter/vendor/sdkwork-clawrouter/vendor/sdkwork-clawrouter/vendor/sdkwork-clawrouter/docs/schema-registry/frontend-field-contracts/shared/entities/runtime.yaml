fragment: shared/entities/runtime
x_response_entities:
  runtime_invocation_item: &id001
    name: RuntimeInvocationItem
    type: object
    additionalProperties: false
    required:
    - id
    - invocationNo
    - invocationType
    - runtime
    - attemptNo
    - status
    - streaming
    - createdAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      invocationNo:
        type: integer
        format: int64
        minimum: 0
      invocationType:
        type: string
        minLength: 1
        maxLength: 128
      runtime:
        type: string
        minLength: 1
        maxLength: 128
      endpoint:
        type: string
        nullable: true
        maxLength: 128
      attemptNo:
        type: integer
        format: int64
        minimum: 0
      status:
        type: string
        enum:
        - pending
        - running
        - streaming
        - completed
        - failed
        - cancelled
      conversationId:
        type: string
        nullable: true
        maxLength: 128
      chatTurnId:
        type: string
        nullable: true
        maxLength: 128
      chatItemId:
        type: string
        nullable: true
        maxLength: 128
      agentSessionId:
        type: string
        nullable: true
        maxLength: 128
      agentRunId:
        type: string
        nullable: true
        maxLength: 128
      agentRunStepId:
        type: string
        nullable: true
        maxLength: 128
      requestId:
        type: string
        nullable: true
        maxLength: 128
      traceId:
        type: string
        nullable: true
        maxLength: 128
      providerResponseId:
        type: string
        nullable: true
        maxLength: 128
      providerSessionId:
        type: string
        nullable: true
        maxLength: 128
      providerConversationId:
        type: string
        nullable: true
        maxLength: 128
      providerStepId:
        type: string
        nullable: true
        maxLength: 128
      model:
        type: string
        nullable: true
        maxLength: 128
      provider:
        type: string
        nullable: true
        maxLength: 128
      toolName:
        type: string
        nullable: true
        maxLength: 128
      toolCallId:
        type: string
        nullable: true
        maxLength: 128
      cwd:
        type: string
        nullable: true
        maxLength: 2048
      sandboxPolicy:
        type: string
        nullable: true
        maxLength: 128
      approvalPolicy:
        type: string
        nullable: true
        maxLength: 128
      permissionMode:
        type: string
        nullable: true
        maxLength: 128
      streaming:
        type: boolean
      startedAt:
        type: string
        nullable: true
        maxLength: 64
      completedAt:
        type: string
        nullable: true
        maxLength: 64
      latencyMs:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      ttftMs:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      exitCode:
        type: integer
        format: int64
        nullable: true
      finishReason:
        type: string
        nullable: true
        maxLength: 128
      errorType:
        type: string
        nullable: true
        maxLength: 128
      errorCode:
        type: string
        nullable: true
        maxLength: 128
      errorMessageMasked:
        type: string
        nullable: true
        maxLength: 1024
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
  runtime_invocation_list_response:
    name: RuntimeInvocationListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: *id001
  runtime_invocation_response:
    name: RuntimeInvocationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: *id001
  runtime_event_item: &id002
    name: RuntimeEventItem
    type: object
    additionalProperties: false
    required:
    - id
    - invocationId
    - eventNo
    - eventType
    - eventSource
    - payloadJson
    - createdAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      invocationId:
        type: string
        minLength: 1
        maxLength: 128
      eventNo:
        type: integer
        format: int64
        minimum: 0
      eventType:
        type: string
        minLength: 1
        maxLength: 128
      eventSource:
        type: string
        minLength: 1
        maxLength: 128
      payloadJson:
        type: object
        additionalProperties: true
      textDelta:
        type: string
        nullable: true
        maxLength: 262144
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
  runtime_event_list_response:
    name: RuntimeEventListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: *id002
  runtime_event_response:
    name: RuntimeEventResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: *id002
  runtime_artifact_item: &id003
    name: RuntimeArtifactItem
    type: object
    additionalProperties: false
    required:
    - id
    - invocationId
    - artifactType
    - createdAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      invocationId:
        type: string
        minLength: 1
        maxLength: 128
      artifactType:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        nullable: true
        maxLength: 512
      mimeType:
        type: string
        nullable: true
        maxLength: 128
      contentText:
        type: string
        nullable: true
        maxLength: 262144
      storageKey:
        type: string
        nullable: true
        maxLength: 2048
      resource:
        $ref: '#/components/schemas/MediaResource'
        nullable: true
      sha256:
        type: string
        nullable: true
        maxLength: 128
      sizeBytes:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
  runtime_artifact_list_response:
    name: RuntimeArtifactListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: *id003
  runtime_artifact_response:
    name: RuntimeArtifactResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: *id003
  runtime_invocation_create_request:
    name: RuntimeInvocationCreateRequest
    type: object
    additionalProperties: false
    required:
    - runtime
    properties:
      invocationType:
        type: string
        maxLength: 128
      runtime:
        type: string
        minLength: 1
        maxLength: 128
      endpoint:
        type: string
        maxLength: 128
      status:
        type: string
        enum:
        - pending
        - running
        - streaming
        - completed
        - failed
        - cancelled
      conversationId:
        type: string
        maxLength: 128
      chatTurnId:
        type: string
        maxLength: 128
      chatItemId:
        type: string
        maxLength: 128
      agentSessionId:
        type: string
        maxLength: 128
      agentRunId:
        type: string
        maxLength: 128
      agentRunStepId:
        type: string
        maxLength: 128
      traceId:
        type: string
        maxLength: 128
      model:
        type: string
        maxLength: 128
      provider:
        type: string
        maxLength: 128
      toolName:
        type: string
        maxLength: 128
      toolCallId:
        type: string
        maxLength: 128
      cwd:
        type: string
        maxLength: 2048
      sandboxPolicy:
        type: string
        maxLength: 128
      approvalPolicy:
        type: string
        maxLength: 128
      permissionMode:
        type: string
        maxLength: 128
      streaming:
        type: boolean
      requestJson:
        type: object
        additionalProperties: true
      metadata:
        type: object
        additionalProperties: true
  runtime_invocation_complete_request:
    name: RuntimeInvocationCompleteRequest
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - pending
        - running
        - streaming
        - completed
        - failed
        - cancelled
      providerResponseId:
        type: string
        maxLength: 128
      providerSessionId:
        type: string
        maxLength: 128
      providerConversationId:
        type: string
        maxLength: 128
      providerStepId:
        type: string
        maxLength: 128
      finishReason:
        type: string
        maxLength: 128
      latencyMs:
        type: integer
        format: int64
        minimum: 0
      ttftMs:
        type: integer
        format: int64
        minimum: 0
      exitCode:
        type: integer
        format: int64
      errorType:
        type: string
        maxLength: 128
      errorCode:
        type: string
        maxLength: 128
      errorMessageMasked:
        type: string
        maxLength: 1024
      responseJson:
        type: object
        additionalProperties: true
      usageJson:
        name: UsageSnapshot
        type: object
        additionalProperties: true
        properties:
          inputTokens:
            type: integer
            format: int64
            minimum: 0
          outputTokens:
            type: integer
            format: int64
            minimum: 0
          cachedTokens:
            type: integer
            format: int64
            minimum: 0
          totalTokens:
            type: integer
            format: int64
            minimum: 0
      metadata:
        type: object
        additionalProperties: true
  runtime_event_create_request:
    name: RuntimeEventCreateRequest
    type: object
    additionalProperties: false
    required:
    - eventType
    properties:
      eventType:
        type: string
        minLength: 1
        maxLength: 128
      eventSource:
        type: string
        maxLength: 128
      payloadJson:
        type: object
        additionalProperties: true
      textDelta:
        type: string
        maxLength: 262144
      metadata:
        type: object
        additionalProperties: true
  runtime_artifact_create_request:
    name: RuntimeArtifactCreateRequest
    type: object
    additionalProperties: false
    required:
    - artifactType
    properties:
      artifactType:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        maxLength: 512
      mimeType:
        type: string
        maxLength: 128
      contentText:
        type: string
        maxLength: 262144
      contentJson:
        type: object
        additionalProperties: true
      storageKey:
        type: string
        maxLength: 2048
      resource:
        $ref: '#/components/schemas/MediaResource'
      sha256:
        type: string
        maxLength: 128
      sizeBytes:
        type: integer
        format: int64
        minimum: 0
      metadata:
        type: object
        additionalProperties: true
