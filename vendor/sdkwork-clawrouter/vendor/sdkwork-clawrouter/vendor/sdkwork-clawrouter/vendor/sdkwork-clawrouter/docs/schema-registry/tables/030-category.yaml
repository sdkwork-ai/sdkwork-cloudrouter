tables:
- table: c_category
  domain: classification
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: catalog-service
  generated_by_this_project: true
  frontend_routes:
  - /apps
  - /apps/:id
  - /admin/catalog
  - /admin/app
  - /admin/prompts
  - /admin/mcp
  api_surfaces:
  - app
  - backend
  columns:
    id:
      type: int64
      constraints: PRIMARY KEY
    uuid:
      type: string(255)
      constraints: NOT NULL UNIQUE
    created_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    updated_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    v:
      type: int64
      constraints: NOT NULL DEFAULT 0
    tenant_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    organization_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    data_scope:
      type: int32
      constraints: NOT NULL DEFAULT 0
    category_type:
      type: string(64)
      constraints: NOT NULL
    name:
      type: string(255)
      constraints: NOT NULL
    description: text
    code: string(128)
    tags:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    icon_drive_uri: string(512)
    icon_resource_snapshot: json
    sort_weight:
      type: int32
      constraints: NOT NULL DEFAULT 0
    parent_id: int64
    path: string(1024)
    visible:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    status:
      type: int32
      constraints: NOT NULL DEFAULT 1
  indexes:
  - name: idx_c_category_type_scope
    columns:
    - tenant_id
    - organization_id
    - category_type
    - status
    - sort_weight
    - id
  - name: idx_c_category_parent
    columns:
    - tenant_id
    - organization_id
    - category_type
    - parent_id
    - sort_weight
    - id
  - name: uk_c_category_code
    unique: true
    columns:
    - tenant_id
    - organization_id
    - category_type
    - code
