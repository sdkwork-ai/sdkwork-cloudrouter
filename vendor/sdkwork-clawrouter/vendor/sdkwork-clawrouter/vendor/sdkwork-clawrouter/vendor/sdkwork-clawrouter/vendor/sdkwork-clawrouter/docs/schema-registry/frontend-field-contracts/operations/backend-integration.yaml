fragment: operations/backend-integration
frontend_operations:
- route: /admin/channel
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-channel/src/channelService.ts
  operation: fetchChannels
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/integration/channels
  read_sources:
  - ai_provider
  - ai_channel
  - ai_channel_credential
  - ai_channel_resource
  - integration_provider_health_snapshot
  query_parameters: []
  response_schema:
    name: AdminChannelsResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: AdminChannelItem
          type: object
          additionalProperties: false
          required: &id002
          - id
          - channelId
          - name
          - vendor
          - channelType
          - protocol
          - accessType
          - credentialRotation
          - credentials
          - capabilities
          - resourceCodes
          - isMultimodal
          - weight
          - status
          - balance
          - errors
          - createdAt
          properties: &id003
            id:
              type: string
              minLength: 1
              maxLength: 128
            channelId:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[1-9][0-9]*$
              description: Scoped ai_channel id used by account route and credential configuration.
            name:
              type: string
              minLength: 1
              maxLength: 128
            vendor:
              type: string
              minLength: 1
              maxLength: 64
            channelType:
              type: string
              enum:
              - official
              - relay
            protocol:
              type: string
              minLength: 1
              maxLength: 64
            accessType:
              type: string
              minLength: 1
              maxLength: 64
            credentialRotation:
              type: string
              enum:
              - default
              - priority
              - round_robin
              - weighted_round_robin
              - random
            credentials:
              type: array
              minItems: 0
              maxItems: 64
              items:
                name: AdminChannelCredentialItem
                type: object
                additionalProperties: false
                required:
                - id
                - credentialId
                - name
                - baseUrl
                - secretRef
                - maskedLabel
                - priority
                - weight
                - status
                - errors
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  credentialId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[1-9][0-9]*$
                  name:
                    type: string
                    minLength: 1
                    maxLength: 128
                  baseUrl:
                    type: string
                    minLength: 1
                    maxLength: 512
                    pattern: ^https?://[^\\s]+$
                  secretRef:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^(vault|secret)://[^\\s]+$
                  apiKey:
                    type: string
                    maxLength: 4096
                    description: Plaintext provider API key returned only to authenticated admin management responses when available for channel credential relay operations.
                  maskedLabel:
                    type: string
                    minLength: 1
                    maxLength: 128
                  priority:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 1000000
                  weight:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 10000
                  status:
                    type: string
                    enum:
                    - active
                    - disabled
                    - error
                  errors:
                    type: integer
                    format: int64
                    minimum: 0
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
            expiresAt:
              type: string
              nullable: true
              maxLength: 64
              description: Optional channel credential expiration timestamp. Null or absence means the channel credential never expires.
            capabilities:
              type: array
              maxItems: 16
              items:
                type: string
                enum:
                - llm
                - image
                - audio
                - music
                - sfx
                - video
            resourceCodes:
              type: array
              maxItems: 256
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 192
                pattern: ^[A-Za-z0-9._-]+$
            isMultimodal:
              type: boolean
            timeoutMs:
              type: integer
              format: int64
              minimum: 1
              maximum: 600000
            retryPolicy:
              name: ProviderRetryPolicy
              type: object
              additionalProperties: false
              required:
              - maxAttempts
              - retryableStatusCodes
              properties:
                maxAttempts:
                  type: integer
                  minimum: 1
                  maximum: 5
                retryableStatusCodes:
                  type: array
                  maxItems: 8
                  uniqueItems: true
                  items:
                    type: integer
                    enum:
                    - 408
                    - 409
                    - 425
                    - 429
                    - 500
                    - 502
                    - 503
                    - 504
                backoffMs:
                  type: integer
                  minimum: 0
                  maximum: 2000
            circuitBreakerPolicy: &id001
              name: ProviderCircuitBreakerPolicy
              type: object
              additionalProperties: false
              required: &id004
              - failureThreshold
              properties: &id005
                failureThreshold:
                  type: integer
                  minimum: 1
                  maximum: 100
            weight:
              type: integer
              format: int64
              minimum: 1
              maximum: 10000
            status:
              type: string
              enum:
              - active
              - disabled
              - error
            balance:
              type: string
              maxLength: 64
            errors:
              type: integer
              format: int64
              minimum: 0
- route: /admin/group
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-group/src/groupService.ts
