- route: /admin/channel
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-channel/src/channelService.ts
  operation: addChannel
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/integration/channels
  read_sources:
  - ai_provider
  - ai_channel
  - ai_channel_credential
  - ai_channel_resource
  write_tables:
  - ai_channel
  - ai_channel_credential
  - ai_channel_resource
  - ops_config_snapshot
  - ops_audit_log
  request_schema:
    name: AdminChannelCreateRequest
    required:
    - name
    - vendor
    - credentials
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 128
      vendor:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9 _().-]+$
      channelType:
        type: string
        enum:
        - official
        - relay
        description: Channel type. official means a direct vendor account; relay means an upstream aggregator account that can expose multiple vendors.
      protocol:
        type: string
        minLength: 1
        maxLength: 64
      accessType:
        type: string
        minLength: 1
        maxLength: 64
      credentialRotation:
        type: string
        enum:
        - default
        - priority
        - round_robin
        - weighted_round_robin
        - random
        description: Credential selection strategy for the upstream credential list.
      credentials:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: false
        items:
          name: AdminChannelCredentialInput
          type: object
          additionalProperties: false
          required:
          - baseUrl
          properties:
            name:
              type: string
              maxLength: 128
            baseUrl:
              type: string
              minLength: 1
              maxLength: 512
              pattern: ^https?://[^\\s]+$
            apiKey:
              type: string
              minLength: 1
              maxLength: 4096
              description: Plaintext upstream API key accepted only on create/update input. Backend stores a derived secret reference and does not return it through non-admin-safe responses.
            secretRef:
              type: string
              minLength: 1
              maxLength: 256
              pattern: ^(vault|secret)://[^\\s]+$
            priority:
              type: integer
              format: int64
              minimum: 1
              maximum: 1000000
            weight:
              type: integer
              format: int64
              minimum: 1
              maximum: 10000
            status:
              type: string
              enum:
              - active
              - disabled
              - error
      expiresAt:
        type: string
        nullable: true
        maxLength: 64
        description: Optional channel credential expiration timestamp. Omit or null to keep the channel credential permanently valid.
      capabilities:
        type: array
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          enum:
          - llm
          - image
          - audio
          - music
          - sfx
          - video
      resourceCodes:
        type: array
        maxItems: 256
        uniqueItems: true
        description: Resource bindings selected from ai_resource or ai_resource_group, such as vendor.openai, api.openai.chat_completions, model.openai.gpt-4o-mini.chat, or bundle.openrouter.openai.standard.
        items:
          type: string
          minLength: 1
          maxLength: 192
          pattern: ^[A-Za-z0-9._-]+$
      timeoutMs:
        type: integer
        format: int64
        minimum: 1
        maximum: 600000
        description: Per-channel upstream response timeout in milliseconds.
      retryPolicy:
        name: ProviderRetryPolicy
        type: object
        additionalProperties: false
        required:
        - maxAttempts
        - retryableStatusCodes
        properties:
          maxAttempts:
            type: integer
            minimum: 1
            maximum: 5
          retryableStatusCodes:
            type: array
            minItems: 0
            maxItems: 8
            uniqueItems: true
            items:
              type: integer
              enum:
              - 408
              - 409
              - 425
              - 429
              - 500
              - 502
              - 503
              - 504
          backoffMs:
            type: integer
            minimum: 0
            maximum: 2000
      circuitBreakerPolicy: *id001
      weight:
        type: integer
        format: int64
        minimum: 1
        maximum: 10000
      status:
        type: string
        enum:
        - active
        - disabled
        - error
  response_schema:
    name: AdminChannelMutationResponse
    required:
    - item
    properties:
      item:
        name: AdminChannelItem
        type: object
        additionalProperties: false
        required: *id002
        properties: *id003
        description: Persisted channel snapshot returned by the backend.
