- route: /rankings
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-rankings/src/rankingService.ts
  interface: RuntimeRankingSnapshot
  fields:
  - catalog
  - history
  - source
  data_sources:
  - ai_model_rank_snapshot
- route: /rankings
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-rankings/src/rankingCatalog.ts
