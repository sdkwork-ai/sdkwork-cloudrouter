tables:
- table: ai_channel_group
  domain: ai
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  frontend_routes:
  - /models
  - /console/api-keys
  - /console/usage
  - /admin/group
  - /admin/ratelimit
  - /admin/service-providers/bindings
  api_surfaces:
  - app
  - backend
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - group_code
  - group_name
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  - name: uk_ai_channel_group_tenant_code
    columns:
    - tenant_id
    - organization_id
    - group_code
  columns:
    group_code: string(64)
    group_name: string(128)
    description: string(512)
    provider_code: string(64)
    group_type: string(32)
    routing_policy_id: int64
    quota_policy_id: int64
    rate_limit_policy_id: int64
    environment: enum_int32
    pricing_plan_id: int64
    pricing_plan_code: string(64)
    rate_multiplier: decimal
    price_reference_mode: enum_int32
    official_price_multiplier: decimal
    billing_type: enum_int32
    capacity_limit: int64
    allowed_origin: json
  indexes:
  - name: idx_ai_channel_group_provider_status
    columns:
    - tenant_id
    - organization_id
    - provider_code
    - status
    - updated_at
    - id
  - name: idx_ai_channel_group_tenant_status_updated
    columns:
    - tenant_id
    - organization_id
    - status
    - updated_at
    - id
  - name: idx_ai_channel_group_pricing
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - status
    - updated_at
    - id
- table: ai_channel_group_member
  domain: ai
  profile: relation_entity
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  source_tables:
  - ai_channel_group
  - ai_channel
  frontend_routes:
  - /models
  - /admin/group
  - /admin/channel
  api_surfaces:
  - app
  - backend
  - worker
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - channel_group_id
  - channel_id
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  columns:
    channel_group_id: int64
    channel_id: int64
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    weight:
      type: int32
      constraints: NOT NULL DEFAULT 100
    enabled:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    effective_from: instant
    effective_to: instant
  indexes:
  - name: idx_ai_channel_group_member_status
    columns:
    - tenant_id
    - organization_id
    - status
    - channel_group_id
    - priority
    - id
  - name: uk_ai_channel_group_member
    unique: true
    columns:
    - tenant_id
    - organization_id
    - channel_group_id
    - channel_id
  - name: idx_ai_channel_group_member_group
    columns:
    - tenant_id
    - organization_id
    - channel_group_id
    - status
    - priority
    - weight
    - id
  - name: idx_ai_channel_group_member_channel
    columns:
    - tenant_id
    - organization_id
    - channel_id
    - status
    - id
  foreign_keys:
  - name: fk_ai_channel_group_member_group
    columns:
    - channel_group_id
    references_table: ai_channel_group
    references_columns:
    - id
  - name: fk_ai_channel_group_member_channel
    columns:
    - channel_id
    references_table: ai_channel
    references_columns:
    - id
- table: ai_channel_group_resource
  domain: ai
  profile: relation_entity
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  source_tables:
  - ai_channel_group
  - ai_resource
  - ai_resource_group
  frontend_routes:
  - /admin/group
  - /admin/channel
  api_surfaces:
  - backend
  - worker
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - channel_group_id
  - grant_type
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  columns:
    channel_group_id: int64
    resource_id: int64
    resource_code:
      type: string(192)
      constraints: NOT NULL DEFAULT ''
    resource_group_id: int64
    resource_group_code:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    grant_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'allow'
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    effective_from: instant
    effective_to: instant
  indexes:
  - name: idx_ai_channel_group_resource_status
    columns:
    - tenant_id
    - organization_id
    - status
    - channel_group_id
    - grant_type
    - priority
    - id
  - name: uk_ai_channel_group_resource
    unique: true
    columns:
    - tenant_id
    - organization_id
    - channel_group_id
    - resource_code
    - resource_group_code
  - name: idx_ai_channel_group_resource_lookup
    columns:
    - tenant_id
    - organization_id
    - channel_group_id
    - status
    - grant_type
    - priority
    - id
- table: ai_channel_group_metric_snapshot
  domain: ai
  profile: projection
  compliance_level: L2
  system_of_record: false
  write_owner: metrics-worker
  common_columns: projection
  source_tables:
  - ai_channel_group
  - iam_gateway_api_key
  - ai_channel
  - ai_usage_fact
  - ai_quota_policy
  frontend_routes:
  - /console/api-keys
  - /admin/group
  api_surfaces:
  - app
  - backend
  - worker
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  columns:
    channel_group_id: int64
    group_code: string(64)
    provider_code: string(64)
    channel_available_count: int64
    channel_total_count: int64
    capacity_used: decimal
    capacity_limit: decimal
    request_count_today: int64
    request_count_total: int64
    usage_amount_today: decimal
    usage_amount_total: decimal
    health_status: enum_int32
    snapshot_at: instant
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  indexes:
  - name: idx_ai_channel_group_metric_tenant_status
    columns:
    - tenant_id
    - organization_id
    - status
    - snapshot_at
    - id
  - name: uk_ai_channel_group_metric_snapshot
    unique: true
    columns:
    - tenant_id
    - organization_id
    - channel_group_id
    - snapshot_at
  - name: idx_ai_channel_group_metric_status
    columns:
    - tenant_id
    - organization_id
    - provider_code
    - health_status
    - snapshot_at
    - id
