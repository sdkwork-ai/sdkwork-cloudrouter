tables:
- table: ai_model_mapping_rule
  domain: ai
  profile: rule_entity
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  source_tables:
  - ai_model_vendor
  frontend_routes:
  - /admin/model/mappings
  - /admin/channel
  api_surfaces:
  - backend
  - worker
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - source_vendor_code
  - target_vendor_code
  - mapping_mode
  - match_type
  - enabled
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  columns:
    source_vendor_id: int64
    source_vendor_code:
      type: string(64)
      constraints: NOT NULL DEFAULT ''
    target_vendor_id: int64
    target_vendor_code:
      type: string(64)
      constraints: NOT NULL DEFAULT ''
    mapping_mode:
      type: string(32)
      constraints: NOT NULL DEFAULT 'alias'
    match_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'exact'
    enabled:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    metadata:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
  indexes:
  - name: idx_ai_model_mapping_rule_source_vendor
    columns:
    - tenant_id
    - organization_id
    - status
    - enabled
    - source_vendor_code
    - id
  - name: idx_ai_model_mapping_rule_target_vendor
    columns:
    - tenant_id
    - organization_id
    - status
    - enabled
    - target_vendor_code
    - id
  - name: idx_ai_model_mapping_rule_enabled
    columns:
    - tenant_id
    - organization_id
    - status
    - enabled
    - id
- table: ai_model_mapping_rule_item
  domain: ai
  profile: relation_entity
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  source_tables:
  - ai_model_mapping_rule
  - ai_model
  frontend_routes:
  - /admin/model/mappings
  - /admin/channel
  api_surfaces:
  - backend
  - worker
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - rule_id
  - source_model
  - target_model
  - sort_order
  - enabled
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  columns:
    rule_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    rule_uuid: string(128)
    source_model:
      type: string(256)
      constraints: NOT NULL DEFAULT ''
    source_catalog_key: string(256)
    target_model:
      type: string(256)
      constraints: NOT NULL DEFAULT ''
    target_catalog_key: string(256)
    target_provider_model: string(256)
    target_provider_native_model: string(256)
    sort_order:
      type: int32
      constraints: NOT NULL DEFAULT 100
    enabled:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    metadata:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
  indexes:
  - name: idx_ai_model_mapping_rule_item_rule_lookup
    columns:
    - tenant_id
    - organization_id
    - rule_id
    - status
    - enabled
    - sort_order
    - id
  - name: idx_ai_model_mapping_rule_item_source_lookup
    columns:
    - tenant_id
    - organization_id
    - source_model
    - status
    - enabled
    - id
  - name: idx_ai_model_mapping_rule_item_target_lookup
    columns:
    - tenant_id
    - organization_id
    - target_catalog_key
    - target_model
    - status
    - id
  foreign_keys:
  - name: fk_ai_model_mapping_rule_item_rule
    columns:
    - rule_id
    references_table: ai_model_mapping_rule
    references_columns:
    - id
- table: ai_model_mapping_rule_binding
  domain: ai
