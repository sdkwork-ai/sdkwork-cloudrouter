fragment: shared/entities/admin
x_response_entities:
  admin_announcement_item:
    name: AdminAnnouncementItem
    type: object
    additionalProperties: false
    required:
    - id
    - title
    - target
    - status
    - showAsPopup
    - date
    - content
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      title:
        type: string
        minLength: 1
        maxLength: 200
      target:
        type: string
        enum:
        - all
        - vip
        - free
        - beta
      status:
        type: string
        enum:
        - published
        - draft
      showAsPopup:
        type: boolean
      date:
        type: string
        minLength: 1
        maxLength: 64
      content:
        type: string
        minLength: 1
        maxLength: 20000
  admin_announcement_create_request:
    name: AdminAnnouncementCreateRequest
    type: object
    additionalProperties: false
    required:
    - title
    - target
    - status
    - showAsPopup
    - content
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      target:
        type: string
        enum:
        - all
        - vip
        - free
        - beta
      status:
        type: string
        enum:
        - published
        - draft
      showAsPopup:
        type: boolean
      content:
        type: string
        minLength: 1
        maxLength: 20000
  admin_announcement_update_request:
    name: AdminAnnouncementUpdateRequest
    type: object
    additionalProperties: false
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      target:
        type: string
        enum:
        - all
        - vip
        - free
        - beta
      status:
        type: string
        enum:
        - published
        - draft
      showAsPopup:
        type: boolean
      content:
        type: string
        minLength: 1
        maxLength: 20000
  admin_announcement_mutation_response:
    name: AdminAnnouncementMutationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        $ref: '#/x_response_entities/admin_announcement_item'
  admin_announcements_response:
    name: AdminAnnouncementsResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: '#/x_response_entities/admin_announcement_item'
  admin_announcements_delete_response:
    name: AnnouncementsDeleteResult
    type: object
    additionalProperties: false
    required:
    - deleted
    properties:
      deleted:
        type: boolean
  admin_referral_stats_response:
    name: AdminReferralStatsResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: '#/x_response_entities/admin_referral_stat_item'
  admin_agent_version_item: &id002
    name: AdminAgentVersionItem
    type: object
    additionalProperties: false
    required:
    - id
    - versionNo
    - releaseStatus
    - systemPrompt
    - toolPolicy
    - memoryPolicy
    - mcpPolicy
    - skillPolicy
    - runtimePolicy
    - createdAt
    - updatedAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      versionNo:
        type: integer
        format: int64
        minimum: 1
      releaseStatus:
        type: string
        enum:
        - draft
        - published
        - archived
      model:
        type: string
        nullable: true
        maxLength: 128
      systemPrompt:
        type: string
        maxLength: 32768
      toolPolicy: &id001
        name: AgentPolicy
        type: object
        additionalProperties: true
        description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
      memoryPolicy: *id001
      mcpPolicy: *id001
      skillPolicy: *id001
      runtimePolicy: *id001
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      updatedAt:
        type: string
        minLength: 1
        maxLength: 64
  admin_agent_capabilities: &id003
    name: AdminAgentCapabilities
    type: object
    additionalProperties: false
    required:
    - memoryEnabled
    - mcpServerCount
    - skillBindingCount
    properties:
      memoryEnabled:
        type: boolean
      mcpServerCount:
        type: integer
        format: int64
        minimum: 0
      skillBindingCount:
        type: integer
        format: int64
        minimum: 0
  admin_agent_item:
    name: AdminAgentItem
    type: object
    additionalProperties: false
    required:
    - id
    - ownerUserId
    - code
    - name
    - description
    - visibility
    - status
    - createdAt
    - updatedAt
    - defaultVersion
    - capabilities
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      ownerUserId:
        type: integer
        format: int64
        minimum: 1
      code:
        type: string
        minLength: 1
        maxLength: 96
        pattern: ^[a-z0-9][a-z0-9-]{0,95}$
      name:
        type: string
        minLength: 1
        maxLength: 128
      description:
        type: string
        maxLength: 1024
      visibility:
        type: string
        enum:
        - private
        - organization
        - public
      status:
        type: string
        enum:
        - active
        - disabled
      avatar:
        $ref: '#/components/schemas/MediaResource'
        nullable: true
      templateSource:
        type: string
        nullable: true
        maxLength: 128
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      updatedAt:
        type: string
        minLength: 1
        maxLength: 64
      defaultVersion: *id002
      capabilities: *id003
  admin_channel_item:
    name: AdminChannelItem
    type: object
    additionalProperties: false
    required:
    - id
    - channelId
    - name
    - vendor
    - channelType
    - protocol
    - accessType
    - credentialRotation
    - credentials
    - capabilities
    - resourceCodes
    - isMultimodal
    - weight
    - status
    - balance
    - errors
    - createdAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      channelId:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[1-9][0-9]*$
      name:
        type: string
        minLength: 1
        maxLength: 128
      vendor:
        type: string
        minLength: 1
        maxLength: 64
      channelType:
        type: string
        enum:
        - official
        - relay
      protocol:
        type: string
        minLength: 1
        maxLength: 64
      accessType:
        type: string
        minLength: 1
        maxLength: 64
      credentialRotation:
        type: string
        enum:
        - default
        - priority
        - round_robin
        - weighted_round_robin
        - random
      credentials:
        type: array
        minItems: 0
        maxItems: 64
        items:
          name: AdminChannelCredentialItem
          type: object
          additionalProperties: false
          required:
          - id
          - credentialId
          - name
          - baseUrl
          - secretRef
          - maskedLabel
          - priority
          - weight
          - status
          - errors
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            credentialId:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[1-9][0-9]*$
            name:
              type: string
              minLength: 1
              maxLength: 128
            baseUrl:
              type: string
              minLength: 1
              maxLength: 512
              pattern: ^https?://[^\\s]+$
            secretRef:
              type: string
              minLength: 1
              maxLength: 256
              pattern: ^(vault|secret)://[^\\s]+$
            apiKey:
              type: string
              maxLength: 4096
              description: Plaintext provider API key returned only to authenticated admin management responses when available.
            maskedLabel:
              type: string
              minLength: 1
              maxLength: 128
            priority:
              type: integer
              format: int64
              minimum: 1
              maximum: 1000000
            weight:
              type: integer
              format: int64
              minimum: 1
              maximum: 10000
            status:
              type: string
              enum:
              - active
              - disabled
              - error
            errors:
              type: integer
              format: int64
              minimum: 0
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      expiresAt:
        type: string
        nullable: true
        maxLength: 64
        description: Optional channel account expiration timestamp. Null or absence means the channel account never expires.
      capabilities:
        type: array
        maxItems: 16
        items:
          type: string
          enum:
          - llm
          - image
          - audio
          - music
          - sfx
          - video
      resourceCodes:
        type: array
        maxItems: 256
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 192
          pattern: ^[A-Za-z0-9._-]+$
      isMultimodal:
        type: boolean
      timeoutMs:
        type: integer
        format: int64
        minimum: 1
        maximum: 600000
      retryPolicy:
        name: ProviderRetryPolicy
        type: object
        additionalProperties: false
        required:
        - maxAttempts
        - retryableStatusCodes
        properties:
          maxAttempts:
            type: integer
            minimum: 1
            maximum: 5
          retryableStatusCodes:
            type: array
            maxItems: 8
            uniqueItems: true
            items:
              type: integer
              enum:
              - 408
              - 409
              - 425
              - 429
              - 500
              - 502
              - 503
              - 504
          backoffMs:
            type: integer
            minimum: 0
            maximum: 2000
      circuitBreakerPolicy:
        name: ProviderCircuitBreakerPolicy
        type: object
        additionalProperties: false
        required:
        - failureThreshold
        properties:
          failureThreshold:
            type: integer
            minimum: 1
            maximum: 100
      weight:
        type: integer
        format: int64
        minimum: 1
        maximum: 10000
      status:
        type: string
        enum:
        - active
        - disabled
        - error
      balance:
        type: string
        maxLength: 64
      errors:
        type: integer
        format: int64
        minimum: 0
  admin_provider_secret_item:
    name: AdminProviderSecretItem
    type: object
    additionalProperties: false
