  admin_ai_model_region_price_input:
    name: AdminAiModelRegionPrice
    type: object
    additionalProperties: false
    description: Regional official reference pricing input for admin AI model commands.
    required:
    - regionCode
    - priceIn
    - priceOut
    properties:
      regionCode:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z][a-z0-9_-]{0,63}$
        description: Model catalog pricing region code.
      priceIn:
        type: string
        pattern: ^[0-9]+(\.[0-9]{1,12})?$
        description: Official reference input unit price in USD.
      priceOut:
        type: string
        pattern: ^[0-9]+(\.[0-9]{1,12})?$
        description: Official reference output unit price in USD.
      cacheReadPrice:
        type: string
        pattern: ^$|^[0-9]+(\.[0-9]{1,12})?$
        description: Optional official reference cache-read unit price in USD.
      cacheWritePrice:
        type: string
        pattern: ^$|^[0-9]+(\.[0-9]{1,12})?$
        description: Optional official reference cache-write unit price in USD.
  admin_ai_model_item:
    name: AdminAiModelItem
    type: object
    additionalProperties: false
    required:
    - id
    - vendorId
    - vendorCode
    - model
    - displayName
    - name
    - type
    - regionPrices
    - status
    - calls
    - description
    - modalities
    - inputModalities
    - outputModalities
    - apiFormat
    - capabilityIntro
    - limitations
    - supportedLanguages
    - useCases
    - trainingDataCutoff
    - contextTokens
    - maxOutputTokens
    - supportsStreaming
    - supportsTools
    - supportsJsonSchema
    - releaseStage
    - shelfState
    - routingState
    - replacementModel
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      vendorId:
        type: string
        minLength: 1
        maxLength: 128
      vendorCode:
        type: string
        minLength: 1
        maxLength: 64
      model:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[A-Za-z0-9._:/-]+$
        description: Runtime model identifier used for provider calls, routing, and pricing keys.
      displayName:
        type: string
        minLength: 1
        maxLength: 128
        description: Product display name. Falls back to model when no display name is configured.
      name:
        type: string
        minLength: 1
        maxLength: 128
        description: Compatibility display alias. Equal to displayName.
      type:
        type: string
        enum:
        - Chat
        - Image
        - Audio
        - Embedding
        - Music
        - SoundEffect
        - Video
      regionPrices:
        type: array
        minItems: 1
        maxItems: 32
        items:
          name: AdminAiModelRegionPrice
          type: object
          additionalProperties: false
          description: Regional official reference pricing returned by admin AI model payloads.
          required:
          - regionCode
          - priceIn
          - priceOut
          properties:
            regionCode:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z][a-z0-9_-]{0,63}$
              description: Model catalog pricing region code.
            priceIn:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,12})?$
              description: Official reference input unit price in USD.
            priceOut:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,12})?$
              description: Official reference output unit price in USD.
            cacheReadPrice:
              type: string
              pattern: ^$|^[0-9]+(\.[0-9]{1,12})?$
