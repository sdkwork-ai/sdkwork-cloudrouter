      capacity:
        name: AdminCapacityPair
        type: object
        additionalProperties: false
        required:
        - used
        - total
        properties:
          used:
            type: number
            minimum: 0
          total:
            type: number
            minimum: 0
      usage:
        name: AdminUsagePair
        type: object
        additionalProperties: false
        required:
        - today
        - total
        properties:
          today:
            type: number
            minimum: 0
          total:
            type: number
            minimum: 0
      status:
        type: string
        enum:
        - active
        - disabled
