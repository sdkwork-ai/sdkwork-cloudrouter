  path_params:
  - invocationId
  query_parameters: []
  response_schema: *id001
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: completeRuntimeInvocation
  operation_id: invocations.submit
  kind: action
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/runtime/invocations/{invocationId}/complete
  sdk_domain: runtime
  summary: Complete runtime invocation
  description: Completes one runtime invocation with provider response ids, finish reason, latency, exit status, response snapshot, and usage snapshot.
  read_sources:
  - ai_runtime_invocation
  write_tables:
  - ai_runtime_invocation
  path_params:
  - invocationId
  idempotency_required: true
  request_schema:
    name: RuntimeInvocationCompleteRequest
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - pending
        - running
        - streaming
        - completed
        - failed
        - cancelled
      providerResponseId:
        type: string
        maxLength: 128
      providerSessionId:
        type: string
        maxLength: 128
      providerConversationId:
        type: string
        maxLength: 128
      providerStepId:
        type: string
        maxLength: 128
      finishReason:
        type: string
        maxLength: 128
      latencyMs:
        type: integer
        format: int64
        minimum: 0
      ttftMs:
        type: integer
        format: int64
        minimum: 0
      exitCode:
        type: integer
        format: int64
      errorType:
        type: string
        maxLength: 128
      errorCode:
        type: string
        maxLength: 128
      errorMessageMasked:
        type: string
        maxLength: 1024
      responseJson:
        type: object
        additionalProperties: true
      usageJson:
        name: UsageSnapshot
        type: object
        additionalProperties: true
        properties:
          inputTokens:
            type: integer
            format: int64
            minimum: 0
          outputTokens:
            type: integer
            format: int64
            minimum: 0
          cachedTokens:
            type: integer
            format: int64
            minimum: 0
          totalTokens:
            type: integer
            format: int64
            minimum: 0
      metadata:
        type: object
        additionalProperties: true
  response_schema: *id002
