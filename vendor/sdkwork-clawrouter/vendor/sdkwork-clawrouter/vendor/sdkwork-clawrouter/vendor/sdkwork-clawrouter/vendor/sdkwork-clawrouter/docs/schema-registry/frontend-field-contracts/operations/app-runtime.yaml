- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: createRuntimeInvocation
  operation_id: invocations.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/runtime/invocations
  sdk_domain: runtime
  summary: Create runtime invocation
  description: Creates one normalized runtime invocation for Claude Code, Gemini, Codex, OpenAI-compatible providers, tools, MCP calls, skills, or custom runtime adapters. The server generates the runtime request id.
  read_sources:
  - ai_chat_conversation
  - ai_chat_turn
  - ai_agent_session
  write_tables:
  - ai_runtime_invocation
  idempotency_required: true
  request_schema:
    name: RuntimeInvocationCreateRequest
    type: object
    additionalProperties: false
    required:
    - runtime
    properties:
      invocationType:
        type: string
        maxLength: 128
      runtime:
        type: string
        minLength: 1
        maxLength: 128
      endpoint:
        type: string
        maxLength: 128
      status:
        type: string
        enum:
        - pending
        - running
        - streaming
        - completed
        - failed
        - cancelled
      conversationId:
        type: string
        maxLength: 128
      chatTurnId:
        type: string
        maxLength: 128
      chatItemId:
        type: string
        maxLength: 128
      agentSessionId:
        type: string
        maxLength: 128
      agentRunId:
        type: string
        maxLength: 128
      agentRunStepId:
        type: string
        maxLength: 128
      traceId:
        type: string
        maxLength: 128
      model:
        type: string
        maxLength: 128
      provider:
        type: string
        maxLength: 128
      toolName:
        type: string
        maxLength: 128
      toolCallId:
        type: string
        maxLength: 128
      cwd:
        type: string
        maxLength: 2048
      sandboxPolicy:
        type: string
        maxLength: 128
      approvalPolicy:
        type: string
        maxLength: 128
      permissionMode:
        type: string
        maxLength: 128
      streaming:
        type: boolean
      requestJson:
        type: object
        additionalProperties: true
      metadata:
        type: object
        additionalProperties: true
  response_schema: &id002
    name: RuntimeInvocationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: *id001
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: retrieveRuntimeInvocation
  operation_id: invocations.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/runtime/invocations/{invocationId}
  sdk_domain: runtime
  summary: Retrieve runtime invocation
  description: Returns one runtime invocation by stable id with provider, model, execution policy, status, latency, and finish metadata.
