fragment: shared/entities/commerce
x_response_entities:
  recharge_record:
    name: RechargeRecord
    type: object
    additionalProperties: false
    required:
    - id
    - orderNo
    - method
    - amount
    - date
    - status
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
        description: Stable appbase commerce_payment_attempt id for the recharge payment record.
      orderNo:
        type: string
        minLength: 1
        maxLength: 128
      method:
        type: string
        minLength: 1
        maxLength: 64
      amount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
        description: Recharge payment amount as a canonical decimal money string.
      date:
        type: string
        minLength: 1
        maxLength: 64
      status:
        type: string
        enum:
        - success
        - pending
        - failed
  recharge_package:
    name: RechargePackage
    type: object
    additionalProperties: false
    required:
    - id
    - priceAmount
    - currencyCode
    - bonusPoints
    - grantAmount
    - points
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      priceAmount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
        description: Recharge package price as a canonical decimal money string.
      currencyCode:
        type: string
        minLength: 3
        maxLength: 16
        pattern: ^[A-Z0-9_-]+$
      bonusPoints:
        type: integer
        format: int64
        minimum: 0
      grantAmount:
        type: integer
        format: int64
        minimum: 0
      points:
        type: integer
        format: int64
        minimum: 0
        description: Total credited points for this recharge package, including bonus points.
  recharge_settings:
    name: RechargeSettings
    type: object
    additionalProperties: false
    required:
    - baseCurrencyCode
    - basePointsPerCny
    - currencyToCnyRates
    properties:
      baseCurrencyCode:
        type: string
        minLength: 3
        maxLength: 16
        pattern: ^[A-Z0-9_-]+$
      basePointsPerCny:
        type: string
        pattern: ^\d+(?:\.\d{1,6})?$
      currencyToCnyRates:
        type: object
        additionalProperties:
          type: string
          pattern: ^\d+(?:\.\d{1,6})?$
      previewExamples:
        type: object
        additionalProperties:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
            - grantAmount
            properties:
              grantAmount:
                type: integer
                format: int64
                minimum: 0
  checkout_status_response:
    name: CheckoutStatusResponse
    type: object
    additionalProperties: false
    required:
    - orderNo
    - outTradeNo
    - amount
    - points
    - providerCode
    - paymentMethod
    - paymentProduct
    - orderStatus
    - paymentStatus
    - rechargeStatus
    - status
    - createdAt
    - expiresAt
    - paidAt
    - nextAction
    - cashierUrl
    - qrCodePayload
    properties:
      orderNo:
        type: string
        minLength: 1
        maxLength: 128
      outTradeNo:
        type: string
        maxLength: 128
      amount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
        description: Checkout amount as a canonical decimal money string.
      currencyCode:
        type: string
        minLength: 3
        maxLength: 16
        pattern: ^[A-Z0-9_-]+$
      points:
        type: integer
        format: int64
        minimum: 0
      providerCode:
        type: string
        minLength: 1
        maxLength: 64
        description: Payment provider code resolved by the backend runtime, such as wechat_pay or alipay.
      paymentMethod:
        type: string
        minLength: 1
        maxLength: 64
        description: Standardized payment method code exposed to app and portal clients. Use business-facing values such as wechat, alipay, or card instead of provider adapter codes like wechat_pay.
      paymentProduct:
        type: string
        minLength: 1
        maxLength: 64
        description: Concrete payment product resolved by the backend runtime, such as wechat_native, wechat_jsapi, alipay_page, or alipay_wap.
      orderStatus:
        type: string
        minLength: 1
        maxLength: 64
      paymentStatus:
        type: string
        minLength: 1
        maxLength: 64
      rechargeStatus:
        type: string
        minLength: 1
        maxLength: 64
      status:
        type: string
        minLength: 1
        maxLength: 64
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      expiresAt:
        type: string
        minLength: 1
        maxLength: 64
      paidAt:
        type: string
        maxLength: 64
      nextAction:
        type: string
        minLength: 1
        maxLength: 64
        description: Business next action for the current checkout state. Use scan_qr for PC qr-scan checkout, request_payment for in-H5 bridge invocation, open_url for browser handoff, completed for fully paid orders, and pending while the payment action is still being prepared.
      cashierUrl:
        type: string
        minLength: 1
        maxLength: 2048
        description: Standard cashier page URL for web and QR based payment entry. PC QR rendering and H5 browser handoff should both prefer this field.
      qrCodePayload:
        type: string
        minLength: 1
        maxLength: 2048
        description: Standard QR payload field. When nextAction is scan_qr, this value must be an http or https payment page URL that a WeChat or Alipay scanner can open and then hand off to the native payment flow.
      requestPaymentPayload:
        type: object
        nullable: true
        additionalProperties: true
        description: Optional payment bridge payload for H5 requestPayment execution such as WeChat JSAPI or Alipay tradePay.
