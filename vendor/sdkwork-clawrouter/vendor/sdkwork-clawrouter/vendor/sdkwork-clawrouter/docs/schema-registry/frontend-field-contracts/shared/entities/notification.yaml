fragment: shared/entities/notification
x_response_entities:
  notification_item:
    name: NotificationItem
    type: object
    additionalProperties: false
    required:
    - id
    - appId
    - title
    - desc
    - content
    - time
    - type
    - read
    - showAsPopup
    - popupSeen
    - archived
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      appId:
        type: string
        minLength: 1
        maxLength: 128
      title:
        type: string
        minLength: 1
        maxLength: 200
      desc:
        type: string
        maxLength: 512
        description: User-facing short notification summary.
      content:
        type: string
        maxLength: 20000
      time:
        type: string
        minLength: 1
        maxLength: 64
      type:
        type: string
        enum:
        - info
        - billing
        - warning
        - alert
      read:
        type: boolean
      showAsPopup:
        type: boolean
        description: Whether this notification should be displayed as a modal popup when the frontend loads.
      popupSeen:
        type: boolean
        description: Server-side per-user state indicating that the popup has already been presented for this app.
      archived:
        type: boolean
      actionUrl:
        type: string
        nullable: true
        maxLength: 512
  notification_mutation_response:
    name: NotificationMutationResponse
    type: object
    additionalProperties: false
    required:
    - updated
    - state
    properties:
      updated:
        type: boolean
      state:
        type: string
        enum:
        - acknowledged
        - popup_seen
