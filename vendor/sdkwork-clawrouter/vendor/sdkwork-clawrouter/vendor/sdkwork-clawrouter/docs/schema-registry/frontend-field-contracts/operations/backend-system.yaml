    properties:
      leftRailMode:
        type: string
        enum:
        - auto
        - highlights-only
        - qr-only
      loginMethods:
        type: array
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items:
          type: string
          enum:
          - password
          - emailCode
          - phoneCode
          - sessionBridge
      oauthLoginEnabled:
        type: boolean
      oauthProviders:
        type: array
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
      oauthRegion:
        type: string
        enum:
        - mainland
        - overseas
      qrLoginEnabled:
        type: boolean
      qrLoginType:
        type: string
        enum:
        - web
        - official
        - mini
      recoveryMethods:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
          enum:
          - email
          - phone
      registerMethods:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
          enum:
          - email
          - phone
      verificationPolicy: *id001
      wechat:
        name: AdminAuthWechatSettingsUpdate
        type: object
        additionalProperties: false
        properties:
          official:
            type: array
            maxItems: 8
            items: *id002
          mini:
            type: array
            maxItems: 8
            items: *id003
