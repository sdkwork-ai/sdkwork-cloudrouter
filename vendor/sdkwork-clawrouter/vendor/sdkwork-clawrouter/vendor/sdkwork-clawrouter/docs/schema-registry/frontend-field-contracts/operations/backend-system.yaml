- route: /admin/runtime-region
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-runtime-region/src/runtimeRegionService.ts
  operation: fetchSettings
  operation_id: runtimeRegion.settings.retrieve
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/system/runtime_region/settings
  sdk_domain: system
  summary: Retrieve runtime region settings
  description: Returns the tenant-scoped default runtime region used for route, endpoint, and regional pricing selection. Defaults to China region when no snapshot has been published.
  read_sources:
  - ops_config_snapshot
  query_parameters: []
  response_schema: &adminRuntimeRegionSettingsResponse
    name: AdminRuntimeRegionSettingsResponse
    type: object
    additionalProperties: false
    required:
    - currentRegionCode
    - currentRegionName
    - remark
    properties:
      currentRegionCode:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z0-9_-]+$
        description: Lowercase runtime region code. The default value is cn.
      currentRegionName:
        type: string
        minLength: 1
        maxLength: 128
        description: Human-readable runtime region name displayed in admin operations.
      remark:
        type: string
        maxLength: 512
        description: Operator-facing explanation for how this runtime region is used.
- route: /admin/runtime-region
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-runtime-region/src/runtimeRegionService.ts
  operation: updateSettings
  operation_id: runtimeRegion.settings.update
  kind: update
  api_surface: backend
  api_method: PATCH
  api_path: /backend/v3/api/system/runtime_region/settings
  sdk_domain: system
  summary: Update runtime region settings
  description: Updates the tenant-scoped default runtime region used for route, endpoint, and regional pricing selection, writes an immutable configuration snapshot, and records an operations audit entry.
  read_sources:
  - ops_config_snapshot
  write_tables:
  - ops_config_snapshot
  - ops_audit_log
  request_schema:
    name: AdminRuntimeRegionSettingsUpdateRequest
    type: object
    additionalProperties: false
    properties:
      currentRegionCode:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z0-9_-]+$
        description: Lowercase runtime region code, for example cn, us, eu, or global.
      currentRegionName:
        type: string
        maxLength: 128
        description: Human-readable runtime region name displayed in admin operations.
      remark:
        type: string
        maxLength: 512
        description: Operator-facing explanation for how this runtime region is used.
  response_schema: *adminRuntimeRegionSettingsResponse
- route: /admin/cache
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-cache/src/cacheService.ts
  operation: fetchOverview
  operation_id: cache.overview.retrieve
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/system/cache/overview
  sdk_domain: system
  summary: Retrieve runtime cache overview
  description: Returns configured cache instances, namespace policies, runtime binding, entry counts, and operational capability flags for admin cache management.
  read_sources:
  - ops_config_snapshot
  - ops_audit_log
  query_parameters: []
  response_schema:
    name: AdminCacheOverviewResponse
    type: object
    additionalProperties: false
    required:
    - summary
    - instances
    - namespacePolicies
    properties:
      summary:
        name: AdminCacheSummary
        type: object
        additionalProperties: false
        required:
        - runtimeTarget
        - totalInstances
        - totalNamespaces
        - totalEntries
        - expiredEntries
        - cacheHits
        - cacheMisses
        - cacheWrites
        - cacheDeletes
        - cacheRefreshes
        - cacheInspections
        - cacheErrors
        properties:
          runtimeTarget:
            type: string
            enum:
            - desktop_packaged
            - service
          totalInstances:
            type: integer
            format: int64
            minimum: 0
          totalNamespaces:
            type: integer
            format: int64
            minimum: 0
          totalEntries:
            type: integer
            format: int64
            minimum: 0
          expiredEntries:
            type: integer
            format: int64
            minimum: 0
          cacheHits:
            type: integer
            format: int64
            minimum: 0
          cacheMisses:
            type: integer
            format: int64
            minimum: 0
          cacheWrites:
            type: integer
            format: int64
            minimum: 0
          cacheDeletes:
            type: integer
            format: int64
            minimum: 0
          cacheRefreshes:
            type: integer
            format: int64
            minimum: 0
          cacheInspections:
            type: integer
            format: int64
            minimum: 0
          cacheErrors:
            type: integer
            format: int64
            minimum: 0
      instances:
        type: array
        maxItems: 32
        items:
          name: AdminCacheInstance
          type: object
          additionalProperties: false
          required:
          - name
          - providerKind
          - purpose
          - keyPrefix
          - defaultTtlSeconds
          - supportsInspect
          - supportsRefresh
          - supportsDelete
          - entryCount
          - expiredEntryCount
          - cacheHits
          - cacheMisses
