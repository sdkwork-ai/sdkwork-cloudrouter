- route: /admin/settings
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-site/src/AuthSettingsService.ts
  operation: fetchClawRouterAuthSettings
  operation_id: auth.settings.retrieve
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/system/auth/settings
  sdk_domain: system
  summary: Retrieve IAM auth runtime settings
  description: Returns configurable login, registration, recovery, OAuth, QR login, and verification policy settings for the shared SDKWork auth runtime.
  read_sources:
  - ops_config_snapshot
  query_parameters: []
  response_schema: &id004
    name: AdminAuthSettingsResponse
    type: object
    additionalProperties: false
    required:
    - leftRailMode
    - loginMethods
    - oauthLoginEnabled
    - oauthProviders
    - qrLoginEnabled
    - qrLoginType
    - recoveryMethods
    - registerMethods
    - verificationPolicy
    - wechat
    properties:
      leftRailMode:
        type: string
        enum:
        - auto
        - highlights-only
        - qr-only
      loginMethods:
        type: array
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items:
          type: string
          enum:
          - password
          - emailCode
          - phoneCode
          - sessionBridge
      oauthLoginEnabled:
        type: boolean
      oauthProviders:
        type: array
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
      oauthRegion:
        type: string
        enum:
        - mainland
        - overseas
      qrLoginEnabled:
        type: boolean
      qrLoginType:
        type: string
        enum:
        - web
        - official
        - mini
      recoveryMethods:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
          enum:
          - email
          - phone
      registerMethods:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
          enum:
          - email
          - phone
      verificationPolicy: &id001
        name: AdminAuthVerificationPolicy
        type: object
        additionalProperties: false
        required:
        - emailCodeLoginEnabled
        - emailRegistrationVerificationRequired
        - phoneCodeLoginEnabled
        - phoneRegistrationVerificationRequired
        properties:
          emailCodeLoginEnabled:
            type: boolean
          emailRegistrationVerificationRequired:
            type: boolean
          phoneCodeLoginEnabled:
            type: boolean
          phoneRegistrationVerificationRequired:
            type: boolean
      wechat:
        name: AdminAuthWechatSettings
        type: object
        additionalProperties: false
        required:
        - official
        - mini
        properties:
          official:
            type: array
            maxItems: 8
            items: &id002
              name: AdminAuthWechatOfficial
              type: object
              additionalProperties: false
              required:
              - key
              - name
              - appId
              - secretRef
              - tokenRef
              - enabled
              - primary
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                appId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                originalId:
                  type: string
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]*$
                secretRef:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^(secret|vault)://[!-~]+$
                tokenRef:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^(secret|vault)://[!-~]+$
                aesKeyRef:
                  type: string
                  maxLength: 256
                  pattern: ^(|secret://[!-~]+|vault://[!-~]+)$
                url:
                  type: string
                  maxLength: 2048
                  pattern: ^$|^https://[^#]+$
                enabled:
                  type: boolean
                primary:
                  type: boolean
                scene:
                  type: string
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]*$
          mini:
            type: array
            maxItems: 8
            items: &id003
              name: AdminAuthWechatMini
              type: object
              additionalProperties: false
              required:
              - key
              - name
              - appId
              - secretRef
              - enabled
              - primary
              - path
              - env
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                appId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_-]+$
                secretRef:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^(secret|vault)://[!-~]+$
                url:
                  type: string
                  maxLength: 2048
                  pattern: ^$|^https://[^#]+$
                enabled:
                  type: boolean
                primary:
                  type: boolean
                path:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[^/?#][^?#]*$
                env:
                  type: string
                  enum:
                  - release
                  - trial
                  - develop
- route: /admin/settings
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-site/src/AuthSettingsService.ts
