fragment: operations/app-auth
frontend_operations:
- route: /auth/login
  source: apps/sdkwork-clawrouter-pc/src/auth/clawRouterAuthSettingsService.ts
  operation: fetchClawRouterAuthRuntimeSettings
  operation_id: iam.runtime.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/system/iam/runtime
  openapi_exposed: false
  sdk_domain: iam
  summary: Retrieve public IAM runtime settings
  description: Returns public login, registration, recovery, OAuth, QR login, and verification policy settings for the shared SDKWork IAM runtime without requiring an app session.
  read_sources:
  - ops_config_snapshot
  query_parameters:
  - name: tenant_code
    schema:
      type: string
      maxLength: 64
  - name: organization_code
    schema:
      type: string
      maxLength: 64
  response_schema:
    name: AuthRuntimeSettingsResponse
    type: object
    additionalProperties: false
    required:
    - leftRailMode
    - loginMethods
    - oauthLoginEnabled
    - oauthProviders
    - qrLoginEnabled
    - qrLoginType
    - recoveryMethods
    - registerMethods
    - verificationPolicy
    properties:
      leftRailMode:
        type: string
        enum:
        - auto
        - highlights-only
        - qr-only
      loginMethods:
        type: array
        minItems: 1
        maxItems: 8
        uniqueItems: true
        items:
          type: string
          enum:
          - password
          - emailCode
          - phoneCode
          - sessionBridge
      oauthLoginEnabled:
        type: boolean
      oauthProviders:
        type: array
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
      oauthRegion:
        type: string
        enum:
        - mainland
        - overseas
      qrLoginEnabled:
        type: boolean
      qrLoginType:
        type: string
        enum:
        - web
        - official
        - mini
      recoveryMethods:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
          enum:
          - email
          - phone
      registerMethods:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
          enum:
          - email
          - phone
      verificationPolicy: &id001
        name: AuthVerificationPolicy
        type: object
        additionalProperties: false
        required:
        - emailCodeLoginEnabled
        - emailRegistrationVerificationRequired
        - phoneCodeLoginEnabled
        - phoneRegistrationVerificationRequired
        properties:
          emailCodeLoginEnabled:
            type: boolean
          emailRegistrationVerificationRequired:
            type: boolean
          phoneCodeLoginEnabled:
            type: boolean
          phoneRegistrationVerificationRequired:
            type: boolean
- route: /auth/login
  source: apps/sdkwork-clawrouter-pc/src/auth/clawRouterAuthController.ts
  operation: signIn
  operation_id: sessions.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/auth/sessions
  openapi_exposed: false
  sdk_domain: auth
  summary: Create IAM session
  description: Creates a standard SDKWork IAM session for password, email-code, phone-code, or signed session-bridge grants and returns dual auth/access tokens with AppContext.
  read_sources:
  - iam_user
  - iam_credential
  - iam_session
  write_tables:
  - iam_session
  - iam_security_event
  - iam_audit_event
  request_schema:
    name: IamSessionCreateRequest
    properties:
      grantType:
        type: string
        enum:
        - password
        - email_code
        - phone_code
        - session_bridge
        description: Authentication grant. Defaults to password when username and password are supplied.
      username:
        type: string
        minLength: 1
        maxLength: 128
      password:
        type: string
        minLength: 1
        maxLength: 128
      email:
        type: string
        maxLength: 256
      phone:
        type: string
        maxLength: 32
      code:
        type: string
        maxLength: 32
      subject:
        type: string
        maxLength: 256
      name:
        type: string
        maxLength: 128
      tenantCode:
        type: string
        maxLength: 64
      organizationCode:
        type: string
        maxLength: 64
      deviceId:
        type: string
        maxLength: 128
      deviceName:
        type: string
        maxLength: 128
      deviceType:
        type: string
        maxLength: 32
  response_schema:
    name: IamSessionResponse
    required:
    - accessToken
    - authToken
    - context
    - user
    properties:
      accessToken:
        type: string
        minLength: 1
        description: Data isolation and tenant access token. Clients send it as Access-Token.
      authToken:
        type: string
        minLength: 1
        description: Bearer authentication token. Clients send it as Authorization Bearer.
      refreshToken:
        type: string
        minLength: 1
        description: Refresh token for session renewal.
      sessionId:
        type: string
        minLength: 1
        maxLength: 128
      expiresAt:
        type: string
        format: date-time
      context:
        name: IamAppContext
        type: object
        additionalProperties: false
        required:
        - appId
        - authLevel
        - dataScope
        - deploymentMode
        - environment
        - permissionScope
        - sessionId
        - tenantId
        - userId
        properties:
          appId:
            type: string
            minLength: 1
            maxLength: 128
          authLevel:
            type: string
            enum:
            - anonymous
            - password
            - mfa
            - system
          dataScope:
            type: array
            maxItems: 100
            items:
              type: string
              maxLength: 256
          deploymentMode:
            type: string
            enum:
            - saas
            - local
            - private
          environment:
            type: string
            enum:
            - dev
            - test
            - prod
          organizationId:
            type: string
            maxLength: 128
          permissionScope:
            type: array
            maxItems: 200
            items:
              type: string
              maxLength: 256
          sessionId:
            type: string
            minLength: 1
            maxLength: 128
          tenantId:
            type: string
            minLength: 1
            maxLength: 128
          userId:
            type: string
            minLength: 1
            maxLength: 128
      user:
        name: IamUserResponse
        type: object
        additionalProperties: false
        required:
        - id
        - username
        - displayName
        - email
        - avatar
        - phone
        - language
        - isVerified
        - status
        - registeredAt
        - lastLogin
        - lastLoginIp
        - passwordLastChanged
        - twoFactorEnabled
        - thirdPartyBound
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          username:
            type: string
            minLength: 1
            maxLength: 128
          displayName:
            type: string
            minLength: 1
            maxLength: 128
          email:
            type: string
            maxLength: 256
          avatar:
            $ref: '#/components/schemas/MediaResource'
          phone:
            type: string
            description: Safe display phone value, empty when unavailable.
          language:
            type: string
            maxLength: 32
          isVerified:
            type: boolean
          status:
            type: string
            maxLength: 32
          registeredAt:
            type: string
            format: date-time
          lastLogin:
            type: string
            maxLength: 64
          lastLoginIp:
            type: string
            description: Masked client IP address from the latest login event.
          passwordLastChanged:
            type: string
            maxLength: 64
          twoFactorEnabled:
            type: boolean
          thirdPartyBound:
            type: string
            description: Safe OAuth provider binding summary without provider subject IDs or tokens.
