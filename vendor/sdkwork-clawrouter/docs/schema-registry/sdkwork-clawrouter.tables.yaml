  integration_provider_type:
    canonical_name: IntegrationProviderType
    zh_name: 接入供应商类型
    description: Stable integration provider business type. A provider can be the
      original model vendor direct API, a cloud platform, another relay or aggregator,
      a self-hosted gateway, a local runtime, or a custom integration.
    db_type: enum_int32
    api_serialization: stable_string_code
    persistence:
      table: ai_provider
      code_column: integration_type
      display_column: display_name
      store_as: stable_int_code
      never_store_as: enum_ordinal
    type_bindings:
      java: com.sdkwork.claw.router.domain.enums.IntegrationProviderType
      rust: sdkwork_claw_router::domain::IntegrationProviderType
      typescript: IntegrationProviderType
      openapi: IntegrationProviderType
    unknown_policy: preserve_raw_code_and_map_to_unknown
    builtin_values:
    - code: unknown
      int_code: 0
      label: Unknown integration provider type
    - code: model_vendor_direct
      int_code: 1
      label: Model vendor direct API
    - code: cloud_platform
      int_code: 2
      label: Cloud platform provider
    - code: relay_aggregator
      int_code: 3
      label: Relay or aggregator provider
    - code: self_hosted_gateway
      int_code: 4
      label: Self-hosted gateway
    - code: local_runtime
      int_code: 5
      label: Local runtime
    - code: custom
      int_code: 6
      label: Custom integration
  price_side:
    canonical_name: PriceSide
    zh_name: 价格侧
    description: Price source side for a model or billing meter, such as official
      reference, upstream cost, customer charge, or internal transfer price.
    db_type: enum_int32
    api_serialization: stable_string_code
    builtin_values:
