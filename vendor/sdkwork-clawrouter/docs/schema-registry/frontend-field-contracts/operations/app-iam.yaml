fragment: operations/app-iam
frontend_operations:
- route: /console/api-keys
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-api-keys/src/apiKeyService.ts
  operation: fetchKeys
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/iam/api_keys
  sdk_domain: iam
  read_sources:
  - iam_gateway_api_key
  - ai_channel_group
  - ai_channel_group_metric_snapshot
  - iam_gateway_access_policy
  - ai_quota_policy
  - ai_model_pricing
  - ai_pricing_plan
  query_parameters: []
  response_schema:
    name: AppApiKeyListResponse
    required:
    - items
    - groups
    properties:
      items:
        type: array
        items:
          name: AppApiKeyItem
          type: object
          additionalProperties: false
          required: &id002
          - id
          - name
          - maskedKey
          - channelGroup
          - quota
          - usedQuota
          - modalities
          - ipLimit
          - created
          - expires
          - status
          - defaultForRuntime
          properties: &id003
            id:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 128
            maskedKey:
              type: string
              minLength: 1
              maxLength: 256
            copyableKey:
              type: string
              minLength: 1
              maxLength: 256
              description: Full plaintext API key returned only by authenticated owner management responses; public catalog responses omit this field.
            channelGroup:
              type: string
              minLength: 1
              maxLength: 128
            channelGroupName:
              type: string
              minLength: 1
              maxLength: 128
              description: Display name snapshot for the bound channel group so the list view does not need to preload selectable groups.
            rate:
              type: string
              nullable: true
              maxLength: 64
            quota:
              type: string
              minLength: 1
              maxLength: 64
            usedQuota:
              type: string
              minLength: 1
              maxLength: 64
            modalities:
              type: array
              items:
                type: string
                enum:
                - text
                - image
                - video
                - audio
                - music
            ipLimit:
              type: string
              maxLength: 1024
            created:
              type: string
              maxLength: 64
            expires:
              type: string
              maxLength: 64
            status:
              type: string
              enum:
              - enabled
              - disabled
            defaultForRuntime:
              type: boolean
              description: Whether this key is the current console default for backend runtime API key selection.
          description: API key metadata with masked key material and authenticated owner copyable key material.
      groups:
        type: array
        items: &id001
          name: AppChannelGroup
          type: object
          additionalProperties: false
          required:
          - id
          - code
          - name
          - rate
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            code:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 128
            rate:
              type: string
              nullable: true
              maxLength: 64
- route: /console/api-keys
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-api-keys/src/apiKeyService.ts
  operation: createKey
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/iam/api_keys
  sdk_domain: iam
  idempotency_required: true
  read_sources:
  - ai_channel_group
  write_tables:
  - ai_channel_group
  - iam_gateway_api_key
  - iam_gateway_access_policy
  - ai_quota_policy
  - ops_audit_log
  request_schema:
    name: CreateApiKeyRequest
    required:
    - name
    - channelGroup
    properties:
      name:
        type: string
        maxLength: 128
        description: API key display name.
      channelGroup:
        type: string
        maxLength: 64
        description: API key channel group code.
      quota:
        type: string
        format: decimal
        description: Optional quota limit as a canonical decimal string.
      isUnlimitedQuota:
        type: boolean
        description: Whether the quota is unlimited.
      modalities:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
          - text
          - image
          - video
          - audio
          - music
      ipLimit:
        type: string
        maxLength: 1024
        description: Comma-separated IP or CIDR allowlist, or unrestricted.
      expires:
        type: string
        maxLength: 32
        description: Expiration timestamp in YYYY-MM-DDTHH:mm format, or never.
      defaultForRuntime:
        type: boolean
        description: Create this key as the default backend runtime API key.
  response_schema:
    name: CreateApiKeyResponse
    required:
    - item
    - rawKey
    properties:
      item:
        name: AppApiKeyItem
        type: object
        additionalProperties: false
        required: *id002
        properties: *id003
        description: Created API key metadata. Authenticated owner management responses include copyableKey matching rawKey.
      rawKey:
        type: string
        minLength: 1
        description: Full raw API key secret returned by create responses. Authenticated owner management list and update responses also expose this value as item.copyableKey for console copy actions.
- route: /console/api-keys
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-api-keys/src/apiKeyService.ts
  operation: updateKey
  operation_id: apiKeys.update
  kind: update
  api_surface: app
  api_method: PATCH
  api_path: /app/v3/api/iam/api_keys/{apiKeyId}
  sdk_domain: iam
  read_sources:
  - iam_gateway_api_key
  - ai_channel_group
  - iam_gateway_access_policy
  - ai_quota_policy
  write_tables:
  - iam_gateway_api_key
  - iam_gateway_access_policy
  - ai_quota_policy
  - ops_audit_log
  request_schema:
    name: UpdateApiKeyRequest
    type: object
    additionalProperties: false
    required: []
    properties:
      name:
        type: string
        maxLength: 128
        description: API key display name.
      channelGroup:
        type: string
        maxLength: 64
        description: API key channel group code to bind to this key.
      quota:
        type: string
        format: decimal
        description: Optional quota limit as a canonical decimal string.
      isUnlimitedQuota:
        type: boolean
        description: Whether the quota is unlimited.
      modalities:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
          - text
          - image
          - video
          - audio
          - music
      ipLimit:
        type: string
        maxLength: 1024
        description: Comma-separated IP or CIDR allowlist, or unrestricted.
      expires:
        type: string
        maxLength: 32
        description: Expiration timestamp in YYYY-MM-DDTHH:mm format, or never.
      defaultForRuntime:
        type: boolean
        description: Marks this API key as the default backend runtime API key for Playground and app runtime calls.
  response_schema:
    name: UpdateApiKeyResponse
    required:
    - item
    properties:
      item:
        name: AppApiKeyItem
        type: object
        additionalProperties: false
        required: *id002
        properties: *id003
        description: Updated API key metadata. Authenticated owner management responses include copyableKey for console copy actions.
