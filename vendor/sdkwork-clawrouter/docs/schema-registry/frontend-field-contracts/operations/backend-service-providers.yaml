            minLength: 1
            maxLength: 128
          pricePlanId:
            type: string
            minLength: 1
            maxLength: 128
          catalogKey:
            type: string
            nullable: true
            maxLength: 256
          model:
            type: string
            nullable: true
            maxLength: 128
          billingMeterCode:
            type: string
            minLength: 1
            maxLength: 64
          tokenKind:
            type: string
            nullable: true
            maxLength: 64
          unitPrice:
            type: string
            minLength: 1
            maxLength: 64
          unitSize:
            type: string
            minLength: 1
            maxLength: 64
          minimumCharge:
            type: string
            minLength: 1
            maxLength: 64
          currency:
            type: string
            nullable: true
