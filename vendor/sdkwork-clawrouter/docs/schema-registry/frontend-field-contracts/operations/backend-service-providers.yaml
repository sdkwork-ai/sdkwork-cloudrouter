- route: /admin/service-providers/downstreams
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-service-provider/src/serviceProviderService.ts
  operation: backendServiceProviderDownstreamCreate
  operation_id: downstreams.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/service_providers/downstreams
  idempotency_required: true
  sdk_domain: integration
  summary: Service Provider Downstream Create
  description: Creates a downstream service-provider subject under a visible seller provider, materializes the hierarchy edge and closure path, and opens the downstream default pricing plan.
  read_sources:
  - integration_service_provider
  - integration_service_provider_closure
  write_tables:
  - integration_service_provider
  - integration_service_provider_edge
  - integration_service_provider_closure
  - integration_service_provider_price_plan
  - ops_audit_log
  request_schema:
    name: ServiceProviderDownstreamCreateRequest
    type: object
    additionalProperties: false
    required:
    - sellerProviderId
    - providerNo
    - displayName
    properties:
      sellerProviderId:
        type: string
        minLength: 1
        maxLength: 128
      providerNo:
        type: string
        minLength: 1
        maxLength: 64
      displayName:
        type: string
        minLength: 1
        maxLength: 128
      providerType:
        type: string
        maxLength: 64
      defaultCurrency:
        type: string
        maxLength: 10
      settlementMode:
        type: string
        maxLength: 32
      pricePlanCode:
        type: string
        maxLength: 64
      defaultMultiplier:
        type: string
        maxLength: 64
  response_schema: &serviceProviderDownstreamMutationResponse
    name: ServiceProviderDownstreamMutationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        type: object
        additionalProperties: false
        required:
        - id
        - providerNo
        - displayName
        - status
        - sellerProviderId
        - edgeId
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          providerNo:
            type: string
            minLength: 1
            maxLength: 64
          displayName:
            type: string
            minLength: 1
            maxLength: 128
          providerType:
            type: string
            nullable: true
            maxLength: 64
          status:
            type: string
            minLength: 1
            maxLength: 64
          sellerProviderId:
            type: string
            minLength: 1
            maxLength: 128
          edgeId:
            type: string
            minLength: 1
            maxLength: 128
          pricePlanId:
            type: string
            nullable: true
            maxLength: 128
          defaultCurrency:
            type: string
            nullable: true
            maxLength: 10
          settlementMode:
            type: string
            nullable: true
            maxLength: 32
