  request_schema: &serviceProviderPricingRuleCreateRequest
    name: ServiceProviderPricingRuleCreateRequest
    type: object
    additionalProperties: false
    required:
    - sellerProviderId
    - buyerProviderId
    - billingMeterCode
    - unitPrice
    - unitSize
    - minimumCharge
    properties:
      sellerProviderId:
        type: string
        minLength: 1
        maxLength: 128
      buyerProviderId:
        type: string
        minLength: 1
        maxLength: 128
      edgeId:
        type: string
        maxLength: 128
      pricePlanId:
        type: string
        maxLength: 128
      catalogKey:
        type: string
        maxLength: 256
      model:
        type: string
        maxLength: 128
      billingMeterCode:
        type: string
        minLength: 1
        maxLength: 64
      tokenKind:
        type: string
        maxLength: 64
      unitPrice:
        type: string
        minLength: 1
        maxLength: 64
      unitSize:
        type: string
        minLength: 1
        maxLength: 64
      minimumCharge:
        type: string
        minLength: 1
        maxLength: 64
      currency:
        type: string
        maxLength: 10
      priority:
        type: integer
        format: int32
