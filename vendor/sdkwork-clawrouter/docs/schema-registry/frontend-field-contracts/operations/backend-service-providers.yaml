fragment: operations/backend-service-providers
frontend_operations:
- route: /admin/service-providers/dashboard
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-service-provider/src/serviceProviderService.ts
  operation: backendServiceProviderDashboardRetrieve
  operation_id: dashboard.retrieve
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/service_providers/dashboard
  sdk_domain: integration
  summary: Service Provider Dashboard Retrieve
  description: Commercial service-provider operating dashboard. Reads provider hierarchy, usage economics, exposure, statements, and reconciliation projections.
  read_sources:
  - integration_service_provider
  - integration_service_provider_edge
  - integration_service_provider_closure
  - ai_usage_service_provider_edge
  - commerce_service_provider_exposure_snapshot
  - analytics_service_provider_daily
  query_parameters: &serviceProviderPageQuery
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  - name: provider_id
    schema:
      type: string
      maxLength: 128
    description: Service-provider id filter. On edge-scoped resources this matches either seller or buyer provider.
  - name: seller_provider_id
    schema:
      type: string
      maxLength: 128
    description: Upstream seller service-provider id for provider-edge scoped retrieval.
  - name: buyer_provider_id
    schema:
      type: string
      maxLength: 128
    description: Downstream buyer service-provider id for provider-edge scoped retrieval.
  - name: edge_id
    schema:
      type: string
      maxLength: 128
    description: Direct service-provider edge id for provider-edge scoped retrieval.
  response_schema:
    name: ServiceProviderDashboardResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          status:
            type: string
            nullable: true
            maxLength: 64
          incomeAmount:
            type: string
            nullable: true
            maxLength: 64
          expenseAmount:
            type: string
            nullable: true
            maxLength: 64
          marginAmount:
            type: string
            nullable: true
            maxLength: 64
          requestCount:
            type: integer
            format: int64
            nullable: true
            minimum: 0
          activeDownstreamCount:
            type: integer
            format: int64
            nullable: true
            minimum: 0
          riskProviderCount:
            type: integer
            format: int64
            nullable: true
            minimum: 0
