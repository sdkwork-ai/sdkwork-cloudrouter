fragment: operations/backend-mcp
frontend_operations:
- route: /admin/mcp
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-mcp/src/mcpService.ts
  operation: listMcpServers
  operation_id: servers.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/mcp/servers
  sdk_domain: mcp
  summary: List MCP servers
  description: Lists vertical MCP server definitions with unified category references and operational health.
  read_sources:
  - ai_mcp_server
  - c_category
  query_parameters:
  - name: page
    schema: { type: integer, format: int64, minimum: 1 }
  - name: page_size
    schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
  - name: q
    schema: { type: string, maxLength: 128 }
  - name: transport
    schema: { type: string, maxLength: 64 }
  - name: visibility
    schema: { type: string, maxLength: 64 }
  - name: status
    schema: { type: string, maxLength: 64 }
  - name: category_id
    schema: { type: string, maxLength: 128 }
  response_schema:
    name: AdminMcpServerListResponse
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        maxItems: 200
        items: &adminMcpServerItem
          name: AdminMcpServerItem
          type: object
          additionalProperties: false
          required: [id, uuid, tenantId, organizationId, serverKey, name, transport, visibility, healthStatus, status, tags, createdAt, updatedAt]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            uuid: { type: string, minLength: 1, maxLength: 128 }
            tenantId: { type: integer, format: int64, minimum: 1 }
            organizationId: { type: integer, format: int64, minimum: 1 }
            serverKey: { type: string, minLength: 1, maxLength: 128 }
            name: { type: string, minLength: 1, maxLength: 255 }
            description: { type: string, nullable: true, maxLength: 4000 }
            categoryId: { type: string, nullable: true, maxLength: 128 }
            categoryCode: { type: string, nullable: true, maxLength: 128 }
            transport: { type: string, maxLength: 64 }
            visibility: { type: string, maxLength: 64 }
            ownerUserId: { type: integer, nullable: true, format: int64 }
            latestRevisionId: { type: integer, nullable: true, format: int64 }
            publishedRevisionId: { type: integer, nullable: true, format: int64 }
            healthStatus: { type: string, maxLength: 64 }
            lastCheckedAt: { type: string, nullable: true, maxLength: 64 }
            lastErrorMasked: { type: string, nullable: true, maxLength: 1024 }
            status: { type: string, maxLength: 64 }
            tags:
              type: array
              maxItems: 32
              items: { type: string, maxLength: 64 }
            publishedAt: { type: string, nullable: true, maxLength: 64 }
            deprecatedAt: { type: string, nullable: true, maxLength: 64 }
            createdAt: { type: string, minLength: 1, maxLength: 64 }
            updatedAt: { type: string, minLength: 1, maxLength: 64 }
