  operation: createMcpServer
  operation_id: servers.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/mcp/servers
  sdk_domain: mcp
  idempotency_required: true
  summary: Create MCP server
  description: Creates an MCP server definition; classification is only by unified category references.
  read_sources:
  - ai_mcp_server
  - c_category
  write_tables:
  - ai_mcp_server
  - ops_audit_log
  request_schema:
    name: AdminMcpServerCreateRequest
    type: object
    additionalProperties: false
    required: [serverKey, name]
    properties:
      serverKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
      name: { type: string, minLength: 1, maxLength: 255 }
      description: { type: string, maxLength: 4000 }
      categoryId: { type: string, maxLength: 128 }
      transport: { type: string, maxLength: 64 }
      visibility: { type: string, maxLength: 64 }
      tags:
        type: array
        maxItems: 32
        items: { type: string, maxLength: 64 }
  response_schema:
    name: AdminMcpServerMutationResponse
    schema:
      $ref: "#/components/schemas/AdminMcpServerMutationResponse"
