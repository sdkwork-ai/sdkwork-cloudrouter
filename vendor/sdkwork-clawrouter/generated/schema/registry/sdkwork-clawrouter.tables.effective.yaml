schema_registry:
  name: sdkwork-clawrouter
  version: 0.1.0
  date: 2026-04-28
  standard: ../../../specs/DATABASE_SPEC.md
  api_standard: ../../../specs/API_SPEC.md
  source_docs:
  - ../18-SkillsHub-AgentSkills-PlusCategory-compatible-design.md
  - ../19-Finance-Trade-Java-compatible-design.md
  - ../05-数据库设计.md
  - ../11-数据契约与核心表设计.md
  - ../12-前端功能模块与数据库表结构映射.md
  - ../13-页面级数据结构覆盖与SchemaRegistry落地设计.md
  - ../14-数据结构细节复核与补强记录.md
  - ../15-new-api-sub2api价格体系对比与ClawRouter定价设计.md
  api_prefixes:
    app: /app/v3/api
    backend: /backend/v3/api
    openai_compatible: /v1
  serialization:
    int64: string
    decimal: string
    instant: iso8601_utc
    enum: forward_compatible
  naming_guardrails:
    allowed_new_prefixes:
    - system
    - iam
    - integration
    - ai
    - commerce
    - platform
    - c
    - ops
    legacy_prefixes: []
    forbidden_new_prefixes:
    - claw
    - router
    - sdkwork
    - console
    - admin
    - portal
  legacy_compatibility_guardrails:
    java_entity_first_required: false
    rule: Greenfield composition model uses ai_* runtime, ops_*, integration_*, and
      c_* tables as claw-router generated ownership. Drive-owned storage, upload,
      object, and MediaResource lifecycle are owned by sdkwork-drive and must not
      be generated in claw-router schema.sql. Model catalog dictionary tables are
      owned by sdkwork-models and consumed via sdkwork-models SDK or bundled catalog
      at runtime. Retired forum/content-feed tables are not owned by claw-router.
      IAM base, verification, commerce, promotion, and messaging tables are owned
      by sibling products and must not be generated or composed in claw-router schema.sql.
      appstore_* and dr_drive_* tables are owned by sdkwork-appstore and sdkwork-drive
      and must not be composed into claw-router database lifecycle.
    protected_domains:
    - platform
    - classification
    - skill
    forbidden_synonym_tables:
    - router_order
    - router_payment
    - router_account
    - router_refund
    - router_invoice
    - sdkwork_order
    - sdkwork_payment
    - sdkwork_account
    - sdkwork_refund
    - sdkwork_invoice
    allowed_projection_exception: Router-owned commerce_* tables may only add usage
      settlement, statement, export, and analytics projections in generated schema.sql.
      Base commerce_*, promotion_*, messaging_*, and iam_* capability tables are external
      and must not be registered in claw-router schema registry or database.manifest
      modules. Retired forum/content-feed tables are not registered in claw-router
      schema registry. platform_* and appstore_* DDL are owned by sdkwork-appstore
      and must not be generated or composed in claw-router schema.sql.
  common_column_groups:
    tenant_entity:
    - id
    - uuid
    - tenant_id
    - organization_id
    - data_scope
    - status
    - created_at
    - updated_at
    - version
    - deleted_at
    - deleted_by
    - metadata
    user_entity:
    - id
    - uuid
    - tenant_id
    - organization_id
    - user_id
    - owner_type
    - owner_id
    - data_scope
    - status
    - created_at
    - updated_at
    - version
    - deleted_at
    - deleted_by
    - metadata
    event_log:
    - id
    - uuid
    - tenant_id
    - organization_id
    - user_id
    - request_id
    - trace_id
    - payload_hash
    - status
    - created_at
    - retention_until
    - legal_hold
    - metadata
    audit_log:
    - id
    - uuid
    - tenant_id
    - organization_id
    - request_id
    - trace_id
    - operator_id
    - action
    - target_type
    - target_id
    - created_at
    - retention_until
    - legal_hold
    - metadata
    projection:
    - id
    - uuid
    - tenant_id
    - organization_id
    - source_type
    - source_id
    - source_version
    - status
    - created_at
    - updated_at
    - rebuild_version
    - metadata
domains:
  iam:
    owner: identity-access
    bounded_context: identity-access
  integration:
    owner: provider-integration
    bounded_context: provider-integration
  ai:
    owner: ai-gateway
    bounded_context: ai-routing-metering
  commerce:
    owner: commerce-projection
    bounded_context: router-commerce-projection
  platform:
    owner: sdkwork-appstore
    bounded_context: external-appstore-platform
  classification:
    owner: catalog-service
    bounded_context: cross-cutting-taxonomy
  ops:
    owner: platform-ops
    bounded_context: operations-observability
domain_names:
  model_vendor:
    canonical_name: ModelVendor
    zh_name: 模型厂商
    description: Stable model vendor identity. It represents the original model producer
      or capability owner, not an access channel, cloud platform, relay, or account.
    persistence:
      table: ai_model_vendor
      code_column: vendor_code
      display_column: display_name
      db_type: string(64)
      store_as: stable_string_code
      never_store_as: enum_ordinal
    type_bindings:
      java: com.sdkwork.claw.router.domain.enums.ModelVendor
      rust: sdkwork_claw_router::domain::ModelVendor
      typescript: ModelVendor
      openapi: ModelVendor
    unknown_policy: preserve_raw_code_and_map_to_unknown
    builtin_values:
    - code: openai
      java: OPENAI
      rust: OpenAi
      label: OpenAI
    - code: anthropic
      java: ANTHROPIC
      rust: Anthropic
      label: Anthropic
    - code: google
      java: GOOGLE
      rust: Google
      label: Google DeepMind / Gemini
    - code: alibaba
      java: ALIBABA
      rust: Alibaba
      label: Alibaba
    - code: baidu
      java: BAIDU
      rust: Baidu
      label: Baidu
    - code: black_forest_labs
      java: BLACK_FOREST_LABS
      rust: BlackForestLabs
      label: Black Forest Labs
    - code: bytedance
      java: BYTEDANCE
      rust: ByteDance
      label: ByteDance
    - code: deepseek
      java: DEEPSEEK
      rust: DeepSeek
      label: DeepSeek
    - code: elevenlabs
      java: ELEVENLABS
      rust: ElevenLabs
      label: ElevenLabs
    - code: kuaishou
      java: KUAISHOU
      rust: Kuaishou
      label: Kuaishou
    - code: minimax
      java: MINIMAX
      rust: MiniMax
      label: MiniMax
    - code: moonshot
      java: MOONSHOT
      rust: Moonshot
      label: Moonshot AI
    - code: xai
      java: XAI
      rust: Xai
      label: xAI
    - code: stability_ai
      java: STABILITY_AI
      rust: StabilityAi
      label: Stability AI
    - code: suno
      java: SUNO
      rust: Suno
      label: Suno
    - code: tencent
      java: TENCENT
      rust: Tencent
      label: Tencent
    - code: zhipu
      java: ZHIPU
      rust: Zhipu
      label: Zhipu AI
    - code: custom
      java: CUSTOM
      rust: Custom
      label: Custom Vendor
    - code: unknown
      java: UNKNOWN
      rust: Unknown
      label: Unknown Vendor
  integration_provider_type:
    canonical_name: IntegrationProviderType
    zh_name: 接入供应商类型
    description: Stable integration provider business type. A provider can be the
      original model vendor direct API, a cloud platform, another relay or aggregator,
      a self-hosted gateway, a local runtime, or a custom integration.
    db_type: enum_int32
    api_serialization: stable_string_code
    persistence:
      table: ai_provider
      code_column: integration_type
      display_column: display_name
      store_as: stable_int_code
      never_store_as: enum_ordinal
    type_bindings:
      java: com.sdkwork.claw.router.domain.enums.IntegrationProviderType
      rust: sdkwork_claw_router::domain::IntegrationProviderType
      typescript: IntegrationProviderType
      openapi: IntegrationProviderType
    unknown_policy: preserve_raw_code_and_map_to_unknown
    builtin_values:
    - code: unknown
      int_code: 0
      label: Unknown integration provider type
    - code: model_vendor_direct
      int_code: 1
      label: Model vendor direct API
    - code: cloud_platform
      int_code: 2
      label: Cloud platform provider
    - code: relay_aggregator
      int_code: 3
      label: Relay or aggregator provider
    - code: self_hosted_gateway
      int_code: 4
      label: Self-hosted gateway
    - code: local_runtime
      int_code: 5
      label: Local runtime
    - code: custom
      int_code: 6
      label: Custom integration
  price_side:
    canonical_name: PriceSide
    zh_name: 价格侧
    description: Price source side for a model or billing meter, such as official
      reference, upstream cost, customer charge, or internal transfer price.
    db_type: enum_int32
    api_serialization: stable_string_code
    builtin_values:
