    user_entity:
      tenant_scope: tenant_required
  legacy_compatibility_guardrails:
    rule: Cloud-router generated ownership is limited to gateway routing, metering,
      pricing, upstream suppliers, accounts, account groups, commerce usage projections,
      gateway IAM extensions, ops telemetry, and system installation metadata. Agent/chat/MCP/runtime/prompt
      tables are owned by sdkwork-kernel. Model catalog dictionary tables are owned
      by sdkwork-models and composed at install time. Notification tables are owned
      by sdkwork-appbase-messaging. IAM base, verification, commerce, promotion, messaging,
      appstore, and drive tables are external sibling modules and must not be generated
      in cloud-router schema.sql.
    allowed_projection_exception: Router-owned commerce_usage_* tables may only add
      usage settlement, statement, export, and analytics projections. c_category remains
      a transitional appstore-aligned classification projection until sdkwork-appstore
      publishes canonical DDL.
    forbidden_synonym_tables:
    - ai_pricing_group
    - ai_pricing_import_snapshot
    - ai_pricing_plan
    - ai_pricing_plan_binding
    - ai_pricing_rule
    - ai_pricing_tier
    - cloudrouter_pricing_adjustment
description: Cloud Router Schema Registry. Machine-readable source of truth for Cloud
  Router-owned runtime tables; generated SQL, manifests, OpenAPI snapshots, SDKs,
  services, and frontends must align to this contract.
table_fragments:
- tables/pricing-core.yaml
- tables/cloudrouter-billing.yaml
- tables/ai-routing.yaml
- tables/ai-metering.yaml
- tables/iam-gateway.yaml
- tables/ops-runtime.yaml
- tables/ai-chat-runtime.yaml
- tables/user-settings.yaml
modules:
  user-settings:
    owner: cloud-router-platform
    description: Console user settings preferences and console webhook endpoints (iam_user_preference,
      integration_webhook_endpoint).
    compliance_level: L2
    tables_count: 2
    tables:
    - iam_user_preference
    - integration_webhook_endpoint
    ddl_location: database/ddl/baseline/{engine}/0001_cloudrouter_baseline.sql
  ai-routing:
    owner: cloud-router-platform
    description: AI routing, upstream supplier, upstream account, account-group, policy,
      quota, and runtime coordination tables.
    compliance_level: L2
    tables_count: 24
    tables:
    - ai_upstream_account
    - ai_upstream_account_health_state
    - ai_upstream_account_credential
    - ai_upstream_account_group
    - ai_upstream_account_group_member
    - ai_upstream_account_group_metric_snapshot
    - ai_config_version
    - ai_config_change_event
    - ai_model_mapping_rule
    - ai_model_mapping_rule_binding
    - ai_model_mapping_rule_item
    - ai_upstream_supplier
    - ai_upstream_object_route
    - ai_quota_policy
    - ai_routing_decision_log
    - ai_routing_policy
    - ai_routing_profile
    - ai_routing_rule
    - ai_upstream_supplier_endpoint
    - ai_upstream_supplier_endpoint_health_state
    - ai_upstream_supplier_auth_method
    - ai_routing_strategy
    - ai_model_access_policy
    - ai_resource_binding
    ddl_location: database/ddl/baseline/{engine}/0001_cloudrouter_baseline.sql
  ai-metering:
    owner: cloud-router-platform
    description: AI usage facts and request traces.
    compliance_level: L3
    tables_count: 2
    tables:
    - ai_metering_usage
    - ai_metering_request_trace
    ddl_location: database/ddl/baseline/{engine}/0001_cloudrouter_baseline.sql
  iam-gateway:
    owner: cloud-router-platform
    description: Gateway-owned IAM API key, access policy, account-group binding,
      and risk rule tables used by Cloud Router runtime.
    compliance_level: L2
    tables_count: 5
    tables:
    - iam_gateway_access_policy
    - iam_gateway_api_key
    - iam_gateway_api_key_account_group
    - iam_gateway_chain_policy
    - iam_gateway_risk_rule
    ddl_location: database/ddl/baseline/{engine}/0001_cloudrouter_baseline.sql
  ops-runtime:
    owner: cloud-router-platform
    description: Cloud Router-owned operational runtime tables for audit logs, job
      execution history, gateway health, monitoring snapshots, alerts, and notification
      projections.
    compliance_level: L2
    tables_count: 10
    tables:
    - ops_alert_event
    - ops_audit_log
    - ops_config_snapshot
    - ops_gateway_heartbeat
    - ops_gateway_instance
    - ops_job_execution
    - ops_metric_snapshot
    - ops_notification_message
    - ops_notification_recipient
    - ops_notification_delivery
    ddl_location: database/ddl/baseline/{engine}/0001_cloudrouter_baseline.sql
  ai-chat-runtime:
    owner: cloud-router-platform
    description: User-scoped chat transcript, context snapshot, runtime invocation,
      event, artifact, and usage-link persistence.
    compliance_level: L2
    tables_count: 10
    tables:
    - ai_chat_conversation
    - ai_chat_turn
    - ai_chat_item
    - ai_chat_message
    - ai_chat_message_part
    - ai_chat_context_snapshot
    - ai_runtime_invocation
    - ai_runtime_invocation_event
    - ai_runtime_artifact
    - ai_runtime_usage_link
    ddl_location: database/ddl/baseline/{engine}/0001_cloudrouter_baseline.sql
registry_dependencies:
- module_id: appbase-iam
  locator: ../sdkwork-appbase
  registry_path: docs/schema-registry/appbase-iam.tables.yaml
  order: 10
  ownership: read_only
- module_id: appbase-messaging
  locator: ../sdkwork-appbase
  registry_path: docs/schema-registry/appbase-messaging.tables.yaml
  order: 12
  ownership: read_only
- module_id: appstore
  locator: ../sdkwork-appstore
  registry_path: docs/schema-registry/appstore.tables.yaml
  order: 30
  ownership: read_only
- module_id: sdkwork-models
  locator: ../sdkwork-models
  registry_path: docs/schema-registry/sdkwork-models.tables.yaml
  order: 35
  ownership: compose_at_install
data_flow:
  usage_to_account:
    description: 用量推送到账户模块
    steps:
    - ai_metering_usage写入（cloud-router本地）
    - 发布UsageRecorded事件
    - sdkwork-account订阅事件
    - commerce_account_ledger_entry写入（sdkwork-account本地）
  authentication:
    description: API Key验证
    steps:
    - Client请求携带api_key
    - router-service调用sdkwork-iam-sdk
    - iam-service验证iam_api_key（sdkwork-iam本地）
    - 返回验证结果
  monitoring:
    description: 监控数据推送
    steps:
    - router-service记录运行监控和作业审计
    - ops-runtime本地表提供可分页的监控、通知和审计读模型
    - ops_metric_snapshot、ops_job_execution、ops_audit_log写入（cloud-router本地）
statistics:
  cloud_router_local_tables: 48
  composed_dependency_tables: 19
  total_tables: 67
  table_prefix_distribution:
    ai_: 53
    iam_: 4
    ops_: 10
  module_distribution:
    cloud-router: 48
    sdkwork-models: 19
    ai-routing: 24
    ai-metering: 2
    iam-gateway: 5
    ops-runtime: 10
    ai-chat-runtime: 10
compliance:
  financial_tables:
  - ai_metering_usage
  security_tables:
  - iam_gateway_access_policy
  - iam_gateway_api_key
  - iam_gateway_api_key_account_group
  - iam_gateway_risk_rule
  audit_tables:
  - ai_metering_request_trace
  - ai_routing_decision_log
  - ops_audit_log
  - ops_job_execution
  retention_policy:
    financial_data:
      online_retention: 12mo
      archive_retention: 5y
    audit_data:
      online_retention: 12mo
      archive_retention: 5y
    usage_data:
      online_retention: 12mo
      archive_retention: 5y
