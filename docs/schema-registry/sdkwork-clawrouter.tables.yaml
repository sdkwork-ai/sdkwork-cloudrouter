description: Claw Router Schema Registry. Machine-readable source of truth for Claw Router-owned runtime tables; generated
  SQL, manifests, OpenAPI snapshots, SDKs, services, and frontends must align to this contract.
table_fragments:
- tables/ai-routing.yaml
- tables/ai-metering.yaml
- tables/ai-pricing.yaml
- tables/iam-gateway.yaml
- tables/ops-runtime.yaml
modules:
  ai-routing:
    owner: claw-router-platform
    description: AI routing, upstream supplier, upstream account, account-group, policy, quota, and runtime coordination tables.
    compliance_level: L2
    tables_count: 21
    tables:
    - ai_upstream_account
    - ai_upstream_account_credential
    - ai_upstream_account_group
    - ai_upstream_account_group_member
    - ai_upstream_account_group_metric_snapshot
    - ai_upstream_account_group_resource
    - ai_upstream_supplier_resource
    - ai_config_version
    - ai_config_change_event
    - ai_model_mapping_rule
    - ai_model_mapping_rule_binding
    - ai_model_mapping_rule_item
    - ai_upstream_supplier
    - ai_provider_object_route
    - ai_quota_policy
    - ai_routing_decision_log
    - ai_routing_policy
    - ai_routing_profile
    - ai_routing_rule
    - ai_upstream_supplier_endpoint
    - ai_upstream_supplier_auth_method
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  ai-metering:
    owner: claw-router-platform
    description: AI usage facts and request traces.
    compliance_level: L3
    tables_count: 2
    tables:
    - ai_usage
    - ai_request_trace
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  ai-pricing:
    owner: claw-router-platform
    description: AI pricing plans, bindings, rules, tiers, and import snapshots.
    compliance_level: L2
    tables_count: 5
    tables:
    - ai_pricing_import_snapshot
    - ai_pricing_plan
    - ai_pricing_plan_binding
    - ai_pricing_rule
    - ai_pricing_tier
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  iam-gateway:
    owner: claw-router-platform
    description: Gateway-owned IAM API key, access policy, account-group binding, and risk rule tables used by Claw Router
      runtime.
    compliance_level: L2
    tables_count: 4
    tables:
    - iam_gateway_access_policy
    - iam_gateway_api_key
    - iam_gateway_api_key_account_group
    - iam_gateway_risk_rule
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
  ops-runtime:
    owner: claw-router-platform
    description: Claw Router-owned operational runtime tables for audit logs, job execution history, gateway health,
      monitoring snapshots, alerts, and notification projections.
    compliance_level: L2
    tables_count: 10
    tables:
    - ops_alert_event
    - ops_audit_log
    - ops_config_snapshot
    - ops_gateway_heartbeat
    - ops_gateway_instance
    - ops_job_execution
    - ops_metric_snapshot
    - ops_notification_message
    - ops_notification_recipient
    - ops_notification_delivery
    ddl_location: database/ddl/baseline/{engine}/0001_clawrouter_baseline.sql
registry_dependencies:
- module_id: sdkwork-iam
  locator: ../sdkwork-iam
  registry_path: docs/schema-registry/sdkwork-iam.tables.yaml
  description: "\u8EAB\u4EFD\u8BA4\u8BC1\u3001API\u5BC6\u94A5\u3001\u8BBF\u95EE\u63A7\u5236\u3001\u6743\u9650\u7BA1\u7406\n\
    \n\u884C\u4E1A\u5BF9\u6807: Stripe API Keys + AWS IAM Access Keys\n\n\u6A21\u5757\u804C\u8D23:\n- \u5B9A\u4E49iam_api_key\u7B49\
    5\u5F20\u8868\n- \u7BA1\u7406\u81EA\u5DF1\u7684DDL\u3001migrations\n- \u72EC\u7ACB\u90E8\u7F72\u3001\u72EC\u7ACB\u5347\
    \u7EA7\n\nClaw Router\u4EA4\u4E92\u65B9\u5F0F:\n- \u901A\u8FC7sdkwork-iam-sdk\u9A8C\u8BC1API Key\n- \u4E0D\u76F4\u63A5\
    \u8BBF\u95EEiam_api_key\u8868\n- \u4E0D\u91CD\u590D\u5B9A\u4E49iam_*\u8868\n"
  tables_count: 5
  tables:
  - iam_api_key
  - iam_api_key_binding
  - iam_api_key_policy
  - iam_access_policy
  - iam_risk_rule
  ownership: independent
  access: sdk
- module_id: sdkwork-account
  locator: ../sdkwork-account
  registry_path: docs/schema-registry/sdkwork-account.tables.yaml
  description: "\u8D26\u6237\u7BA1\u7406\u3001\u8D26\u6237\u6D41\u6C34\u3001\u4F59\u989D\u7BA1\u7406\n\n\u884C\u4E1A\u5BF9\
    \u6807: Stripe Customers + Stripe Balance Transactions\n\n\u5B9E\u9645\u9A8C\u8BC1: commerce_account\u8868\u5DF2\u5728\
    sdkwork-account\u4E2D\n\n\u6A21\u5757\u804C\u8D23:\n- \u5B9A\u4E49commerce_account\u7B493\u5F20\u8868\n- \u7BA1\u7406\u81EA\
    \u5DF1\u7684DDL\u3001migrations\n- \u72EC\u7ACB\u90E8\u7F72\u3001\u72EC\u7ACB\u5347\u7EA7\n\nClaw Router\u4EA4\u4E92\u65B9\
    \u5F0F:\n- \u901A\u8FC7\u4E8B\u4EF6\u63A8\u9001\u7528\u91CF\u5230commerce_account_ledger_entry\n- \u4E0D\u76F4\u63A5\u5199\
    \u5165commerce_account\u8868\n- \u4E0D\u91CD\u590D\u5B9A\u4E49commerce_*\u8868\n"
  tables_count: 3
  tables:
