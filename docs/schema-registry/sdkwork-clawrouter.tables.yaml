data_flow:
  usage_to_account:
    description: "\u7528\u91CF\u63A8\u9001\u5230\u8D26\u6237\u6A21\u5757"
    steps:
    - "ai_usage\u5199\u5165\uFF08claw-router\u672C\u5730\uFF09"
    - "\u53D1\u5E03UsageRecorded\u4E8B\u4EF6"
    - "sdkwork-account\u8BA2\u9605\u4E8B\u4EF6"
    - "commerce_account_ledger_entry\u5199\u5165\uFF08sdkwork-account\u672C\u5730\uFF09"
  authentication:
    description: "API Key\u9A8C\u8BC1"
    steps:
    - "Client\u8BF7\u6C42\u643A\u5E26api_key"
    - "router-service\u8C03\u7528sdkwork-iam-sdk"
    - "iam-service\u9A8C\u8BC1iam_api_key\uFF08sdkwork-iam\u672C\u5730\uFF09"
    - "\u8FD4\u56DE\u9A8C\u8BC1\u7ED3\u679C"
  monitoring:
    description: "\u76D1\u63A7\u6570\u636E\u63A8\u9001"
    steps:
    - "router-service\u63A8\u9001\u76D1\u63A7\u6307\u6807"
    - "sdkwork-ops-sdk\u8C03\u7528"
    - "ops_metric\u5199\u5165\uFF08sdkwork-ops\u672C\u5730\uFF09"
