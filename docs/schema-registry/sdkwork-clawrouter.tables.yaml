data_flow:
  usage_to_account:
    description: "\u7528\u91CF\u63A8\u9001\u5230\u8D26\u6237\u6A21\u5757"
    steps:
    - "ai_usage\u5199\u5165\uFF08claw-router\u672C\u5730\uFF09"
    - "\u53D1\u5E03UsageRecorded\u4E8B\u4EF6"
    - "sdkwork-account\u8BA2\u9605\u4E8B\u4EF6"
    - "commerce_account_ledger_entry\u5199\u5165\uFF08sdkwork-account\u672C\u5730\uFF09"
  authentication:
    description: "API Key\u9A8C\u8BC1"
    steps:
    - "Client\u8BF7\u6C42\u643A\u5E26api_key"
    - "router-service\u8C03\u7528sdkwork-iam-sdk"
    - "iam-service\u9A8C\u8BC1iam_api_key\uFF08sdkwork-iam\u672C\u5730\uFF09"
    - "\u8FD4\u56DE\u9A8C\u8BC1\u7ED3\u679C"
  monitoring:
    description: "\u76D1\u63A7\u6570\u636E\u63A8\u9001"
    steps:
    - "router-service\u8BB0\u5F55\u8FD0\u884C\u76D1\u63A7\u548C\u4F5C\u4E1A\u5BA1\u8BA1"
    - "ops-runtime\u672C\u5730\u8868\u63D0\u4F9B\u53EF\u5206\u9875\u7684\u76D1\u63A7\u3001\u901A\u77E5\u548C\u5BA1\u8BA1\u8BFB\u6A21\u578B"
    - "ops_metric_snapshot\u3001ops_job_execution\u3001ops_audit_log\u5199\u5165\uFF08claw-router\u672C\u5730\uFF09"
statistics:
  claw_router_local_tables: 43
  composed_dependency_tables: 19
  total_tables: 62
  table_prefix_distribution:
    ai_: 48
    iam_: 4
    ops_: 10
  module_distribution:
    claw-router: 43
    sdkwork-models: 19
    ai-routing: 21
    ai-metering: 3
    ai-pricing: 5
    iam-gateway: 4
    ops-runtime: 10
