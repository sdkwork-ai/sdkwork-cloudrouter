x-pricing-import-lifecycle: &pricing_import_lifecycle
  storage_strategy: indexed_append_only
  retention: { online_retention: 24mo, archive_retention: 7y, grace_period: 24h }
  cleanup:
    owner: pricing-service
    scope: platform_cross_tenant
    authorization: { mode: service_identity, service: pricing-service, audit_required: true }
    candidate_recheck:
      required: true
      operations: [archive, delete]
      key_columns: [tenant_id, organization_id, id]
    batch_size: 1000
    predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
    archive_before_delete: true
    retry:
      max_attempts: 5
      backoff: { strategy: exponential, initial: 1s, maximum: 5m }
    monitoring:
      metrics: [cleanup_candidates, cleanup_archived, cleanup_deleted, cleanup_failures]
      alerts: [retention_lag, retry_exhausted]
    dry_run: { supported: true, default: true }

tables:
- table: pricing_product
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    namespace_code: { type: string(64), constraints: NOT NULL }
    product_code: { type: string(160), constraints: NOT NULL }
    product_kind: { type: string(64), constraints: NOT NULL }
    owner_system: { type: string(64), constraints: NOT NULL }
    display_name: { type: string(256), constraints: NOT NULL }
    description: string(1024)
  unique_constraints:
  - { name: uk_pricing_product_uuid, columns: [uuid] }
  - { name: uk_pricing_product_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_product_code, columns: [tenant_id, organization_id, namespace_code, product_code] }
  indexes:
  - { name: uq_pricing_product_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_product_lookup, columns: [tenant_id, organization_id, owner_system, product_kind, status, id] }

- table: pricing_operation
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    namespace_code: { type: string(64), constraints: NOT NULL }
    operation_code: { type: string(160), constraints: NOT NULL }
    operation_kind: { type: string(64), constraints: NOT NULL }
    charge_timing_default: { type: string(32), constraints: NOT NULL }
    async_completion_policy: { type: string(32), constraints: NOT NULL }
    success_status_policy: { type: string(32), constraints: NOT NULL }
    display_name: { type: string(256), constraints: NOT NULL }
  unique_constraints:
  - { name: uk_pricing_operation_uuid, columns: [uuid] }
  - { name: uk_pricing_operation_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_operation_code, columns: [tenant_id, organization_id, namespace_code, operation_code] }
  check_constraints:
  - name: ck_pricing_operation_charge_timing
    expression: charge_timing_default IN ('request_accepted', 'successful_result', 'usage_reported', 'rate_defined')
  indexes:
  - { name: uq_pricing_operation_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_operation_lookup, columns: [tenant_id, organization_id, operation_kind, status, id] }

- table: pricing_meter
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    namespace_code: { type: string(64), constraints: NOT NULL }
    meter_code: { type: string(96), constraints: NOT NULL }
    quantity_kind: { type: string(64), constraints: NOT NULL }
    unit_code: { type: string(64), constraints: NOT NULL }
    aggregation_mode: { type: string(32), constraints: NOT NULL }
    default_unit_size: { type: decimal, constraints: NOT NULL }
    quantity_precision: { type: int32, constraints: NOT NULL }
    display_name: { type: string(256), constraints: NOT NULL }
  unique_constraints:
  - { name: uk_pricing_meter_uuid, columns: [uuid] }
  - { name: uk_pricing_meter_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_meter_code, columns: [tenant_id, organization_id, namespace_code, meter_code] }
  check_constraints:
  - { name: ck_pricing_meter_unit_size, expression: default_unit_size > 0 }
  - { name: ck_pricing_meter_precision, expression: quantity_precision BETWEEN 0 AND 12 }
  - name: ck_pricing_meter_aggregation
    expression: aggregation_mode IN ('sum', 'maximum', 'minimum', 'last', 'distinct_invocation')
  indexes:
  - { name: uq_pricing_meter_scope_reference, columns: [tenant_id, organization_id, id], unique: true }

- table: pricing_price_book
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    import_run_id: int64
    namespace_code: { type: string(64), constraints: NOT NULL }
    price_book_code: { type: string(160), constraints: NOT NULL }
    price_book_version: { type: string(128), constraints: NOT NULL }
    price_side: { type: string(32), constraints: NOT NULL }
    source_system: { type: string(64), constraints: NOT NULL }
    vendor_code: { type: string(64), constraints: NOT NULL }
    region_code: { type: string(64), constraints: NOT NULL }
    source_catalog_version: { type: string(128), constraints: NOT NULL }
    source_hash: { type: string(128), constraints: NOT NULL }
    lifecycle_state: { type: string(32), constraints: NOT NULL }
    currency_code: { type: string(10), constraints: NOT NULL }
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
    activated_at: instant
  unique_constraints:
  - { name: uk_pricing_price_book_uuid, columns: [uuid] }
  - { name: uk_pricing_price_book_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_price_book_version, columns: [tenant_id, organization_id, namespace_code, price_book_code, vendor_code, region_code, price_book_version] }
  - { name: uk_pricing_price_book_source, columns: [tenant_id, organization_id, source_system, vendor_code, region_code, source_catalog_version, price_book_code, source_hash] }
  - { name: uk_pricing_price_book_active, columns: [tenant_id, organization_id, namespace_code, price_book_code, vendor_code, region_code], where: lifecycle_state = 'active' AND deleted_at IS NULL }
  foreign_keys:
  - { name: fk_pricing_price_book_import, columns: [tenant_id, organization_id, import_run_id], references_table: pricing_import_run, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - name: ck_pricing_price_book_state
    expression: lifecycle_state IN ('draft', 'staged', 'active', 'retired', 'rejected')
  - name: ck_pricing_price_book_side
    expression: price_side IN ('official_reference', 'upstream_cost', 'customer_charge', 'internal_transfer')
  - { name: ck_pricing_price_book_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  - { name: ck_pricing_price_book_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  indexes:
  - { name: uq_pricing_price_book_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_price_book_active, columns: [tenant_id, organization_id, namespace_code, lifecycle_state, effective_from, id] }

- table: pricing_product_binding
  domain: commerce
  profile: relation_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: relation_entity
  columns:
    product_id: { type: int64, constraints: NOT NULL }
    operation_id: { type: int64, constraints: NOT NULL }
    vendor_code: { type: string(64), constraints: NOT NULL }
    provider_code: { type: string(64), constraints: NOT NULL }
    account_id: int64
    region_code: { type: string(64), constraints: NOT NULL }
    resource_type: { type: string(64), constraints: NOT NULL }
    resource_code: { type: string(256), constraints: NOT NULL }
    catalog_key: string(256)
    api_format: string(64)
    endpoint_code: string(160)
  unique_constraints:
  - { name: uk_pricing_product_binding_uuid, columns: [uuid] }
  - { name: uk_pricing_product_binding_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_product_binding_provider, columns: [tenant_id, organization_id, product_id, operation_id, vendor_code, provider_code, region_code, resource_type, resource_code], where: account_id IS NULL AND deleted_at IS NULL }
  - { name: uk_pricing_product_binding_account, columns: [tenant_id, organization_id, product_id, operation_id, vendor_code, provider_code, account_id, region_code, resource_type, resource_code], where: account_id IS NOT NULL AND deleted_at IS NULL }
  foreign_keys:
  - name: fk_pricing_product_binding_product
    columns: [tenant_id, organization_id, product_id]
    references_table: pricing_product
    references_columns: [tenant_id, organization_id, id]
  - name: fk_pricing_product_binding_operation
    columns: [tenant_id, organization_id, operation_id]
    references_table: pricing_operation
    references_columns: [tenant_id, organization_id, id]
  indexes:
  - { name: uq_pricing_product_binding_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_product_binding_catalog, columns: [tenant_id, organization_id, vendor_code, provider_code, account_id, region_code, catalog_key, status, id] }
  - { name: idx_pricing_product_binding_endpoint, columns: [tenant_id, organization_id, endpoint_code, api_format, status, id] }

- table: pricing_rate
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    price_book_id: { type: int64, constraints: NOT NULL }
    product_id: { type: int64, constraints: NOT NULL }
    operation_id: { type: int64, constraints: NOT NULL }
    meter_id: { type: int64, constraints: NOT NULL }
    rate_code: { type: string(192), constraints: NOT NULL }
    rate_hash: { type: string(128), constraints: NOT NULL }
    billability: { type: string(32), constraints: NOT NULL }
    charge_timing: { type: string(32), constraints: NOT NULL }
    calculation_mode: { type: string(32), constraints: NOT NULL }
    quantity_aggregation: { type: string(32), constraints: NOT NULL }
    unit_size: { type: decimal, constraints: NOT NULL }
    unit_price: { type: decimal, constraints: NOT NULL }
    minimum_quantity: { type: decimal, constraints: NOT NULL }
    quantity_step: decimal
    currency_code: { type: string(10), constraints: NOT NULL }
    priority: { type: int32, constraints: NOT NULL }
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
    source_url: { type: string(2048), constraints: NOT NULL }
    source_observed_at: { type: instant, constraints: NOT NULL }
  unique_constraints:
  - { name: uk_pricing_rate_uuid, columns: [uuid] }
  - { name: uk_pricing_rate_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_rate_book_code, columns: [tenant_id, organization_id, price_book_id, rate_code] }
  - { name: uk_pricing_rate_book_hash, columns: [tenant_id, organization_id, price_book_id, rate_hash] }
  foreign_keys:
  - { name: fk_pricing_rate_book, columns: [tenant_id, organization_id, price_book_id], references_table: pricing_price_book, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_pricing_rate_product, columns: [tenant_id, organization_id, product_id], references_table: pricing_product, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_pricing_rate_operation, columns: [tenant_id, organization_id, operation_id], references_table: pricing_operation, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_pricing_rate_meter, columns: [tenant_id, organization_id, meter_id], references_table: pricing_meter, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - { name: ck_pricing_rate_quantities, expression: unit_size > 0 AND unit_price >= 0 AND minimum_quantity >= 0 AND (quantity_step IS NULL OR quantity_step > 0) }
  - { name: ck_pricing_rate_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  - name: ck_pricing_rate_billability
    expression: billability IN ('chargeable', 'free', 'not_applicable', 'unknown')
  - name: ck_pricing_rate_charge_timing
    expression: charge_timing IN ('request_accepted', 'successful_result', 'usage_reported')
  - name: ck_pricing_rate_calculation_mode
    expression: calculation_mode IN ('per_unit', 'flat', 'graduated', 'volume', 'formula')
  - name: ck_pricing_rate_quantity_aggregation
    expression: quantity_aggregation IN ('sum', 'maximum', 'minimum', 'last', 'distinct_invocation')
  - name: ck_pricing_rate_flat_unit_size
    expression: calculation_mode <> 'flat' OR unit_size = 1
  - name: ck_pricing_rate_chargeable_price
    expression: billability <> 'chargeable' OR calculation_mode IN ('graduated', 'volume') OR unit_price > 0
  - name: ck_pricing_rate_non_chargeable_price
    expression: billability NOT IN ('free', 'not_applicable') OR unit_price = 0
  - { name: ck_pricing_rate_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  indexes:
  - { name: uq_pricing_rate_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: uq_pricing_rate_scope_book_reference, columns: [tenant_id, organization_id, id, price_book_id], unique: true }
  - { name: uq_pricing_rate_scope_currency_reference, columns: [tenant_id, organization_id, id, currency_code], unique: true }
  - { name: idx_pricing_rate_resolve, columns: [tenant_id, organization_id, product_id, operation_id, meter_id, billability, status, priority, effective_from, id] }

- table: pricing_rate_tier
  domain: commerce
