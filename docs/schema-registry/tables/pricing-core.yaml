    formula_version: { type: string(64), constraints: NOT NULL }
    constant_units: { type: decimal, constraints: NOT NULL }
    quantity_coefficient: { type: decimal, constraints: NOT NULL }
    minimum_units: decimal
    maximum_units: decimal
  unique_constraints:
  - { name: uk_pricing_rate_formula_uuid, columns: [uuid] }
  - { name: uk_pricing_rate_formula_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_rate_formula_rate, columns: [tenant_id, organization_id, rate_id] }
  foreign_keys:
  - { name: fk_pricing_rate_formula_rate, columns: [tenant_id, organization_id, rate_id], references_table: pricing_rate, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - { name: ck_pricing_rate_formula_coefficients, expression: constant_units >= 0 AND quantity_coefficient >= 0 }
  - { name: ck_pricing_rate_formula_bounds, expression: (minimum_units IS NULL OR minimum_units >= 0) AND (maximum_units IS NULL OR maximum_units >= 0) AND (minimum_units IS NULL OR maximum_units IS NULL OR maximum_units >= minimum_units) }
  indexes:
  - { name: uq_pricing_rate_formula_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_rate_formula_code, columns: [tenant_id, organization_id, formula_code, formula_version, status, id] }

