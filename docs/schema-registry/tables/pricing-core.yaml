  unique_constraints:
  - { name: uk_pricing_rate_formula_term_uuid, columns: [uuid] }
  - { name: uk_pricing_rate_formula_term_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_rate_formula_term_index, columns: [tenant_id, organization_id, formula_id, term_index] }
  - { name: uk_pricing_rate_formula_term_code, columns: [tenant_id, organization_id, formula_id, term_code] }
  - { name: uk_pricing_rate_formula_term_dimension, columns: [tenant_id, organization_id, formula_id, dimension_code] }
  foreign_keys:
  - { name: fk_pricing_rate_formula_term_formula, columns: [tenant_id, organization_id, formula_id], references_table: pricing_rate_formula, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - { name: ck_pricing_rate_formula_term_index, expression: term_index >= 0 }
  - { name: ck_pricing_rate_formula_term_coefficient, expression: coefficient >= 0 }
  indexes:
  - { name: idx_pricing_rate_formula_term_resolve, columns: [tenant_id, organization_id, formula_id, term_index, status, id] }

