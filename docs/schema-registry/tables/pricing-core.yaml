  system_of_record: true
  write_owner: pricing-service
  common_columns: relation_entity
  columns:
    rate_id: { type: int64, constraints: NOT NULL }
    tier_index: { type: int32, constraints: NOT NULL }
    tier_code: { type: string(96), constraints: NOT NULL }
    lower_bound: { type: decimal, constraints: NOT NULL }
    upper_bound: decimal
    unit_size: { type: decimal, constraints: NOT NULL }
    unit_price: { type: decimal, constraints: NOT NULL }
    flat_amount: { type: decimal, constraints: NOT NULL }
    currency_code: { type: string(10), constraints: NOT NULL }
  unique_constraints:
  - { name: uk_pricing_rate_tier_uuid, columns: [uuid] }
  - { name: uk_pricing_rate_tier_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_rate_tier_index, columns: [tenant_id, organization_id, rate_id, tier_index] }
  - { name: uk_pricing_rate_tier_code, columns: [tenant_id, organization_id, rate_id, tier_code] }
  foreign_keys:
  - { name: fk_pricing_rate_tier_rate, columns: [tenant_id, organization_id, rate_id, currency_code], references_table: pricing_rate, references_columns: [tenant_id, organization_id, id, currency_code] }
  check_constraints:
  - { name: ck_pricing_rate_tier_index, expression: tier_index >= 0 }
  - { name: ck_pricing_rate_tier_bounds, expression: lower_bound >= 0 AND (upper_bound IS NULL OR upper_bound > lower_bound) }
  - { name: ck_pricing_rate_tier_amounts, expression: unit_size > 0 AND unit_price >= 0 AND flat_amount >= 0 }
  - { name: ck_pricing_rate_tier_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  indexes:
  - { name: idx_pricing_rate_tier_resolve, columns: [tenant_id, organization_id, rate_id, tier_index, lower_bound, upper_bound, status, id] }

