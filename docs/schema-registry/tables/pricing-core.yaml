  domain: commerce
  profile: relation_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: relation_entity
  columns:
    rate_id: { type: int64, constraints: NOT NULL }
    product_binding_id: { type: int64, constraints: NOT NULL }
  unique_constraints:
  - { name: uk_pricing_rate_binding_uuid, columns: [uuid] }
  - { name: uk_pricing_rate_binding_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_rate_binding_relation, columns: [tenant_id, organization_id, rate_id, product_binding_id] }
  foreign_keys:
  - { name: fk_pricing_rate_binding_rate, columns: [tenant_id, organization_id, rate_id], references_table: pricing_rate, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_pricing_rate_binding_product_binding, columns: [tenant_id, organization_id, product_binding_id], references_table: pricing_product_binding, references_columns: [tenant_id, organization_id, id] }
  indexes:
  - { name: idx_pricing_rate_binding_product, columns: [tenant_id, organization_id, product_binding_id, status, rate_id] }

- table: pricing_rate_condition
  domain: commerce
  profile: relation_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: relation_entity
  columns:
    rate_id: { type: int64, constraints: NOT NULL }
    dimension_code: { type: string(96), constraints: NOT NULL }
    operator_code: { type: string(16), constraints: NOT NULL }
    value_type: { type: string(16), constraints: NOT NULL }
    value_string: string(512)
    value_decimal: decimal
    value_boolean: bool
    value_json: json
    sort_order: { type: int32, constraints: NOT NULL }
  unique_constraints:
  - { name: uk_pricing_rate_condition_uuid, columns: [uuid] }
  - { name: uk_pricing_rate_condition_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_rate_condition_slot, columns: [tenant_id, organization_id, rate_id, dimension_code, operator_code, sort_order] }
  foreign_keys:
  - { name: fk_pricing_rate_condition_rate, columns: [tenant_id, organization_id, rate_id], references_table: pricing_rate, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - name: ck_pricing_rate_condition_operator
    expression: operator_code IN ('eq', 'neq', 'gt', 'gte', 'lt', 'lte', 'in', 'not_in', 'exists')
  - name: ck_pricing_rate_condition_value_type
    expression: value_type IN ('string', 'decimal', 'boolean', 'json')
  - name: ck_pricing_rate_condition_value
    expression: (value_type = 'string' AND value_string IS NOT NULL AND value_decimal IS NULL AND value_boolean IS NULL AND value_json IS NULL) OR (value_type = 'decimal' AND value_string IS NULL AND value_decimal IS NOT NULL AND value_boolean IS NULL AND value_json IS NULL) OR (value_type = 'boolean' AND value_string IS NULL AND value_decimal IS NULL AND value_boolean IS NOT NULL AND value_json IS NULL) OR (value_type = 'json' AND value_string IS NULL AND value_decimal IS NULL AND value_boolean IS NULL AND value_json IS NOT NULL)
  - name: ck_pricing_rate_condition_operator_value
    expression: (operator_code <> 'exists' OR value_type = 'boolean') AND (operator_code NOT IN ('in', 'not_in') OR value_type = 'json')
  - { name: ck_pricing_rate_condition_sort_order, expression: sort_order >= 0 }
  indexes:
  - { name: idx_pricing_rate_condition_match, columns: [tenant_id, organization_id, rate_id, dimension_code, operator_code, sort_order, id] }

- table: pricing_import_run
  domain: commerce
  profile: event_log
  tenant_scope: tenant_with_global_fallback
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: event_log
  columns:
    source_system: { type: string(64), constraints: NOT NULL }
    source_catalog_version: { type: string(128), constraints: NOT NULL }
    source_hash: { type: string(128), constraints: NOT NULL }
    import_state: { type: string(32), constraints: NOT NULL }
    row_count: { type: int64, constraints: NOT NULL }
    accepted_count: { type: int64, constraints: NOT NULL }
    rejected_count: { type: int64, constraints: NOT NULL }
    staged_at: { type: instant, constraints: NOT NULL }
    activated_at: instant
    failure_summary: string(1024)
  unique_constraints:
  - { name: uk_pricing_import_run_uuid, columns: [uuid] }
  - { name: uk_pricing_import_run_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_import_run_source, columns: [tenant_id, organization_id, source_system, source_catalog_version, source_hash] }
  check_constraints:
  - { name: ck_pricing_import_run_counts, expression: row_count >= 0 AND accepted_count >= 0 AND rejected_count >= 0 AND accepted_count + rejected_count <= row_count }
  - name: ck_pricing_import_run_state
    expression: import_state IN ('staging', 'validated', 'activated', 'rejected', 'failed')
  indexes:
  - { name: uq_pricing_import_run_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_import_run_latest, columns: [tenant_id, organization_id, source_system, import_state, staged_at, id] }
  - { name: idx_pricing_import_run_retention, columns: [retention_until, id] }
  lifecycle: *pricing_import_lifecycle
