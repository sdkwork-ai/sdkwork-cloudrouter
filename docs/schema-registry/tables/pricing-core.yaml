x-pricing-import-lifecycle: &pricing_import_lifecycle
  storage_strategy: indexed_append_only
  retention: { online_retention: 24mo, archive_retention: 7y, grace_period: 24h }
  cleanup:
    owner: pricing-service
    scope: platform_cross_tenant
    authorization: { mode: service_identity, service: pricing-service, audit_required: true }
    candidate_recheck:
      required: true
      operations: [archive, delete]
      key_columns: [tenant_id, organization_id, id]
    batch_size: 1000
    predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
    archive_before_delete: true
    retry:
      max_attempts: 5
      backoff: { strategy: exponential, initial: 1s, maximum: 5m }
    monitoring:
      metrics: [cleanup_candidates, cleanup_archived, cleanup_deleted, cleanup_failures]
      alerts: [retention_lag, retry_exhausted]
    dry_run: { supported: true, default: true }

tables:
- table: pricing_import_run
  domain: commerce
  profile: event_log
  tenant_scope: tenant_with_global_fallback
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: event_log
  columns:
    source_system: { type: string(64), constraints: NOT NULL }
    source_catalog_version: { type: string(128), constraints: NOT NULL }
    source_hash: { type: string(128), constraints: NOT NULL }
    import_state: { type: string(32), constraints: NOT NULL }
    row_count: { type: int64, constraints: NOT NULL }
    accepted_count: { type: int64, constraints: NOT NULL }
    rejected_count: { type: int64, constraints: NOT NULL }
    staged_at: { type: instant, constraints: NOT NULL }
    activated_at: instant
    failure_summary: string(1024)
  unique_constraints:
  - { name: uk_pricing_import_run_uuid, columns: [uuid] }
  - { name: uk_pricing_import_run_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_import_run_source, columns: [tenant_id, organization_id, source_system, source_catalog_version, source_hash] }
  check_constraints:
  - { name: ck_pricing_import_run_counts, expression: row_count >= 0 AND accepted_count >= 0 AND rejected_count >= 0 AND accepted_count + rejected_count <= row_count }
  - name: ck_pricing_import_run_state
    expression: "import_state IN ('staging', 'validated', 'activated', 'rejected', 'failed')"
  indexes:
  - { name: uq_pricing_import_run_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_import_run_latest, columns: [tenant_id, organization_id, source_system, import_state, staged_at, id] }
  - { name: idx_pricing_import_run_retention, columns: [retention_until, id] }
  lifecycle: *pricing_import_lifecycle

- table: pricing_price_book
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    import_run_id: int64
    namespace_code: { type: string(64), constraints: NOT NULL }
    price_book_code: { type: string(160), constraints: NOT NULL }
    price_book_version: { type: string(128), constraints: NOT NULL }
    price_side: { type: string(32), constraints: NOT NULL }
    source_system: { type: string(64), constraints: NOT NULL }
    vendor_code: { type: string(64), constraints: NOT NULL }
    region_code: { type: string(64), constraints: NOT NULL }
    source_catalog_version: { type: string(128), constraints: NOT NULL }
    source_hash: { type: string(128), constraints: NOT NULL }
    lifecycle_state: { type: string(32), constraints: NOT NULL }
    currency_code: { type: string(3), constraints: NOT NULL }
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
    activated_at: instant
  unique_constraints:
  - { name: uk_pricing_price_book_uuid, columns: [uuid] }
  - { name: uk_pricing_price_book_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_price_book_version, columns: [tenant_id, organization_id, namespace_code, price_book_code, vendor_code, region_code, price_book_version] }
  - { name: uk_pricing_price_book_source, columns: [tenant_id, organization_id, source_system, vendor_code, region_code, source_catalog_version, price_book_code, source_hash] }
  - { name: uk_pricing_price_book_active, columns: [tenant_id, organization_id, namespace_code, price_book_code, vendor_code, region_code], where: lifecycle_state = 'active' AND deleted_at IS NULL }
  foreign_keys:
  - { name: fk_pricing_price_book_import, columns: [tenant_id, organization_id, import_run_id], references_table: pricing_import_run, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - { name: ck_pricing_price_book_state, expression: "lifecycle_state IN ('draft', 'staged', 'active', 'retired', 'rejected')" }
  - { name: ck_pricing_price_book_side, expression: "price_side IN ('official_reference', 'upstream_cost', 'customer_charge', 'internal_transfer')" }
  - { name: ck_pricing_price_book_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  - { name: ck_pricing_price_book_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  indexes:
  - { name: uq_pricing_price_book_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: uq_pricing_price_book_rate_dimensions, columns: [tenant_id, organization_id, id, vendor_code, region_code, currency_code], unique: true }
  - { name: idx_pricing_price_book_active, columns: [tenant_id, organization_id, namespace_code, lifecycle_state, effective_from, id] }

- table: pricing_rate
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    price_book_id: { type: int64, constraints: NOT NULL }
    rate_code: { type: string(192), constraints: NOT NULL }
    rate_hash: { type: string(128), constraints: NOT NULL }
    product_code: { type: string(160), constraints: NOT NULL }
    product_kind: { type: string(64), constraints: NOT NULL }
    product_display_name: { type: string(256), constraints: NOT NULL }
    operation_code: { type: string(160), constraints: NOT NULL }
    operation_kind: { type: string(64), constraints: NOT NULL }
    operation_display_name: { type: string(256), constraints: NOT NULL }
    meter_code: { type: string(96), constraints: NOT NULL }
    meter_display_name: { type: string(256), constraints: NOT NULL }
    quantity_kind: { type: string(64), constraints: NOT NULL }
    unit_code: { type: string(64), constraints: NOT NULL }
    vendor_code: { type: string(64), constraints: NOT NULL }
    provider_code: { type: string(64), constraints: NOT NULL }
    account_id: int64
    region_code: { type: string(64), constraints: NOT NULL }
    resource_type: { type: string(64), constraints: NOT NULL }
    resource_code: { type: string(256), constraints: NOT NULL }
    catalog_key: string(256)
    api_format: string(64)
    endpoint_code: string(160)
    billability: { type: string(32), constraints: NOT NULL }
    charge_timing: { type: string(32), constraints: NOT NULL }
    calculation_mode: { type: string(32), constraints: NOT NULL }
    quantity_aggregation: { type: string(32), constraints: NOT NULL }
    unit_size: { type: decimal, constraints: NOT NULL }
    unit_price: { type: decimal, constraints: NOT NULL }
    minimum_quantity: { type: decimal, constraints: NOT NULL }
    quantity_step: decimal
    currency_code: { type: string(3), constraints: NOT NULL }
    conditions: { type: json, constraints: "NOT NULL DEFAULT '[]'::jsonb" }
    tiers: { type: json, constraints: "NOT NULL DEFAULT '[]'::jsonb" }
    formula: json
    priority: { type: int32, constraints: NOT NULL }
    rate_variant: { type: string(32), constraints: "NOT NULL DEFAULT 'standard'" }
    schedule: json
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
    source_url: { type: string(2048), constraints: NOT NULL }
    source_observed_at: { type: instant, constraints: NOT NULL }
  unique_constraints:
  - { name: uk_pricing_rate_uuid, columns: [uuid] }
  - { name: uk_pricing_rate_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_rate_book_code, columns: [tenant_id, organization_id, price_book_id, rate_code] }
  - { name: uk_pricing_rate_book_hash, columns: [tenant_id, organization_id, price_book_id, rate_hash] }
  foreign_keys:
  - { name: fk_pricing_rate_book, columns: [tenant_id, organization_id, price_book_id], references_table: pricing_price_book, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_pricing_rate_book_dimensions, columns: [tenant_id, organization_id, price_book_id, vendor_code, region_code, currency_code], references_table: pricing_price_book, references_columns: [tenant_id, organization_id, id, vendor_code, region_code, currency_code] }
  check_constraints:
  - { name: ck_pricing_rate_quantities, expression: unit_size > 0 AND unit_price >= 0 AND minimum_quantity >= 0 AND (quantity_step IS NULL OR quantity_step > 0) }
  - { name: ck_pricing_rate_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  - { name: ck_pricing_rate_billability, expression: "billability IN ('chargeable', 'free', 'not_applicable', 'unknown')" }
  - { name: ck_pricing_rate_charge_timing, expression: "charge_timing IN ('request_accepted', 'successful_result', 'usage_reported')" }
  - { name: ck_pricing_rate_calculation_mode, expression: "calculation_mode IN ('per_unit', 'flat', 'graduated', 'volume', 'formula')" }
  - { name: ck_pricing_rate_quantity_aggregation, expression: "quantity_aggregation IN ('sum', 'maximum', 'minimum', 'last', 'distinct_invocation')" }
  - { name: ck_pricing_rate_flat_unit_size, expression: calculation_mode <> 'flat' OR unit_size = 1 }
  - { name: ck_pricing_rate_chargeable_price, expression: billability <> 'chargeable' OR unit_price > 0 }
  - { name: ck_pricing_rate_non_chargeable_price, expression: "billability NOT IN ('free', 'not_applicable') OR unit_price = 0" }
  - { name: ck_pricing_rate_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  - { name: ck_pricing_rate_conditions_json, expression: "jsonb_typeof(conditions) = 'array'" }
  - { name: ck_pricing_rate_tiers_json, expression: "jsonb_typeof(tiers) = 'array'" }
  - { name: ck_pricing_rate_formula_json, expression: "formula IS NULL OR jsonb_typeof(formula) = 'object'" }
  - { name: ck_pricing_rate_variant, expression: "rate_variant IN ('standard', 'time_window')" }
  - { name: ck_pricing_rate_schedule_json, expression: "schedule IS NULL OR jsonb_typeof(schedule) = 'object'" }
  - { name: ck_pricing_rate_schedule_variant, expression: "(rate_variant = 'standard' AND schedule IS NULL) OR (rate_variant = 'time_window' AND schedule IS NOT NULL)" }
  - { name: ck_pricing_rate_calculation_payload, expression: "(calculation_mode IN ('graduated', 'volume')) = (jsonb_array_length(tiers) > 0) AND (calculation_mode = 'formula') = (formula IS NOT NULL)" }
  indexes:
  - { name: uq_pricing_rate_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: uq_pricing_rate_scope_book_reference, columns: [tenant_id, organization_id, id, price_book_id], unique: true }
  - { name: idx_pricing_rate_resolve, columns: [tenant_id, organization_id, catalog_key, product_code, operation_code, meter_code, provider_code, region_code, billability, status, priority, effective_from, id] }

- table: pricing_default_region
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  columns:
    vendor_code: { type: string(64), constraints: NOT NULL }
    provider_code: { type: string(64), constraints: "NOT NULL DEFAULT ''" }
    product_code: { type: string(160), constraints: NOT NULL }
    resource_code: { type: string(256), constraints: "NOT NULL DEFAULT ''" }
    catalog_key: { type: string(256), constraints: NOT NULL }
    # Stable resource identity hash computed by the IMMUTABLE
    # pricing_resource_key(vendor_code, provider_code, catalog_key,
    # product_code, resource_code) function. A resource (model) that exposes
    # prices across multiple regions still owns exactly one default billing
    # region row: uniqueness is enforced on resource_key, not catalog_key, so
    # the admin list can render one row per resource with region tabs.
    resource_key: { type: string(64), constraints: "NOT NULL DEFAULT ''" }
    default_region_code: { type: string(64), constraints: NOT NULL }
    currency_code: { type: string(3), constraints: NOT NULL }
    description: string(1024)
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
  unique_constraints:
  - { name: uk_pricing_default_region_uuid, columns: [uuid] }
  - { name: uk_pricing_default_region_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_pricing_default_region_resource_key, columns: [tenant_id, organization_id, resource_key], where: "deleted_at IS NULL AND BTRIM(resource_key) <> ''" }
  check_constraints:
  - { name: ck_pricing_default_region_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  - { name: ck_pricing_default_region_region_not_blank, expression: "BTRIM(default_region_code) <> ''" }
  - { name: ck_pricing_default_region_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  - { name: ck_pricing_default_region_resource_key_blank, expression: "BTRIM(resource_key) <> ''" }
  indexes:
  - { name: uq_pricing_default_region_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_pricing_default_region_catalog_key, columns: [tenant_id, organization_id, vendor_code, catalog_key, default_region_code, id] }
  - { name: idx_pricing_default_region_resource_key, columns: [tenant_id, organization_id, resource_key, default_region_code, id] }
