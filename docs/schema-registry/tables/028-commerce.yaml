tables:
- table: commerce_usage_service_provider_reconciliation_run
  domain: commerce
  profile: commercial_provider_reconciliation_run
  compliance_level: L3
  system_of_record: true
  write_owner: reconciliation-worker
  common_columns: event_log
  source_tables:
  - ai_usage_service_provider_edge
  - integration_provider_invoice_item
  frontend_routes:
  - /admin/service-providers/reconciliation
  api_surfaces:
  - backend
  - worker
  columns:
    run_no: string(128)
    scope_type: string(64)
    scope_id: string(128)
    period_start: instant
    period_end: instant
    matched_count: int64
    mismatch_count: int64
    missing_internal_count: int64
    missing_external_count: int64
    total_internal_amount: decimal
    total_external_amount: decimal
    difference_amount: decimal
  indexes:
  - name: uk_commerce_usage_service_provider_reconciliation_run_no
    unique: true
    columns:
    - tenant_id
    - organization_id
    - run_no
  - name: idx_commerce_usage_service_provider_reconciliation_run_period
    columns:
    - tenant_id
    - organization_id
    - scope_type
    - period_start
    - period_end
    - id
  security:
    financial: true
    audit_required: true
- table: commerce_usage_service_provider_reconciliation_item
  domain: commerce
  profile: commercial_provider_reconciliation_item
  compliance_level: L3
  system_of_record: true
  write_owner: reconciliation-worker
  common_columns: event_log
  source_tables:
  - commerce_usage_service_provider_reconciliation_run
  - ai_usage_service_provider_edge
  - integration_provider_invoice_item
  frontend_routes:
  - /admin/service-providers/reconciliation
  api_surfaces:
  - backend
  - worker
  columns:
    run_id: int64
    usage_edge_id: int64
    usage_fact_id: int64
    provider_invoice_item_id: int64
    statement_item_id: int64
    match_status: string(64)
    internal_amount: decimal
    external_amount: decimal
    difference_amount: decimal
    reason_code: string(128)
    resolution_status: string(64)
  indexes:
  - name: idx_commerce_usage_service_provider_reconciliation_item_run
    columns:
    - tenant_id
    - organization_id
    - run_id
    - match_status
    - id
  security:
    financial: true
    audit_required: true
- table: commerce_service_provider_exposure_snapshot
  domain: commerce
  profile: commercial_provider_exposure_snapshot
  compliance_level: L3
  system_of_record: false
  write_owner: settlement-worker
  common_columns: projection
  source_tables:
  - integration_service_provider
  source_refs:
  - sdkwork-commerce:commerce_account
  - sdkwork-commerce:commerce_account_ledger_entry
  frontend_routes:
  - /admin/service-providers/dashboard
  - /admin/service-providers/wallet
  - /admin/service-providers/risk
  api_surfaces:
  - backend
  - worker
  columns:
    service_provider_id: int64
    balance_amount: decimal
    frozen_amount: decimal
    credit_limit_amount: decimal
    used_credit_amount: decimal
    exposure_amount: decimal
    pending_settlement_amount: decimal
    overdue_amount: decimal
    currency: string(10)
    risk_status: string(64)
    calculated_at: instant
  indexes:
  - name: uk_commerce_service_provider_exposure_snapshot_provider
    unique: true
    columns:
    - tenant_id
    - organization_id
    - service_provider_id
    - currency
  security:
    financial: true
