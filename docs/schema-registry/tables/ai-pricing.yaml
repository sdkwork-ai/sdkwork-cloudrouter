    - organization_id
    - status
    - effective_from
    - priority
    - id
  - name: idx_ai_pricing_plan_binding_subject_effective
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_id
    - status
    - effective_from
    - id
  - name: idx_ai_pricing_plan_binding_plan
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - status
    - priority
    - id
