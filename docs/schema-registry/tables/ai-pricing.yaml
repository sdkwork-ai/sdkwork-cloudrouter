    subject_id: int64
    subject_code: string(128)
    binding_source: int32
    multiplier_override: decimal
    rpm_override: int64
    tpm_override: int64
    quota_policy_id: int64
    priority:
      type: int32
      constraints: NOT NULL
    effective_from:
      type: instant
      constraints: NOT NULL
    effective_to: instant
  unique_constraints:
  - name: uk_ai_pricing_plan_binding_uuid
    columns:
    - uuid
  - name: uk_ai_pricing_plan_binding_subject
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_id
    - pricing_plan_id
  indexes:
  - name: idx_ai_pricing_plan_binding_tenant_status_effective
    columns:
    - tenant_id
    - organization_id
    - status
    - effective_from
    - priority
    - id
  - name: idx_ai_pricing_plan_binding_subject_effective
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_id
    - status
    - effective_from
    - id
  - name: idx_ai_pricing_plan_binding_plan
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - status
    - priority
    - id
- table: ai_pricing_rule
  domain: ai
  profile: pricing
  compliance_level: L2
  system_of_record: true
  write_owner: ai-pricing-service
  common_columns: pricing
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    pricing_plan_id:
      type: int64
      constraints: NOT NULL
    pricing_plan_code: string(64)
    rule_code:
      type: string(64)
      constraints: NOT NULL
    rule_name: string(128)
    match_type: int32
    vendor_code: string(64)
    family_code: string(64)
    model_id: int64
    model: string(256)
    supplier_code: string(64)
    account_id: int64
    provider_model: string(256)
    capability_code: string(64)
    platform_code: string(64)
    service_tier: string(64)
    region: string(64)
    price_side: int32
    reference_price_side: int32
    reference_pricing_id: int64
    reference_pricing_scope: int32
    price_item_type: int32
    billing_type: int32
    billing_mode: int32
    billing_meter_id: int64
    billing_meter_code:
      type: string(64)
      constraints: NOT NULL
    unit: int32
    unit_size: decimal
    metering_mode: int32
    quantity_source: int32
    quantity_formula: text
    result_selector: string(256)
    minimum_quantity: decimal
    quantity_step: decimal
    included_quantity: decimal
    formula_mode:
      type: int32
      constraints: NOT NULL
    multiplier: decimal
    markup_amount: decimal
    unit_price_override: decimal
    expression: text
    expression_hash: string(128)
    fallback_mode: int32
    priority:
      type: int32
      constraints: NOT NULL
    effective_from:
      type: instant
      constraints: NOT NULL
    effective_to: instant
  required_columns:
  - pricing_plan_id
  - rule_code
  - billing_meter_code
  - formula_mode
  - priority
  - effective_from
  unique_constraints:
  - name: uk_ai_pricing_rule_uuid
    columns:
    - uuid
  - name: uk_ai_pricing_rule_plan_code
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - rule_code
  foreign_keys:
  - name: fk_ai_pricing_rule_plan
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    references_table: ai_pricing_plan
    references_columns:
    - tenant_id
    - organization_id
    - id
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_pricing_rule_positive_units
    expression: (unit_size IS NULL OR unit_size > 0)
      AND (minimum_quantity IS NULL OR minimum_quantity >= 0)
      AND (quantity_step IS NULL OR quantity_step > 0)
      AND (included_quantity IS NULL OR included_quantity >= 0)
  - name: ck_ai_pricing_rule_non_negative_amounts
    expression: (multiplier IS NULL OR multiplier >= 0)
      AND (markup_amount IS NULL OR markup_amount >= 0)
      AND (unit_price_override IS NULL OR unit_price_override >= 0)
  - name: ck_ai_pricing_rule_effective_interval
    expression: effective_to IS NULL OR effective_to > effective_from
  indexes:
  - name: uk_ai_pricing_rule_scope_id
    unique: true
    columns:
    - tenant_id
    - organization_id
    - id
  - name: idx_ai_pricing_rule_tenant_status_priority
    columns:
    - tenant_id
    - organization_id
    - status
    - priority
    - effective_from
    - id
  - name: idx_ai_pricing_rule_model_lookup
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - model
    - supplier_code
    - account_id
    - billing_meter_code
    - status
    - priority
    - id
  - name: idx_ai_pricing_rule_meter_lookup
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - billing_meter_code
    - match_type
    - status
    - priority
    - id
  - name: idx_ai_pricing_rule_reference
    columns:
    - tenant_id
    - organization_id
    - reference_price_side
    - reference_pricing_id
    - status
    - id
- table: ai_pricing_tier
  domain: ai
  profile: pricing
  compliance_level: L2
  system_of_record: true
  write_owner: ai-pricing-service
  common_columns: pricing
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    pricing_rule_id: int64
    model_pricing_id: int64
    tier_code:
      type: string(64)
      constraints: NOT NULL
    tier_label: string(64)
    price_item_type: int32
    billing_mode: int32
    billing_meter_id: int64
    billing_meter_code:
      type: string(64)
      constraints: NOT NULL
    min_quantity: decimal
    max_quantity: decimal
    quantity_unit: int32
    quantity_step: decimal
    included_quantity: decimal
    result_selector: string(256)
    input_unit_price: decimal
    output_unit_price: decimal
    cache_write_unit_price: decimal
    cache_read_unit_price: decimal
    image_unit_price: decimal
    audio_unit_price: decimal
    video_unit_price: decimal
    per_request_price: decimal
    multiplier: decimal
    currency: string(10)
    sort_order:
      type: int32
      constraints: NOT NULL
    effective_from:
      type: instant
      constraints: NOT NULL
    effective_to: instant
  required_columns:
  - pricing_rule_id
  - tier_code
  - billing_meter_code
  - sort_order
  - effective_from
  unique_constraints:
  - name: uk_ai_pricing_tier_uuid
    columns:
    - uuid
  - name: uk_ai_pricing_tier_rule_code
    columns:
    - tenant_id
    - organization_id
    - pricing_rule_id
    - tier_code
  foreign_keys:
  - name: fk_ai_pricing_tier_rule
    columns:
    - tenant_id
    - organization_id
    - pricing_rule_id
    references_table: ai_pricing_rule
    references_columns:
    - tenant_id
    - organization_id
    - id
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_pricing_tier_quantity_range
    expression: (min_quantity IS NULL OR min_quantity >= 0)
      AND (max_quantity IS NULL OR max_quantity >= 0)
      AND (min_quantity IS NULL OR max_quantity IS NULL OR max_quantity >= min_quantity)
      AND (quantity_step IS NULL OR quantity_step > 0)
      AND (included_quantity IS NULL OR included_quantity >= 0)
  - name: ck_ai_pricing_tier_non_negative_amounts
    expression: (input_unit_price IS NULL OR input_unit_price >= 0)
      AND (output_unit_price IS NULL OR output_unit_price >= 0)
      AND (cache_write_unit_price IS NULL OR cache_write_unit_price >= 0)
      AND (cache_read_unit_price IS NULL OR cache_read_unit_price >= 0)
      AND (image_unit_price IS NULL OR image_unit_price >= 0)
      AND (audio_unit_price IS NULL OR audio_unit_price >= 0)
      AND (video_unit_price IS NULL OR video_unit_price >= 0)
      AND (per_request_price IS NULL OR per_request_price >= 0)
      AND (multiplier IS NULL OR multiplier >= 0)
  - name: ck_ai_pricing_tier_effective_interval
    expression: effective_to IS NULL OR effective_to > effective_from
  indexes:
  - name: idx_ai_pricing_tier_tenant_status_effective
    columns:
    - tenant_id
    - organization_id
    - status
    - effective_from
    - sort_order
    - id
  - name: idx_ai_pricing_tier_rule_range
    columns:
    - tenant_id
    - organization_id
    - pricing_rule_id
    - billing_meter_code
    - min_quantity
    - max_quantity
    - sort_order
    - id
  - name: idx_ai_pricing_tier_model_pricing
    columns:
    - tenant_id
    - organization_id
    - model_pricing_id
    - price_item_type
    - sort_order
    - id
