tables:
- table: ai_pricing_import_snapshot
  domain: ai
  profile: event_log
  tenant_scope: tenant_with_global_fallback
  compliance_level: L2
  system_of_record: true
  write_owner: ai-pricing-service
  common_columns: event_log
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    import_source:
      type: int32
      constraints: NOT NULL
    source_name:
      type: string(128)
      constraints: NOT NULL
    source_url: string(1024)
    source_version: string(128)
    source_hash:
      type: string(128)
      constraints: NOT NULL
    upstream_commit: string(128)
    data_format: string(64)
    row_count: int64
    accepted_count: int64
    rejected_count: int64
    currency: string(10)
    published_at: instant
    observed_at:
      type: instant
      constraints: NOT NULL
    raw_payload_ref: string(512)
    normalized_payload_hash: string(128)
    schema_version: string(32)
    error_message_masked: string(1024)
  unique_constraints:
  - name: uk_ai_pricing_import_snapshot_uuid
    columns:
    - uuid
  - name: uk_ai_pricing_import_snapshot_hash
    columns:
    - tenant_id
    - organization_id
    - import_source
    - source_hash
  indexes:
  - name: idx_ai_pricing_import_snapshot_tenant_latest
    columns:
    - tenant_id
    - organization_id
    - status
    - import_source
    - observed_at
    - id
  - name: idx_ai_pricing_import_snapshot_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: ai-pricing-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: ai-pricing-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
- table: ai_pricing_plan
  domain: ai
  profile: pricing
  compliance_level: L2
  system_of_record: true
  write_owner: ai-pricing-service
  common_columns: pricing
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    plan_code:
      type: string(64)
      constraints: NOT NULL
    plan_name:
      type: string(128)
      constraints: NOT NULL
    description: string(512)
    plan_scope: int32
    base_price_side:
      type: int32
      constraints: NOT NULL
    base_pricing_scope: int32
    default_reference_price_id: int64
    default_multiplier: decimal
    default_markup_amount: decimal
    currency:
      type: string(10)
      constraints: NOT NULL
    billing_mode: int32
    rounding_mode: int32
    min_charge_amount: decimal
    fallback_mode: int32
    priority: int32
    price_version: string(64)
    effective_from:
      type: instant
      constraints: NOT NULL
    effective_to: instant
  unique_constraints:
  - name: uk_ai_pricing_plan_uuid
    columns:
    - uuid
  - name: uk_ai_pricing_plan_tenant_code
    columns:
    - tenant_id
    - organization_id
    - plan_code
  check_constraints:
  - name: ck_ai_pricing_plan_non_negative_amounts
    expression: (default_multiplier IS NULL OR default_multiplier >= 0)
      AND (default_markup_amount IS NULL OR default_markup_amount >= 0)
      AND (min_charge_amount IS NULL OR min_charge_amount >= 0)
  - name: ck_ai_pricing_plan_effective_interval
    expression: effective_to IS NULL OR effective_to > effective_from
  indexes:
  - name: uk_ai_pricing_plan_scope_id
    unique: true
    columns:
    - tenant_id
    - organization_id
    - id
  - name: idx_ai_pricing_plan_scope_status
    columns:
    - tenant_id
    - organization_id
    - plan_scope
    - status
    - priority
    - id
  - name: idx_ai_pricing_plan_effective
    columns:
    - tenant_id
    - organization_id
    - status
    - effective_from
    - effective_to
    - id
- table: ai_pricing_plan_binding
