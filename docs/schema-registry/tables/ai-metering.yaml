tables:
- table: ai_usage
  domain: ai
  profile: ledger_source_fact
  compliance_level: L3
  system_of_record: true
  write_owner: router-service
  common_columns: ledger_source_fact
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    decision_log_id: int64
    api_key_id: int64
    legacy_api_key_id: int64
    api_key_name_snapshot: string(128)
    channel_group_id: int64
    channel_group_snapshot: string(128)
    owner_type: int32
    owner_id: int64
    owner_name_snapshot: string(128)
    catalog_key:
      type: string(256)
      constraints: NOT NULL
    requested_model_catalog_key: string(256)
    model: string(256)
    provider_native_model: string(256)
    region_code: string(64)
    provider_id: int64
    channel_id: int64
    modality: int32
    usage_type: int32
    billing_type: int32
    billing_mode: int32
    billing_meter_id: int64
    billing_meter_code: string(64)
    billing_tier: string(64)
    billable_quantity: decimal
    billable_unit: int32
    prompt_tokens: int64
    completion_tokens: int64
    cached_tokens: int64
    total_tokens: int64
    request_count: int64
    result_count: int64
    item_count: int64
    character_count: int64
    image_count: int64
    audio_seconds: decimal
    video_seconds: decimal
    storage_byte_hours: decimal
    bandwidth_bytes: int64
    base_input_unit_price: decimal
    base_output_unit_price: decimal
    cache_read_unit_price: decimal
    rate_multiplier: decimal
    reference_multiplier: decimal
    official_reference_amount: decimal
    upstream_cost_amount: decimal
    customer_charge_amount: decimal
    currency: string(10)
    pricing_id: int64
    pricing_plan_id: int64
    pricing_plan_code: string(64)
    pricing_rule_id: int64
    pricing_tier_id: int64
    pricing_snapshot: json
    reasoning_effort: string(64)
    occurred_at: instant
    settlement_status: int32
    settlement_id: int64
  required_columns:
  - request_id
  - idempotency_key
  - usage_type
  - billing_meter_code
  - billable_quantity
  - currency
  - occurred_at
  - settlement_status
  unique_constraints:
  - name: uk_ai_usage_scope_id
    columns:
    - tenant_id
    - organization_id
    - id
  - name: uk_ai_usage_idempotency
    columns:
    - tenant_id
    - organization_id
    - idempotency_key
  - name: uk_ai_usage_request
    columns:
    - tenant_id
    - organization_id
    - request_id
    - usage_type
  check_constraints:
  - name: ck_ai_usage_non_negative_counts
    expression: (prompt_tokens IS NULL OR prompt_tokens >= 0)
      AND (completion_tokens IS NULL OR completion_tokens >= 0)
      AND (cached_tokens IS NULL OR cached_tokens >= 0)
      AND (total_tokens IS NULL OR total_tokens >= 0)
      AND (request_count IS NULL OR request_count >= 0)
      AND (result_count IS NULL OR result_count >= 0)
      AND (item_count IS NULL OR item_count >= 0)
      AND (character_count IS NULL OR character_count >= 0)
      AND (image_count IS NULL OR image_count >= 0)
  - name: ck_ai_usage_non_negative_amounts
    expression: billable_quantity >= 0
      AND (audio_seconds IS NULL OR audio_seconds >= 0)
      AND (video_seconds IS NULL OR video_seconds >= 0)
      AND (storage_byte_hours IS NULL OR storage_byte_hours >= 0)
      AND (official_reference_amount IS NULL OR official_reference_amount >= 0)
      AND (upstream_cost_amount IS NULL OR upstream_cost_amount >= 0)
      AND (customer_charge_amount IS NULL OR customer_charge_amount >= 0)
  - name: ck_ai_usage_currency
    expression: length(trim(currency)) BETWEEN 3 AND 10
  indexes:
  - name: idx_ai_usage_tenant_owner_occurred
    columns:
    - tenant_id
    - organization_id
    - owner_type
    - owner_id
    - occurred_at
    - id
  - name: idx_ai_usage_api_key_occurred
    columns:
    - tenant_id
    - organization_id
    - api_key_id
    - occurred_at
    - id
  - name: idx_ai_usage_model_occurred
    columns:
    - tenant_id
    - organization_id
    - catalog_key
    - occurred_at
    - id
  - name: idx_ai_usage_pricing_plan_occurred
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - occurred_at
    - id
  - name: idx_ai_usage_meter_occurred
    columns:
    - tenant_id
    - organization_id
    - billing_meter_code
    - occurred_at
    - id
  - name: idx_ai_usage_settlement_status
    columns:
    - tenant_id
    - organization_id
    - settlement_status
    - occurred_at
    - id
  - name: idx_ai_usage_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: router-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: router-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
  semantic_contracts:
    ranking_refresh_source_fact:
      time_field: occurred_at
      window_predicate: half_open_utc
      aggregation_grain:
      - tenant_id
      - organization_id
      - catalog_key
- table: ai_usage_service_provider_edge
  domain: ai
  profile: ledger_source_fact
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: ledger_source_fact
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    usage_fact_id:
      type: int64
      constraints: NOT NULL
    edge_id:
      type: int64
      constraints: NOT NULL
    edge_depth: int32
    seller_provider_id: int64
    buyer_provider_id: int64
    amount_role: string(64)
    pricing_plan_id: int64
    pricing_rule_id: int64
    billing_meter_code: string(64)
    token_kind: string(64)
    billable_quantity: decimal
    unit_price: decimal
    unit_size: decimal
    charge_amount: decimal
    currency: string(10)
    fx_rate_snapshot: decimal
    settlement_currency: string(10)
    converted_charge_amount: decimal
    seller_snapshot: json
    buyer_snapshot: json
    price_snapshot: json
    occurred_at: instant
    settlement_status: int32
  required_columns:
  - usage_fact_id
  - edge_id
  - edge_depth
  - amount_role
  - billable_quantity
  - charge_amount
  - currency
  - occurred_at
  unique_constraints:
  - name: uk_ai_usage_service_provider_edge_usage_depth
    columns:
    - tenant_id
    - organization_id
    - usage_fact_id
    - edge_depth
    - amount_role
  foreign_keys:
  - name: fk_ai_usage_service_provider_edge_usage
    columns:
    - tenant_id
    - organization_id
    - usage_fact_id
    references_table: ai_usage
    references_columns:
    - tenant_id
    - organization_id
    - id
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_usage_service_provider_edge_depth
    expression: edge_depth >= 0
  - name: ck_ai_usage_service_provider_edge_amounts
    expression: billable_quantity >= 0 AND charge_amount >= 0
      AND (converted_charge_amount IS NULL OR converted_charge_amount >= 0)
  indexes:
  - name: idx_ai_usage_service_provider_edge_seller_time
    columns:
    - tenant_id
    - organization_id
    - seller_provider_id
    - occurred_at
    - id
  - name: idx_ai_usage_service_provider_edge_buyer_time
    columns:
    - tenant_id
    - organization_id
    - buyer_provider_id
    - occurred_at
    - id
  - name: idx_ai_usage_service_provider_edge_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: router-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: router-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
- table: ai_request_trace
  domain: ai
  profile: event_log
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: event_log
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    attempt_no: int32
    decision_log_id: int64
    api_key_id: int64
    legacy_api_key_id: int64
    api_key_name_snapshot: string(128)
    channel_group_id: int64
    channel_group_snapshot: string(128)
    owner_type: int32
    owner_id: int64
    owner_name_snapshot: string(128)
    provider_id: int64
    channel_id: int64
    channel_name_snapshot: string(128)
    requested_model: string(256)
    requested_model_catalog_key: string(256)
    provider_model: string(256)
    provider_native_model: string(256)
    gateway_instance_id: int64
    gateway_instance_code_snapshot: string(128)
    gateway_region_code_snapshot: string(64)
    gateway_node_name_snapshot: string(128)
    region_code: string(64)
    endpoint: string(256)
    request_path: string(256)
    http_method: string(16)
    http_status: int32
    provider_error_code: string(128)
    error_type: string(128)
    started_at: instant
    ended_at: instant
    latency_ms: int32
    ttft_ms: int32
    streaming: bool
    request_bytes: int64
    response_bytes: int64
    prompt_tokens: int64
    completion_tokens: int64
    cached_tokens: int64
    total_tokens: int64
    request_payload_hash: string(128)
    response_payload_hash: string(128)
    error_message_masked: string(1024)
    reasoning_effort: string(64)
    client_ip_hash: string(128)
    client_ip_masked: string(64)
    client_ip_region: string(128)
    user_agent_hash: string(128)
  required_columns:
  - request_id
  - attempt_no
  - started_at
  unique_constraints:
  - name: uk_ai_request_trace_request_attempt
    columns:
    - tenant_id
    - organization_id
    - request_id
    - attempt_no
  check_constraints:
  - name: ck_ai_request_trace_attempt
    expression: attempt_no >= 1
  - name: ck_ai_request_trace_http_status
    expression: http_status IS NULL OR http_status BETWEEN 100 AND 599
  - name: ck_ai_request_trace_non_negative_metrics
    expression: (latency_ms IS NULL OR latency_ms >= 0)
      AND (ttft_ms IS NULL OR ttft_ms >= 0)
      AND (prompt_tokens IS NULL OR prompt_tokens >= 0)
      AND (completion_tokens IS NULL OR completion_tokens >= 0)
      AND (cached_tokens IS NULL OR cached_tokens >= 0)
      AND (total_tokens IS NULL OR total_tokens >= 0)
  indexes:
  - name: idx_ai_request_trace_tenant_trace
    columns:
    - tenant_id
    - organization_id
    - trace_id
  - name: idx_ai_request_trace_api_key_started
    columns:
    - tenant_id
    - organization_id
    - api_key_id
    - started_at
    - id
  - name: idx_ai_request_trace_model_started
    columns:
    - tenant_id
    - organization_id
    - requested_model
    - started_at
    - id
  - name: idx_ai_request_trace_tenant_status_started
    columns:
    - tenant_id
    - organization_id
    - status
    - started_at
    - id
  - name: idx_ai_request_trace_user_status_started
    columns:
    - tenant_id
    - organization_id
    - user_id
    - status
    - started_at
    - id
  - name: idx_ai_request_trace_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: router-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: router-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
