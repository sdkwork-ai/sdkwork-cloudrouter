tables:
- table: ai_usage
  domain: ai
  profile: ledger_source_fact
  compliance_level: L3
  system_of_record: true
  write_owner: router-service
  common_columns: ledger_source_fact
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    decision_log_id: int64
    api_key_id: int64
    legacy_api_key_id: int64
    api_key_name_snapshot: string(128)
    channel_group_id: int64
    channel_group_snapshot: string(128)
    owner_type: int32
    owner_id: int64
    owner_name_snapshot: string(128)
    catalog_key:
      type: string(256)
      constraints: NOT NULL
    requested_model_catalog_key: string(256)
    model: string(256)
    provider_native_model: string(256)
    region_code: string(64)
    provider_id: int64
    channel_id: int64
    modality: int32
    usage_type: int32
    billing_type: int32
    billing_mode: int32
    billing_meter_id: int64
    billing_meter_code: string(64)
    billing_tier: string(64)
    billable_quantity: decimal
    billable_unit: int32
    prompt_tokens: int64
    completion_tokens: int64
    cached_tokens: int64
    total_tokens: int64
    request_count: int64
    result_count: int64
    item_count: int64
    character_count: int64
    image_count: int64
    audio_seconds: decimal
    video_seconds: decimal
    storage_byte_hours: decimal
    bandwidth_bytes: int64
    unit_price_snapshot: decimal
    base_input_unit_price: decimal
    base_output_unit_price: decimal
    cache_read_unit_price: decimal
    rate_multiplier: decimal
    reference_multiplier: decimal
    official_reference_amount: decimal
    upstream_cost_amount: decimal
    customer_charge_amount: decimal
    cost_amount: decimal
    currency: string(10)
    pricing_id: int64
    pricing_plan_id: int64
    pricing_plan_code: string(64)
    pricing_rule_id: int64
    pricing_tier_id: int64
    pricing_snapshot: json
    reasoning_effort: string(64)
    occurred_at: instant
    settlement_status: int32
    settlement_id: int64
  unique_constraints:
  - name: uk_ai_usage_request
    columns:
    - tenant_id
    - organization_id
    - request_id
    - usage_type
  indexes:
  - name: idx_ai_usage_tenant_owner_occurred
    columns:
    - tenant_id
    - organization_id
    - owner_type
    - owner_id
    - occurred_at
    - id
  - name: idx_ai_usage_api_key_occurred
    columns:
    - tenant_id
    - organization_id
    - api_key_id
    - occurred_at
    - id
  - name: idx_ai_usage_model_occurred
    columns:
    - tenant_id
    - organization_id
    - catalog_key
    - occurred_at
    - id
  - name: idx_ai_usage_pricing_plan_occurred
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - occurred_at
    - id
  - name: idx_ai_usage_meter_occurred
    columns:
    - tenant_id
    - organization_id
    - billing_meter_code
    - occurred_at
    - id
  - name: idx_ai_usage_settlement_status
    columns:
    - tenant_id
    - organization_id
    - settlement_status
    - occurred_at
    - id
  lifecycle:
    partition_by: created_at_month
  semantic_contracts:
    ranking_refresh_source_fact:
      time_field: occurred_at
      window_predicate: half_open_utc
      aggregation_grain:
      - tenant_id
      - organization_id
      - catalog_key
- table: ai_usage_service_provider_edge
  domain: ai
  profile: ledger_source_fact
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: ledger_source_fact
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    usage_fact_id:
      type: int64
      constraints: NOT NULL
    edge_id:
      type: int64
      constraints: NOT NULL
    edge_depth: int32
    seller_provider_id: int64
    buyer_provider_id: int64
    amount_role: string(64)
    pricing_plan_id: int64
    pricing_rule_id: int64
    billing_meter_code: string(64)
    token_kind: string(64)
    billable_quantity: decimal
    unit_price: decimal
    unit_size: decimal
    charge_amount: decimal
    currency: string(10)
    fx_rate_snapshot: decimal
    settlement_currency: string(10)
    converted_charge_amount: decimal
    seller_snapshot: json
    buyer_snapshot: json
    price_snapshot: json
    occurred_at: instant
    settlement_status: int32
  unique_constraints:
  - name: uk_ai_usage_service_provider_edge_usage_depth
    columns:
    - tenant_id
    - organization_id
    - usage_fact_id
    - edge_depth
    - amount_role
  indexes:
  - name: idx_ai_usage_service_provider_edge_seller_time
    columns:
    - tenant_id
    - organization_id
    - seller_provider_id
    - occurred_at
    - id
  - name: idx_ai_usage_service_provider_edge_buyer_time
    columns:
    - tenant_id
    - organization_id
    - buyer_provider_id
    - occurred_at
    - id
  lifecycle:
    partition_by: created_at_month
- table: ai_request_trace
  domain: ai
  profile: event_log
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: event_log
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    attempt_no: int32
    decision_log_id: int64
    api_key_id: int64
    legacy_api_key_id: int64
    api_key_name_snapshot: string(128)
    channel_group_id: int64
    channel_group_snapshot: string(128)
    owner_type: int32
    owner_id: int64
    owner_name_snapshot: string(128)
    provider_id: int64
    channel_id: int64
    channel_name_snapshot: string(128)
    requested_model: string(256)
    requested_model_catalog_key: string(256)
    provider_model: string(256)
    provider_native_model: string(256)
    region_code: string(64)
    endpoint: string(256)
    request_path: string(256)
    http_method: string(16)
    http_status: int32
    provider_error_code: string(128)
    error_type: int32
    started_at: instant
    ended_at: instant
    latency_ms: int32
    ttft_ms: int32
    streaming: bool
    request_bytes: int64
    response_bytes: int64
    prompt_tokens: int64
    completion_tokens: int64
    cached_tokens: int64
    total_tokens: int64
    request_payload_hash: string(128)
    response_payload_hash: string(128)
    error_message_masked: string(1024)
    reasoning_effort: string(64)
    client_ip_hash: string(128)
    client_ip_masked: string(64)
    client_ip_region: string(128)
    user_agent_hash: string(128)
  unique_constraints:
  - name: uk_ai_request_trace_request_attempt
    columns:
    - tenant_id
    - organization_id
    - request_id
    - attempt_no
  indexes:
  - name: idx_ai_request_trace_tenant_trace
    columns:
    - tenant_id
    - organization_id
    - trace_id
  - name: idx_ai_request_trace_api_key_started
    columns:
    - tenant_id
    - organization_id
    - api_key_id
    - started_at
    - id
  - name: idx_ai_request_trace_model_started
    columns:
    - tenant_id
    - organization_id
    - requested_model
    - started_at
    - id
  - name: idx_ai_request_trace_tenant_status_started
    columns:
    - tenant_id
    - organization_id
    - status
    - started_at
    - id
  lifecycle:
    partition_by: created_at_month
