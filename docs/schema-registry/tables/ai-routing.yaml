tables:
- table: ai_upstream_account
  domain: ai
  profile: tenant_entity
  soft_delete_policy: full_lifecycle_unique
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    supplier_id:
      type: int64
      constraints: NOT NULL
    supplier_code:
      type: string(64)
      constraints: NOT NULL
    preferred_endpoint_id: int64
    account_code:
      type: string(64)
      constraints: NOT NULL
    account_name:
      type: string(128)
      constraints: NOT NULL
    account_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'standard'
    auth_method_code:
      type: string(64)
      constraints: NOT NULL
    external_account_id: string(128)
    credential_rotation_policy: json
    credential_rotation_strategy:
      type: string(64)
      constraints: NOT NULL DEFAULT 'default'
    environment: int32
    region_code: string(64)
    quota_unit: int32
    quota_limit: decimal
    quota_used: decimal
    upstream_balance_amount: decimal
    upstream_balance_currency: string(10)
    contract_cost_multiplier:
      type: decimal
      constraints: NOT NULL DEFAULT 1
    last_balance_checked_at: instant
    last_rotated_at: instant
    next_rotate_at: instant
    rpm_limit: int64
    timeout_ms: int32
    retry_policy: json
    circuit_breaker_policy: json
    proxy_id: int64
    risk_level: int32
  unique_constraints:
  - name: uk_ai_upstream_account_uuid
    columns:
    - uuid
  - name: uk_ai_upstream_account_tenant_code
    columns:
    - tenant_id
    - organization_id
    - account_code
  foreign_keys:
  - name: fk_ai_upstream_account_supplier
    columns:
    - tenant_id
    - organization_id
    - supplier_id
    - supplier_code
    references_table: ai_upstream_supplier
    references_columns:
    - tenant_id
    - organization_id
    - id
    - supplier_code
    on_delete: RESTRICT
  - name: fk_ai_upstream_account_preferred_endpoint
    columns:
    - tenant_id
    - organization_id
    - supplier_id
    - preferred_endpoint_id
    references_table: ai_upstream_supplier_endpoint
    references_columns:
    - tenant_id
    - organization_id
    - supplier_id
    - id
    on_delete: RESTRICT
  - name: fk_ai_upstream_account_auth_method
    columns:
    - tenant_id
    - organization_id
    - supplier_id
    - auth_method_code
    references_table: ai_upstream_supplier_auth_method
    references_columns:
    - tenant_id
    - organization_id
    - supplier_id
    - auth_method_code
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_upstream_account_financial_values
    expression: contract_cost_multiplier > 0
      AND (quota_limit IS NULL OR quota_limit >= 0)
      AND (quota_used IS NULL OR quota_used >= 0)
      AND (upstream_balance_amount IS NULL OR upstream_balance_amount >= 0)
  - name: ck_ai_upstream_account_timeout
    expression: timeout_ms IS NULL OR timeout_ms > 0
  indexes:
  - name: uk_ai_upstream_account_scope_id
    unique: true
    columns:
    - tenant_id
    - organization_id
    - id
  - name: uk_ai_upstream_account_scope_auth_method
    unique: true
    columns:
    - tenant_id
    - organization_id
    - id
    - auth_method_code
  - name: idx_ai_upstream_account_supplier_status
    columns:
    - tenant_id
    - organization_id
    - supplier_id
    - status
    - id
  - name: idx_ai_upstream_account_preferred_endpoint
    columns:
    - tenant_id
    - organization_id
    - preferred_endpoint_id
    - status
    - id
- table: ai_upstream_account_health_state
  domain: ai
  profile: operational_state
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: operational_state
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    account_id:
      type: int64
      constraints: NOT NULL
    health_status:
      type: int32
      constraints: NOT NULL DEFAULT 0
    last_latency_ms: int32
    consecutive_error_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    last_verified_at: instant
    last_used_at: instant
    last_success_at: instant
    last_failure_at: instant
  unique_constraints:
  - name: uk_ai_upstream_account_health_state_scope
    columns:
    - tenant_id
    - organization_id
    - account_id
  foreign_keys:
  - name: fk_ai_upstream_account_health_state_account
    columns:
    - tenant_id
    - organization_id
    - account_id
    references_table: ai_upstream_account
    references_columns:
    - tenant_id
    - organization_id
    - id
    on_delete: CASCADE
  check_constraints:
  - name: ck_ai_upstream_account_health_state_identity
    expression: id = account_id
  - name: ck_ai_upstream_account_health_state_values
    expression: health_status IN (0, 1, 2)
      AND (last_latency_ms IS NULL OR last_latency_ms >= 0)
      AND consecutive_error_count >= 0
  indexes:
  - name: idx_ai_upstream_account_health_state_health
    columns:
    - tenant_id
    - organization_id
    - health_status
    - updated_at
    - account_id
  lifecycle:
    storage_strategy: overwrite_state
    concurrency: atomic_upsert
    cleanup:
      strategy: foreign_key_cascade
      parent_table: ai_upstream_account
- table: ai_upstream_account_credential
  domain: ai
  profile: credential_ref
  soft_delete_policy: full_lifecycle_unique
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: credential_ref
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    account_id:
      type: int64
      constraints: NOT NULL
    auth_method_code:
      type: string(64)
      constraints: NOT NULL
    credential_name:
      type: string(128)
      constraints: NOT NULL
    credential_ref:
      type: text
      constraints: NOT NULL
    credential_hash:
      type: string(128)
      constraints: NOT NULL
    masked_label: string(128)
    credential_version:
      type: int64
      constraints: NOT NULL DEFAULT 1
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    is_active:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    expires_at: instant
    last_rotated_at: instant
    last_verified_at: instant
    last_used_at: instant
  unique_constraints:
  - name: uk_ai_upstream_account_credential_uuid
    columns:
    - uuid
  - name: uk_ai_upstream_account_credential_version
    columns:
    - tenant_id
    - organization_id
    - account_id
    - credential_version
  foreign_keys:
  - name: fk_ai_upstream_account_credential_account
    columns:
    - tenant_id
    - organization_id
    - account_id
    - auth_method_code
    references_table: ai_upstream_account
    references_columns:
    - tenant_id
    - organization_id
    - id
    - auth_method_code
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_upstream_account_credential_version
    expression: credential_version > 0 AND priority >= 0
  indexes:
  - name: idx_ai_upstream_account_credential_account
    columns:
    - tenant_id
    - organization_id
    - account_id
    - status
    - is_active
    - priority
    - id
- table: ai_upstream_account_group
  domain: ai
  profile: tenant_entity
  soft_delete_policy: full_lifecycle_unique
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    group_code:
      type: string(64)
      constraints: NOT NULL
    group_name:
      type: string(128)
      constraints: NOT NULL
    description: string(512)
    group_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'shared'
    routing_strategy:
      type: string(32)
      constraints: NOT NULL DEFAULT 'weighted'
    fallback_mode:
      type: string(32)
      constraints: NOT NULL DEFAULT 'sequential'
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    routing_policy_id: int64
    quota_policy_id: int64
    rate_limit_policy_id: int64
    environment: int32
    pricing_plan_id: int64
    pricing_plan_code: string(64)
    cost_multiplier:
      type: decimal
      constraints: NOT NULL DEFAULT 1
    sale_multiplier:
      type: decimal
      constraints: NOT NULL DEFAULT 1
    billing_type: int32
    capacity_limit: int64
    allowed_origin: json
  unique_constraints:
  - name: uk_ai_upstream_account_group_uuid
    columns:
    - uuid
  - name: uk_ai_upstream_account_group_tenant_code
    columns:
    - tenant_id
    - organization_id
    - group_code
  check_constraints:
  - name: ck_ai_upstream_account_group_routing_strategy
    expression: routing_strategy IN ('weighted', 'round_robin', 'least_latency', 'least_cost', 'failover')
  - name: ck_ai_upstream_account_group_fallback_mode
    expression: fallback_mode IN ('none', 'sequential', 'same_supplier', 'cross_supplier')
  - name: ck_ai_upstream_account_group_financial_values
    expression: cost_multiplier > 0 AND sale_multiplier > 0
      AND priority >= 0
      AND (capacity_limit IS NULL OR capacity_limit >= 0)
  indexes:
  - name: uk_ai_upstream_account_group_scope_id
    unique: true
    columns:
    - tenant_id
    - organization_id
    - id
  - name: idx_ai_upstream_account_group_tenant_status_updated
    columns:
    - tenant_id
    - organization_id
    - status
    - updated_at
    - id
  - name: idx_ai_upstream_account_group_pricing
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - status
    - updated_at
    - id
- table: ai_upstream_account_group_member
  domain: ai
  profile: relation_entity
  soft_delete_policy: full_lifecycle_unique
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: relation_entity
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    account_group_id:
      type: int64
      constraints: NOT NULL
    account_id:
      type: int64
      constraints: NOT NULL
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    routing_weight:
      type: int32
      constraints: NOT NULL DEFAULT 100
    cost_multiplier_override: decimal
    enabled:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    effective_from: instant
    effective_to: instant
  unique_constraints:
  - name: uk_ai_upstream_account_group_member_uuid
    columns:
    - uuid
  - name: uk_ai_upstream_account_group_member
    columns:
    - tenant_id
    - organization_id
    - account_group_id
    - account_id
  foreign_keys:
  - name: fk_ai_upstream_account_group_member_group
    columns:
    - tenant_id
    - organization_id
    - account_group_id
    references_table: ai_upstream_account_group
    references_columns:
    - tenant_id
    - organization_id
    - id
    on_delete: RESTRICT
  - name: fk_ai_upstream_account_group_member_account
    columns:
    - tenant_id
    - organization_id
    - account_id
    references_table: ai_upstream_account
    references_columns:
    - tenant_id
    - organization_id
    - id
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_upstream_account_group_member_non_negative_weighting
    expression: priority >= 0 AND routing_weight >= 0
      AND (cost_multiplier_override IS NULL OR cost_multiplier_override > 0)
  - name: ck_ai_upstream_account_group_member_effective_interval
    expression: effective_to IS NULL OR effective_from IS NULL OR effective_to > effective_from
  indexes:
  - name: idx_ai_upstream_account_group_member_status
    columns:
    - tenant_id
    - organization_id
    - status
    - account_group_id
    - priority
    - id
  - name: idx_ai_upstream_account_group_member_group
    columns:
    - tenant_id
    - organization_id
    - account_group_id
    - status
    - priority
    - routing_weight
    - id
  - name: idx_ai_upstream_account_group_member_account
    columns:
    - tenant_id
    - organization_id
    - account_id
    - status
    - id
- table: ai_upstream_account_group_metric_snapshot
  domain: ai
  profile: projection
  compliance_level: L2
  system_of_record: false
  write_owner: ai-routing-service
  common_columns: projection
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    account_group_id: int64
    group_code: string(64)
    account_available_count: int64
    account_total_count: int64
    capacity_used: decimal
    capacity_limit: decimal
    request_count_today: int64
    request_count_total: int64
    usage_amount_today: decimal
    usage_amount_total: decimal
    health_status: int32
    snapshot_at: instant
  required_columns:
  - account_group_id
  - snapshot_at
  - source_version
  source_tables:
  - ai_upstream_account_group
  - ai_upstream_account_group_member
  - ai_upstream_account
  - ai_usage
  unique_constraints:
  - name: uk_ai_upstream_account_group_metric_snapshot_uuid
    columns:
    - uuid
  - name: uk_ai_upstream_account_group_metric_snapshot
    columns:
    - tenant_id
    - organization_id
    - account_group_id
    - snapshot_at
  check_constraints:
  - name: ck_ai_upstream_account_group_metric_counts
    expression: (account_available_count IS NULL OR account_available_count >= 0)
      AND (account_total_count IS NULL OR account_total_count >= 0)
      AND (request_count_today IS NULL OR request_count_today >= 0)
      AND (request_count_total IS NULL OR request_count_total >= 0)
  - name: ck_ai_upstream_account_group_metric_amounts
    expression: (capacity_used IS NULL OR capacity_used >= 0)
      AND (capacity_limit IS NULL OR capacity_limit >= 0)
      AND (usage_amount_today IS NULL OR usage_amount_today >= 0)
      AND (usage_amount_total IS NULL OR usage_amount_total >= 0)
  indexes:
  - name: idx_ai_upstream_account_group_metric_tenant_status
    columns:
    - tenant_id
    - organization_id
    - status
    - snapshot_at
    - id
  semantic_contracts:
    projection_lineage:
      watermark:
        field: snapshot_at
        strategy: high_watermark
      source_version:
        field: source_version
        strategy: max_source_version
      algorithm_version: upstream-account-group-metric-v1
      freshness:
        target_seconds: 300
        max_staleness_seconds: 900
      rebuild:
        strategy: full_recompute
        owner: ai-routing-service
      aggregation_grain:
      - tenant_id
      - organization_id
      - account_group_id
      - snapshot_at
- table: ai_upstream_account_group_resource
  domain: ai
  profile: relation_entity
  soft_delete_policy: full_lifecycle_unique
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: relation_entity
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    account_group_id:
      type: int64
      constraints: NOT NULL
    resource_id: int64
    resource_code:
      type: string(192)
      constraints: NOT NULL DEFAULT ''
    resource_group_id: int64
    resource_group_code:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    grant_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'allow'
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    effective_from: instant
    effective_to: instant
  unique_constraints:
  - name: uk_ai_upstream_account_group_resource_uuid
    columns:
    - uuid
  - name: uk_ai_upstream_account_group_resource
    columns:
    - tenant_id
    - organization_id
    - account_group_id
    - resource_code
    - resource_group_code
  foreign_keys:
  - name: fk_ai_upstream_account_group_resource_group
    columns:
    - tenant_id
    - organization_id
    - account_group_id
    references_table: ai_upstream_account_group
    references_columns:
    - tenant_id
    - organization_id
    - id
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_upstream_account_group_resource_target
    expression: (NULLIF(resource_code, '') IS NOT NULL) <> (NULLIF(resource_group_code, '') IS NOT NULL)
      AND grant_type IN ('allow', 'deny')
      AND priority >= 0
      AND (effective_to IS NULL OR effective_from IS NULL OR effective_to > effective_from)
  indexes:
  - name: idx_ai_upstream_account_group_resource_status
    columns:
    - tenant_id
    - organization_id
    - status
    - account_group_id
    - grant_type
    - priority
    - id
  - name: idx_ai_upstream_account_group_resource_lookup
    columns:
    - tenant_id
    - organization_id
    - account_group_id
    - status
    - grant_type
    - priority
    - id
