- table: ai_channel
  domain: ai
  profile: credential_ref
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: credential_ref
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    provider_id: int64
    provider_code: string(64)
    site_id: int64
    site_service_id: int64
    site_code: string(64)
    site_service_code: string(64)
    site_channel_role: string(32)
    channel_code:
      type: string(64)
      constraints: NOT NULL
    channel_name:
      type: string(128)
      constraints: NOT NULL
    channel_type:
      type: string(32)
      constraints: NOT NULL
    protocol_code: string(64)
    auth_type: int32
    credential_profile: int32
    external_channel_id: string(128)
    base_url: string(512)
    auth_config: json
    credential_ref: string(256)
    credential_hash: string(128)
    credential_version: int64
    credential_rotation_policy: json
    credential_rotation_strategy:
      type: string(64)
      constraints: NOT NULL DEFAULT 'default'
    masked_label: string(128)
    environment: int32
    region_code: string(64)
    quota_unit: int32
    quota_limit: decimal
    quota_used: decimal
    upstream_balance_amount: decimal
    upstream_balance_currency: string(10)
    last_balance_checked_at: instant
    last_rotated_at: instant
    next_rotate_at: instant
    last_verified_at: instant
    last_used_at: instant
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    weight:
      type: int32
      constraints: NOT NULL DEFAULT 100
    rpm_limit: int64
    timeout_ms: int32
    retry_policy: json
    circuit_breaker_policy: json
    health_status:
      type: int32
      constraints: NOT NULL DEFAULT 1
    last_latency_ms: int32
    consecutive_error_count: int64
    proxy_id: int64
    risk_level: int32
  unique_constraints:
  - name: uk_ai_channel_uuid
    columns:
    - uuid
  - name: uk_ai_channel_tenant_code
    columns:
    - tenant_id
    - organization_id
    - channel_code
  indexes:
  - name: idx_ai_channel_provider_type_status
    columns:
    - tenant_id
    - organization_id
    - provider_code
    - channel_type
    - status
    - id
  - name: idx_ai_channel_health_status
    columns:
    - tenant_id
    - organization_id
    - status
    - health_status
    - priority
    - weight
    - id
  - name: idx_ai_channel_site_status
    columns:
    - tenant_id
    - organization_id
    - site_id
    - status
    - health_status
    - id
  - name: idx_ai_channel_site_service_status
    columns:
    - tenant_id
    - organization_id
    - site_service_id
    - status
    - health_status
    - id
  - name: idx_ai_channel_site_code
    columns:
    - tenant_id
    - organization_id
    - site_code
    - site_service_code
    - status
    - id
