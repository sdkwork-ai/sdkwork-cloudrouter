- table: ai_routing_decision_log
  domain: ai
  profile: event_log
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: event_log
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    api_key_id: int64
    legacy_api_key_id: int64
    policy_id: int64
    profile_id: int64
    rule_id: int64
    requested_model: string(256)
    resolved_model: string(256)
    capability: int32
    selected_supplier_id: int64
    selected_account_id: int64
    selected_credential_id: int64
    decision_mode: int32
    decision_reason: json
    candidate_snapshot: json
    fallback_chain: json
    decision_latency_ms: int32
  unique_constraints:
  - name: uk_ai_routing_decision_log_request
    columns:
    - tenant_id
    - organization_id
    - request_id
  indexes:
  - name: idx_ai_routing_decision_tenant_model_created
    columns:
    - tenant_id
    - organization_id
    - requested_model
    - created_at
    - id
  - name: idx_ai_routing_decision_log_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: ai-routing-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: ai-routing-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
