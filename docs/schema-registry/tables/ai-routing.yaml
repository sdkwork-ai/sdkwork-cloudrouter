      id: int64
      uuid: string(64)
      
      # 租户隔离
      tenant_id: int64
      organization_id: int64
      
      # 关联信息
      request_id: string(128)
      usage_id: int64
      
      # 路由信息
      policy_id: int64
      rule_id: int64
      group_id: int64
      
      # 决策信息
      selected_channel_id: int64
      selected_channel_code: string(64)
      selection_reason: string(512)
      
      # 候选信息
      candidate_channels: json
      
      # 匹配条件
      matched_conditions: json
      
      # 决策时间
      decision_at: instant
      decision_duration_ms: int32
      
      # 审计字段
      created_at: instant
      
      # 生命周期
      status: enum_int32
    
