tables:
- table: iam_gateway_access_policy
  domain: iam
  profile: tenant_entity
  compliance_level: L3
  system_of_record: true
  write_owner: access-policy-service
  common_columns: tenant_entity
  frontend_routes:
  - /console/api-keys
  api_surfaces:
  - app
  - backend
  columns:
    name: string(128)
    policy_type: enum_int32
    subject_type: enum_int32
    subject_id: int64
    subject_ref_hash: string(128)
    subject_ref_masked: string(128)
    allowed_capabilities: json
    denied_capabilities: json
    allowed_models: json
    denied_models: json
    network_policy_mode: enum_int32
    ip_rule_count: int32
    ip_allowlist: json
    ip_denylist: json
    region_allowlist: json
    max_context_tokens: int64
    data_retention_mode: enum_int32
    effective_from: instant
    effective_to: instant
  indexes:
  - name: idx_iam_gateway_access_policy_tenant_subject_status
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_id
    - status
  - name: idx_iam_gateway_access_policy_subject_ref
    columns:
    - tenant_id
    - organization_id
    - subject_type
    - subject_ref_hash
    - status
  security:
    sensitivity: ACCESS_CONTROL
    pii: true
    stores_secret_plaintext: false
    audit_required: true
- table: iam_gateway_risk_rule
  domain: iam
  profile: tenant_entity
  compliance_level: L3
  system_of_record: true
  write_owner: risk-service
  common_columns: tenant_entity
  frontend_routes:
  - /admin/ratelimit
  api_surfaces:
  - backend
  columns:
    rule_name: string(128)
    rule_category: enum_int32
    rule_type: enum_int32
    scope_type: enum_int32
    scope_id: int64
    target_type: enum_int32
    target_value: string(256)
    target_value_hash: string(128)
    target_value_masked: string(128)
    target_value_cipher_ref: string(256)
    match_mode: enum_int32
    reason: string(512)
    action: enum_int32
    priority: int32
    requests_per_second: int64
    requests_per_minute: int64
    requests_per_day: int64
    tokens_per_minute: int64
    burst_limit: decimal
    block_duration_seconds: int64
    effective_from: instant
    effective_to: instant
    hit_count: int64
    last_hit_at: instant
  indexes:
  - name: uk_iam_gateway_risk_rule_tenant_target
    unique: true
    columns:
    - tenant_id
    - organization_id
    - rule_type
    - target_type
    - target_value
  - name: idx_iam_gateway_risk_rule_scope_priority
    columns:
    - tenant_id
    - organization_id
    - rule_category
    - scope_type
    - scope_id
    - priority
    - status
  - name: idx_iam_gateway_risk_rule_target_hash
    columns:
    - tenant_id
    - organization_id
    - target_type
    - target_value_hash
    - status
  security:
    sensitivity: NETWORK_SECURITY_RULE
    pii: true
    stores_secret_plaintext: false
    encrypted_fields:
    - target_value_cipher_ref
    audit_required: true
- table: iam_user_preference
  domain: iam
  profile: user_entity
  compliance_level: L2
  system_of_record: true
  write_owner: user-preference-service
  common_columns: user_entity
  frontend_routes:
  - /console/settings
  api_surfaces:
  - app
  columns:
    language: string(32)
    timezone: string(64)
    theme_mode: enum_int32
    appearance_config: json
    notification_preferences: json
    default_console_path: string(256)
  indexes:
  - name: uk_iam_user_preference_user
    unique: true
    columns:
    - tenant_id
    - organization_id
    - user_id
- table: iam_user_security_setting
  domain: iam
  profile: user_entity
  compliance_level: L3
  system_of_record: true
  write_owner: user-security-service
  common_columns: user_entity
  frontend_routes:
  - /console/account
  api_surfaces:
  - app
  - backend
  columns:
    mfa_enabled: bool
    mfa_method: enum_int32
    password_last_changed_at: instant
    security_level: enum_int32
    trusted_device_count: int32
    last_login_at: instant
    last_login_ip_hash: string(128)
    third_party_bound_snapshot: json
  indexes:
  - name: uk_iam_user_security_setting_user
    unique: true
    columns:
    - tenant_id
    - organization_id
    - user_id
  security:
    pii: true
    stores_secret_plaintext: false
    audit_required: true
- table: iam_user_login_event
  domain: iam
  profile: event_log
  compliance_level: L3
  system_of_record: true
  write_owner: auth-service
  common_columns: event_log
  frontend_routes:
  - /admin/user
  - /console/account
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    auth_method: enum_int32
    auth_provider: string(64)
    login_result: enum_int32
    risk_level: enum_int32
    failure_reason_code: string(128)
    client_ip_hash: string(128)
    client_ip_masked: string(64)
    client_ip_region: string(128)
    device_fingerprint_hash: string(128)
    device_label: string(128)
    user_agent_hash: string(128)
    mfa_verified: bool
    session_id_hash: string(128)
    occurred_at: instant
  indexes:
  - name: idx_iam_user_login_event_user_occurred
    columns:
    - tenant_id
    - organization_id
    - user_id
    - occurred_at
    - id
  - name: idx_iam_user_login_event_result_occurred
    columns:
    - tenant_id
    - organization_id
    - login_result
    - occurred_at
    - id
  lifecycle:
    partition_by: occurred_at_month
    online_retention: 180d
    archive_retention: 3y
  security:
    pii: true
    sensitivity: AUTH_EVENT
    payload_stored: metadata_only
    stores_secret_plaintext: false
    audit_required: true
