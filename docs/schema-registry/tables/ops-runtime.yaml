tables:
- table: ops_alert_event
  domain: ops
  profile: audit_event
  compliance_level: L2
  system_of_record: true
  write_owner: cloudrouter-ops-runtime
  common_columns: event_log
  api_surfaces:
  - app
  - backend
  - worker
  frontend_routes:
  - /admin/monitor
  columns:
    alert_no: string(128)
    severity: enum_int32
    source: string(128)
    title: string(200)
    message: string(1024)
    alert_status: enum_int32
    first_seen_at: instant
    last_seen_at: instant
    resolved_at: instant
    resolved_by: int64
  unique_constraints:
  - name: uk_ops_alert_event_no
    columns:
    - alert_no
  indexes:
  - name: idx_ops_alert_event_tenant_status_latest
    columns:
    - tenant_id
    - organization_id
    - status
    - last_seen_at
    - id
  - name: idx_ops_alert_event_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: cloudrouter-ops-runtime
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: cloudrouter-ops-runtime
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
