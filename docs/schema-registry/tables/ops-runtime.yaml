- table: ops_job_execution
  domain: ops
  profile: operational_state
  compliance_level: L2
  system_of_record: true
  write_owner: cloudrouter-ops-runtime
  common_columns: event_log
  api_surfaces:
  - app
  - backend
  - worker
  frontend_routes:
  - /admin/model
  columns:
    job_name: string(128)
    job_type: enum_int32
    trigger_type: enum_int32
    started_at: instant
    ended_at: instant
    duration_ms: int64
    execution_status: enum_int32
    processed_count: int64
    success_count: int64
    failure_count: int64
    failure_reason: string(1024)
    payload: json
  semantic_contracts:
    model_ranking_refresh:
      job_name: model_ranking_refresh
      job_type:
        code: 20
        meaning: model ranking refresh
      trigger_types:
        scheduled: 1
        manual: 2
      execution_status:
        running: 1
        succeeded: 2
        failed: 3
        empty: 4
        skipped: 5
      payload_contract:
        required_fields:
        - rankScope
        - snapshotDate
        - snapshotPeriod
        - windowStart
        - windowEnd
        - generatedCount
        - sourceCount
        - refreshIntervalSeconds
        - cacheMaxAgeSeconds
        - nextRefreshAt
        - status
        - attemptCount
        - retryCount
        - consecutiveFailureCount
        - alertRecommended
        - sourceTables
        source_tables:
        - ai_metering_usage
        - ai_model
        - ai_model_rank_snapshot
      runtime_contract:
        scheduler_owner: sdkwork-cloudrouter-standalone-gateway
        startup_policy:
          run_on_startup_default: true
        timeout:
          default_millis: 300000
        retry:
          max_retry_attempts_default: 1
          max_retry_attempts_max: 5
        concurrency_lock:
          scope:
          - worker_instance
          - tenant_id
          - organization_id
          - rank_scope
          overlap_behavior: audit_skipped
        cache_invalidation:
          invalidate_after_status:
          - succeeded
          - empty
        delayed_alerting:
          alert_after_consecutive_failures_default: 3
  indexes:
  - name: idx_ops_job_execution_name_started
    columns:
    - job_name
    - started_at
    - id
  - name: idx_ops_job_execution_status_started
    columns:
    - execution_status
    - started_at
    - id
  - name: idx_ops_job_execution_model_ranking_scope_started
    columns:
    - tenant_id
    - organization_id
    - status
    - job_type
    - job_name
    - started_at
    - id
  - name: idx_ops_job_execution_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: cloudrouter-ops-runtime
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: cloudrouter-ops-runtime
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
- table: ops_metric_snapshot
  domain: ops
  profile: read_model
  compliance_level: L2
  system_of_record: false
  write_owner: cloudrouter-ops-runtime
  common_columns: projection
  api_surfaces:
  - app
  - backend
  - worker
  frontend_routes:
  - /admin/dashboard
  - /admin/monitor
  - /console/dashboard
  columns:
    metric_scope: enum_int32
    metric_name: string(128)
    metric_period: enum_int32
    period_start: instant
    period_end: instant
    dimension_key: string(128)
    dimension_value: string(256)
    metric_value: decimal
    metric_unit: string(64)
    payload: json
  required_columns:
  - metric_scope
  - metric_name
  - metric_period
  - period_start
  - dimension_key
  - dimension_value
  - metric_value
  - source_version
  source_tables:
  - ai_usage
  - ai_request_trace
  - ops_gateway_instance
  - ops_gateway_heartbeat
  unique_constraints:
  - name: uk_ops_metric_snapshot
    columns:
    - tenant_id
    - organization_id
    - metric_scope
    - metric_name
    - metric_period
    - period_start
    - dimension_key
    - dimension_value
  indexes:
  - name: idx_ops_metric_snapshot_name_period
    columns:
    - tenant_id
    - organization_id
    - metric_name
    - period_start
    - id
  - name: idx_ops_metric_snapshot_scope_period
    columns:
    - tenant_id
    - organization_id
    - metric_scope
    - metric_period
    - period_start
    - id
  check_constraints:
  - name: ck_ops_metric_snapshot_period_interval
    expression: period_end IS NULL OR period_end > period_start
  semantic_contracts:
    projection_lineage:
      watermark:
        field: period_start
        strategy: high_watermark
      source_version:
        field: source_version
        strategy: max_source_version
      algorithm_version: ops-metric-snapshot-v1
      freshness:
        target_seconds: 60
        max_staleness_seconds: 300
      rebuild:
        strategy: full_recompute
        owner: cloudrouter-ops-runtime
      aggregation_grain:
      - tenant_id
      - organization_id
      - metric_scope
      - metric_name
      - metric_period
      - period_start
      - dimension_key
      - dimension_value
