      AND reasoning_tokens >= 0
      AND total_tokens >= 0
      AND (cost_amount IS NULL OR cost_amount >= 0)
      AND (usage_fact_id IS NULL OR usage_fact_id > 0)
  - name: ck_ai_runtime_usage_link_usage_type
    expression: length(trim(usage_type)) > 0
  - name: ck_ai_runtime_usage_link_currency
    expression: currency IS NULL OR length(trim(currency)) BETWEEN 3 AND 10
  indexes:
  - name: idx_ai_runtime_usage_link_message
    columns:
    - tenant_id
    - organization_id
    - user_id
    - message_id
    - occurred_at
    - id
  - name: idx_ai_runtime_usage_link_invocation
    columns:
    - tenant_id
    - organization_id
    - user_id
    - runtime_invocation_id
    - occurred_at
    - id
  - name: idx_ai_runtime_usage_link_usage_fact
    columns:
    - tenant_id
    - organization_id
    - user_id
    - usage_fact_id
    - id
