    conversation_id:
      type: int64
      constraints: NOT NULL
    turn_id:
      type: int64
      constraints: NOT NULL
    runtime_invocation_id: int64
    snapshot_no:
      type: int64
      constraints: NOT NULL
    strategy:
      type: string(64)
      constraints: NOT NULL
    included_item_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    excluded_item_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    included_memory_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    excluded_memory_ids:
      type: json
      constraints: NOT NULL DEFAULT '[]'::jsonb
    memory_pack:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    memory_token_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    provider_conversation_id: string(128)
    previous_response_id: string(128)
    input_token_estimate:
      type: int64
      constraints: NOT NULL DEFAULT 0
    truncation_reason: string(128)
    context_json:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
  required_columns:
  - user_id
  - conversation_id
  - turn_id
  - snapshot_no
  - strategy
  - included_item_ids
  - excluded_item_ids
  - included_memory_ids
  - excluded_memory_ids
  - memory_pack
  - memory_token_count
  - input_token_estimate
  - context_json
  unique_constraints:
  - name: uk_ai_chat_context_snapshot_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_chat_context_snapshot_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  - name: uk_ai_chat_context_snapshot_scope_turn_no
    columns:
    - tenant_id
    - organization_id
    - user_id
    - turn_id
    - snapshot_no
  foreign_keys:
  - name: fk_ai_chat_context_snapshot_turn
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_id
    references_table: ai_chat_turn
    references_columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - id
    on_delete: CASCADE
  - name: fk_ai_chat_context_snapshot_invocation
    columns:
    - tenant_id
    - organization_id
    - user_id
    - runtime_invocation_id
    references_table: ai_runtime_invocation
    references_columns:
    - tenant_id
    - organization_id
    - user_id
    - id
    on_delete: RESTRICT
  check_constraints:
  - name: ck_ai_chat_context_snapshot_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_chat_context_snapshot_status
    expression: status IN ('active', 'superseded', 'deleted')
  - name: ck_ai_chat_context_snapshot_values
    expression: snapshot_no > 0
      AND memory_token_count >= 0
      AND input_token_estimate >= 0
      AND length(trim(strategy)) > 0
  indexes:
  - name: idx_ai_chat_context_snapshot_conversation_created
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - created_at
    - id
  - name: idx_ai_chat_context_snapshot_invocation
    columns:
    - tenant_id
    - organization_id
    - user_id
    - runtime_invocation_id
    - id

