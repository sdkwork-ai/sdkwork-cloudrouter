tables:
- table: ai_chat_conversation
  domain: ai
  profile: user_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: user_runtime_entity
  api_surfaces:
  - app
  - worker
  columns:
    data_scope:
      type: int32
      constraints: NOT NULL DEFAULT 1
    status:
      type: string(32)
      constraints: NOT NULL DEFAULT 'active'
    version:
      type: int64
      constraints: NOT NULL DEFAULT 0
    deleted_at: instant
    deleted_by: int64
    conversation_code:
      type: string(64)
      constraints: NOT NULL
    title:
      type: string(256)
      constraints: NOT NULL
    source_surface:
      type: string(64)
      constraints: NOT NULL DEFAULT 'chat'
    default_provider: string(128)
    default_model: string(128)
    agent_id: string(128)
    agent_session_id: string(128)
    memory_space_id: string(128)
    last_message_preview: string(1024)
    message_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    turn_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    item_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    input_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    output_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    cached_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    reasoning_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    cost_amount_total:
      type: decimal
      constraints: NOT NULL DEFAULT 0
    currency: string(10)
    last_turn_id: int64
    last_item_id: int64
  required_columns:
  - user_id
  - conversation_code
  - title
  - source_surface
  unique_constraints:
  - name: uk_ai_chat_conversation_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_chat_conversation_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  - name: uk_ai_chat_conversation_scope_code
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_code
  check_constraints:
  - name: ck_ai_chat_conversation_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_chat_conversation_status
    expression: status IN ('active', 'archived', 'deleted')
  - name: ck_ai_chat_conversation_non_negative_counts
    expression: message_count >= 0
      AND turn_count >= 0
      AND item_count >= 0
      AND input_token_total >= 0
      AND output_token_total >= 0
      AND cached_token_total >= 0
      AND reasoning_token_total >= 0
      AND cost_amount_total >= 0
      AND version >= 0
  - name: ck_ai_chat_conversation_last_ids
    expression: (last_turn_id IS NULL OR last_turn_id > 0)
      AND (last_item_id IS NULL OR last_item_id > 0)
  - name: ck_ai_chat_conversation_currency
    expression: currency IS NULL OR length(trim(currency)) BETWEEN 3 AND 10
  indexes:
  - name: idx_ai_chat_conversation_user_status_updated
    columns:
    - tenant_id
    - organization_id
    - user_id
    - status
    - updated_at
    - id

- table: ai_chat_turn
  domain: ai
  profile: user_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: user_runtime_entity
  api_surfaces:
  - app
  - worker
  columns:
    conversation_id:
      type: int64
      constraints: NOT NULL
    turn_no:
      type: int64
      constraints: NOT NULL
    mode: string(64)
    status:
      type: string(32)
      constraints: NOT NULL DEFAULT 'queued'
    completed_at: instant
    provider: string(128)
    model: string(128)
    agent_id: string(128)
    agent_session_id: string(128)
    final_output_item_id: int64
    input_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    output_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    cached_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    reasoning_token_total:
      type: int64
      constraints: NOT NULL DEFAULT 0
    cost_amount: decimal
    currency: string(10)
    response_snapshot: json
    usage_snapshot: json
    context_snapshot_id: int64
    context_snapshot_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
  required_columns:
  - user_id
  - conversation_id
  - turn_no
  unique_constraints:
  - name: uk_ai_chat_turn_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_chat_turn_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  - name: uk_ai_chat_turn_scope_conversation_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - id
  - name: uk_ai_chat_turn_scope_conversation_no
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_no
  foreign_keys:
  - name: fk_ai_chat_turn_conversation
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    references_table: ai_chat_conversation
    references_columns:
    - tenant_id
    - organization_id
    - user_id
    - id
    on_delete: CASCADE
  check_constraints:
  - name: ck_ai_chat_turn_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_chat_turn_status
    expression: status IN ('queued', 'running', 'streaming', 'requires_action', 'completed', 'failed', 'cancelled', 'deleted')
  - name: ck_ai_chat_turn_non_negative_values
    expression: turn_no > 0
      AND input_token_total >= 0
      AND output_token_total >= 0
      AND cached_token_total >= 0
      AND reasoning_token_total >= 0
      AND (cost_amount IS NULL OR cost_amount >= 0)
      AND context_snapshot_count >= 0
      AND (final_output_item_id IS NULL OR final_output_item_id > 0)
      AND (context_snapshot_id IS NULL OR context_snapshot_id > 0)
  - name: ck_ai_chat_turn_currency
    expression: currency IS NULL OR length(trim(currency)) BETWEEN 3 AND 10
  indexes:
  - name: idx_ai_chat_turn_conversation_created
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - created_at
    - id
  - name: idx_ai_chat_turn_conversation_status
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - status
    - updated_at
    - id

- table: ai_chat_item
  domain: ai
  profile: user_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: user_runtime_entity
  api_surfaces:
  - app
  - worker
  columns:
    conversation_id:
      type: int64
      constraints: NOT NULL
    turn_id:
      type: int64
      constraints: NOT NULL
    sequence_no:
      type: int64
      constraints: NOT NULL
    item_type:
      type: string(64)
      constraints: NOT NULL
    role: string(32)
    direction:
      type: string(16)
      constraints: NOT NULL
    status:
      type: string(32)
      constraints: NOT NULL
    content_text: text
    content_json: json
    provider: string(128)
    model: string(128)
    runtime_invocation_id: string(128)
    completed_at: instant
  required_columns:
  - user_id
  - conversation_id
  - turn_id
  - sequence_no
  - item_type
  - direction
  - status
  unique_constraints:
  - name: uk_ai_chat_item_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_chat_item_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  - name: uk_ai_chat_item_scope_turn_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_id
    - id
  - name: uk_ai_chat_item_scope_conversation_sequence
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - sequence_no
  foreign_keys:
  - name: fk_ai_chat_item_turn
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_id
    references_table: ai_chat_turn
    references_columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - id
    on_delete: CASCADE
  check_constraints:
  - name: ck_ai_chat_item_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_chat_item_sequence
    expression: sequence_no > 0
  - name: ck_ai_chat_item_values
    expression: length(trim(item_type)) > 0
      AND direction IN ('input', 'output', 'internal')
      AND (role IS NULL OR role IN ('system', 'developer', 'user', 'assistant', 'tool'))
      AND status IN ('pending', 'running', 'streaming', 'completed', 'failed', 'cancelled', 'deleted')
  indexes:
  - name: idx_ai_chat_item_turn_direction_status
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - turn_id
    - direction
    - role
    - status
    - sequence_no
    - id

