- table: ai_runtime_invocation
  domain: ai
  profile: user_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: user_runtime_entity
  api_surfaces:
  - app
  - worker
  columns:
    conversation_id: string(128)
    chat_turn_id: string(128)
    chat_item_id: string(128)
    agent_session_id: string(128)
    agent_run_id: string(128)
    agent_run_step_id: string(128)
    invocation_no:
      type: int64
      constraints: NOT NULL
    invocation_type:
      type: string(128)
      constraints: NOT NULL
    runtime:
      type: string(128)
      constraints: NOT NULL
    endpoint: string(128)
    attempt_no:
      type: int64
      constraints: NOT NULL DEFAULT 1
    status:
      type: string(32)
      constraints: NOT NULL DEFAULT 'running'
    request_id: string(128)
    trace_id: string(128)
    provider_response_id: string(128)
    provider_session_id: string(128)
    provider_conversation_id: string(128)
    provider_step_id: string(128)
    model: string(128)
    provider: string(128)
    tool_name: string(128)
    tool_call_id: string(128)
    cwd: string(2048)
    sandbox_policy: string(128)
    approval_policy: string(128)
    permission_mode: string(128)
    streaming:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    started_at:
      type: instant
      constraints: NOT NULL
    completed_at: instant
    latency_ms: int64
    ttft_ms: int64
    exit_code: int64
    finish_reason: string(128)
    error_type: string(128)
    error_code: string(128)
    error_message_masked: string(1024)
    request_json:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    response_json: json
    usage_json: json
  required_columns:
  - user_id
  - invocation_no
  - invocation_type
  - runtime
  - status
  - started_at
  - request_json
  unique_constraints:
  - name: uk_ai_runtime_invocation_scope_id
    columns:
    - tenant_id
    - organization_id
    - user_id
    - id
  - name: uk_ai_runtime_invocation_scope_uuid
    columns:
    - tenant_id
    - organization_id
    - user_id
    - uuid
  check_constraints:
  - name: ck_ai_runtime_invocation_subject_scope
    expression: tenant_id > 0 AND organization_id >= 0 AND user_id > 0
  - name: ck_ai_runtime_invocation_sequence
    expression: invocation_no > 0 AND attempt_no > 0
  - name: ck_ai_runtime_invocation_status
    expression: status IN ('pending', 'running', 'streaming', 'completed', 'failed', 'cancelled')
  - name: ck_ai_runtime_invocation_runtime
    expression: length(trim(invocation_type)) > 0 AND length(trim(runtime)) > 0
  - name: ck_ai_runtime_invocation_metrics
    expression: (latency_ms IS NULL OR latency_ms >= 0)
      AND (ttft_ms IS NULL OR ttft_ms >= 0)
  indexes:
  - name: idx_ai_runtime_invocation_user_created
    columns:
    - tenant_id
    - organization_id
    - user_id
    - created_at
    - id
  - name: idx_ai_runtime_invocation_chat_created
    columns:
    - tenant_id
    - organization_id
    - user_id
    - conversation_id
    - chat_turn_id
    - created_at
    - id
  - name: idx_ai_runtime_invocation_runtime_status
    columns:
    - tenant_id
    - organization_id
    - user_id
    - runtime
    - status
    - created_at
    - id

