tables:
# Storage-center governance plane.
#
# `/backend/v3/api/storage/*` reads and writes these tables. They were consumed
# by the router service without ever being declared in the schema registry, so
# every request failed at SQL prepare time with `relation does not exist` and the
# console surfaced HTTP 500. They are Cloud Router-owned governance records (the
# provider *account* catalog itself stays IAM-owned, and object bytes stay
# Drive-owned); `storage_provider`/`storage_bucket` only carry the bucket
# reference a default-bucket policy resolves through.
- table: storage_provider
  domain: storage
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/storage/defaultBuckets
  columns:
    name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    supplier_code:
      type: string(64)
      constraints: NOT NULL
    provider_type:
      type: string(64)
      constraints: NOT NULL
    endpoint_url:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
    region:
      type: string(64)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - supplier_code
  - provider_type
  unique_constraints:
  - name: uk_storage_provider_scope_code
    columns:
    - tenant_id
    - organization_id
    - supplier_code
  check_constraints:
  - name: ck_storage_provider_scope
    expression: tenant_id >= 0 AND organization_id >= 0
  - name: ck_storage_provider_values
    expression: length(supplier_code) > 0
      AND length(provider_type) > 0
      AND length(endpoint_url) <= 512
      AND length(region) <= 64
  indexes:
  - name: ix_storage_provider_scope_status
    columns:
    - tenant_id
    - organization_id
    - status
    - supplier_code

- table: storage_bucket
  domain: storage
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/storage/defaultBuckets
  columns:
    provider_id:
      type: int64
      constraints: NOT NULL
    bucket_name:
      type: string(128)
      constraints: NOT NULL
    bucket_region:
      type: string(64)
      constraints: NOT NULL DEFAULT ''
    logical_scope:
      type: string(64)
      constraints: NOT NULL
  required_columns:
  - provider_id
  - bucket_name
  - logical_scope
  unique_constraints:
  - name: uk_storage_bucket_scope_name
    columns:
    - tenant_id
    - organization_id
    - provider_id
    - bucket_name
  check_constraints:
  - name: ck_storage_bucket_scope
    expression: tenant_id >= 0 AND organization_id >= 0 AND provider_id > 0
  - name: ck_storage_bucket_values
    expression: length(bucket_name) > 0
      AND length(logical_scope) > 0
      AND length(bucket_region) <= 64
  indexes:
  - name: ix_storage_bucket_scope_scope
    columns:
    - tenant_id
    - organization_id
    - logical_scope
    - bucket_name

- table: storage_default_bucket_policy
  domain: storage
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/storage/defaultBuckets
  columns:
    logical_scope:
      type: string(64)
      constraints: NOT NULL
    bucket_id:
      type: int64
      constraints: NOT NULL
    bucket_logical_scope:
      type: string(64)
      constraints: NOT NULL
    updated_by:
      type: int64
      constraints: NOT NULL DEFAULT 0
    reason:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
    request_id:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - logical_scope
  - bucket_id
  - bucket_logical_scope
  unique_constraints:
  - name: uk_storage_default_bucket_scope
    columns:
    - tenant_id
    - organization_id
    - logical_scope
  check_constraints:
  - name: ck_storage_default_bucket_scope
    expression: tenant_id >= 0 AND organization_id >= 0
  - name: ck_storage_default_bucket_values
    expression: length(logical_scope) > 0
      AND length(bucket_logical_scope) > 0
      AND bucket_id > 0
      AND length(reason) <= 512
  indexes:
  - name: ix_storage_default_bucket_scope_updated
    columns:
    - tenant_id
    - organization_id
    - status
    - updated_at

- table: storage_quota_policy
  domain: storage
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/storage/quotas
  columns:
    scope_type:
      type: string(32)
      constraints: NOT NULL
    scope_id:
      type: string(128)
      constraints: NOT NULL
    quota_limit_bytes:
      type: int64
      constraints: NOT NULL
    single_file_limit_bytes:
      type: int64
    enforcement:
      type: string(16)
      constraints: NOT NULL DEFAULT 'hard'
    idempotency_key:
      type: string(128)
      constraints: NOT NULL
    request_id:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - scope_type
  - scope_id
  - quota_limit_bytes
  - idempotency_key
  unique_constraints:
  - name: uk_storage_quota_policy_scope
    columns:
    - tenant_id
    - organization_id
    - scope_type
    - scope_id
  - name: uk_storage_quota_policy_idempotency
    columns:
    - tenant_id
    - organization_id
    - idempotency_key
  check_constraints:
  - name: ck_storage_quota_policy_scope
    expression: tenant_id >= 0 AND organization_id >= 0
  - name: ck_storage_quota_policy_values
    expression: quota_limit_bytes >= 0
      AND (single_file_limit_bytes IS NULL OR single_file_limit_bytes >= 0)
      AND enforcement IN ('hard', 'soft')
      AND length(scope_type) > 0
      AND length(scope_id) > 0
  indexes:
  - name: ix_storage_quota_policy_scope_status
    columns:
    - tenant_id
    - organization_id
    - scope_type
    - status
    - id

- table: storage_usage_counter
  domain: storage
  profile: operational_state
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: operational_state
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/storage/usage
  columns:
    scope_type:
      type: string(32)
      constraints: NOT NULL
    scope_id:
      type: string(128)
      constraints: NOT NULL
    used_logical_bytes:
      type: int64
      constraints: NOT NULL DEFAULT 0
    reserved_bytes:
      type: int64
      constraints: NOT NULL DEFAULT 0
    file_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    version:
      type: int64
      constraints: NOT NULL DEFAULT 0
  required_columns:
  - scope_type
  - scope_id
  unique_constraints:
  - name: uk_storage_usage_counter_scope
    columns:
    - tenant_id
    - organization_id
    - scope_type
    - scope_id
  check_constraints:
  - name: ck_storage_usage_counter_scope
    expression: tenant_id >= 0 AND organization_id >= 0
  - name: ck_storage_usage_counter_values
    expression: used_logical_bytes >= 0
      AND reserved_bytes >= 0
      AND file_count >= 0
      AND length(scope_type) > 0
      AND length(scope_id) > 0
  indexes:
  - name: ix_storage_usage_counter_scope_id
    columns:
    - tenant_id
    - organization_id
    - scope_type
    - id

- table: storage_reconciliation_run
  domain: storage
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/storage/reconciliation
  columns:
    id:
      type: int64
      constraints: NOT NULL PRIMARY KEY
    uuid:
      type: string(64)
      constraints: NOT NULL
    tenant_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    organization_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    provider_id:
      type: int64
    bucket_id:
      type: int64
    run_type:
      type: string(32)
      constraints: NOT NULL
    dry_run:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    requested_by:
      type: int64
      constraints: NOT NULL DEFAULT 0
    idempotency_key:
      type: string(128)
      constraints: NOT NULL
    request_id:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    summary_json:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    status:
      type: int32
      constraints: NOT NULL DEFAULT 1
    missing_object_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    orphan_object_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    checksum_mismatch_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    started_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    completed_at:
      type: instant
    created_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
  required_columns:
  - run_type
  - idempotency_key
  unique_constraints:
  - name: uk_storage_reconciliation_run_idempotency
    columns:
    - tenant_id
    - organization_id
    - idempotency_key
  check_constraints:
  - name: ck_storage_reconciliation_run_scope
    expression: tenant_id >= 0 AND organization_id >= 0
  - name: ck_storage_reconciliation_run_values
    expression: missing_object_count >= 0
      AND orphan_object_count >= 0
      AND checksum_mismatch_count >= 0
      AND length(run_type) > 0
  indexes:
  - name: ix_storage_reconciliation_run_scope_created
    columns:
    - tenant_id
    - organization_id
    - status
    - id
  - name: ix_storage_reconciliation_run_uuid
    columns:
    - uuid

- table: storage_gc_job
  domain: storage
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/storage/garbageCollection
  columns:
    id:
      type: int64
      constraints: NOT NULL PRIMARY KEY
    uuid:
      type: string(64)
      constraints: NOT NULL
    tenant_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    organization_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    job_type:
      type: string(32)
      constraints: NOT NULL
    dry_run:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    requested_by:
      type: int64
      constraints: NOT NULL DEFAULT 0
    idempotency_key:
      type: string(128)
      constraints: NOT NULL
    request_id:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    criteria_json:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    result_json:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    candidate_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    status:
      type: int32
      constraints: NOT NULL DEFAULT 1
    created_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    completed_at:
      type: instant
  required_columns:
  - job_type
  - idempotency_key
  unique_constraints:
  - name: uk_storage_gc_job_idempotency
    columns:
    - tenant_id
    - organization_id
    - idempotency_key
  check_constraints:
  - name: ck_storage_gc_job_scope
    expression: tenant_id >= 0 AND organization_id >= 0
  - name: ck_storage_gc_job_values
    expression: candidate_count >= 0 AND length(job_type) > 0
  indexes:
  - name: ix_storage_gc_job_scope_created
    columns:
    - tenant_id
    - organization_id
    - status
    - id
  - name: ix_storage_gc_job_uuid
    columns:
    - uuid
