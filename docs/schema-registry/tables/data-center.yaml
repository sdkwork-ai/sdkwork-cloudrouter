tables:
# Data-center capability plane.
#
# `/backend/v3/api/datacenter/*` is the admin "数据中心" (Data Center) surface.
# It owns the governance records a deployment can observe: data sources with
# write-only credentials, connectivity history, landed table and dataset
# catalogs, governed export jobs, and the data-access audit trail.
#
# External database connections are read-only data sources, and the landed data
# itself lives in a Data Center-owned schema so quota, retention, and cleanup
# never touch gateway, routing, or billing tables.
- table: dc_workspace
  domain: data
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/overview
  columns:
    name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    description:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
    storage_quota_bytes:
      type: int64
      constraints: NOT NULL DEFAULT 5368709120
    instance_concurrency_quota:
      type: int32
      constraints: NOT NULL DEFAULT 4
    daily_export_row_quota:
      type: int64
      constraints: NOT NULL DEFAULT 10000
    audit_retention_days:
      type: int32
      constraints: NOT NULL DEFAULT 30
  required_columns:
  - name
  unique_constraints:
  - name: uk_dc_workspace_scope_name
    columns:
    - tenant_id
    - organization_id
    - name
  indexes:
  - name: idx_dc_workspace_scope_status
    columns:
    - tenant_id
    - organization_id
    - status
    - id
  lifecycle:
    storage_strategy: live_state

- table: dc_data_source
  domain: data
  profile: tenant_entity
  compliance_level: L3
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/sources
  columns:
    name:
      type: string(128)
      constraints: NOT NULL
    source_kind:
      type: string(32)
      constraints: NOT NULL
    endpoint_host:
      type: string(256)
      constraints: NOT NULL DEFAULT ''
    endpoint_port:
      type: int32
      constraints: NOT NULL DEFAULT 0
    database_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    username:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    secret_version:
      type: int32
      constraints: NOT NULL DEFAULT 0
    ssl_mode:
      type: string(16)
      constraints: NOT NULL DEFAULT 'prefer'
    read_only:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    health:
      type: string(16)
      constraints: NOT NULL DEFAULT 'unknown'
    table_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    last_tested_at:
      type: instant
    last_test_error:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
    owner_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - name
  - source_kind
  unique_constraints:
  - name: uk_dc_data_source_scope_name
    columns:
    - tenant_id
    - organization_id
    - name
  check_constraints:
  - name: ck_dc_data_source_kind
    expression: source_kind IN ('postgresql', 'mysql', 'platform', 'file')
  - name: ck_dc_data_source_health
    expression: health IN ('unknown', 'healthy', 'warning', 'error')
  - name: ck_dc_data_source_values
    expression: length(name) > 0
      AND length(endpoint_host) <= 256
      AND endpoint_port >= 0
      AND endpoint_port <= 65535
      AND table_count >= 0
      AND secret_version >= 0
  indexes:
  - name: idx_dc_data_source_scope_health
    columns:
    - tenant_id
    - organization_id
    - health
    - id
  lifecycle:
    storage_strategy: live_state

- table: dc_data_source_credential
  domain: data
  profile: tenant_entity
  compliance_level: L3
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/sources
  columns:
    data_source_id:
      type: int64
      constraints: NOT NULL
    secret_version:
      type: int32
      constraints: NOT NULL
    secret_ciphertext:
      type: text
      constraints: NOT NULL DEFAULT ''
    secret_digest:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    rotated_at:
      type: instant
  required_columns:
  - data_source_id
  - secret_ciphertext
  - secret_digest
  unique_constraints:
  - name: uk_dc_data_source_credential_version
    columns:
    - tenant_id
    - organization_id
    - data_source_id
    - secret_version
  check_constraints:
  - name: ck_dc_data_source_credential_values
    expression: data_source_id > 0 AND secret_version >= 1
  indexes:
  - name: idx_dc_data_source_credential_source
    columns:
    - tenant_id
    - organization_id
    - data_source_id
    - created_at
  lifecycle:
    storage_strategy: live_state

- table: dc_data_source_test_log
  domain: data
  profile: event_log
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: event_log
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/sources
  columns:
    data_source_id:
      type: int64
      constraints: NOT NULL
    stage:
      type: string(32)
      constraints: NOT NULL DEFAULT 'connect'
    result:
      type: string(16)
      constraints: NOT NULL
    latency_ms:
      type: int64
      constraints: NOT NULL DEFAULT 0
  required_columns:
  - data_source_id
  - result
  unique_constraints: []
  check_constraints:
  - name: ck_dc_data_source_test_log_result
    expression: result IN ('success', 'failure')
  - name: ck_dc_data_source_test_log_values
    expression: data_source_id > 0 AND latency_ms >= 0
  indexes:
  - name: idx_dc_data_source_test_log_source
    columns:
    - tenant_id
    - organization_id
    - data_source_id
    - created_at
    - id
  - name: idx_dc_data_source_test_log_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: router-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: router-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true

- table: dc_table
  domain: data
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/tables
  columns:
    table_key:
      type: string(128)
      constraints: NOT NULL
    display_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    table_kind:
      type: string(16)
      constraints: NOT NULL DEFAULT 'landed'
    data_source_id:
      type: int64
    physical_schema:
      type: string(64)
      constraints: NOT NULL DEFAULT 'dc_data'
    physical_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    row_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    column_count:
      type: int32
      constraints: NOT NULL DEFAULT 0
    storage_bytes:
      type: int64
      constraints: NOT NULL DEFAULT 0
    owner_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    description:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
    last_landed_at:
      type: instant
  required_columns:
  - table_key
  - table_kind
  unique_constraints:
  - name: uk_dc_table_scope_key
    columns:
    - tenant_id
    - organization_id
    - table_key
  check_constraints:
  - name: ck_dc_table_kind
    expression: table_kind IN ('landed', 'external', 'view')
  - name: ck_dc_table_values
    expression: length(table_key) > 0
      AND row_count >= 0
      AND column_count >= 0
      AND storage_bytes >= 0
  indexes:
  - name: idx_dc_table_scope_kind
    columns:
    - tenant_id
    - organization_id
    - table_kind
    - updated_at
    - id
  lifecycle:
    storage_strategy: live_state

- table: dc_table_column
  domain: data
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/tables
  columns:
    table_id:
      type: int64
      constraints: NOT NULL
    column_name:
      type: string(128)
      constraints: NOT NULL
    data_type:
      type: string(64)
      constraints: NOT NULL
    nullable:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    ordinal:
      type: int32
      constraints: NOT NULL DEFAULT 0
    is_primary_key:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    sensitivity:
      type: string(16)
      constraints: NOT NULL DEFAULT 'public'
    description:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - table_id
  - column_name
  - data_type
  unique_constraints:
  - name: uk_dc_table_column_name
    columns:
    - tenant_id
    - organization_id
    - table_id
    - column_name
  check_constraints:
  - name: ck_dc_table_column_sensitivity
    expression: sensitivity IN ('public', 'internal', 'confidential', 'restricted')
  - name: ck_dc_table_column_values
    expression: table_id > 0 AND length(column_name) > 0 AND ordinal >= 0
  indexes:
  - name: idx_dc_table_column_table
    columns:
    - tenant_id
    - organization_id
    - table_id
    - ordinal
  lifecycle:
    storage_strategy: live_state

- table: dc_dataset
  domain: data
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/datasets
  columns:
    dataset_key:
      type: string(128)
      constraints: NOT NULL
    display_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    table_id:
      type: int64
    row_filter:
      type: string(1024)
      constraints: NOT NULL DEFAULT ''
    lifecycle_state:
      type: string(16)
      constraints: NOT NULL DEFAULT 'draft'
    owner_name:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    description:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - dataset_key
  unique_constraints:
  - name: uk_dc_dataset_scope_key
    columns:
    - tenant_id
    - organization_id
    - dataset_key
  check_constraints:
  - name: ck_dc_dataset_state
    expression: lifecycle_state IN ('draft', 'published', 'retired')
  - name: ck_dc_dataset_values
    expression: length(dataset_key) > 0
  indexes:
  - name: idx_dc_dataset_scope_state
    columns:
    - tenant_id
    - organization_id
    - lifecycle_state
    - updated_at
    - id
  lifecycle:
    storage_strategy: live_state

- table: dc_dataset_field
  domain: data
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/datasets
  columns:
    dataset_id:
      type: int64
      constraints: NOT NULL
    field_name:
      type: string(128)
      constraints: NOT NULL
    alias:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    semantic:
      type: string(64)
      constraints: NOT NULL DEFAULT ''
    ordinal:
      type: int32
      constraints: NOT NULL DEFAULT 0
    sensitive:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
  required_columns:
  - dataset_id
  - field_name
  unique_constraints:
  - name: uk_dc_dataset_field_name
    columns:
    - tenant_id
    - organization_id
    - dataset_id
    - field_name
  check_constraints:
  - name: ck_dc_dataset_field_values
    expression: dataset_id > 0 AND length(field_name) > 0 AND ordinal >= 0
  indexes:
  - name: idx_dc_dataset_field_dataset
    columns:
    - tenant_id
    - organization_id
    - dataset_id
    - ordinal
  lifecycle:
    storage_strategy: live_state

- table: dc_export_job
  domain: data
  profile: tenant_entity
  compliance_level: L3
  system_of_record: true
  write_owner: router-service
  common_columns: tenant_entity
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/exports
  columns:
    dataset_id:
      type: int64
    dataset_name:
      type: string(128)
      constraints: NOT NULL
    export_format:
      type: string(16)
      constraints: NOT NULL DEFAULT 'csv'
    purpose:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
    export_status:
      type: string(24)
      constraints: NOT NULL DEFAULT 'pending_approval'
    row_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    requested_by:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    approved_by:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    expires_at:
      type: instant
    completed_at:
      type: instant
    failure_reason:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - dataset_name
  - export_status
  unique_constraints: []
  check_constraints:
  - name: ck_dc_export_job_status
    expression: export_status IN ('pending_approval', 'running', 'succeeded', 'failed', 'expired')
  - name: ck_dc_export_job_format
    expression: export_format IN ('csv', 'xlsx')
  - name: ck_dc_export_job_values
    expression: row_count >= 0 AND length(dataset_name) > 0
  indexes:
  - name: idx_dc_export_job_scope_status
    columns:
    - tenant_id
    - organization_id
    - export_status
    - created_at
    - id
  lifecycle:
    storage_strategy: live_state

- table: dc_audit_log
  domain: data
  profile: event_log
  compliance_level: L3
  system_of_record: true
  write_owner: router-service
  common_columns: event_log
  soft_delete_policy: null
  api_surfaces:
  - backend
  frontend_routes:
  - /admin/data/audits
  columns:
    actor:
      type: string(128)
      constraints: NOT NULL DEFAULT ''
    audit_action:
      type: string(24)
      constraints: NOT NULL
    object_type:
      type: string(32)
      constraints: NOT NULL DEFAULT ''
    object_key:
      type: string(256)
      constraints: NOT NULL DEFAULT ''
    row_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    audit_result:
      type: string(16)
      constraints: NOT NULL
    detail:
      type: string(512)
      constraints: NOT NULL DEFAULT ''
  required_columns:
  - audit_action
  - audit_result
  unique_constraints: []
  check_constraints:
  - name: ck_dc_audit_log_action
    expression: audit_action IN ('connect', 'query', 'download', 'ddl', 'dml', 'publish', 'approve', 'rollback')
  - name: ck_dc_audit_log_result
    expression: audit_result IN ('success', 'failure')
  - name: ck_dc_audit_log_values
    expression: row_count >= 0
  indexes:
  - name: idx_dc_audit_log_scope_created
    columns:
    - tenant_id
    - organization_id
    - created_at
    - id
  - name: idx_dc_audit_log_retention
    columns:
    - retention_until
    - id
  lifecycle:
    storage_strategy: indexed_append_only
    retention:
      online_retention: 12mo
      archive_retention: 5y
      grace_period: 24h
    cleanup:
      owner: router-service
      scope: platform_cross_tenant
      authorization:
        mode: service_identity
        service: router-service
        audit_required: true
      candidate_recheck:
        required: true
        operations:
        - archive
        - delete
        key_columns:
        - tenant_id
        - organization_id
        - id
      batch_size: 1000
      predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
      archive_before_delete: true
      retry:
        max_attempts: 5
        backoff:
          strategy: exponential
          initial: 1s
          maximum: 5m
      monitoring:
        metrics:
        - cleanup_candidates
        - cleanup_archived
        - cleanup_deleted
        - cleanup_skipped_legal_hold
        - cleanup_failures
        alerts:
        - retention_lag
        - retry_exhausted
      dry_run:
        supported: true
        default: true
