x-billing-fact-lifecycle: &billing_fact_lifecycle
  storage_strategy: indexed_append_only
  retention: { online_retention: 12mo, archive_retention: 7y, grace_period: 24h }
  cleanup:
    owner: cloudrouter-billing-retention-service
    scope: platform_cross_tenant
    authorization: { mode: service_identity, service: cloudrouter-billing-retention-service, audit_required: true }
    candidate_recheck:
      required: true
      operations: [archive, delete]
      key_columns: [tenant_id, organization_id, id]
    batch_size: 1000
    predicate: "retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false"
    archive_before_delete: true
    retry:
      max_attempts: 5
      backoff: { strategy: exponential, initial: 1s, maximum: 5m }
    monitoring:
      metrics: [cleanup_candidates, cleanup_archived, cleanup_deleted, cleanup_failures]
      alerts: [retention_lag, retry_exhausted]
    dry_run: { supported: true, default: true }

tables:
- table: cloudrouter_pricing_plan
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: cloudrouter-rating-service
  common_columns: tenant_entity
  columns:
    plan_code: { type: string(96), constraints: NOT NULL }
    plan_name: { type: string(256), constraints: NOT NULL }
    base_price_side: { type: string(32), constraints: NOT NULL }
    currency_code: { type: string(10), constraints: NOT NULL }
    fallback_policy: { type: string(32), constraints: NOT NULL }
    rounding_mode: { type: string(32), constraints: NOT NULL }
    minimum_charge_amount: { type: decimal, constraints: NOT NULL }
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
  unique_constraints:
  - { name: uk_cloudrouter_pricing_plan_uuid, columns: [uuid] }
  - { name: uk_cloudrouter_pricing_plan_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_cloudrouter_pricing_plan_code, columns: [tenant_id, organization_id, plan_code] }
  check_constraints:
  - { name: ck_cloudrouter_pricing_plan_minimum, expression: minimum_charge_amount >= 0 }
  - { name: ck_cloudrouter_pricing_plan_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  - name: ck_cloudrouter_pricing_plan_base_side
    expression: base_price_side IN ('official_reference', 'upstream_cost', 'customer_charge', 'internal_transfer')
  - { name: ck_cloudrouter_pricing_plan_fallback, expression: fallback_policy = 'fail_closed' }
  - name: ck_cloudrouter_pricing_plan_rounding
    expression: rounding_mode IN ('half_up', 'half_even', 'up', 'down')
  - { name: ck_cloudrouter_pricing_plan_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  indexes:
  - { name: uq_cloudrouter_pricing_plan_scope_reference, columns: [tenant_id, organization_id, id], unique: true }

- table: cloudrouter_pricing_rule
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: cloudrouter-rating-service
  common_columns: tenant_entity
  columns:
    pricing_plan_id: { type: int64, constraints: NOT NULL }
    rule_code: { type: string(96), constraints: NOT NULL }
    product_code: string(160)
    operation_code: string(160)
    meter_code: string(96)
    provider_code: string(64)
    region_code: string(64)
    catalog_key: string(256)
    formula_mode: { type: string(32), constraints: NOT NULL }
    multiplier: { type: decimal, constraints: NOT NULL }
    markup_amount: { type: decimal, constraints: NOT NULL }
    unit_price_override: decimal
    priority: { type: int32, constraints: NOT NULL }
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
  unique_constraints:
  - { name: uk_cloudrouter_pricing_rule_uuid, columns: [uuid] }
  - { name: uk_cloudrouter_pricing_rule_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_cloudrouter_pricing_rule_plan_id, columns: [id, pricing_plan_id] }
  - { name: uk_cloudrouter_pricing_rule_code, columns: [tenant_id, organization_id, pricing_plan_id, rule_code] }
  foreign_keys:
  - { name: fk_cloudrouter_pricing_rule_plan, columns: [tenant_id, organization_id, pricing_plan_id], references_table: cloudrouter_pricing_plan, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - { name: ck_cloudrouter_pricing_rule_amounts, expression: multiplier >= 0 AND markup_amount >= 0 AND (unit_price_override IS NULL OR unit_price_override >= 0) }
  - name: ck_cloudrouter_pricing_rule_formula
    expression: (formula_mode = 'multiplier_markup' AND unit_price_override IS NULL) OR (formula_mode = 'unit_price_override' AND unit_price_override IS NOT NULL AND multiplier = 1 AND markup_amount = 0)
  - { name: ck_cloudrouter_pricing_rule_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  indexes:
  - { name: uq_cloudrouter_pricing_rule_plan_reference, columns: [id, pricing_plan_id], unique: true }
  - { name: uq_cloudrouter_pricing_rule_scope_plan_reference, columns: [tenant_id, organization_id, id, pricing_plan_id], unique: true }
  - { name: idx_cloudrouter_pricing_rule_resolve, columns: [tenant_id, organization_id, pricing_plan_id, product_code, operation_code, meter_code, provider_code, region_code, status, priority, id] }

- table: cloudrouter_account_rate_card
  domain: commerce
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: cloudrouter-rating-service
  common_columns: tenant_entity
  columns:
    subject_type: { type: string(32), constraints: NOT NULL }
    subject_id: int64
    subject_code: string(160)
    pricing_plan_tenant_id: { type: int64, constraints: NOT NULL }
    pricing_plan_organization_id: { type: int64, constraints: NOT NULL }
    pricing_plan_id: { type: int64, constraints: NOT NULL }
    priority: { type: int32, constraints: NOT NULL }
    effective_from: { type: instant, constraints: NOT NULL }
    effective_to: instant
  unique_constraints:
  - { name: uk_cloudrouter_account_rate_card_uuid, columns: [uuid] }
  - { name: uk_cloudrouter_account_rate_card_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_cloudrouter_account_rate_card_subject_id, columns: [tenant_id, organization_id, subject_type, subject_id, pricing_plan_tenant_id, pricing_plan_organization_id, pricing_plan_id], where: subject_id IS NOT NULL AND deleted_at IS NULL }
  - { name: uk_cloudrouter_account_rate_card_subject_code, columns: [tenant_id, organization_id, subject_type, subject_code, pricing_plan_tenant_id, pricing_plan_organization_id, pricing_plan_id], where: subject_code IS NOT NULL AND deleted_at IS NULL }
  foreign_keys:
  - { name: fk_cloudrouter_account_rate_card_plan, columns: [pricing_plan_tenant_id, pricing_plan_organization_id, pricing_plan_id], references_table: cloudrouter_pricing_plan, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - { name: ck_cloudrouter_account_rate_card_subject, expression: (subject_id IS NOT NULL AND subject_code IS NULL) OR (subject_id IS NULL AND subject_code IS NOT NULL) }
  - name: ck_cloudrouter_account_rate_card_subject_type
    expression: subject_type IN ('default', 'api_key', 'account_group', 'account', 'user', 'organization')
  - { name: ck_cloudrouter_account_rate_card_interval, expression: effective_to IS NULL OR effective_to > effective_from }
  indexes:
  - { name: uq_cloudrouter_account_rate_card_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_cloudrouter_account_rate_card_resolve, columns: [tenant_id, organization_id, subject_type, subject_id, status, priority, effective_from, id] }
  - { name: idx_cloudrouter_account_rate_card_code, columns: [tenant_id, organization_id, subject_type, subject_code, status, priority, effective_from, id] }

- table: cloudrouter_usage_measurement
  domain: commerce
  profile: ledger_source_fact
  compliance_level: L3
  system_of_record: true
  write_owner: cloudrouter-metering-service
  common_columns: ledger_source_fact
  columns:
    invocation_id: { type: string(128), constraints: NOT NULL }
    measurement_key: { type: string(160), constraints: NOT NULL }
    api_key_id: int64
    account_id: int64
    product_code: { type: string(160), constraints: NOT NULL }
    operation_code: { type: string(160), constraints: NOT NULL }
    meter_code: { type: string(96), constraints: NOT NULL }
    vendor_code: { type: string(64), constraints: NOT NULL }
    provider_code: string(64)
    region_code: string(64)
    catalog_key: string(256)
    quantity: { type: decimal, constraints: NOT NULL }
    unit_code: { type: string(64), constraints: NOT NULL }
    measurement_source: { type: string(32), constraints: NOT NULL }
    dimensions_json: { type: json, constraints: NOT NULL }
    occurred_at: { type: instant, constraints: NOT NULL }
  unique_constraints:
  - { name: uk_cloudrouter_usage_measurement_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_cloudrouter_usage_measurement_idempotency, columns: [tenant_id, organization_id, idempotency_key] }
  - { name: uk_cloudrouter_usage_measurement_line, columns: [tenant_id, organization_id, invocation_id, measurement_key] }
  check_constraints:
  - { name: ck_cloudrouter_usage_measurement_quantity, expression: quantity >= 0 }
  indexes:
  - { name: uq_cloudrouter_usage_measurement_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_cloudrouter_usage_measurement_rating, columns: [tenant_id, organization_id, status, occurred_at, id] }
  - { name: idx_cloudrouter_usage_measurement_subject, columns: [tenant_id, organization_id, user_id, occurred_at, id] }
  - { name: idx_cloudrouter_usage_measurement_retention, columns: [retention_until, id] }
  lifecycle: *billing_fact_lifecycle

- table: cloudrouter_rating_decision
  domain: commerce
  profile: ledger_source_fact
  compliance_level: L3
  system_of_record: true
  write_owner: cloudrouter-rating-service
  common_columns: ledger_source_fact
  columns:
    invocation_id: { type: string(128), constraints: NOT NULL }
    measurement_id: { type: int64, constraints: NOT NULL }
    decision_status: { type: string(32), constraints: NOT NULL }
    billability: { type: string(32), constraints: NOT NULL }
    reason_code: { type: string(96), constraints: NOT NULL }
    strategy_code: string(32)
    calculation_mode: string(32)
    charge_timing: string(32)
    quantity_aggregation: string(32)
    price_book_tenant_id: int64
    price_book_organization_id: int64
    price_book_id: int64
    rate_id: int64
    account_rate_card_tenant_id: int64
    account_rate_card_organization_id: int64
    account_rate_card_id: int64
    pricing_plan_tenant_id: int64
    pricing_plan_organization_id: int64
    pricing_plan_id: int64
    pricing_rule_id: int64
    measured_quantity: { type: decimal, constraints: NOT NULL }
    rated_quantity: { type: decimal, constraints: NOT NULL }
    unit_size: decimal
    reference_unit_price: decimal
    cost_unit_price: decimal
    unit_price: decimal
    reference_amount: decimal
    cost_amount: decimal
    amount: decimal
    currency_code: string(10)
    billing_components: { type: json, constraints: NOT NULL }
    pricing_snapshot: { type: json, constraints: NOT NULL }
    decided_at: { type: instant, constraints: NOT NULL }
  unique_constraints:
  - { name: uk_cloudrouter_rating_decision_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_cloudrouter_rating_decision_idempotency, columns: [tenant_id, organization_id, idempotency_key] }
  - { name: uk_cloudrouter_rating_decision_measurement, columns: [tenant_id, organization_id, measurement_id] }
  foreign_keys:
  - { name: fk_cloudrouter_rating_decision_measurement, columns: [tenant_id, organization_id, measurement_id], references_table: cloudrouter_usage_measurement, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_cloudrouter_rating_decision_book, columns: [price_book_tenant_id, price_book_organization_id, price_book_id], references_table: pricing_price_book, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_cloudrouter_rating_decision_rate, columns: [price_book_tenant_id, price_book_organization_id, rate_id, price_book_id], references_table: pricing_rate, references_columns: [tenant_id, organization_id, id, price_book_id] }
  - { name: fk_cloudrouter_rating_decision_rate_card, columns: [account_rate_card_tenant_id, account_rate_card_organization_id, account_rate_card_id], references_table: cloudrouter_account_rate_card, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_cloudrouter_rating_decision_plan, columns: [pricing_plan_tenant_id, pricing_plan_organization_id, pricing_plan_id], references_table: cloudrouter_pricing_plan, references_columns: [tenant_id, organization_id, id] }
  - { name: fk_cloudrouter_rating_decision_rule, columns: [pricing_plan_tenant_id, pricing_plan_organization_id, pricing_rule_id, pricing_plan_id], references_table: cloudrouter_pricing_rule, references_columns: [tenant_id, organization_id, id, pricing_plan_id] }
  check_constraints:
  - { name: ck_cloudrouter_rating_decision_quantity, expression: measured_quantity >= 0 AND rated_quantity >= 0 }
  - name: ck_cloudrouter_rating_decision_status
    expression: decision_status IN ('rated', 'non_chargeable', 'unrated')
  - name: ck_cloudrouter_rating_decision_billability
    expression: billability IN ('chargeable', 'free', 'not_applicable', 'unknown')
  - name: ck_cloudrouter_rating_decision_strategy
    expression: strategy_code IS NULL OR strategy_code IN ('flat_fee', 'token_usage', 'api_call', 'image_quantity', 'duration', 'unit_quantity', 'graduated_tier', 'volume_tier', 'formula')
  - name: ck_cloudrouter_rating_decision_calculation_mode
    expression: calculation_mode IS NULL OR calculation_mode IN ('per_unit', 'flat', 'graduated', 'volume', 'formula')
  - name: ck_cloudrouter_rating_decision_rate_identity
    expression: (price_book_tenant_id IS NULL AND price_book_organization_id IS NULL AND price_book_id IS NULL AND rate_id IS NULL) OR (price_book_tenant_id IS NOT NULL AND price_book_organization_id IS NOT NULL AND price_book_id IS NOT NULL AND rate_id IS NOT NULL)
  - name: ck_cloudrouter_rating_decision_rate_card_identity
    expression: (account_rate_card_tenant_id IS NULL AND account_rate_card_organization_id IS NULL AND account_rate_card_id IS NULL) OR (account_rate_card_tenant_id IS NOT NULL AND account_rate_card_organization_id IS NOT NULL AND account_rate_card_id IS NOT NULL)
  - name: ck_cloudrouter_rating_decision_plan_identity
    expression: (pricing_plan_tenant_id IS NULL AND pricing_plan_organization_id IS NULL AND pricing_plan_id IS NULL AND pricing_rule_id IS NULL) OR (pricing_plan_tenant_id IS NOT NULL AND pricing_plan_organization_id IS NOT NULL AND pricing_plan_id IS NOT NULL AND pricing_rule_id IS NOT NULL)
  - name: ck_cloudrouter_rating_decision_amount
    expression: (decision_status = 'rated' AND billability = 'chargeable' AND reference_unit_price IS NOT NULL AND reference_unit_price >= 0 AND (cost_unit_price IS NULL OR cost_unit_price >= 0) AND unit_price IS NOT NULL AND unit_price >= 0 AND reference_amount IS NOT NULL AND reference_amount >= 0 AND (cost_amount IS NULL OR cost_amount >= 0) AND amount IS NOT NULL AND amount >= 0 AND currency_code IS NOT NULL AND unit_size > 0 AND strategy_code IS NOT NULL AND calculation_mode IS NOT NULL AND price_book_id IS NOT NULL AND rate_id IS NOT NULL AND account_rate_card_id IS NOT NULL AND pricing_plan_id IS NOT NULL AND pricing_rule_id IS NOT NULL) OR (decision_status = 'non_chargeable' AND billability IN ('free', 'not_applicable') AND reference_amount IS NULL AND cost_amount IS NULL AND amount IS NULL AND currency_code IS NULL AND price_book_id IS NOT NULL AND rate_id IS NOT NULL) OR (decision_status = 'unrated' AND billability IN ('chargeable', 'unknown') AND reference_amount IS NULL AND cost_amount IS NULL AND amount IS NULL AND currency_code IS NULL)
  - { name: ck_cloudrouter_rating_decision_currency, expression: "currency_code IS NULL OR currency_code ~ '^[A-Z]{3}$'" }
  indexes:
  - { name: uq_cloudrouter_rating_decision_scope_reference, columns: [tenant_id, organization_id, id], unique: true }
  - { name: idx_cloudrouter_rating_decision_invocation, columns: [tenant_id, organization_id, invocation_id, decision_status, decided_at, id] }
  - { name: idx_cloudrouter_rating_decision_retention, columns: [retention_until, id] }
  lifecycle: *billing_fact_lifecycle

- table: cloudrouter_charge_line
  domain: commerce
  profile: ledger_source_fact
  compliance_level: L3
  system_of_record: true
  write_owner: cloudrouter-charging-service
  common_columns: ledger_source_fact
  columns:
    invocation_id: { type: string(128), constraints: NOT NULL }
    rating_decision_id: { type: int64, constraints: NOT NULL }
    account_id: int64
    charge_status: { type: string(32), constraints: NOT NULL }
    product_code: { type: string(160), constraints: NOT NULL }
    operation_code: { type: string(160), constraints: NOT NULL }
    meter_code: { type: string(96), constraints: NOT NULL }
    quantity: { type: decimal, constraints: NOT NULL }
    reference_amount: { type: decimal, constraints: NOT NULL }
    cost_amount: { type: decimal, constraints: NOT NULL }
    amount: { type: decimal, constraints: NOT NULL }
    currency_code: { type: string(10), constraints: NOT NULL }
    charged_at: { type: instant, constraints: NOT NULL }
    settlement_id: int64
    settled_at: instant
  unique_constraints:
  - { name: uk_cloudrouter_charge_line_scope_id, columns: [tenant_id, organization_id, id] }
  - { name: uk_cloudrouter_charge_line_idempotency, columns: [tenant_id, organization_id, idempotency_key] }
  - { name: uk_cloudrouter_charge_line_decision, columns: [tenant_id, organization_id, rating_decision_id] }
  foreign_keys:
  - { name: fk_cloudrouter_charge_line_decision, columns: [tenant_id, organization_id, rating_decision_id], references_table: cloudrouter_rating_decision, references_columns: [tenant_id, organization_id, id] }
  check_constraints:
  - { name: ck_cloudrouter_charge_line_amount, expression: quantity > 0 AND reference_amount >= 0 AND cost_amount >= 0 AND amount > 0 }
  - name: ck_cloudrouter_charge_line_status
    expression: charge_status IN ('rated', 'pending', 'settled', 'reversed', 'failed')
  - { name: ck_cloudrouter_charge_line_currency, expression: "currency_code ~ '^[A-Z]{3}$'" }
  - { name: ck_cloudrouter_charge_line_settlement, expression: (settlement_id IS NULL AND settled_at IS NULL) OR (settlement_id IS NOT NULL AND settled_at IS NOT NULL) }
  indexes:
  - { name: idx_cloudrouter_charge_line_dashboard, columns: [tenant_id, organization_id, user_id, charge_status, charged_at, invocation_id, id] }
  - { name: idx_cloudrouter_charge_line_settlement, columns: [tenant_id, organization_id, charge_status, settled_at, id] }
  - { name: idx_cloudrouter_charge_line_retention, columns: [retention_until, id] }
  lifecycle: *billing_fact_lifecycle
