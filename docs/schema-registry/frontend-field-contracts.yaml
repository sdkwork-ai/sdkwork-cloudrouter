  request_schema:
    name: CreateApiKeyRequest
    required: [name, channelGroup, quota, isUnlimitedQuota, modalities, ipLimit, expires]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 128
        description: API key display name.
      channelGroup:
        type: string
        minLength: 1
        maxLength: 64
        description: API key channel group code.
      quota:
        type: string
        format: decimal
        description: Quota limit as a canonical decimal string.
      isUnlimitedQuota:
        type: boolean
        description: Whether the quota is unlimited.
      modalities:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, enum: [text, image, video, audio, music] }
      ipLimit:
        type: string
        maxLength: 1024
        description: Comma-separated IP or CIDR allowlist, or unrestricted.
      expires:
        type: string
        maxLength: 32
        description: Expiration timestamp in YYYY-MM-DDTHH:mm format, or never.
      defaultForRuntime:
        type: boolean
        description: Create this key as the default backend runtime API key.
  response_schema:
    name: CreateApiKeyResponse
    required: [item, rawKey]
    properties:
      item:
        name: AppApiKeyItem
        type: object
        additionalProperties: false
        required: [id, name, maskedKey, channelGroup, quota, usedQuota, modalities, ipLimit, created, expires, status, defaultForRuntime]
        properties:
          id: { type: string, minLength: 1, maxLength: 128 }
          name: { type: string, minLength: 1, maxLength: 128 }
          maskedKey: { type: string, minLength: 1, maxLength: 256 }
          copyableKey:
            type: string
            minLength: 1
            maxLength: 256
            description: Full plaintext API key returned only by authenticated owner management responses; public catalog responses omit this field.
          channelGroup: { type: string, minLength: 1, maxLength: 128 }
          channelGroupName:
            type: string
            minLength: 1
            maxLength: 128
            description: Display name snapshot for the bound channel group so the list view does not need to preload selectable groups.
          rate: { type: string, nullable: true, maxLength: 64 }
          quota: { type: string, minLength: 1, maxLength: 64 }
          usedQuota: { type: string, minLength: 1, maxLength: 64 }
          modalities:
            type: array
            items: { type: string, enum: [text, image, video, audio, music] }
          ipLimit: { type: string, maxLength: 1024 }
          created: { type: string, maxLength: 64 }
          expires: { type: string, maxLength: 64 }
          status: { type: string, enum: [enabled, disabled] }
          defaultForRuntime:
            type: boolean
            description: Whether this key is the current console default for backend runtime API key selection.
        description: Created API key metadata. Authenticated owner management responses include copyableKey matching rawKey.
      rawKey:
        type: string
        minLength: 1
        description: Full raw API key secret returned by create responses. Authenticated owner management list and update responses also expose this value as item.copyableKey for console copy actions.
