schema:
  name: sdkwork-cloudrouter-frontend-field-contracts
  version: 0.2.0
  source: tools/hydrate_frontend_contract_relay_surfaces.py
frontend_operation_sdk_authorities:
  sdkwork-models-app-sdk:
    manifest: ../sdkwork-models/sdks/sdkwork-models-app-sdk/sdk-manifest.json
frontend_operations:
  - route: /console/settlements
    source: sdks/_route-manifests/app-api/sdkwork-routes-cloudrouter-app-api.route-manifest.json
    operation: fetch_settlements_dashboard
    operation_id: settlements.dashboard.retrieve
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/ai/settlements/dashboard
    sdk_domain: ai
    read_sources:
      - ai_metering_usage
      - cloudrouter_charge_line
      - cloudrouter_rating_decision
    response_schema:
      name: SettlementsDashboardSnapshot
      schema:
        additionalProperties: false
        name: SettlementsDashboardSnapshot
        properties:
          chartData:
            items:
              additionalProperties: false
              name: SettlementChartPoint
              properties:
                day: { type: string }
                text: { type: string }
                image:
                  $ref: '#/components/schemas/MediaResource'
                video:
                  $ref: '#/components/schemas/MediaResource'
                audio:
                  $ref: '#/components/schemas/MediaResource'
                music:
                  $ref: '#/components/schemas/MediaResource'
              required: [day, text, image, video, audio, music]
              type: object
            type: array
          bills:
            items:
              additionalProperties: false
              name: SettlementBill
              properties:
                id: { type: string }
                period: { type: string }
                startDate: { type: string }
                endDate: { type: string }
                totalTokens: { type: string }
                totalCost: { type: string }
                status: { type: string }
              required: [id, period, startDate, endDate, totalTokens, totalCost, status]
              type: object
            type: array
        required: [chartData, bills]
        type: object
    query_parameters:
      - name: year
        schema:
          format: int64
          pattern: ^-?[0-9]+$
          type: string
          x-sdkwork-int64-string: true
          x-sdkwork-rust-type: i64
  - route: /console/dashboard
    source: apps/sdkwork-cloudrouter-pc/packages/sdkwork-cloudrouter-pc-console-dashboard/src/dashboardService.ts
    operation: fetchDashboardOverview
    operation_id: dashboard.overview.retrieve
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/ai/dashboard/overview
    sdk_domain: ai
    read_sources:
      - ai_usage
      - ai_request_trace
      - ai_model_rank_snapshot
      - ops_notification_message
      - ops_gateway_instance
    response_schema:
      name: DashboardOverviewResponse
      schema:
        additionalProperties: false
        name: DashboardOverviewResponse
        properties:
          announcements:
            items:
              additionalProperties: false
              name: DashboardAnnouncement
              properties:
                id:
                  format: int64
                  pattern: ^-?[0-9]+$
                  type: string
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
                text: { type: string }
                time: { type: string }
                type: { enum: [success, info, warning, error, unknown], type: string }
              required: [id, text, time, type]
              type: object
            type: array
          chartData:
            items:
              additionalProperties: false
              name: DashboardChartPoint
              properties:
                audio (Whisper): { type: number }
                audio (Whisper) cost: { type: number }
                image (Midjourney/DALL-E): { type: number }
                image (Midjourney/DALL-E) cost: { type: number }
                llm (Text): { type: number }
                llm (Text) cost: { type: number }
                music (Suno): { type: number }
                music (Suno) cost: { type: number }
                time: { type: string }
                video (Runway/Sora): { type: number }
                video (Runway/Sora) cost: { type: number }
              required: [time, llm (Text), image (Midjourney/DALL-E), video (Runway/Sora), audio (Whisper), music (Suno), llm (Text) cost, image (Midjourney/DALL-E) cost, video (Runway/Sora) cost, audio (Whisper) cost, music (Suno) cost]
              type: object
            type: array
          configurationDomains:
            items:
              additionalProperties: false
              name: DashboardConfigurationDomain
              properties:
                domain: { type: string }
                id: { type: string }
                ip: { type: string }
                name: { type: string }
                remark: { type: string }
                status: { enum: [online, warning, offline, unknown], type: string }
              required: [id, name, domain, ip, status, remark]
              type: object
            type: array
          modalityDistribution:
            items:
              additionalProperties: false
              name: DashboardModalityDistribution
              properties:
                modality: { enum: [text, image, video, audio, music, unknown], type: string }
                requests:
                  format: int64
                  pattern: ^-?[0-9]+$
                  type: string
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [modality, requests]
              type: object
            type: array
          multimodalSparkline:
            items:
              additionalProperties: false
              name: DashboardSparklinePoint
              properties:
                value: { type: number }
              required: [value]
              type: object
            type: array
          performanceSparkline:
            items:
              additionalProperties: false
              name: DashboardSparklinePoint
              properties:
                value: { type: number }
              required: [value]
              type: object
            type: array
          requestSparkline:
            items:
              additionalProperties: false
              name: DashboardSparklinePoint
              properties:
                value: { type: number }
              required: [value]
              type: object
            type: array
          summary:
            additionalProperties: false
            name: DashboardOverviewSummary
            properties:
              audioRequests:
                format: int64
                pattern: ^-?[0-9]+$
                type: string
                x-sdkwork-int64-string: true
                x-sdkwork-rust-type: i64
              availableCredits: { type: number }
              errorCount:
                format: int64
                pattern: ^-?[0-9]+$
                type: string
                x-sdkwork-int64-string: true
                x-sdkwork-rust-type: i64
              imageRequests:
                format: int64
                pattern: ^-?[0-9]+$
                type: string
                x-sdkwork-int64-string: true
                x-sdkwork-rust-type: i64
              musicRequests:
                format: int64
                pattern: ^-?[0-9]+$
                type: string
                x-sdkwork-int64-string: true
                x-sdkwork-rust-type: i64
              requestCount:
                format: int64
                pattern: ^-?[0-9]+$
                type: string
                x-sdkwork-int64-string: true
                x-sdkwork-rust-type: i64
              rpm: { type: number }
              totalRequestCount:
                format: int64
                pattern: ^-?[0-9]+$
                type: string
                x-sdkwork-int64-string: true
                x-sdkwork-rust-type: i64
              totalUsedCredits: { type: number }
              tpm: { type: number }
              usedCredits: { type: number }
              videoRequests:
                format: int64
                pattern: ^-?[0-9]+$
                type: string
                x-sdkwork-int64-string: true
                x-sdkwork-rust-type: i64
            required: [availableCredits, usedCredits, requestCount, totalUsedCredits, totalRequestCount, errorCount, imageRequests, videoRequests, audioRequests, musicRequests, rpm, tpm]
            type: object
          topModels:
            items:
              additionalProperties: false
              name: DashboardTopModel
              properties:
                cost: { type: number }
                isUp: { type: boolean }
                modality: { enum: [text, image, video, audio, music, unknown], type: string }
                name: { type: string }
                rank:
                  format: int64
                  pattern: ^-?[0-9]+$
                  type: string
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
                requests:
                  format: int64
                  pattern: ^-?[0-9]+$
                  type: string
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
                supplier: { type: string }
                trend: { type: string }
              required: [rank, name, supplier, modality, requests, cost, trend, isUp]
              type: object
            type: array
          warnings:
            items: { type: string }
            type: array
        required: [summary, requestSparkline, multimodalSparkline, performanceSparkline, chartData, modalityDistribution, topModels, announcements, warnings]
        type: object
    query_parameters:
      - name: time_range
        schema: { type: string, enum: [hourly, daily, monthly, yearly] }
      - name: start_time
        schema: { type: string, maxLength: 64 }
      - name: end_time
        schema: { type: string, maxLength: 64 }
  - route: /pricing
    source: apps/sdkwork-cloudrouter-pc/packages/sdkwork-cloudrouter-pc-pricing/src/services/compareService.ts
    operation: fetchCompareModels
    operation_id: pricing.compare.models.get
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/ai/models
    sdk_domain: ai
    sdk_operations:
      - { sdk_family: sdkwork-models-app-sdk, operation_id: models.list }
    query_parameters:
      - name: q
        schema: { type: string, maxLength: 256 }
      - name: vendor_codes
        schema: { type: string }
      - name: page_size
        schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
    openapi_exposed: false
    read_sources:
      - ai_model_vendor
      - ai_model
      - ai_model_capability
      - ai_model_pricing
      - ai_upstream_supplier
      - ai_upstream_account
      - ai_upstream_account_group
      - ai_upstream_account_group_member
      - ai_resource_binding
    response_schema:
      name: NoData
      schema:
        additionalProperties: false
        name: NoData
        properties: {}
        type: object
  - route: /pricing
    source: apps/sdkwork-cloudrouter-pc/packages/sdkwork-cloudrouter-pc-pricing/src/services/pricingService.ts
    operation: fetchOfficialPricingRates
    operation_id: pricing.rates.list
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/ai/pricing/rates
    sdk_domain: ai
    read_sources:
      - pricing_price_book
      - pricing_rate
      - pricing_import_run
    response_schema: &official-pricing-catalog-response
      name: OfficialPricingCatalogResponse
      schema:
        additionalProperties: false
        name: OfficialPricingCatalogResponse
        properties:
          items:
            type: array
            items: &official-pricing-rate-schema
              additionalProperties: false
              name: OfficialPricingRate
              type: object
              properties:
                rateCode: { type: string }
                rateHash: { type: string }
                groupCodes:
                  type: array
                  items: { type: string, enum: [all, llm, image, video, audio, music, embedding, sound, api, other] }
                productCode: { type: string }
                productKind: { type: string }
                productDisplayName: { type: string }
                operationCode: { type: string }
                operationKind: { type: string }
                operationDisplayName: { type: string }
                vendorCode: { type: string }
                providerCode: { type: string }
                regionCode: { type: string }
                resourceType: { type: string }
                resourceCode: { type: string }
                catalogKey: { type: string, nullable: true }
                apiFormat: { type: string, nullable: true }
                endpointCode: { type: string, nullable: true }
                priceBookCode: { type: string }
                priceBookVersion: { type: string }
                meterCode: { type: string }
                meterDisplayName: { type: string }
                quantityKind: { type: string }
                unitCode: { type: string }
                billability: { type: string, enum: [chargeable, free, not_applicable, unknown] }
                chargeTiming: { type: string, enum: [request_accepted, successful_result, usage_reported] }
                calculationMode: { type: string, enum: [per_unit, flat, graduated, volume, formula] }
                quantityAggregation: { type: string, enum: [sum, maximum, minimum, last, distinct_invocation] }
                unitSize: { type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$' }
                unitPrice: { type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$' }
                minimumQuantity: { type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$' }
                quantityStep: { type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$', nullable: true }
                currencyCode: {type: string, pattern: '^[A-Z]{3}$'}
                priority: { type: integer, format: int32, minimum: 0 }
                rateVariant: { type: string, enum: [standard, time_window] }
                schedule:
                  nullable: true
                  additionalProperties: false
                  type: object
                  properties:
                    timeZone: { type: string, minLength: 1, maxLength: 128 }
                    weeklyWindows:
                      type: array
                      minItems: 1
                      maxItems: 64
                      items:
                        additionalProperties: false
                        type: object
                        properties:
                          windowCode: { type: string, minLength: 1, maxLength: 96 }
                          daysOfWeek:
                            type: array
                            minItems: 1
                            maxItems: 7
                            uniqueItems: true
                            items: { type: integer, format: int32, minimum: 1, maximum: 7 }
                          startTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
                          endTime: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
                          endDayOffset: { type: integer, format: int32, enum: [0, 1] }
                        required: [windowCode, daysOfWeek, startTime, endTime, endDayOffset]
                    includeDates:
                      type: array
                      maxItems: 366
                      uniqueItems: true
                      items: { type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
                    excludeDates:
                      type: array
                      maxItems: 366
                      uniqueItems: true
                      items: { type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
                  required: [timeZone, weeklyWindows, includeDates, excludeDates]
                conditions:
                  type: array
                  items:
                    additionalProperties: false
                    name: OfficialPricingRateCondition
                    type: object
                    properties:
                      dimensionCode: { type: string }
                      operatorCode: { type: string, enum: [eq, neq, gt, gte, lt, lte, in, not_in, exists] }
                      value:
                        oneOf:
                          - { type: string }
                          - { type: number }
                          - { type: boolean }
                          - { type: array, maxItems: 64, items: { oneOf: [{ type: string }, { type: number }, { type: boolean }] } }
                    required: [dimensionCode, operatorCode, value]
                tiers:
                  type: array
                  items:
                    additionalProperties: false
                    name: OfficialPricingRateTier
                    type: object
                    properties:
                      tierCode: { type: string }
                      lowerBound: { type: string }
                      upperBound: { type: string, nullable: true }
                      unitSize: { type: string }
                      unitPrice: { type: string }
                      flatAmount: { type: string }
                      currencyCode: { type: string }
                    required: [tierCode, lowerBound, unitSize, unitPrice, flatAmount, currencyCode]
                formula:
                  additionalProperties: false
                  name: OfficialPricingFormula
                  type: object
                  nullable: true
                  properties:
                    formulaCode: { type: string }
                    formulaVersion: { type: string }
                    constantUnits: { type: string }
                    quantityCoefficient: { type: string }
                    minimumUnits: { type: string, nullable: true }
                    maximumUnits: { type: string, nullable: true }
                    terms:
                      type: array
                      items:
                        additionalProperties: false
                        name: OfficialPricingFormulaTerm
                        type: object
                        properties:
                          termCode: { type: string }
                          dimensionCode: { type: string }
                          coefficient: { type: string }
                        required: [termCode, dimensionCode, coefficient]
                  required: [formulaCode, formulaVersion, constantUnits, quantityCoefficient, terms]
                effectiveFrom: { type: string }
                effectiveTo: { type: string, nullable: true }
                sourceUrl: { type: string }
                sourceObservedAt: { type: string }
                capabilities:
                  type: array
                  items: { type: string }
                  nullable: true
                inputModalities:
                  type: array
                  items: { type: string }
                  nullable: true
                outputModalities:
                  type: array
                  items: { type: string }
                  nullable: true
                usageScopes:
                  type: array
                  items: { type: string }
                  nullable: true
                contextTokens:
                  type: string
                  format: int64
                  pattern: ^[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
                  nullable: true
                maxInputTokens:
                  type: string
                  format: int64
                  pattern: ^[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
                  nullable: true
                maxOutputTokens:
                  type: string
                  format: int64
                  pattern: ^[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
                  nullable: true
                supportsStreaming: { type: boolean, nullable: true }
                supportsTools: { type: boolean, nullable: true }
                supportsJsonSchema: { type: boolean, nullable: true }
              required: [rateCode, rateHash, groupCodes, productCode, productKind, productDisplayName, operationCode, operationKind, operationDisplayName, vendorCode, providerCode, regionCode, resourceType, resourceCode, priceBookCode, priceBookVersion,
                meterCode, meterDisplayName, quantityKind, unitCode, billability, chargeTiming, calculationMode, quantityAggregation, unitSize, unitPrice, minimumQuantity, currencyCode, conditions, tiers, effectiveFrom, sourceUrl, sourceObservedAt]
          pageInfo:
            $ref: '#/components/schemas/PageInfo'
          groups:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingGroupFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [id, code, count]
          vendors:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingValueFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [id, code, count]
          regions:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingRegionFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [id, code, count]
          currencies:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingValueFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [id, code, count]
          meters:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingMeterFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                displayName: { type: string }
                unitCode: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [id, code, displayName, unitCode, count]
        required: [items, pageInfo, groups, vendors, regions, currencies, meters]
        type: object
    query_parameters: &official-pricing-query-parameters
      - name: category
        schema: { type: string, enum: [all, llm, image, video, audio, music, embedding, sound, api, other] }
      - name: q
        schema: { type: string, maxLength: 256 }
      - name: vendor_code
        schema: { type: string, maxLength: 160, pattern: '^[A-Za-z0-9._:/-]+$' }
      - name: region_code
        schema: { type: string, maxLength: 160, pattern: '^[A-Za-z0-9._:/-]+$' }
      - name: meter_code
        schema: { type: string, maxLength: 160, pattern: '^[A-Za-z0-9._:/-]+$' }
      - name: currency_code
        schema: { type: string, maxLength: 3, pattern: '^[A-Z]{3}$' }
      - name: page
        schema: { type: integer, format: int32, minimum: 1 }
      - name: page_size
        schema: { type: integer, format: int32, minimum: 1, maximum: 200 }
  - route: /admin/pricing/settings
    source: apps/sdkwork-cloudrouter-pc/packages/sdkwork-cloudrouter-pc-admin-pricing/src/pricingService.ts
    operation: fetchAdminOfficialPricingRates
    operation_id: officialRates.list
    kind: read
    api_surface: backend
    api_method: GET
    api_path: /backend/v3/api/pricing/official_rates
    sdk_domain: pricing
    read_sources:
      - pricing_price_book
      - pricing_rate
      - pricing_import_run
    response_schema:
      <<: *official-pricing-catalog-response
    query_parameters: *official-pricing-query-parameters
  - route: /admin/pricing/settings
    source: apps/sdkwork-cloudrouter-pc/packages/sdkwork-cloudrouter-pc-admin-pricing/src/pricingService.ts
    operation: fetchAdminOfficialPricingProducts
    operation_id: officialProducts.list
    kind: read
    api_surface: backend
    api_method: GET
    api_path: /backend/v3/api/pricing/official_products
    sdk_domain: pricing
    read_sources:
      - pricing_price_book
      - pricing_rate
      - pricing_import_run
    response_schema:
      name: OfficialPricingProductCatalogResponse
      schema:
        additionalProperties: false
        name: OfficialPricingProductCatalogResponse
        type: object
        properties:
          items:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingProductGroup
              type: object
              properties:
                groupKey: { type: string, minLength: 1 }
                groupCodes:
                  type: array
                  items: { type: string, enum: [all, llm, image, video, audio, music, embedding, sound, api, other] }
                productCode: { type: string }
                productKind: { type: string }
                productDisplayName: { type: string }
                vendorCode: { type: string }
                providerCode: { type: string }
                regionCode: { type: string }
                resourceType: { type: string }
                resourceCode: { type: string }
                resourceDisplayName: { type: string }
                catalogKey: { type: string, nullable: true }
                currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
                priceBookCode: { type: string }
                priceBookVersion: { type: string }
                rates:
                  type: array
                  minItems: 1
                  items: *official-pricing-rate-schema
                availableRegions:
                  type: array
                  items: &official-pricing-region-option-schema
                    additionalProperties: false
                    name: OfficialPricingRegionOption
                    type: object
                    properties:
                      regionCode: { type: string }
                      currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
                      rateCount: { type: integer, format: int32, minimum: 0 }
                      isGlobal: { type: boolean }
                    required: [regionCode, currencyCode, rateCount, isGlobal]
                defaultRegionCode: { type: string }
                regionFallback: { type: boolean }
              required: [groupKey, groupCodes, productCode, productKind, productDisplayName,
                vendorCode, providerCode, regionCode, resourceType, resourceCode, resourceDisplayName, currencyCode,
                priceBookCode, priceBookVersion, rates, availableRegions, defaultRegionCode, regionFallback]
          pageInfo:
            $ref: '#/components/schemas/PageInfo'
          groups:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingProductGroupFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [id, code, count]
          vendors:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingProductVendorFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
                  x-sdkwork-rust-type: i64
              required: [id, code, count]
          regions:
            type: array
            items:
              additionalProperties: false
              name: OfficialPricingProductRegionFacet
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                count:
                  type: string
                  format: int64
                  pattern: ^-?[0-9]+$
                  x-sdkwork-int64-string: true
