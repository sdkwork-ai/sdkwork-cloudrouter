- route: /console/ai/models
  source: tools/bootstrap_frontend_contract_from_route_manifest.py
  operation: list
  operation_id: models.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/models
  read_sources:
  - ai
  response_schema:
    name: ModelCatalogPage
    additionalProperties: false
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: true
      groups:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            key:
              type: string
            label:
              type: string
            modelCount:
              type: integer
              format: int64
              minimum: 0
          required:
          - key
          - label
          - modelCount
      pageInfo:
        $ref: '#/components/schemas/PageInfo'
    required:
    - items
    - groups
    - pageInfo
  query_parameters:
  - name: page
    required: false
    schema:
      type: integer
      format: int32
      minimum: 1
      default: 1
    description: One-based page index.
  - name: page_size
    required: false
    schema:
      type: integer
      format: int32
      minimum: 1
      maximum: 200
      default: 20
    description: Number of models returned in the current page.
  - name: q
    required: false
    schema:
      type: string
    description: Free-text model search query.
  - name: billing_meter
    required: false
    schema:
      type: string
    description: Billing meter code filter.
  - name: vendor_codes
    required: false
    schema:
      type: array
      items:
        type: string
    style: form
    explode: false
    description: Comma-separated vendor code filter.
  - name: modalities
    required: false
    schema:
      type: array
      items:
        type: string
    style: form
    explode: false
    description: Comma-separated modality filter.
  - name: capabilities
    required: false
    schema:
      type: array
      items:
        type: string
    style: form
    explode: false
    description: Comma-separated capability filter.
  - name: categories
    required: false
    schema:
      type: array
      items:
        type: string
    style: form
    explode: false
    description: Comma-separated model category filter.
  - name: groups
    required: false
    schema:
      type: array
      items:
        type: string
    style: form
    explode: false
    description: Comma-separated channel group filter.
