schema:
  name: sdkwork-clawrouter-frontend-field-contracts
  version: 0.1.0
  source: tools/hydrate_frontend_contract_relay_surfaces.py
frontend_operations:
- route: /console/api-keys
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-api-keys/src/apiKeyService.ts
  operation: fetchGroups
  operation_id: channelGroups.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/channel_groups
  read_sources:
  - ai_channel_group
  - ai_channel_group_metric_snapshot
  - ai_pricing_plan
  response_schema:
    name: AppChannelGroupListResponse
    required: [items, pageInfo]
    properties:
      items:
        type: array
        items:
          name: AppChannelGroup
          type: object
          additionalProperties: false
          required: [id, code, name, rate]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            code: { type: string, minLength: 1, maxLength: 128 }
            name: { type: string, minLength: 1, maxLength: 128 }
            rate: { type: string, nullable: true, maxLength: 64 }
      pageInfo:
        $ref: '#/components/schemas/PageInfo'
  query_parameters: []
- route: /console/dashboard
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-dashboard/src/dashboardService.ts
  operation: fetchDashboardOverview
  operation_id: dashboard.overview.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/dashboard/overview
  sdk_domain: ai
  read_sources:
  - ai_usage
  - ai_request_trace
  - ai_model_rank_snapshot
  - ops_notification_message
  - ops_metric_snapshot
  - ops_gateway_instance
  response_schema:
    name: DashboardOverviewResponse
    required: [summary, requestSparkline, multimodalSparkline, performanceSparkline, chartData, topModels, announcements, warnings]
    properties:
      summary:
        type: object
        additionalProperties: false
        name: DashboardOverviewSummary
        required: [availableCredits, usedCredits, requestCount, totalUsedCredits, totalRequestCount, errorCount, imageRequests, videoRequests, audioRequests, musicRequests, rpm, tpm]
        properties:
          availableCredits: { type: number }
          usedCredits: { type: number }
          requestCount: { type: integer, format: int64 }
          totalUsedCredits: { type: number }
          totalRequestCount: { type: integer, format: int64 }
          errorCount: { type: integer, format: int64 }
          imageRequests: { type: integer, format: int64 }
          videoRequests: { type: integer, format: int64 }
          audioRequests: { type: integer, format: int64 }
          musicRequests: { type: integer, format: int64 }
          rpm: { type: number }
          tpm: { type: number }
      requestSparkline:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardSparklinePoint
          required: [value]
          properties:
            value: { type: number }
      multimodalSparkline:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardSparklinePoint
          required: [value]
          properties:
            value: { type: number }
      performanceSparkline:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardSparklinePoint
          required: [value]
          properties:
            value: { type: number }
      chartData:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardChartPoint
          required: [time, llm (Text), image (Midjourney/DALL-E), video (Runway/Sora), audio (Whisper), music (Suno)]
          properties:
            time: { type: string }
            llm (Text): { type: number }
            image (Midjourney/DALL-E): { type: number }
            video (Runway/Sora): { type: number }
            audio (Whisper): { type: number }
            music (Suno): { type: number }
      topModels:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardTopModel
          required: [rank, name, supplier, modality, requests, cost, trend, isUp]
          properties:
            rank: { type: integer, format: int64 }
            name: { type: string }
            supplier: { type: string }
            modality: { type: string, enum: [text, image, video, audio, music, unknown] }
            requests: { type: integer, format: int64 }
            cost: { type: number }
            trend: { type: string }
            isUp: { type: boolean }
      announcements:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardAnnouncement
          required: [id, text, time, type]
          properties:
            id: { type: integer, format: int64 }
            text: { type: string }
            time: { type: string }
            type: { type: string, enum: [success, info, warning, error, unknown] }
      configurationDomains:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardConfigurationDomain
          required: [id, name, domain, ip, status, remark]
          properties:
            id: { type: string }
            name: { type: string }
            domain: { type: string }
            ip: { type: string }
            status: { type: string, enum: [online, warning, offline, unknown] }
            remark: { type: string }
      warnings:
        type: array
        items: { type: string }
  query_parameters:
  - name: time_range
    schema: { type: string, enum: [hourly, daily, monthly, yearly] }
  - name: start_time
    schema: { type: string, maxLength: 64 }
  - name: end_time
    schema: { type: string, maxLength: 64 }
