- route: /rankings
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-rankings/src/rankingService.ts
  operation: fetchModelRankings
  operation_id: ai.model.rankings.get
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/model_rankings
  sdk_domain: ai
  read_sources:
  - ai_model_rank_snapshot
  - ai_model
  response_schema:
    name: ModelRankingsPage
    required: [source, items, history, pageInfo]
    properties:
      source:
        type: object
        additionalProperties: false
        name: ModelRankingsSource
        required: [sourceLabel, sourceDescription, observedAt, snapshotDate, snapshotPeriod, windowStart, windowEnd, generatedAt, refreshIntervalSeconds, nextRefreshAt, cacheMaxAgeSeconds, rankScope, sourceTables]
        properties:
          sourceLabel: { type: string }
          sourceDescription: { type: string }
          observedAt: { type: string }
          snapshotDate: { type: string }
          snapshotPeriod: { type: string, enum: [hourly, daily, weekly, monthly] }
          windowStart: { type: string }
          windowEnd: { type: string }
          generatedAt: { type: string }
          refreshIntervalSeconds: { type: integer, minimum: 1 }
          nextRefreshAt: { type: string }
          cacheMaxAgeSeconds: { type: integer, minimum: 0 }
          rankScope: { type: string }
          sourceTables: { type: array, items: { type: string } }
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          name: ModelRankingItem
          required: [id, rank, prevRank, name, vendor, vendorCode, modality, baseVolume, costIndicator, latency, isNew, color, strengths, requests, tokens, cost, currency]
          properties:
            id: { type: string }
            rank: { type: integer, minimum: 1 }
            prevRank: { type: integer, minimum: 0 }
            name: { type: string }
            vendor: { type: string }
            vendorCode: { type: string }
            modality: { type: string }
            baseVolume: { type: integer, minimum: 0 }
            costIndicator: { type: integer, minimum: 0 }
            latency: { type: integer, minimum: 0 }
            contextSize: { type: string }
            isNew: { type: boolean }
            color: { type: string }
            winRate: { type: number }
            pricing: { type: string }
            license: { type: string }
            strengths: { type: array, items: { type: string } }
            requests: { type: integer, minimum: 0 }
            tokens: { type: integer, minimum: 0 }
            cost: { type: number, minimum: 0 }
            currency: { type: string }
            trendScore: { type: number }
      history:
        type: array
        items:
          type: object
          additionalProperties: false
          name: ModelRankingHistoryPoint
          required: [date, index, entries]
          properties:
            date: { type: string }
            index: { type: integer, minimum: 0 }
            entries:
              type: array
              items:
                type: object
                additionalProperties: false
                name: ModelRankingHistoryEntry
                required: [model, catalogKey, rank, volume, color]
                properties:
                  model: { type: string }
                  catalogKey: { type: string }
                  rank: { type: integer, minimum: 1 }
                  volume: { type: integer, minimum: 0 }
                  color: { type: string }
      pageInfo:
        type: object
        additionalProperties: false
        name: PageInfo
        required: [mode, page, pageSize, totalItems, totalPages, hasMore]
        properties:
          mode: { type: string, enum: [offset] }
          page: { type: integer, minimum: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 200 }
          totalItems: { type: string, pattern: '^[0-9]+$' }
          totalPages: { type: integer, minimum: 0 }
          hasMore: { type: boolean }
  query_parameters:
  - name: rank_scope
    schema: { type: string, maxLength: 64 }
  - name: vendor_code
    schema: { type: string, maxLength: 64 }
  - name: modality
    schema: { type: string, maxLength: 32 }
  - name: q
    schema: { type: string, maxLength: 200 }
  - name: page
    schema: { type: integer, minimum: 1, default: 1 }
  - name: page_size
    schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
