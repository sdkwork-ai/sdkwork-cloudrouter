          official: { $ref: '#/components/schemas/AdminOfficialRateAnchor' }
          pricingPlanCode: { maxLength: 96, type: string }
          pricingPlanId:
            format: int64
            pattern: ^-?[0-9]+$
            type: string
            x-sdkwork-int64-string: true
            x-sdkwork-rust-type: i64
          regionCode: { maxLength: 64, type: string }
          regionFallback: { type: boolean }
          resolvedUnitPrice: {pattern: '^-?[0-9]+(\.[0-9]+)?$', type: string}
          rule:
            allOf:
              - $ref: '#/components/schemas/AdminPricingRule'
          source: { enum: [rule_override, rule_multiplier_markup, official_reference], type: string }
        required: [official, regionCode, regionFallback, pricingPlanId, pricingPlanCode, resolvedUnitPrice, currencyCode, source]
        type: object
