- route: /console/ai/model_rankings
  source: tools/bootstrap_frontend_contract_from_route_manifest.py
  operation: list
  operation_id: modelRankings.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/model_rankings
  read_sources:
  - ai
  response_schema:
    name: ModelRankingsPage
    additionalProperties: false
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: true
      history:
        type: array
        items:
          type: object
          additionalProperties: true
      source:
        type: object
        additionalProperties: true
      pageInfo:
        $ref: '#/components/schemas/PageInfo'
    required:
    - items
    - history
    - source
    - pageInfo
  query_parameters:
  - name: rank_scope
    required: false
    schema:
      type: string
    description: Ranking snapshot scope.
  - name: vendor_code
    required: false
    schema:
      type: string
    description: Vendor code filter.
  - name: modality
    required: false
    schema:
      type: string
    description: Model modality filter.
  - name: q
    required: false
    schema:
      type: string
    description: Free-text ranking search query.
  - name: page_size
    required: false
    schema:
      type: integer
      format: int32
      minimum: 1
      maximum: 200
      default: 200
    description: Number of ranking rows returned in the current page.
- route: /console/ai/model_vendors
