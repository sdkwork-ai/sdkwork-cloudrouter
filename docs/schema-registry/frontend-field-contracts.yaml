    operation: fetchKeys
    operation_id: apiKeys.list
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/iam/api_keys
    read_sources:
      - iam_gateway_api_key
      - ai_upstream_account_group
      - ai_upstream_account_group_metric_snapshot
      - iam_gateway_access_policy
      - ai_quota_policy
      - ai_model_pricing
      - cloudrouter_pricing_plan
    response_schema:
      name: AppApiKeyListResponse
      schema:
        additionalProperties: false
        name: AppApiKeyListResponse
        properties:
          items:
            items:
              additionalProperties: false
              description: API key metadata. Raw key material is returned when the deployment stores it (plaintext or decrypted ciphertext); legacy keys without a stored secret return null.
              name: AppApiKeyItem
              properties:
                accountGroup: { maxLength: 128, minLength: 1, type: string }
                accountGroupName:
                  description: Display name snapshot for the bound upstream account group.
                  maxLength: 128
                  minLength: 1
                  type: string
                accountGroups:
                  description: Route binding group codes (priority order), including the default group.
                  items: { maxLength: 128, type: string }
                  type: array
                groupBindings:
                  description: Route binding group routing policies (priority order), including the default group.
                  items:
                    additionalProperties: false
                    description: Account group binding with per-key routing strategy on app api key item.
                    properties:
                      accountGroup:
                        description: Account group field on app api key item group binding.
                        maxLength: 128
                        minLength: 1
                        type: string
                      priority:
                        description: Binding attempt order within this API key; lower values are tried first.
                        minimum: 0
                        type: integer
                      routingStrategy:
                        description: Per-key routing strategy for this bound group (weighted, price_first (default), or quality_first.
                        enum: [weighted, price_first, quality_first]
                        type: string
                      weight:
                        description: Binding weight used to order groups sharing the same priority.
                        maximum: 10000
                        minimum: 0
                        type: integer
                    required: [accountGroup, routingStrategy, weight, priority]
                    type: object
                  type: array
                created: { maxLength: 64, type: string }
                defaultForRuntime:
                  description: Whether this key is the current console default for backend runtime API key selection.
                  type: boolean
                expires: { maxLength: 64, type: string }
                id: { maxLength: 128, minLength: 1, type: string }
                ipLimit: { maxLength: 1024, type: string }
                maskedKey: { maxLength: 256, minLength: 1, type: string }
                modalities:
                  items: { enum: [text, image, video, audio, music], type: string }
                  type: array
                name: { maxLength: 128, minLength: 1, type: string }
                quota: { maxLength: 64, minLength: 1, type: string }
