  source: tools/bootstrap_frontend_contract_from_route_manifest.py
  operation: retrieve
  operation_id: analytics.admin.overview.retrieve
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/system/analytics/admin/overview
  read_sources:
  - system
  response_schema:
    name: AdminAnalyticsOverview
    additionalProperties: false
    properties:
      timeRange:
        type: string
        enum:
        - hourly
        - daily
        - weekly
        - monthly
        - yearly
      startTime:
        type:
        - string
        - 'null'
      endTime:
        type:
        - string
        - 'null'
      rankingSize:
        type: integer
        format: int32
        minimum: 3
        maximum: 50
      summary:
        type: object
        additionalProperties: false
        properties:
          totalUsers:
            type: integer
            format: int64
            minimum: 0
          activeUsers:
            type: integer
            format: int64
            minimum: 0
          activeModels:
            type: integer
            format: int64
            minimum: 0
          totalRequests:
            type: integer
            format: int64
            minimum: 0
          successfulRequests:
            type: integer
            format: int64
            minimum: 0
          failedRequests:
            type: integer
            format: int64
            minimum: 0
          totalTokens:
            type: number
            minimum: 0
          totalPoints:
            type: number
            minimum: 0
          upstreamCost:
            type: number
            minimum: 0
          averageTokensPerRequest:
            type: number
            minimum: 0
          averagePointsPerRequest:
            type: number
            minimum: 0
          errorRate:
            type: number
            minimum: 0
        required:
        - totalUsers
        - activeUsers
        - activeModels
        - totalRequests
        - successfulRequests
        - failedRequests
        - totalTokens
        - totalPoints
        - upstreamCost
        - averageTokensPerRequest
        - averagePointsPerRequest
        - errorRate
      trend:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            time:
              type: string
            requests:
              type: number
              minimum: 0
            tokens:
              type: number
              minimum: 0
            points:
              type: number
              minimum: 0
            users:
              type: integer
              format: int64
              minimum: 0
          required:
          - time
          - requests
          - tokens
          - points
          - users
      userRankings:
        type: object
        additionalProperties: false
        properties:
          points:
            type: array
            items: &AdminAnalyticsUserRankItemSchema
              type: object
              additionalProperties: false
              properties:
                rank:
                  type: integer
                  format: int64
                  minimum: 1
                userId:
                  type: string
                userName:
                  type: string
                email:
                  type:
                  - string
                  - 'null'
                requestCount:
                  type: integer
                  format: int64
                  minimum: 0
                totalTokens:
                  type: number
                  minimum: 0
                points:
                  type: number
                  minimum: 0
                modelDistribution:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                      value:
                        type: number
                        minimum: 0
                      color:
                        type: string
                    required:
                    - name
                    - value
                    - color
              required:
              - rank
              - userId
              - userName
              - requestCount
              - totalTokens
              - points
              - modelDistribution
          tokens:
            type: array
            items: *AdminAnalyticsUserRankItemSchema
          requests:
            type: array
            items: *AdminAnalyticsUserRankItemSchema
        required:
        - points
        - tokens
        - requests
      modelRankings:
        type: object
        additionalProperties: false
        properties:
          points:
            type: array
            items: &AdminAnalyticsModelRankItemSchema
              type: object
              additionalProperties: false
              properties:
                rank:
                  type: integer
                  format: int64
                  minimum: 1
                model:
                  type: string
                catalogKey:
                  type: string
                vendor:
                  type: string
                modality:
                  type: string
                requestCount:
                  type: integer
                  format: int64
                  minimum: 0
                totalTokens:
                  type: number
                  minimum: 0
                points:
                  type: number
                  minimum: 0
                upstreamCost:
                  type: number
                  minimum: 0
                userCount:
                  type: integer
                  format: int64
                  minimum: 0
                averageTokensPerRequest:
                  type: number
                  minimum: 0
                errorRate:
                  type: number
                  minimum: 0
              required:
              - rank
              - model
              - catalogKey
              - vendor
              - modality
              - requestCount
              - totalTokens
              - points
              - upstreamCost
              - userCount
              - averageTokensPerRequest
              - errorRate
          tokens:
            type: array
            items: *AdminAnalyticsModelRankItemSchema
          requests:
            type: array
            items: *AdminAnalyticsModelRankItemSchema
        required:
        - points
        - tokens
        - requests
      modelDistribution:
        type: array
        items: &AdminAnalyticsPieItemSchema
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            value:
              type: number
              minimum: 0
            color:
              type: string
          required:
          - name
          - value
          - color
      modalityDistribution:
        type: array
        items: *AdminAnalyticsPieItemSchema
      insights:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            key:
              type: string
            title:
              type: string
            value:
              type: string
            severity:
              type: string
              enum:
              - info
              - warning
              - critical
            detail:
              type: string
          required:
          - key
          - title
          - value
          - severity
          - detail
    required:
    - timeRange
    - rankingSize
    - summary
    - trend
    - userRankings
    - modelRankings
    - modelDistribution
    - modalityDistribution
    - insights
  query_parameters:
  - name: time_range
    required: false
    schema:
      type: string
      enum:
      - hourly
      - daily
      - weekly
      - monthly
      - yearly
    description: Analytics aggregation time range.
  - name: start_time
    required: false
    schema:
      type: string
      format: date-time
    description: Inclusive analytics window start time.
  - name: end_time
    required: false
    schema:
      type: string
      format: date-time
    description: Inclusive analytics window end time.
  - name: ranking_size
    required: false
    schema:
      type: integer
      format: int32
      minimum: 3
      maximum: 50
      default: 10
    description: Number of ranking rows returned for each ranking metric.
