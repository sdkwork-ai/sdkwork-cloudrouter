fragment: shared/entities/ecosystem
x_response_entities:
  skill_package_item: &id001
    name: SkillPackageItem
    type: object
    additionalProperties: false
    required:
    - id
    - version
    - artifactRef
    - artifactSizeBytes
    - frameworks
    - licenseName
    - publishedAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      version:
        type: string
        maxLength: 64
      artifactRef:
        type: string
        maxLength: 512
      artifactSizeBytes:
        type: integer
        format: int64
        minimum: 0
      frameworks:
        type: array
        maxItems: 32
        items:
          type: string
          minLength: 1
          maxLength: 64
      licenseName:
        type: string
        maxLength: 128
      publishedAt:
        type: string
        maxLength: 64
  skill_catalog_item:
    name: SkillCatalogItem
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - developer
    - description
    - category
    - image
    - rating
    - downloads
    - features
    - lastUpdated
    - clawhubImage
    - version
    - size
    - license
    - frameworks
    - screenshots
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 128
      developer:
        type: string
        minLength: 1
        maxLength: 128
      description:
        type: string
        maxLength: 4096
      category:
        type: string
        minLength: 1
        maxLength: 128
      image:
        $ref: '#/components/schemas/MediaResource'
      rating:
        type: number
        minimum: 0
        maximum: 5
      downloads:
        type: string
        maxLength: 64
      features:
        type: array
        maxItems: 64
        items:
          type: string
          minLength: 1
          maxLength: 128
      lastUpdated:
        type: string
        maxLength: 64
      clawhubImage:
        type: string
        maxLength: 512
      version:
        type: string
        maxLength: 64
      size:
        type: string
        maxLength: 64
      license:
        type: string
        maxLength: 128
      frameworks:
        type: array
        maxItems: 32
        items:
          type: string
          minLength: 1
          maxLength: 64
      screenshots:
        type: array
        maxItems: 20
        items:
          type: string
          maxLength: 2048
      packages:
        type: array
        maxItems: 16
        items: *id001
