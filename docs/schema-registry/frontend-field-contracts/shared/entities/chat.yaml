fragment: shared/entities/chat
x_response_entities:
  chat_conversation_item: &id001
    name: ChatConversationItem
    type: object
    additionalProperties: false
    required:
    - id
    - title
    - status
    - sourceSurface
    - messageCount
    - turnCount
    - createdAt
    - updatedAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      title:
        type: string
        minLength: 1
        maxLength: 256
      status:
        type: string
        enum:
        - active
        - archived
        - deleted
      sourceSurface:
        type: string
        minLength: 1
        maxLength: 64
      defaultModel:
        type: string
        nullable: true
        maxLength: 128
      defaultProvider:
        type: string
        nullable: true
        maxLength: 128
      agentId:
        type: string
        nullable: true
        maxLength: 128
      agentSessionId:
        type: string
        nullable: true
        maxLength: 128
      memorySpaceId:
        type: string
        nullable: true
        maxLength: 128
      lastMessagePreview:
        type: string
        nullable: true
        maxLength: 2048
      messageCount:
        type: integer
        format: int64
        minimum: 0
      turnCount:
        type: integer
        format: int64
        minimum: 0
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      updatedAt:
        type: string
        minLength: 1
        maxLength: 64
  chat_message_item: &id002
    name: ChatMessageItem
    type: object
    additionalProperties: false
    required:
    - id
    - conversationId
    - role
    - direction
    - content
    - status
    - createdAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      conversationId:
        type: string
        minLength: 1
        maxLength: 128
      turnId:
        type: string
        nullable: true
        maxLength: 128
      role:
        type: string
        enum:
        - system
        - user
        - assistant
        - tool
        - developer
      direction:
        type: string
        enum:
        - input
        - output
      content:
        type: string
        maxLength: 65536
      status:
        type: string
        enum:
        - pending
        - streaming
        - completed
        - failed
        - cancelled
        - deleted
      model:
        type: string
        nullable: true
        maxLength: 128
      provider:
        type: string
        nullable: true
        maxLength: 128
      runtime:
        type: string
        nullable: true
        maxLength: 128
      runtimeInvocationId:
        type: string
        nullable: true
        maxLength: 128
      usageLinkId:
        type: string
        nullable: true
        maxLength: 128
      usage:
        type: object
        nullable: true
        additionalProperties: false
        required:
        - inputTokens
        - outputTokens
        - cachedTokens
        - reasoningTokens
        - totalTokens
        properties:
          inputTokens:
            type: integer
            format: int64
            minimum: 0
          outputTokens:
            type: integer
            format: int64
            minimum: 0
          cachedTokens:
            type: integer
            format: int64
            minimum: 0
          reasoningTokens:
            type: integer
            format: int64
            minimum: 0
          totalTokens:
            type: integer
            format: int64
            minimum: 0
          costAmount:
            type: string
            nullable: true
            maxLength: 64
          currency:
            type: string
            nullable: true
            maxLength: 16
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
  chat_turn_item: &id003
    name: ChatTurnItem
    type: object
    additionalProperties: false
    required:
    - id
    - conversationId
    - status
    - createdAt
    - updatedAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      conversationId:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        enum:
        - pending
        - running
        - completed
        - failed
        - cancelled
      model:
        type: string
        nullable: true
        maxLength: 128
      provider:
        type: string
        nullable: true
        maxLength: 128
      agentId:
        type: string
        nullable: true
        maxLength: 128
      agentSessionId:
        type: string
        nullable: true
        maxLength: 128
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      updatedAt:
        type: string
        minLength: 1
        maxLength: 64
  chat_conversation_list_response:
    name: ChatConversationListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: *id001
  chat_conversation_response:
    name: ChatConversationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: *id001
  chat_message_list_response:
    name: ChatMessageListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 1000
        items: *id002
  chat_turn_create_response:
    name: ChatTurnCreateResponse
    type: object
    additionalProperties: false
    required:
    - turn
    - messages
    properties:
      turn: *id003
      messages:
        type: array
        maxItems: 16
        items: *id002
  chat_conversation_create_request:
    name: ChatConversationCreateRequest
    type: object
    additionalProperties: false
    properties:
      title:
        type: string
        maxLength: 256
      sourceSurface:
        type: string
        maxLength: 64
      defaultModel:
        type: string
        maxLength: 128
      defaultProvider:
        type: string
        maxLength: 128
      agentId:
        type: string
        maxLength: 128
      agentSessionId:
        type: string
        maxLength: 128
      memorySpaceId:
        type: string
        maxLength: 128
      metadata:
        type: object
        additionalProperties: true
  chat_turn_create_request:
    name: ChatTurnCreateRequest
    type: object
    additionalProperties: false
    required:
    - message
    properties:
      message:
        type: string
        minLength: 1
        maxLength: 65536
      mode:
        type: string
        maxLength: 64
      agentId:
        type: string
        maxLength: 128
      agentSessionId:
        type: string
        maxLength: 128
      model:
        type: string
        maxLength: 128
      provider:
        type: string
        maxLength: 128
      metadata:
        type: object
        additionalProperties: true
  chat_turn_response_request:
    name: ChatTurnResponseRequest
    type: object
    additionalProperties: false
    required:
    - message
    properties:
      message:
        type: string
        minLength: 1
        maxLength: 65536
      status:
        type: string
        enum:
        - completed
        - failed
        - cancelled
        - streaming
      model:
        type: string
        maxLength: 128
      provider:
        type: string
        maxLength: 128
      runtime:
        type: string
        maxLength: 128
        description: Runtime adapter such as claude_code, gemini, codex, openai_compatible, or custom.
      runtimeInvocationId:
        type: string
        maxLength: 128
      usageFactId:
        type: string
        maxLength: 128
      usage:
        type: object
        additionalProperties: false
        properties:
          inputTokens:
            type: integer
            format: int64
            minimum: 0
          outputTokens:
            type: integer
            format: int64
            minimum: 0
          cachedTokens:
            type: integer
            format: int64
            minimum: 0
          reasoningTokens:
            type: integer
            format: int64
            minimum: 0
          totalTokens:
            type: integer
            format: int64
            minimum: 0
          cost:
            type: string
            maxLength: 64
          costAmount:
            type: string
            maxLength: 64
          currency:
            type: string
            maxLength: 16
      metadata:
        type: object
        additionalProperties: true
