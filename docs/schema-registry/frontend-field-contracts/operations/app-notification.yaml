fragment: operations/app-notification
frontend_operations:
- route: /console/notifications
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-messages/src/messagesService.ts
  operation: fetchMessages
  operation_id: notifications.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/notification/notifications
  sdk_domain: notification
  openapi_exposed: false
  summary: List portal notifications through console messages facade
  description: Console messages facade that delegates to the notification service boundary.
  read_sources:
  - ops_notification_message
  - ops_notification_delivery
- route: /console/notifications
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-messages/src/messagesService.ts
  operation: acknowledge
  operation_id: notifications.acknowledge.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/notification/notifications/{notificationId}/acknowledge
  sdk_domain: notification
  openapi_exposed: false
  idempotency_required: true
  request_body_required: false
  summary: Acknowledge portal notification through console messages facade
  description: Console messages facade that delegates to the notification service boundary.
  read_sources:
  - ops_notification_delivery
  write_tables:
  - ops_notification_delivery
- route: /console/notifications
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-messages/src/messagesService.ts
  operation: markPopupSeen
  operation_id: notifications.popupSeen.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/notification/notifications/{notificationId}/popup_seen
  sdk_domain: notification
  openapi_exposed: false
  idempotency_required: true
  request_body_required: false
  summary: Mark portal notification popup seen through console messages facade
  description: Console messages facade that delegates to the notification service boundary.
  read_sources:
  - ops_notification_delivery
  write_tables:
  - ops_notification_delivery
- route: /console/notifications
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/notificationService.ts
  operation: fetchNotifications
  operation_id: notifications.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/notification/notifications
  sdk_domain: notification
  summary: List portal notifications
  description: Lists in-app notifications through the notification-pc-react service boundary.
  read_sources:
  - ops_notification_message
  - ops_notification_delivery
  query_parameters:
  - name: include_archived
    schema: { type: boolean }
  - name: page
    schema: { type: integer, format: int64, minimum: 1 }
  - name: page_size
    schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
  response_schema:
    name: NotificationListResponse
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        maxItems: 200
        items:
          name: NotificationItem
          type: object
          additionalProperties: false
          required: [id, appId, title, desc, content, time, type, read, showAsPopup, popupSeen, archived]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            appId: { type: string, minLength: 1, maxLength: 128 }
            title: { type: string, minLength: 1, maxLength: 200 }
            desc: { type: string, maxLength: 512 }
            content: { type: string, maxLength: 20000 }
            time: { type: string, minLength: 1, maxLength: 64 }
            type: { type: string, enum: [info, billing, warning, alert] }
            read: { type: boolean }
            showAsPopup: { type: boolean }
            popupSeen: { type: boolean }
            archived: { type: boolean }
            actionUrl: { type: string, nullable: true, maxLength: 512 }
- route: /console/notifications
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/notificationService.ts
  operation: list
  operation_id: notifications.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/notification/notifications
  sdk_domain: notification
  openapi_exposed: false
  summary: List portal notifications through composed notification service
  description: Internal composed notification service list operation used by the notification-pc-react boundary.
  read_sources:
  - ops_notification_message
  - ops_notification_delivery
  query_parameters: []
- route: /console/notifications
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/notificationService.ts
  operation: acknowledge
  operation_id: notifications.acknowledge.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/notification/notifications/{notificationId}/acknowledge
  sdk_domain: notification
  idempotency_required: true
  request_body_required: false
  summary: Acknowledge portal notification
  description: Marks a notification as read through the notification-pc-react service boundary.
  read_sources:
  - ops_notification_delivery
  write_tables:
  - ops_notification_delivery
  response_schema:
    name: NotificationMutationResponse
    type: object
    additionalProperties: false
    required: [updated, state]
    properties:
      updated: { type: boolean }
      state: { type: string, enum: [acknowledged, popup_seen] }
- route: /console/notifications
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawroutes-pc-commons/src/notificationService.ts
  operation: markPopupSeen
  operation_id: notifications.popupSeen.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/notification/notifications/{notificationId}/popup_seen
  sdk_domain: notification
  idempotency_required: true
  request_body_required: false
  summary: Mark portal notification popup seen
  description: Records popup presentation through the notification-pc-react service boundary.
  read_sources:
  - ops_notification_delivery
  write_tables:
  - ops_notification_delivery
  response_schema:
    name: NotificationMutationResponse
    type: object
    additionalProperties: false
    required: [updated, state]
    properties:
      updated: { type: boolean }
      state: { type: string, enum: [acknowledged, popup_seen] }
