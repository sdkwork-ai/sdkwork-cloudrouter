- route: /admin/group
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-group/src/groupService.ts
  operation: fetchRuntimeRouteExplain
  operation_scope: app_shell
  operation_id: routeExplain.create
  kind: action
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/ai/route_explain
  read_sources:
  - ai_api_key
  - ai_channel_group
  - ai_channel_group_member
  - ai_model_provider_route
  - ai_provider_route
  - ai_routing_policy
  - ai_routing_rule
  - ai_model_pricing
  - ai_pricing_plan
  request_schema:
    name: AdminRuntimeRouteExplainRequest
    type: object
    additionalProperties: false
    required:
    - apiKeyId
    properties:
      apiKeyId:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[1-9][0-9]*$
        description: API key id whose owner scope and route group are used by the runtime selector.
      channelGroupId:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[1-9][0-9]*$
        description: Optional channel group id. Defaults to the API key's bound group.
      resourceCode:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
        description: Requested resource code, such as api.openai.chat_completions.
      catalogKey:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:/-]+$
        description: Optional model catalog key. When present the runtime selector explains model route planning.
      model:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:/-]+$
        description: Requested model or provider-native model identifier.
      apiCode:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
        description: API endpoint code used for route and channel scope matching.
      capability:
        type: string
        enum:
        - chat
        - image
        - audio
        - music
        - video
        - embedding
        - rerank
        - network
        description: Runtime routing capability to evaluate. Defaults to chat.
      billingMeter:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z0-9_]+$
        description: Billing meter used by pricing readiness checks.
      routeKey:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
        description: Non-model route key used when catalogKey is absent.
  response_schema:
    name: AdminRuntimeRouteExplainResponse
    type: object
    additionalProperties: false
    required:
    - source
    - ready
    - resourceCode
    - catalogKey
    - model
    - apiCode
    - capability
    - billingMeter
    - apiKeyId
    - channelGroupId
    - groupCode
    - pricingPlanCode
    - candidateCount
    - selectedCandidates
    - blockedReasons
    - warnings
    - policyId
    - ruleId
    - policySnapshotVersion
    properties:
      source:
        type: string
        enum:
        - runtime_selector
        description: Explains the live runtime ProviderRouteSelector decision for one request shape.
      ready:
        type: boolean
      resourceCode:
        type: string
        minLength: 1
        maxLength: 128
      catalogKey:
        type:
        - string
        - 'null'
        maxLength: 128
      model:
        type:
        - string
        - 'null'
        maxLength: 128
      apiCode:
        type: string
        minLength: 1
        maxLength: 128
      capability:
        type: string
        enum:
        - chat
        - image
        - audio
        - music
        - video
        - embedding
        - rerank
        - network
      billingMeter:
        type: string
        minLength: 1
        maxLength: 64
      apiKeyId:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[1-9][0-9]*$
      channelGroupId:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[1-9][0-9]*$
      groupCode:
        type: string
        minLength: 1
        maxLength: 128
      pricingPlanCode:
        type: string
        minLength: 1
        maxLength: 128
      candidateCount:
        type: integer
        minimum: 0
      selectedCandidates:
        type: array
        maxItems: 64
        items:
          name: AdminRuntimeRouteExplainCandidate
          type: object
          additionalProperties: false
          required:
          - kind
          - providerCode
          - channelId
          - channelGroupId
          - channelGroupCode
          - pricingPlanCode
          - policyId
          - ruleId
          - apiCode
          - catalogKey
          - requestedModel
          - providerModel
          - regionCode
          - credentialId
          - credentialRotation
          - timeoutMs
          properties:
            kind:
              type: string
              enum:
              - model
              - channel
            providerCode:
              type: string
              minLength: 1
              maxLength: 128
            channelId:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[1-9][0-9]*$
            channelGroupId:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[1-9][0-9]*$
            channelGroupCode:
              type: string
              minLength: 1
              maxLength: 128
            pricingPlanCode:
              type: string
              minLength: 1
              maxLength: 128
            policyId:
              type:
              - string
              - 'null'
              maxLength: 128
              pattern: ^[1-9][0-9]*$
            ruleId:
              type:
              - string
              - 'null'
              maxLength: 128
              pattern: ^[1-9][0-9]*$
            apiCode:
              type: string
              maxLength: 128
            catalogKey:
              type:
              - string
              - 'null'
              maxLength: 128
            requestedModel:
              type:
              - string
              - 'null'
              maxLength: 128
            providerModel:
              type:
              - string
              - 'null'
              maxLength: 128
            regionCode:
              type: string
              maxLength: 64
            credentialId:
              type:
              - string
              - 'null'
              maxLength: 128
              pattern: ^[1-9][0-9]*$
            credentialRotation:
              type:
              - string
              - 'null'
              maxLength: 64
            timeoutMs:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 86400000
      blockedReasons:
        type: array
        maxItems: 32
        items:
          name: AdminRuntimeRouteExplainIssue
          type: object
          additionalProperties: false
          required:
          - code
          - severity
          - message
          properties:
            code:
              type: string
              enum: &adminRuntimeRouteExplainIssueCodeEnum
              - route.unavailable
              - pricing.unavailable
            severity:
              type: string
              enum:
              - blocking
              - warning
              - info
            message:
              type: string
              minLength: 1
              maxLength: 2048
      warnings:
        type: array
        maxItems: 32
        items:
          name: AdminRuntimeRouteExplainIssue
          type: object
          additionalProperties: false
          required:
          - code
          - severity
          - message
          properties:
            code:
              type: string
              enum: *adminRuntimeRouteExplainIssueCodeEnum
            severity:
              type: string
              enum:
              - blocking
              - warning
              - info
            message:
              type: string
              minLength: 1
              maxLength: 2048
      policyId:
        type:
        - string
        - 'null'
        maxLength: 128
        pattern: ^[1-9][0-9]*$
      ruleId:
        type:
        - string
        - 'null'
        maxLength: 128
        pattern: ^[1-9][0-9]*$
      policySnapshotVersion:
        type: string
        minLength: 1
        maxLength: 128
