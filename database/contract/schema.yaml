    constraints:
      - name: pk_ai_config_change_event
        type: primary_key
        columns:
          - id
      - name: ck_ai_config_change_event_tenant_scope
        type: check
        columns:
          - tenant_id
          - organization_id
        expression: tenant_id > 0 AND organization_id >= 0
      - name: uk_ai_config_change_event_uuid
        type: unique
        columns: &id001
          - uuid
        where: null
