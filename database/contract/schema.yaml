    constraints:
      - name: pk_ai_usage
        type: primary_key
        columns:
          - id
      - name: ck_ai_usage_tenant_scope
        type: check
        columns:
          - tenant_id
          - organization_id
        expression: tenant_id > 0 AND organization_id >= 0
      - name: uk_ai_usage_scope_id
        type: unique
        columns: &id048
          - tenant_id
          - organization_id
          - id
        where: null
      - name: uk_ai_usage_idempotency
        type: unique
        columns: &id049
          - tenant_id
          - organization_id
          - idempotency_key
        where: null
      - name: uk_ai_usage_request
        type: unique
        columns: &id050
          - tenant_id
          - organization_id
          - request_id
          - usage_type
        where: null
      - name: ck_ai_usage_non_negative_counts
        type: check
        columns: []
        expression: (prompt_tokens IS NULL OR prompt_tokens >= 0) AND (completion_tokens IS NULL OR completion_tokens >= 0)
          AND (cached_tokens IS NULL OR cached_tokens >= 0) AND (total_tokens IS NULL OR total_tokens >= 0) AND (request_count
          IS NULL OR request_count >= 0) AND (result_count IS NULL OR result_count >= 0) AND (item_count IS NULL OR item_count
          >= 0) AND (character_count IS NULL OR character_count >= 0) AND (image_count IS NULL OR image_count >= 0)
      - name: ck_ai_usage_non_negative_amounts
        type: check
        columns: []
        expression: billable_quantity >= 0 AND (audio_seconds IS NULL OR audio_seconds >= 0) AND (video_seconds IS NULL OR
          video_seconds >= 0) AND (storage_byte_hours IS NULL OR storage_byte_hours >= 0) AND (official_reference_amount IS
          NULL OR official_reference_amount >= 0) AND (upstream_cost_amount IS NULL OR upstream_cost_amount >= 0) AND (customer_charge_amount
          IS NULL OR customer_charge_amount >= 0)
      - name: ck_ai_usage_currency
        type: check
        columns: []
        expression: length(trim(currency)) BETWEEN 3 AND 10
    indexes:
      - name: uk_ai_usage_scope_id
        columns: *id048
        unique: true
        where: null
      - name: uk_ai_usage_idempotency
        columns: *id049
        unique: true
        where: null
      - name: uk_ai_usage_request
        columns: *id050
