        postgres_type: VARCHAR(3)
        constraints: NOT NULL
      conditions:
        type: json
        required: true
        postgres_type: JSONB
        constraints: NOT NULL DEFAULT '[]'::jsonb
      tiers:
        type: json
        required: true
        postgres_type: JSONB
        constraints: NOT NULL DEFAULT '[]'::jsonb
      formula:
        type: json
        required: false
        postgres_type: JSONB
        constraints: ''
      priority:
        type: int32
        required: true
        postgres_type: INTEGER
        constraints: NOT NULL
      rate_variant:
        type: string(32)
        required: true
        postgres_type: VARCHAR(32)
        constraints: NOT NULL DEFAULT 'standard'
      schedule:
        type: json
        required: false
        postgres_type: JSONB
        constraints: ''
      effective_from:
        type: instant
        required: true
        postgres_type: TIMESTAMPTZ
        constraints: NOT NULL
      effective_to:
        type: instant
        required: false
        postgres_type: TIMESTAMPTZ
        constraints: ''
      source_url:
        type: string(2048)
        required: true
        postgres_type: VARCHAR(2048)
        constraints: NOT NULL
      source_observed_at:
        type: instant
        required: true
        postgres_type: TIMESTAMPTZ
        constraints: NOT NULL
    constraints:
      - name: pk_pricing_rate
        type: primary_key
        columns:
          - id
      - name: ck_pricing_rate_tenant_scope
        type: check
        columns:
          - tenant_id
          - organization_id
        expression: tenant_id >= 0 AND organization_id >= 0 AND (tenant_id > 0 OR organization_id = 0)
      - name: uk_pricing_rate_uuid
        type: unique
        columns: &id012
          - uuid
        where: null
      - name: uk_pricing_rate_scope_id
        type: unique
        columns: &id013
          - tenant_id
          - organization_id
          - id
        where: null
      - name: uk_pricing_rate_book_code
        type: unique
        columns: &id014
          - tenant_id
          - organization_id
          - price_book_id
          - rate_code
        where: null
      - name: uk_pricing_rate_book_hash
        type: unique
        columns: &id015
          - tenant_id
          - organization_id
          - price_book_id
          - rate_hash
        where: null
      - name: fk_pricing_rate_book
        type: foreign_key
        columns:
          - tenant_id
          - organization_id
          - price_book_id
        references_table: pricing_price_book
        references_columns:
          - tenant_id
          - organization_id
          - id
        on_delete: RESTRICT
      - name: fk_pricing_rate_book_dimensions
        type: foreign_key
        columns:
          - tenant_id
          - organization_id
          - price_book_id
          - vendor_code
          - region_code
          - currency_code
        references_table: pricing_price_book
        references_columns:
          - tenant_id
          - organization_id
          - id
          - vendor_code
          - region_code
          - currency_code
        on_delete: RESTRICT
      - name: ck_pricing_rate_quantities
        type: check
        columns: []
        expression: unit_size > 0 AND unit_price >= 0 AND minimum_quantity >= 0 AND (quantity_step IS NULL OR quantity_step
          > 0)
      - name: ck_pricing_rate_interval
        type: check
        columns: []
        expression: effective_to IS NULL OR effective_to > effective_from
      - name: ck_pricing_rate_billability
        type: check
        columns: []
        expression: billability IN ('chargeable', 'free', 'not_applicable', 'unknown')
      - name: ck_pricing_rate_charge_timing
        type: check
        columns: []
        expression: charge_timing IN ('request_accepted', 'successful_result', 'usage_reported')
      - name: ck_pricing_rate_calculation_mode
        type: check
        columns: []
        expression: calculation_mode IN ('per_unit', 'flat', 'graduated', 'volume', 'formula')
      - name: ck_pricing_rate_quantity_aggregation
        type: check
        columns: []
        expression: quantity_aggregation IN ('sum', 'maximum', 'minimum', 'last', 'distinct_invocation')
      - name: ck_pricing_rate_flat_unit_size
        type: check
        columns: []
        expression: calculation_mode <> 'flat' OR unit_size = 1
      - name: ck_pricing_rate_chargeable_price
        type: check
        columns: []
        expression: billability <> 'chargeable' OR unit_price > 0
      - name: ck_pricing_rate_non_chargeable_price
        type: check
        columns: []
        expression: billability NOT IN ('free', 'not_applicable') OR unit_price = 0
      - name: ck_pricing_rate_currency
        type: check
        columns: []
        expression: currency_code ~ '^[A-Z]{3}$'
      - name: ck_pricing_rate_conditions_json
        type: check
        columns: []
        expression: jsonb_typeof(conditions) = 'array'
      - name: ck_pricing_rate_tiers_json
        type: check
        columns: []
        expression: jsonb_typeof(tiers) = 'array'
      - name: ck_pricing_rate_formula_json
        type: check
        columns: []
        expression: formula IS NULL OR jsonb_typeof(formula) = 'object'
      - name: ck_pricing_rate_variant
        type: check
        columns: []
        expression: rate_variant IN ('standard', 'time_window')
      - name: ck_pricing_rate_schedule_json
        type: check
        columns: []
        expression: schedule IS NULL OR jsonb_typeof(schedule) = 'object'
      - name: ck_pricing_rate_schedule_variant
        type: check
        columns: []
        expression: (rate_variant = 'standard' AND schedule IS NULL) OR (rate_variant = 'time_window' AND schedule IS NOT
          NULL)
      - name: ck_pricing_rate_calculation_payload
        type: check
        columns: []
        expression: (calculation_mode IN ('graduated', 'volume')) = (jsonb_array_length(tiers) > 0) AND (calculation_mode
          = 'formula') = (formula IS NOT NULL)
    indexes:
      - name: uk_pricing_rate_uuid
        columns: *id012
        unique: true
        where: deleted_at IS NULL
      - name: uk_pricing_rate_scope_id
        columns: *id013
        unique: true
        where: deleted_at IS NULL
      - name: uk_pricing_rate_book_code
        columns: *id014
        unique: true
        where: deleted_at IS NULL
      - name: uk_pricing_rate_book_hash
        columns: *id015
        unique: true
        where: deleted_at IS NULL
      - name: uq_pricing_rate_scope_reference
        columns:
          - tenant_id
          - organization_id
          - id
        unique: true
        where: null
      - name: uq_pricing_rate_scope_book_reference
        columns:
          - tenant_id
          - organization_id
          - id
          - price_book_id
        unique: true
        where: null
      - name: idx_pricing_rate_resolve
        columns:
          - tenant_id
          - organization_id
          - catalog_key
          - product_code
          - operation_code
          - meter_code
          - provider_code
          - region_code
          - billability
          - status
          - priority
          - effective_from
          - id
        unique: false
        where: null
    source_tables: []
    source_refs: []
    projection_policy: null
    lifecycle: null
    semantic_contracts: null
    frontend_routes: []
