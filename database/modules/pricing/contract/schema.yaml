    constraints:
      - name: pk_pricing_import_run
        type: primary_key
        columns:
          - id
      - name: ck_pricing_import_run_tenant_scope
        type: check
        columns:
          - tenant_id
          - organization_id
        expression: tenant_id >= 0 AND organization_id >= 0 AND (tenant_id > 0 OR organization_id = 0)
      - name: uk_pricing_import_run_uuid
        type: unique
        columns: &id001
          - uuid
        where: null
      - name: uk_pricing_import_run_scope_id
        type: unique
        columns: &id002
          - tenant_id
          - organization_id
          - id
        where: null
      - name: uk_pricing_import_run_source
        type: unique
        columns: &id003
          - tenant_id
          - organization_id
          - source_system
          - source_catalog_version
          - source_hash
        where: null
      - name: ck_pricing_import_run_counts
        type: check
        columns: []
        expression: row_count >= 0 AND accepted_count >= 0 AND rejected_count >= 0 AND accepted_count + rejected_count <=
          row_count
      - name: ck_pricing_import_run_state
        type: check
        columns: []
        expression: import_state IN ('staging', 'validated', 'activated', 'rejected', 'failed')
