          - id
        unique: false
        where: null
    source_tables: []
    source_refs: []
    projection_policy: null
    lifecycle:
      storage_strategy: indexed_append_only
      retention:
        online_retention: 24mo
        archive_retention: 7y
        grace_period: 24h
      cleanup:
        owner: pricing-service
        scope: platform_cross_tenant
        authorization:
          mode: service_identity
          service: pricing-service
          audit_required: true
        candidate_recheck:
          required: true
          operations:
            - archive
            - delete
          key_columns:
            - tenant_id
            - organization_id
            - id
        batch_size: 1000
        predicate: retention_until IS NOT NULL AND retention_until <= :now AND legal_hold = false
        archive_before_delete: true
        retry:
          max_attempts: 5
          backoff:
            strategy: exponential
            initial: 1s
            maximum: 5m
        monitoring:
          metrics:
            - cleanup_candidates
            - cleanup_archived
            - cleanup_deleted
            - cleanup_failures
          alerts:
            - retention_lag
            - retry_exhausted
        dry_run:
          supported: true
          default: true
    semantic_contracts: null
    frontend_routes: []
