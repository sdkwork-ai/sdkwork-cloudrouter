      payment_intent_id: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL }
      order_id: { type: string(128), required: true, postgres_type: TEXT, constraints: NOT NULL }
      provider: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      out_trade_no: { type: string(128), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      amount: { type: string(32), required: true, postgres_type: TEXT, constraints: NOT NULL }
      currency_code: { type: string(10), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT 'CNY' }
      status: { type: string(32), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT 'requires_confirmation' }
      callback_payload: { type: json_text, required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '{}' }
      paid_at: { type: instant, required: false, postgres_type: TIMESTAMPTZ, constraints: '' }
      created_at: { type: instant, required: true, postgres_type: TIMESTAMPTZ, constraints: NOT NULL DEFAULT NOW() }
      updated_at: { type: instant, required: true, postgres_type: TIMESTAMPTZ, constraints: NOT NULL DEFAULT NOW() }
    indexes:
      - idx_commerce_payment_attempt_intent (tenant_id, payment_intent_id)
      - idx_commerce_payment_attempt_out_trade_no (tenant_id, out_trade_no)
