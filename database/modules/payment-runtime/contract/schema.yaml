      provider_error_code: { type: string(128), required: false, postgres_type: TEXT, constraints: '' }
      provider_error_message: { type: string(1024), required: false, postgres_type: TEXT, constraints: '' }
      retryable: { type: boolean, required: true, postgres_type: BOOLEAN, constraints: NOT NULL DEFAULT FALSE }
      status: { type: string(32), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT 'PENDING' }
      started_at: { type: instant, required: true, postgres_type: TIMESTAMPTZ, constraints: NOT NULL }
      completed_at: { type: instant, required: false, postgres_type: TIMESTAMPTZ, constraints: '' }
      created_at: { type: instant, required: true, postgres_type: TIMESTAMPTZ, constraints: NOT NULL DEFAULT NOW() }
