schema_version: 1
kind: sdkwork.database.schema
database_role: authoritative-server
module_id: payment-runtime
contract_version: 0.1.0
owner_team: sdkwork-cloudrouter
compliance_level: L2
engines:
  - postgres
table_prefix: commerce_
tables:
  - name: commerce_payment_intent
    lifecycle_status: active
    owner: sdkwork-cloudrouter
    domain: payment
    profile: payment_runtime_entity
    compliance_level: L2
    system_of_record: true
    write_owner: router-service
    columns:
      id: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL PRIMARY KEY }
      tenant_id: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL }
      organization_id: { type: string(64), required: false, postgres_type: TEXT, constraints: '' }
      owner_user_id: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL }
      order_id: { type: string(128), required: true, postgres_type: TEXT, constraints: NOT NULL }
      merchant_order_no: { type: string(128), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      subject: { type: string(256), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      provider: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      supplier_code: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      payment_method: { type: string(64), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      scene_code: { type: string(32), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT 'web' }
      amount: { type: string(32), required: true, postgres_type: TEXT, constraints: NOT NULL }
      currency_code: { type: string(10), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT 'CNY' }
      status: { type: string(32), required: true, postgres_type: TEXT, constraints: 'NOT NULL CHECK (status IN (''requires_confirmation'', ''requires_action'', ''processing'', ''succeeded'', ''failed'', ''canceled''))' }
      request_no: { type: string(128), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '' }
      idempotency_key: { type: string(128), required: true, postgres_type: TEXT, constraints: NOT NULL }
      metadata_json: { type: json_text, required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '{}' }
      provider_native_json: { type: json_text, required: false, postgres_type: TEXT, constraints: '' }
      next_action_json: { type: json_text, required: false, postgres_type: TEXT, constraints: '' }
      captured_amount: { type: string(32), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '0.00' }
      refunded_amount: { type: string(32), required: true, postgres_type: TEXT, constraints: NOT NULL DEFAULT '0.00' }
      version: { type: int64, required: true, postgres_type: BIGINT, constraints: NOT NULL DEFAULT 0 }
      created_at: { type: instant, required: true, postgres_type: TIMESTAMPTZ, constraints: NOT NULL DEFAULT NOW() }
      updated_at: { type: instant, required: true, postgres_type: TIMESTAMPTZ, constraints: NOT NULL DEFAULT NOW() }
      deleted_at: { type: instant, required: false, postgres_type: TIMESTAMPTZ, constraints: '' }
    indexes:
      - ux_commerce_payment_intent_tenant_idempotency UNIQUE (tenant_id, idempotency_key)
      - idx_commerce_payment_intent_owner (tenant_id, owner_user_id, created_at DESC, id)
      - idx_commerce_payment_intent_status (tenant_id, status, created_at)
  - name: commerce_payment_attempt
