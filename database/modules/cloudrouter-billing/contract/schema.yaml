          - tenant_id
          - organization_id
          - id
        on_delete: RESTRICT
      - name: ck_cloudrouter_account_rate_card_subject
        type: check
        columns: []
        expression: (subject_id IS NOT NULL AND subject_code IS NULL) OR (subject_id IS NULL AND subject_code IS NOT NULL)
      - name: ck_cloudrouter_account_rate_card_subject_type
        type: check
        columns: []
        expression: subject_type IN ('default', 'api_key', 'account_group', 'account', 'user', 'organization')
      - name: ck_cloudrouter_account_rate_card_interval
        type: check
        columns: []
        expression: effective_to IS NULL OR effective_to > effective_from
    indexes:
