          - tenant_id
          - organization_id
          - id
        on_delete: RESTRICT
      - name: ck_cloudrouter_charge_line_amount
        type: check
        columns: []
        expression: quantity > 0 AND reference_amount >= 0 AND cost_amount >= 0 AND amount > 0
      - name: ck_cloudrouter_charge_line_status
        type: check
        columns: []
        expression: charge_status IN ('rated', 'pending', 'settled', 'reversed', 'failed')
      - name: ck_cloudrouter_charge_line_currency
        type: check
        columns: []
        expression: currency_code ~ '^[A-Z]{3}$'
      - name: ck_cloudrouter_charge_line_settlement
        type: check
        columns: []
        expression: (settlement_id IS NULL AND settled_at IS NULL) OR (settlement_id IS NOT NULL AND settled_at IS NOT NULL)
