name: Verify Application

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdkwork
          POSTGRES_PASSWORD: sdkwork-ci
          POSTGRES_DB: sdkwork_clawrouter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdkwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SDKWORK_CLAW_POSTGRES_TEST_DATABASE_URL: postgres://sdkwork:sdkwork-ci@localhost:5432/sdkwork_clawrouter_ci
      CLAWROUTER_BROWSER_SMOKE_REQUIRED: "1"
      CLAWROUTER_EDGE_DEV_SMOKE_REQUIRED: "1"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo audit/deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust formatting check
        run: pnpm format:rust:check

      - name: Rust clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Alignment check
        run: pnpm check:alignment

      - name: API standard extensions
        run: pnpm api:standard-extensions:check

      - name: Install PC workspace dependencies
        working-directory: apps/sdkwork-clawrouter-pc
        run: pnpm install --frozen-lockfile

      - name: PC workspace typecheck
        working-directory: apps/sdkwork-clawrouter-pc
        run: pnpm typecheck

      - name: PC workspace lint
        working-directory: apps/sdkwork-clawrouter-pc
        run: pnpm lint

      - name: PC workspace tests
        working-directory: apps/sdkwork-clawrouter-pc
        run: pnpm test

      - name: PC bundle size check
        working-directory: apps/sdkwork-clawrouter-pc
        run: pnpm size

      - name: Product verification (CI)
        run: pnpm verify:ci --parallel --concurrency 4

      - name: PostgreSQL integration tests (required)
        run: pnpm test:postgres:required

      - name: Browser smoke
        run: pnpm verify

      - name: Edge dev smoke
        run: pnpm verify -- --with-edge-dev-smoke

  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo audit/deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Cargo audit (Rust vulnerabilities)
        run: cargo audit --deny warnings

      - name: Cargo deny (licenses, advisories, bans)
        run: cargo deny check advisories bans licenses sources

      - name: Gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan (high/critical fail)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: pnpm audit (npm vulnerabilities)
        run: pnpm audit --audit-level=high

  supply-chain:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate multi-ecosystem SBOM with syft (cargo + npm + pnpm)
        uses: anchore/syft-action@v1
        with:
          path: .
          format: spdx-json
          output-file: /tmp/sbom-ci.spdx.json

      - name: Verify syft SBOM covers cargo and npm ecosystems
        run: |
          node -e "
          const fs = require('fs');
          const sbom = JSON.parse(fs.readFileSync('/tmp/sbom-ci.spdx.json', 'utf8'));
          let cargo = 0, npm = 0;
          for (const p of sbom.packages || []) {
            for (const r of p.externalRefs || []) {
              if (r.referenceCategory === 'PACKAGE-MANAGER') {
                if (r.referenceLocator.startsWith('pkg:cargo')) cargo++;
                if (r.referenceLocator.startsWith('pkg:npm')) npm++;
              }
            }
          }
          console.log('syft SBOM ecosystem coverage: ' + cargo + ' cargo, ' + npm + ' npm packages');
          if (cargo < 1) { console.error('FAIL: syft SBOM has no cargo packages'); process.exit(1); }
          if (npm < 1) { console.error('FAIL: syft SBOM has no npm packages; frontend dependencies missing'); process.exit(1); }
          console.log('syft multi-ecosystem SBOM verification OK');
          "

      - name: Validate committed sbom.spdx.json (inputHashes + npm coverage)
        run: |
          node -e "
          const sbom = require('./deployments/artifacts/sbom.spdx.json');
          const h = (sbom.provenance && sbom.provenance.inputHashes) || {};
          if (!h.cargoLock) throw new Error('sbom.spdx.json: cargoLock hash missing');
          if (!h.rootPnpmLock) throw new Error('sbom.spdx.json: rootPnpmLock hash missing');
          if (!h.pcPnpmLock) throw new Error('sbom.spdx.json: pcPnpmLock is null; PC workspace lockfile hash must be populated');
          const cargo = (sbom.packages || []).filter(p => p.packageType === 'cargo').length;
          const npm = (sbom.packages || []).filter(p => p.packageType === 'npm').length;
          console.log('committed SBOM: ' + cargo + ' cargo, ' + npm + ' npm packages');
          if (npm < 1) throw new Error('committed SBOM has no npm packages; frontend dependencies missing');
          console.log('sbom.spdx.json validation OK');
          "

      - name: Validate committed checksums.json (5 install packages)
        run: |
          node -e "
          const cs = require('./deployments/artifacts/checksums.json');
          const arts = cs.artifacts || [];
          if (arts.length !== 5) throw new Error('expected 5 install package artifacts, got ' + arts.length);
          for (const a of arts) {
            for (const f of ['name', 'path', 'sha256', 'reproducible']) {
              if (!(f in a)) throw new Error('artifact missing required field \"' + f + '\": ' + JSON.stringify(a));
            }
          }
          console.log('checksums.json validation OK: ' + arts.length + ' artifacts');
          "

      - name: SBOM generator dry-run check
        run: node scripts/generate-release-sbom.mjs --check

  e2e:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3901
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install PC workspace dependencies
        working-directory: apps/sdkwork-clawrouter-pc
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: apps/sdkwork-clawrouter-pc
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: apps/sdkwork-clawrouter-pc
        env:
          CI: "true"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/sdkwork-clawrouter-pc/playwright-report/
          retention-days: 7
