name: Verify Application

# Thin verification entrypoint. Runner setup, dependency checkouts, toolchain
# versions, and the install command come from the reusable SDKWork CI workflow
# and `agent.workflow.json`; this file only selects the triggers and the gate
# scripts. Never add inline setup, install, or gate commands here — declare them
# in `agent.workflow.json` or the repository's package scripts instead.
#
# `verify:ci` runs the full commercial-contract guardian plan, Rust checks, SDK
# builds, and the schema quality gate without a database. The database-backed
# gates (PostgreSQL integration tests, browser smoke, edge dev smoke) and the
# security/supply-chain/E2E lanes live in `application-gates.yml`, which owns
# the PostgreSQL service container.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-ci.yml@2121cc5f1385e8e561171d01fbb71f11adbda187
    with:
      config_path: agent.workflow.json
      scripts: verify:ci
      install_command: pnpm install --no-frozen-lockfile
      os_matrix: '["ubuntu-24.04"]'
      framework_ref: 2121cc5f1385e8e561171d01fbb71f11adbda187
    secrets:
      SDKWORK_RELEASE_TOKEN: ${{ secrets.SDKWORK_RELEASE_TOKEN }}
