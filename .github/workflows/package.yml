name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.1.0
      package_version:
        description: Package version used in artifact names and manifests.
        required: true
        default: 0.1.0
      deployment_profile:
        description: Deployment profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - standalone
          - cloud
      runtime_target:
        description: Runtime target filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
          - desktop
          - tablet-ipados
          - tablet-android
          - capacitor-ios
          - capacitor-android
          - flutter-ios
          - flutter-android
          - android-native
          - ios-native
          - harmony-native
          - mini-program
          - server
          - container
          - test-runner
      platform:
        description: Platform filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - android-tablet
          - ios
          - ipados
          - windows-tablet
          - web
          - h5
          - h5-weixin
          - harmony
          - container
          - mp-weixin
      architecture:
        description: Architecture filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
          - armv7
          - universal
          - wasm32
          - noarch
      profile:
        description: Package profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
          - server
          - desktop
          - mobile
          - tablet
          - mini-program
          - container
          - worker
          - library
          - test
      variant:
        description: Package variant filter.
        required: true
        default: all
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging.
        required: true
        default: false
        type: boolean

      sdkwork_account_ref:
        description: 'SDKWORK_ACCOUNT_REF dependency ref; blank falls back to the repository variable.'
        required: false
        default: ''
      sdkwork_agents_ref:
        description: 'SDKWORK_AGENTS_REF dependency ref; blank falls back to the repository variable.'
