name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.3.0
      package_version:
        description: Package version used in artifact names and manifests.
        required: true
        default: 0.3.0
      platform:
        description: Platform filter.
        required: true
        default: all
      architecture:
        description: CPU architecture filter.
        required: true
        default: all
      profile:
        description: Runtime profile filter.
        required: true
        default: all
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging.
        required: true
        default: false
        type: boolean
      sdkwork_appbase_ref:
        description: sdkwork-appbase commit/ref.
        required: false
        default: ba3a5103dd0a895a11dcda3ea2e5bac5428f38aa
      sdkwork_core_ref:
        description: sdkwork-core commit/ref.
        required: false
        default: 1cb61734ab62e1954ba7fcc3b7cd5465e6914149
      sdkwork_ui_ref:
        description: sdkwork-ui commit/ref.
        required: false
        default: e53d25425dd13ec02d5e0173e79245d32c5926ff
      sdkwork_drive_ref:
        description: sdkwork-drive commit/ref.
        required: false
        default: 46245a721cca19262c68742a7506a8a0aa752291
      sdkwork_generations_ref:
