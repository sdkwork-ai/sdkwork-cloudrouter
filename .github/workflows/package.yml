name: Package Application

# Thin reusable workflow call (GITHUB_WORKFLOW_SPEC.md section 2). All build,
# package, validate, sign, SBOM, and release-upload behavior lives in
# sdkwork.workflow.json lifecycle steps and in the sdkwork-github-workflow
# framework. Do not add matrix, upload, changelog, or attestation logic here.
#
# DISPATCH INPUT BUDGET — GitHub rejects the whole file above 25
# workflow_dispatch inputs (raised from 10 in December 2025); an over-budget
# file never runs at all, not even for a tag push. This repository has
# 49 dependencies, so per-dependency dispatch inputs exist only for the
# 10 dependencies pinned to a fixed ref. Every other dependency resolves
# through its repository variable (vars.SDKWORK_*_REF) and defaults to the ref
# declared in sdkwork.workflow.json. Current budget: 20 of 25.

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.4.2
      package_version:
        description: Package version used in artifact names and manifests.
        required: true
        default: 0.4.2
      deployment_profile:
        description: Deployment profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - standalone
          - cloud
      runtime_target:
        description: Runtime target filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
          - desktop
          - tablet-ipados
          - tablet-android
          - capacitor-ios
          - capacitor-android
          - flutter-ios
          - flutter-android
          - android-native
          - ios-native
          - harmony-native
          - mini-program
          - server
          - container
          - test-runner
      platform:
        description: Platform filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - android-tablet
          - ios
          - ipados
          - windows-tablet
          - web
          - h5
          - h5-weixin
          - harmony
          - container
          - mp-weixin
      architecture:
        description: Architecture filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
          - armv7
          - universal
          - wasm32
          - noarch
      profile:
        description: Package profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - browser
          - server
          - desktop
          - mobile
          - tablet
          - mini-program
          - container
          - worker
          - library
          - test
      variant:
        description: Package variant filter.
        required: true
        default: all
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging.
        required: true
        default: false
        type: boolean
      sdkwork_appbase_ref:
        description: sdkwork-appbase commit/ref override.
        required: false
        default: ba3a5103dd0a895a11dcda3ea2e5bac5428f38aa
      sdkwork_core_ref:
        description: sdkwork-core commit/ref override.
        required: false
        default: 1cb61734ab62e1954ba7fcc3b7cd5465e6914149
      sdkwork_database_ref:
        description: sdkwork-database commit/ref override.
        required: false
        default: main
      sdkwork_drive_ref:
        description: sdkwork-drive commit/ref override.
        required: false
        default: 46245a721cca19262c68742a7506a8a0aa752291
      sdkwork_generations_ref:
        description: sdkwork-generations commit/ref override.
        required: false
        default: 5823633ca3efc930f9c500e5c91e53e7210cae44
      sdkwork_image_ref:
        description: sdkwork-image commit/ref override.
        required: false
        default: 19aa219bee6bf9e926c73433748add88c0917083
      sdkwork_sdk_generator_ref:
        description: sdkwork-sdk-generator commit/ref override.
        required: false
        default: e11d0c69f7a19ad5e9bb680f22ac392e98a2bc49
      sdkwork_ui_ref:
        description: sdkwork-ui commit/ref override.
        required: false
        default: e53d25425dd13ec02d5e0173e79245d32c5926ff
      sdkwork_utils_ref:
        description: sdkwork-utils commit/ref override.
        required: false
        default: main
      sdkwork_web_framework_ref:
        description: sdkwork-web-framework commit/ref override.
        required: false
        default: main

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-package.yml@2121cc5f1385e8e561171d01fbb71f11adbda187
    with:
      config_path: sdkwork.workflow.json
      tag: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      package_version: ${{ github.event.inputs.package_version || '' }}
      deployment_profile: ${{ github.event.inputs.deployment_profile || 'all' }}
      runtime_target: ${{ github.event.inputs.runtime_target || 'all' }}
      platform: ${{ github.event.inputs.platform || 'all' }}
      architecture: ${{ github.event.inputs.architecture || 'all' }}
      profile: ${{ github.event.inputs.profile || 'all' }}
      variant: ${{ github.event.inputs.variant || 'all' }}
      format: ${{ github.event.inputs.format || 'all' }}
      publish_release: true
      upload_artifact: true
      deploy: ${{ github.event.inputs.deploy == 'true' || github.event_name == 'release' }}
      retention_days: 30
      framework_ref: 2121cc5f1385e8e561171d01fbb71f11adbda187
      dependency_refs_json: >-
        {
          "SDKWORK_ACCOUNT_REF": "${{ vars.SDKWORK_ACCOUNT_REF }}",
          "SDKWORK_AGENTS_REF": "${{ vars.SDKWORK_AGENTS_REF }}",
          "SDKWORK_APP_TOPOLOGY_REF": "${{ vars.SDKWORK_APP_TOPOLOGY_REF }}",
          "SDKWORK_APPBASE_REF": "${{ github.event.inputs.sdkwork_appbase_ref || vars.SDKWORK_APPBASE_REF }}",
          "SDKWORK_ASSETS_REF": "${{ vars.SDKWORK_ASSETS_REF }}",
          "SDKWORK_AUDIO_REF": "${{ vars.SDKWORK_AUDIO_REF }}",
          "SDKWORK_CATALOG_REF": "${{ vars.SDKWORK_CATALOG_REF }}",
          "SDKWORK_CLOUDROUTER_REF": "${{ vars.SDKWORK_CLOUDROUTER_REF }}",
          "SDKWORK_COMMUNITY_REF": "${{ vars.SDKWORK_COMMUNITY_REF }}",
          "SDKWORK_CORE_REF": "${{ github.event.inputs.sdkwork_core_ref || vars.SDKWORK_CORE_REF }}",
          "SDKWORK_COURSE_REF": "${{ vars.SDKWORK_COURSE_REF }}",
          "SDKWORK_DATABASE_REF": "${{ github.event.inputs.sdkwork_database_ref || vars.SDKWORK_DATABASE_REF }}",
          "SDKWORK_DOCUMENTS_REF": "${{ vars.SDKWORK_DOCUMENTS_REF }}",
          "SDKWORK_DRIVE_REF": "${{ github.event.inputs.sdkwork_drive_ref || vars.SDKWORK_DRIVE_REF }}",
          "SDKWORK_FEEDS_REF": "${{ vars.SDKWORK_FEEDS_REF }}",
          "SDKWORK_GENERATIONS_REF": "${{ github.event.inputs.sdkwork_generations_ref || vars.SDKWORK_GENERATIONS_REF }}",
          "SDKWORK_IAM_REF": "${{ vars.SDKWORK_IAM_REF }}",
          "SDKWORK_ID_REF": "${{ vars.SDKWORK_ID_REF }}",
          "SDKWORK_IMAGE_REF": "${{ github.event.inputs.sdkwork_image_ref || vars.SDKWORK_IMAGE_REF }}",
          "SDKWORK_INVENTORY_REF": "${{ vars.SDKWORK_INVENTORY_REF }}",
          "SDKWORK_INVOICE_REF": "${{ vars.SDKWORK_INVOICE_REF }}",
          "SDKWORK_KERNEL_REF": "${{ vars.SDKWORK_KERNEL_REF }}",
          "SDKWORK_KNOWLEDGEBASE_REF": "${{ vars.SDKWORK_KNOWLEDGEBASE_REF }}",
          "SDKWORK_LOG_REF": "${{ vars.SDKWORK_LOG_REF }}",
          "SDKWORK_MEMBERSHIP_REF": "${{ vars.SDKWORK_MEMBERSHIP_REF }}",
          "SDKWORK_MEMORY_REF": "${{ vars.SDKWORK_MEMORY_REF }}",
          "SDKWORK_MERCHANDISE_REF": "${{ vars.SDKWORK_MERCHANDISE_REF }}",
          "SDKWORK_MESSAGING_REF": "${{ vars.SDKWORK_MESSAGING_REF }}",
          "SDKWORK_MODELS_REF": "${{ vars.SDKWORK_MODELS_REF }}",
          "SDKWORK_MUSIC_REF": "${{ vars.SDKWORK_MUSIC_REF }}",
          "SDKWORK_ORDER_REF": "${{ vars.SDKWORK_ORDER_REF }}",
          "SDKWORK_PARTNER_REF": "${{ vars.SDKWORK_PARTNER_REF }}",
          "SDKWORK_PAYMENT_REF": "${{ vars.SDKWORK_PAYMENT_REF }}",
          "SDKWORK_PROMOTION_REF": "${{ vars.SDKWORK_PROMOTION_REF }}",
          "SDKWORK_PROMPTS_REF": "${{ vars.SDKWORK_PROMPTS_REF }}",
          "SDKWORK_RPC_FRAMEWORK_REF": "${{ vars.SDKWORK_RPC_FRAMEWORK_REF }}",
          "SDKWORK_RTC_REF": "${{ vars.SDKWORK_RTC_REF }}",
          "SDKWORK_SANDBOX_REF": "${{ vars.SDKWORK_SANDBOX_REF }}",
          "SDKWORK_SDK_COMMONS_REF": "${{ vars.SDKWORK_SDK_COMMONS_REF }}",
          "SDKWORK_SDK_GENERATOR_REF": "${{ github.event.inputs.sdkwork_sdk_generator_ref || vars.SDKWORK_SDK_GENERATOR_REF }}",
          "SDKWORK_SPECS_REF": "${{ vars.SDKWORK_SPECS_REF }}",
          "SDKWORK_SHOP_REF": "${{ vars.SDKWORK_SHOP_REF }}",
          "SDKWORK_SKILLS_REF": "${{ vars.SDKWORK_SKILLS_REF }}",
          "SDKWORK_TEST_REF": "${{ vars.SDKWORK_TEST_REF }}",
          "SDKWORK_UI_REF": "${{ github.event.inputs.sdkwork_ui_ref || vars.SDKWORK_UI_REF }}",
          "SDKWORK_UTILS_REF": "${{ github.event.inputs.sdkwork_utils_ref || vars.SDKWORK_UTILS_REF }}",
          "SDKWORK_VIDEO_REF": "${{ vars.SDKWORK_VIDEO_REF }}",
          "SDKWORK_VOICE_REF": "${{ vars.SDKWORK_VOICE_REF }}",
          "SDKWORK_WEB_FRAMEWORK_REF": "${{ github.event.inputs.sdkwork_web_framework_ref || vars.SDKWORK_WEB_FRAMEWORK_REF }}"
        }
    secrets: inherit
