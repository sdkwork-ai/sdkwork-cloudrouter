name: Credential Probe (temporary)

# Temporary diagnostic workflow. It reports only whether the container registry
# credentials are visible to this repository (repository-level or organization
# level). It never prints a credential value. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Report credential availability
        env:
          SDKWORK_CONTAINER_REGISTRY_USERNAME: ${{ secrets.SDKWORK_CONTAINER_REGISTRY_USERNAME }}
          SDKWORK_CONTAINER_REGISTRY_PASSWORD: ${{ secrets.SDKWORK_CONTAINER_REGISTRY_PASSWORD }}
          SDKWORK_RELEASE_TOKEN: ${{ secrets.SDKWORK_RELEASE_TOKEN }}
        run: |
          for name in SDKWORK_CONTAINER_REGISTRY_USERNAME SDKWORK_CONTAINER_REGISTRY_PASSWORD SDKWORK_RELEASE_TOKEN; do
            if [ -n "${!name}" ]; then
              echo "$name: PRESENT"
            else
              echo "$name: ABSENT"
            fi
          done
