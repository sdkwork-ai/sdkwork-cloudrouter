name: Materialize SDKWork dependencies
description: >-
  Check out the sibling SDKWork repositories declared by sdkwork.workflow.json
  into the workspace parent directory, at the ref each dependency resolves to
  (main unless a repository variable pins it). This repository's Cargo workspace
  and pnpm workspace address those dependencies by relative path, so no build,
  install, or e2e step can run until they are materialized.

inputs:
  framework-ref:
    required: false
    default: 2121cc5f1385e8e561171d01fbb71f11adbda187
    description: sdkwork-github-workflow ref that provides the checkout action.
  token:
    required: false
    default: ${{ github.token }}
    description: GitHub token used for dependency checkout.
  config-path:
    required: false
    default: sdkwork.workflow.json
    description: Workflow manifest that declares the dependency set.

runs:
  using: composite
  steps:
    # sdkwork-agents records apps/ as a submodule whose URL is SSH
    # (git@github.com:sdkwork-ai/sdkwork-agents-apps.git). A runner has no SSH
    # key, so submodule init would fail; rewrite the scheme to HTTPS first. The
    # dependency clones themselves already use HTTPS and are unaffected.
    - name: Rewrite SSH submodule URLs to HTTPS
      shell: bash
      run: |
        set -euo pipefail
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add safe.directory '*'

    - name: Checkout workflow framework
      uses: actions/checkout@v4
      with:
        repository: sdkwork-ai/sdkwork-github-workflow
        ref: ${{ inputs.framework-ref }}
        path: .sdkwork/github-workflow
        fetch-depth: 1
        token: ${{ inputs.token }}

    - id: dependencies
      name: Resolve dependency checkout plan
      shell: bash
      env:
        SDKWORK_CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail
        node .sdkwork/github-workflow/scripts/sdkwork-workflow.mjs dependencies \
          --config "${SDKWORK_CONFIG_PATH}" \
          --github-output

    - name: Checkout declared dependencies
      uses: ./.sdkwork/github-workflow/actions/checkout-dependencies
      with:
        dependencies-json: ${{ steps.dependencies.outputs.dependencies }}
        token: ${{ inputs.token }}

    # The framework's composite action runs `git clone` as a native command, so
    # a non-zero exit does not stop it: a dependency that fails to clone is
    # silently absent, and the job then dies much later with a confusing
    # downstream error. A private repository cloned with the workflow
    # GITHUB_TOKEN reports "repository ... not found", because that token is
    # scoped to this repository alone. Verify every planned path exists and
    # name the repository that is missing.
    # sdkwork-agents keeps its PC packages in a separate repository,
    # sdkwork-agents-apps, recorded in the parent tree as a gitlink at apps/
    # whose URL is SSH. The dependency plan declares `submodules: false`, so the
    # checkout leaves apps/ empty, and the pnpm workspace then cannot resolve
    # @sdkwork/agents-pc-agents and the other agents packages. Materialize the
    # revision the parent tree pins, over HTTPS, at the revision it records so
    # this never goes stale when main moves.
    - name: Materialize the sdkwork-agents apps submodule
      shell: bash
      env:
        SDKWORK_AGENTS_APPS_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        target="../sdkwork-agents/apps"
        marker="$target/sdkwork-agents-pc/package.json"
        if [ -f "$marker" ]; then
          echo "[sdkwork-agents-apps] already materialized"
          exit 0
        fi
        pinned="$(git -C ../sdkwork-agents rev-parse "HEAD:apps" 2>/dev/null || true)"
        if [ -z "$pinned" ]; then
          echo "[sdkwork-agents-apps] sdkwork-agents records no apps gitlink; nothing to materialize"
          exit 0
        fi
        echo "[sdkwork-agents-apps] materializing $target at $pinned"
        mkdir -p "$target"
        if [ ! -d "$target/.git" ]; then
          git -C "$target" init --quiet
        fi
        git -C "$target" remote remove origin >/dev/null 2>&1 || true
        git -C "$target" remote add origin https://github.com/sdkwork-ai/sdkwork-agents-apps.git
        basic="$(printf 'x-access-token:%s' "$SDKWORK_AGENTS_APPS_TOKEN" | base64 -w0)"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
          -C "$target" fetch --depth 1 origin "$pinned"
        git -C "$target" checkout --detach FETCH_HEAD

    - name: Verify every declared dependency was checked out
      shell: bash
      env:
        SDKWORK_DEPENDENCY_PLAN_JSON: ${{ steps.dependencies.outputs.dependencies }}
      run: |
        set -euo pipefail
        node -e '
        const fs = require("fs");
        const plan = JSON.parse(process.env.SDKWORK_DEPENDENCY_PLAN_JSON ?? "{}");
        const include = plan.include ?? [];
        const missing = include
          .filter((entry) => !entry.path || !fs.existsSync(entry.path))
          .map((entry) => `${entry.repository} -> ${entry.path}`);
        if (missing.length > 0) {
          console.error("dependency checkout left these repositories absent:");
          for (const entry of missing) console.error("  " + entry);
          console.error("A private dependency cloned with the workflow GITHUB_TOKEN reports 404; pass a token with cross-repository read access.");
          process.exit(1);
        }
        console.log(`dependency checkout verified: ${include.length} repositories present`);
        '
