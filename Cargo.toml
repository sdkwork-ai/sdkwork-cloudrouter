resolver = "2"

[profile.dev]
debug = 1
incremental = true

# Compile third-party and workspace dependencies without debug info to cut dev build time.
[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.test]
debug = 1

[workspace.package]
edition = "2021"
version = "0.3.0"
license-file = "LICENSE"

[workspace.dependencies]
sdkwork-api-cloud-gateway-registry = { path = "../sdkwork-api-cloud-gateway/crates/sdkwork-api-cloud-gateway-registry" }
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22.1"
bytes = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
hmac = "0.12.1"
futures-core = "0.3.32"
futures-util = "0.3.32"
getrandom = "0.3"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
hex = "0.4.3"
ring = "0.17.14"
redis = { version = "1.2.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "net", "time", "test-util", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1"
prometheus = "0.13"
dashmap = "6"
# OpenTelemetry / OTLP observability stack (M-5: wire OTLP exporter into tracing_setup)
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"

