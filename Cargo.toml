resolver = "2"

[profile.dev]
debug = 1
incremental = true

# Compile third-party and workspace dependencies without debug info to cut dev build time.
[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.test]
debug = 1

# Release binaries ship inside the container image and native installers:
# strip debug symbols and favor size so image/installer payloads stay small
# enough for commercial distribution (registry pulls, offline packages).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.package]
edition = "2021"
version = "0.3.0"
license-file = "LICENSE"

[workspace.dependencies]
sdkwork-api-cloudrouter-assembly = { path = "crates/sdkwork-api-cloudrouter-assembly" }
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
url = "2.5"
hmac = "0.12.1"
futures-core = "0.3.32"
futures-util = "0.3.32"
getrandom = "0.3"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
hex = "0.4.3"
ring = "0.17.14"
redis = { version = "1.2.1", default-features = false, features = ["tokio-comp", "connection-manager", "script", "streams"] }
sha2 = "0.10.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "net", "time", "test-util", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
# tracing 0.1.42+ previously triggered nondeterministic rustc const-eval ICEs on
# Windows in FieldName (observed with rustc 1.90/1.91); verified clean on rustc
# 1.97.1, so the caret range keeps 0.1.x patch upgrades available for the IM
# workspace's aws-runtime 1.8+ requirement (tracing ^0.1.44).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1"
arc-swap = "1.9"
prometheus = "0.13"
dashmap = "6"
# OpenTelemetry / OTLP observability stack (M-5: wire OTLP exporter into tracing_setup)
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-rustls", "trace"] }
tracing-opentelemetry = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

