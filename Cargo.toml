# SDKWork database dependencies
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx" }
sdkwork-database-repository = { path = "../sdkwork-database/crates/sdkwork-database-repository" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id" }
sdkwork-cloudrouter-database-host = { path = "crates/sdkwork-cloudrouter-database-host" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }

# SDKWork log foundation (request logs): host-neutral API assembly owns the
# query router, capture layer, and `log_request` module lifecycle; consuming
# applications compose the dependency surface through this assembly entrypoint
# (API_ASSEMBLY_SPEC.md §3/§6.1, DATABASE_SPEC_PROCESS_SHARED_POOL.md §2/§4).
sdkwork-api-log-assembly = { path = "../sdkwork-log/crates/sdkwork-api-log-assembly" }

# Asymmetric cryptography for per-tenant session token signing
rsa = { version = "0.9", features = ["pem"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "1.0"

# SDKWork agents/kernel websocket upstream forks (same patch as sdkwork-agents
# workspace): codex app-server-client requires the proxy feature supplied by
# these forks; version requirements not satisfied by the fork keep crates.io.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
