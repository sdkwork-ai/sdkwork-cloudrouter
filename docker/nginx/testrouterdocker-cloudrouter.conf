# sdkwork-cloudrouter docker test domains -> container gateway.
# Windows hosts: 127.0.0.1 testrouterdocker.sdkwork.com testdocker.dtuplay.com testdocker.birdcoder.com
# The gateway serves the default site for Host localhost:3903 and uses
# X-Forwarded-Host for public URL generation, so the real domain is preserved.
server {
    listen 80;
    listen [::]:80;
    server_name testrouterdocker.sdkwork.com testdocker.sdkwork.com testdocker.dtuplay.com testdocker.birdcoder.com;

    access_log /var/log/nginx/testrouterdocker-cloudrouter.access.log;
    error_log /var/log/nginx/testrouterdocker-cloudrouter.error.log;

    location / {
        proxy_pass http://127.0.0.1:3903;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3903;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1100m;
    }
}
