# SDKWork API Gateway config bundle for sdkwork-clawrouter (production)
# Owned by sdkwork-api-cloud-gateway; this repository ships the config bundle only.

[server]
bind = "0.0.0.0:443"

[claw-router]
application_public_http_url = "https://clawrouter.sdkwork.com"
application_backend_http_url = "https://clawrouter-admin.sdkwork.com"
application_open_http_url = "https://clawrouter.sdkwork.com"
