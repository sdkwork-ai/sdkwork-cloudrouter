# Named Adaptive Web locations (SDKWORK_DEPLOY_SPEC.md section 8.1).
# Installed package roots: /usr/share/sdkwork/router/web/{pc,h5}.
#
# /assets/ MUST NOT fall through to the SPA document. Every release replaces the
# whole content-hashed chunk set, so a browser that still holds the previous
# document (open tab, bfcache) asks for chunk names that no longer exist. The
# historical `try_files $uri $uri/ /index.html` answered those requests with
# index.html (HTTP 200, text/html), and the strict module MIME check aborted the
# page with "Expected a JavaScript-or-Wasm module script but the server
# responded with a MIME type of text/html" instead of reporting a missing file.
#
# Resolution order for /assets/:
#   1. the live release root,
#   2. the retained chunks of recent releases under <surface>.legacy/assets
#      (fed by ../retain-adaptive-web-assets.sh from the deploy rollback dirs),
#   3. 404.
location ^~ /assets/ {
    root /usr/share/sdkwork/router/web/$sdkwork_webserver_surface_final;
    try_files $uri @sdkwork_adaptive_previous_assets;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location @sdkwork_adaptive_previous_assets {
    root /usr/share/sdkwork/router/web/$sdkwork_webserver_surface_final.legacy;
    try_files $uri =404;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Root-level entry payloads (runtime-env.js, credential-entry-bootstrap-*.js,
# openapi.json, favicon assets) are module/document resources too: answer 404
# instead of handing back the SPA document with a non-JS content type.
location ~* ^/[^/]+\.(?:js|mjs|css|map|wasm|json|svg|png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$ {
    root /usr/share/sdkwork/router/web/$sdkwork_webserver_surface_final;
    try_files $uri =404;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control $sdkwork_webserver_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location @pc {
    root /usr/share/sdkwork/router/web/pc;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control $sdkwork_webserver_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location @h5 {
    root /usr/share/sdkwork/router/web/h5;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Vary "User-Agent, Sec-CH-UA-Mobile" always;
    add_header Cache-Control $sdkwork_webserver_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
