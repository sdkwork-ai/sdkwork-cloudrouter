environment = "staging"

[http]

[http.certificates]

[http.certificates."sdkwork.com"]
certFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.com/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.com/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.com/chain.pem"
ocspStapling = true

[http.certificates."birdcoder.com"]
certFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.com/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.com/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.com/chain.pem"
ocspStapling = true

[http.certificates."dtupay.com"]
certFile = "/etc/sdkwork/certs/letsencrypt/dtupay.com/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/dtupay.com/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/dtupay.com/chain.pem"
ocspStapling = true

[http.certificates."sdkwork.cn"]
certFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.cn/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.cn/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/sdkwork.cn/chain.pem"
ocspStapling = true

[http.certificates."birdcoder.cn"]
certFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.cn/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.cn/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/birdcoder.cn/chain.pem"
ocspStapling = true

[http.certificates."dtupay.cn"]
certFile = "/etc/sdkwork/certs/letsencrypt/dtupay.cn/fullchain.pem"
certKeyFile = "/etc/sdkwork/certs/letsencrypt/dtupay.cn/privkey.pem"
chainFile = "/etc/sdkwork/certs/letsencrypt/dtupay.cn/chain.pem"
ocspStapling = true

[[http.server]]
listen = ["80"]
serverName = ["router-staging.sdkwork.com", "router-staging.birdcoder.com", "router-staging.dtupay.com", "router-staging.sdkwork.cn", "router-staging.birdcoder.cn", "router-staging.dtupay.cn", "cloudrouter-staging.sdkwork.com", "router-admin-staging.sdkwork.com", "router-admin-staging.birdcoder.com", "router-admin-staging.dtupay.com", "router-admin-staging.sdkwork.cn", "router-admin-staging.birdcoder.cn", "router-admin-staging.dtupay.cn", "router-open-staging.sdkwork.com", "router-open-staging.birdcoder.com", "router-open-staging.dtupay.com", "router-open-staging.sdkwork.cn", "router-open-staging.birdcoder.cn", "router-open-staging.dtupay.cn"]

[[http.server.location]]
match = "/api/"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]

[[http.server.location]]
match = "/"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyBuffering = false
proxyReadTimeout = "300s"

