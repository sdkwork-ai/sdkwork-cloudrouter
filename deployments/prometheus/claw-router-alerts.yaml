# Claw Router production alerting rules.
# Availability treats HTTP 5xx as service failures; 4xx remains caller-visible
# traffic but does not consume the service availability budget.

groups:
  - name: clawrouter-availability-burn-rate
    interval: 30s
    rules:
      - alert: ClawRouterAvailabilityFastBurn
        expr: |
          (
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[1h])
            )
            /
            clamp_min(
              sum by (service, environment, deployment_profile, runtime_target) (
                rate(sdkwork_http_requests_labeled_total{environment="production"}[1h])
              ),
              0.001
            )
          ) > 14.4 * 0.001
          and
          (
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[5m])
            )
            /
            clamp_min(
              sum by (service, environment, deployment_profile, runtime_target) (
                rate(sdkwork_http_requests_labeled_total{environment="production"}[5m])
              ),
              0.001
            )
          ) > 14.4 * 0.001
        for: 5m
        labels:
          severity: critical
          slo: availability
          burn_rate: fast
        annotations:
          summary: "Claw Router availability budget is burning rapidly"
          description: "The 1h and 5m HTTP 5xx ratios both exceed the 14.4x burn-rate threshold."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterAvailabilityMediumBurn
        expr: |
          (
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[6h])
            )
            /
            clamp_min(
              sum by (service, environment, deployment_profile, runtime_target) (
                rate(sdkwork_http_requests_labeled_total{environment="production"}[6h])
              ),
              0.001
            )
          ) > 6 * 0.001
          and
          (
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[30m])
            )
            /
            clamp_min(
              sum by (service, environment, deployment_profile, runtime_target) (
                rate(sdkwork_http_requests_labeled_total{environment="production"}[30m])
              ),
              0.001
            )
          ) > 6 * 0.001
        for: 30m
        labels:
          severity: warning
          slo: availability
          burn_rate: medium
        annotations:
          summary: "Claw Router availability budget is burning"
          description: "The 6h and 30m HTTP 5xx ratios both exceed the 6x burn-rate threshold."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterAvailabilitySlowBurn
        expr: |
          (
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[3d])
            )
            /
            clamp_min(
              sum by (service, environment, deployment_profile, runtime_target) (
                rate(sdkwork_http_requests_labeled_total{environment="production"}[3d])
              ),
              0.001
            )
          ) > 0.001
          and
          (
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[6h])
            )
            /
            clamp_min(
              sum by (service, environment, deployment_profile, runtime_target) (
                rate(sdkwork_http_requests_labeled_total{environment="production"}[6h])
              ),
              0.001
            )
          ) > 0.001
        for: 3h
        labels:
          severity: warning
          slo: availability
          burn_rate: slow
        annotations:
          summary: "Claw Router availability budget has a sustained burn"
          description: "The 3d and 6h HTTP 5xx ratios both exceed the base error-budget rate."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

  - name: clawrouter-http
    interval: 30s
    rules:
      - alert: ClawRouterControlPlaneP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_request_duration_seconds_bucket{
                environment="production",
                api_surface=~"app-api|backend-api"
              }[10m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Claw Router control-plane p95 latency is high"
          description: "The 10m p95 app/backend API latency exceeds the 1 second operational guardrail."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterControlPlaneP99LatencyCritical
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_request_duration_seconds_bucket{
                environment="production",
                api_surface=~"app-api|backend-api"
              }[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Claw Router control-plane p99 latency is critical"
          description: "The 5m p99 app/backend API latency exceeds the 2 second operational guardrail."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterHighServerErrorRate
        expr: |
          sum by (service, environment, deployment_profile, runtime_target) (
            rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[5m])
          )
          /
          clamp_min(
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production"}[5m])
            ),
            0.001
          ) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Claw Router HTTP 5xx rate is elevated"
          description: "The 5m HTTP 5xx ratio exceeds 1%."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterVeryHighServerErrorRate
        expr: |
          sum by (service, environment, deployment_profile, runtime_target) (
            rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[5m])
          )
          /
          clamp_min(
            sum by (service, environment, deployment_profile, runtime_target) (
              rate(sdkwork_http_requests_labeled_total{environment="production"}[5m])
            ),
            0.001
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Claw Router HTTP 5xx rate is critical"
          description: "The 5m HTTP 5xx ratio exceeds 5%."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterOnlyServerErrors
        expr: |
          sum by (service, environment, deployment_profile, runtime_target) (
            rate(sdkwork_http_requests_labeled_total{environment="production",status!~"5.."}[5m])
          ) == 0
          and
          sum by (service, environment, deployment_profile, runtime_target) (
            rate(sdkwork_http_requests_labeled_total{environment="production",status=~"5.."}[5m])
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Claw Router is serving only HTTP 5xx responses"
          description: "Traffic is present, but no non-5xx response has been observed for 5 minutes."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

  - name: clawrouter-infrastructure
    interval: 30s
    rules:
      - alert: ClawRouterMetricsUnavailable
        expr: up{pod=~"sdkwork-(api-)?clawrouter-.*"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Claw Router metrics endpoint is unavailable"
          description: "Prometheus cannot scrape a discovered Claw Router pod."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterReadinessFailure
        expr: increase(sdkwork_http_readiness_checks_total{result="not_ready"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Claw Router readiness checks are failing"
          description: "At least one required dependency readiness check failed in the last 5 minutes."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterMetricSeriesDropped
        expr: increase(sdkwork_http_metric_series_dropped_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Claw Router dropped bounded metric series"
          description: "The HTTP metric registry rejected a new series because its fixed capacity or label-byte bound was reached."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterContainerMemoryHigh
        expr: |
          (
            container_memory_working_set_bytes{
              pod=~"sdkwork-(api-)?clawrouter-.*",
              container!="",
              container!="POD"
            }
            /
            on (namespace, pod, container)
            clamp_min(
              container_spec_memory_limit_bytes{
                pod=~"sdkwork-(api-)?clawrouter-.*",
                container!="",
                container!="POD"
              },
              1
            )
          ) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Claw Router container memory exceeds 80% of its limit"
          description: "The container working set is approaching its declared cgroup memory limit."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"

      - alert: ClawRouterContainerOOMKilled
        expr: |
          kube_pod_container_status_last_terminated_reason{
            pod=~"sdkwork-(api-)?clawrouter-.*",
            reason="OOMKilled"
          } == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Claw Router container was OOM-killed"
          description: "Kubernetes reports OOMKilled as the most recent container termination reason."
          runbook_url: "https://github.com/Sdkwork-Cloud/sdkwork-clawrouter/blob/main/docs/runbooks/observability-alert-response.md"
