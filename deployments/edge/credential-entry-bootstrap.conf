# Credential-entry bootstrap Access-Token delivery (trusted host channel).
# The deployed cloud portal is static; the serving edge injects the
# IAM-signed, short-lived bootstrap token through this no-store script so the
# credential-entry client can dispatch login/registration requests
# (IAM_CREDENTIAL_ENTRY_SPEC.md §4/§5, sdkwork-webserver test-package pattern).
location = /__sdkwork/credential-entry-bootstrap.js {
    alias /etc/sdkwork/cloudrouter/credential-entry-bootstrap/credential-entry-bootstrap.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log off;
}
