version: 2
defaultProfile: cloud.production

profiles:
  cloud.test:
    deployment:
      deploymentProfile: cloud
      environment: test
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: router-test.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        aliases:
          - router-test.birdcoder.com
          - router-test.dtupay.com
          - cloudrouter-test.sdkwork.com
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.test
        env: etc/topology/cloud.test.env

  cloud.staging:
    deployment:
      deploymentProfile: cloud
      environment: staging
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: router-staging.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        aliases:
          - router-staging.birdcoder.com
          - router-staging.dtupay.com
          - cloudrouter-staging.sdkwork.com
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.staging
        env: etc/topology/cloud.staging.env
      kubernetes:
        reference: deployments/kubernetes/

  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: router.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        aliases:
          - router.birdcoder.com
          - router.dtupay.com
          - cloudrouter.sdkwork.com
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/

  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - domain: router.internal.example
        tls: managed
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
    packages:
      - desktop-windows
      - desktop-macos
      - desktop-linux
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:3900
          platform.api-gateway: http://127.0.0.1:3902
