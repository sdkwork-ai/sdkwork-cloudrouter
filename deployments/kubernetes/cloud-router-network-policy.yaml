# Network policies for sdkwork-cloudrouter.
# Implements zero-trust segmentation: deny-all default + explicit allow rules
# for each component's required ingress traffic.

---
# Default deny-all ingress for the cloudrouter namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-default-deny
  labels:
    app: sdkwork-cloudrouter
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
  policyTypes:
    - Ingress
    - Egress
---
# Edge: accept external traffic on port 3900.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-edge-ingress
  labels:
    app: sdkwork-cloudrouter
    component: edge
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: edge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3900
---
# Gateway: accept traffic from edge on port 18080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-gateway-ingress
  labels:
    app: sdkwork-cloudrouter
    component: gateway
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: edge
      ports:
        - protocol: TCP
          port: 18080
---
# Admin API: accept traffic from edge on port 18081.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-admin-api-ingress
  labels:
    app: sdkwork-cloudrouter
    component: admin-api
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: admin-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: edge
      ports:
        - protocol: TCP
          port: 18081
---
# App API: accept traffic from edge on port 18082.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-app-api-ingress
  labels:
    app: sdkwork-cloudrouter
    component: app-api
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: app-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: edge
      ports:
        - protocol: TCP
          port: 18082
---
# Redis: accept traffic from gateway/admin-api/app-api/edge on port 6379
# and from other Redis pods on port 26379 (sentinel gossip).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-redis-ingress
  labels:
    app: sdkwork-cloudrouter
    component: redis
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: gateway
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: admin-api
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: app-api
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: edge
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
---
# Egress: allow all cloudrouter pods to reach DNS, Postgres, and Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-egress
  labels:
    app: sdkwork-cloudrouter
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - ports:
        - protocol: TCP
          port: 5432
    # Redis (internal)
    - to:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Internal service-to-service (edge → gateway/admin-api/app-api)
    - to:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
      ports:
        - protocol: TCP
          port: 18080
        - protocol: TCP
          port: 18081
        - protocol: TCP
          port: 18082
    # Provider HTTPS is intentionally absent here. The required Cilium FQDN
    # policy owns that allowlist without opening a generic port-443 escape.
