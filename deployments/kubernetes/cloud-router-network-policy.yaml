# Network policies for sdkwork-cloudrouter.
# Implements zero-trust segmentation: deny-all default + explicit allow rules
# for the standalone deployment's required ingress/egress traffic.

---
# Default deny-all ingress for the cloudrouter namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-default-deny
  labels:
    app: sdkwork-cloudrouter
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
  policyTypes:
    - Ingress
    - Egress
---
# Standalone: accept external traffic on port 3900 (the single application
# public ingress served by the all-in-one cloudrouter binary).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-standalone-ingress
  labels:
    app: sdkwork-cloudrouter
    component: standalone
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: standalone
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3900
---
# Redis: accept traffic from the standalone pod on port 6379 and from other
# Redis pods on port 26379 (sentinel gossip).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-redis-ingress
  labels:
    app: sdkwork-cloudrouter
    component: redis
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: standalone
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
---
# Egress: allow all cloudrouter pods to reach DNS, Postgres, and Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-cloudrouter-egress
  labels:
    app: sdkwork-cloudrouter
spec:
  podSelector:
    matchLabels:
      app: sdkwork-cloudrouter
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - ports:
        - protocol: TCP
          port: 5432
    # Redis (internal)
    - to:
        - podSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Provider HTTPS is intentionally absent here. The required Cilium FQDN
    # policy owns that allowlist without opening a generic port-443 escape.
