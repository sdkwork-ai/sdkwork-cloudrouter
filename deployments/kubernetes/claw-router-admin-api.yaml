apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-clawrouter-admin-api
  labels:
    app: sdkwork-clawrouter
    component: admin-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdkwork-clawrouter
      component: admin-api
  template:
    metadata:
      labels:
        app: sdkwork-clawrouter
        component: admin-api
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: admin-api
      containers:
        - name: admin-api
          image: registry.sdkwork.com/apps/sdkwork-clawrouter:0.3.0
          command: ["sdkwork-clawrouter-admin-gateway"]
          ports:
            - containerPort: 18081
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: SDKWORK_CLAW_ROUTER_CONFIG_PROFILE
              value: prod
            - name: SDKWORK_CLAW_ROUTER_ENVIRONMENT
              value: production
            - name: SDKWORK_CLAW_ROUTER_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_CLAW_ROUTER_RUNTIME_TARGET
              value: container
            - name: SDKWORK_CLAW_CONFIG_FILE
              value: /etc/sdkwork/clawrouter.toml
            - name: SDKWORK_CLAW_ADMIN_API_BIND
              value: 0.0.0.0:18081
            - name: SDKWORK_CLAW_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-clawrouter-config
                  key: redis-url
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/sdkwork
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: sdkwork-clawrouter-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sdkwork-clawrouter-admin-api
spec:
  selector:
    app: sdkwork-clawrouter
    component: admin-api
  ports:
    - name: http
      port: 18081
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sdkwork-clawrouter-admin-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sdkwork-clawrouter
      component: admin-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sdkwork-clawrouter-admin-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sdkwork-clawrouter-admin-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
