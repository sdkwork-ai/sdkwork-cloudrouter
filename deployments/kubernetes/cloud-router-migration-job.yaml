apiVersion: batch/v1
kind: Job
metadata:
  name: sdkwork-cloudrouter-db-upgrade-0-3-0
  labels:
    app: sdkwork-cloudrouter
    component: migration
    app.kubernetes.io/version: 0.3.0
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: sdkwork-cloudrouter
        component: migration
        app.kubernetes.io/version: 0.3.0
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upgrade
          image: ghcr.io/sdkwork-cloudrouter/cloudrouter:0.3.0
          command: ["cloudrouterctl", "upgrade"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # Deployment identity (DEPLOYMENT_SPEC §5.2): the standalone image
            # defaults to profile=standalone, target=container. Explicit here so
            # the Job cannot drift from the runtime workloads.
            - name: SDKWORK_CLOUDROUTER_DEPLOYMENT_PROFILE
              value: standalone
            - name: SDKWORK_CLOUDROUTER_RUNTIME_TARGET
              value: container
            - name: SDKWORK_CLOUDROUTER_CONFIG_FILE
              value: /etc/sdkwork/router/config.toml
            - name: SDKWORK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-cloudrouter-config
                  key: database-migrator-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/sdkwork/router
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: sdkwork-cloudrouter-config
        - name: tmp
          emptyDir: {}
