apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-cloudrouter-admin-api
  labels:
    app: sdkwork-cloudrouter
    component: admin-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: admin-api
  template:
    metadata:
      labels:
        app: sdkwork-cloudrouter
        component: admin-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "18081"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sdkwork-cloudrouter
              component: admin-api
      containers:
        - name: admin-api
          image: registry.sdkwork.com/apps/sdkwork-cloudrouter:0.3.0
          command: ["sdkwork-cloudrouter-admin-gateway"]
          ports:
            - containerPort: 18081
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: SDKWORK_CLOUDROUTER_ROUTER_CONFIG_PROFILE
              value: prod
            - name: SDKWORK_CLOUDROUTER_ROUTER_ENVIRONMENT
              value: production
            - name: SDKWORK_CLOUDROUTER_ROUTER_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_CLOUDROUTER_ROUTER_RUNTIME_TARGET
              value: container
            - name: SDKWORK_CLOUDROUTER_ROUTER_REGION_CODE
              value: cn
            - name: SDKWORK_DATABASE_SEED_LOCALE
              value: zh-CN
            - name: SDKWORK_NODE_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SDKWORK_NODE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: SDKWORK_CLOUDROUTER_CONFIG_FILE
              value: /etc/sdkwork/config.toml
            - name: SDKWORK_CLOUDROUTER_ADMIN_API_BIND
              value: 0.0.0.0:18081
            - name: SDKWORK_CLOUDROUTER_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-cloudrouter-redis-auth
                  key: redis-url
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/sdkwork
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: sdkwork-cloudrouter-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sdkwork-cloudrouter-admin-api
spec:
  selector:
    app: sdkwork-cloudrouter
    component: admin-api
  ports:
    - name: http
      port: 18081
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sdkwork-cloudrouter-admin-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sdkwork-cloudrouter
      component: admin-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sdkwork-cloudrouter-admin-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sdkwork-cloudrouter-admin-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
