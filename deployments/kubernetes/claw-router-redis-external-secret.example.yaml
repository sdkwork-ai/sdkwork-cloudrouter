# Production Redis credentials MUST be supplied through sealed-secrets or external-secrets.
# Do not deploy claw-router-redis.yaml placeholder passwords in production clusters.
#
# Example ExternalSecret (requires external-secrets operator):
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: sdkwork-clawrouter-redis-auth
#   namespace: sdkwork-clawrouter
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: sdkwork-secret-store
#     kind: ClusterSecretStore
#   target:
#     name: sdkwork-clawrouter-redis-auth
#     creationPolicy: Owner
#   data:
#     - secretKey: redis-password
#       remoteRef:
#         key: clawrouter/redis
#         property: password
#     - secretKey: redis-url
#       remoteRef:
#         key: clawrouter/redis
#         property: url
#
# Production Redis URLs MUST use TLS: rediss://:password@host:6379/0
