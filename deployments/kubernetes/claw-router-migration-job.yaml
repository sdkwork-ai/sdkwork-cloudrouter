apiVersion: batch/v1
kind: Job
metadata:
  name: sdkwork-clawrouter-db-upgrade-0-3-0
  labels:
    app: sdkwork-clawrouter
    component: migration
    app.kubernetes.io/version: 0.3.0
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: sdkwork-clawrouter
        component: migration
        app.kubernetes.io/version: 0.3.0
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: upgrade
          image: registry.sdkwork.com/apps/sdkwork-clawrouter:0.3.0
          command: ["clawrouterctl", "upgrade"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: SDKWORK_CLAW_ROUTER_CONFIG_PROFILE
              value: prod
            - name: SDKWORK_CLAW_ROUTER_ENVIRONMENT
              value: production
            - name: SDKWORK_CLAW_ROUTER_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_CLAW_ROUTER_RUNTIME_TARGET
              value: container
            - name: SDKWORK_CLAW_CONFIG_FILE
              value: /etc/sdkwork/clawrouter.toml
            - name: SDKWORK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-clawrouter-config
                  key: database-migrator-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/sdkwork
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: sdkwork-clawrouter-config
        - name: tmp
          emptyDir: {}
