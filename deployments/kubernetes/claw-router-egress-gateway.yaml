# Reference egress gateway namespace for provider HTTPS egress pinning.
# Pair with claw-router-network-policy.yaml `egress-gateway` selector rules.
#
# Production: deploy an L7-aware proxy (Envoy, Squid, Cilium egress gateway, or Istio
# egress gateway) in this namespace and enforce the documented provider FQDN allowlist.

---
apiVersion: v1
kind: Namespace
metadata:
  name: egress-gateway
  labels:
    app: sdkwork-clawrouter
    component: egress-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: egress-gateway
  namespace: egress-gateway
  labels:
    app: egress-gateway
    component: egress-gateway
spec:
  selector:
    app: egress-gateway
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-gateway
  namespace: egress-gateway
  labels:
    app: egress-gateway
    component: egress-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: egress-gateway
  template:
    metadata:
      labels:
        app: egress-gateway
        component: egress-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.33-latest
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: egress-gateway-envoy-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-gateway-envoy-config
  namespace: egress-gateway
  labels:
    app: egress-gateway
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: https_egress
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8443
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_https
                    route_config:
                      name: provider_routes
                      virtual_hosts:
                        - name: provider_allowlist
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: dynamic_forward
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: dynamic_forward
          connect_timeout: 5s
          type: LOGICAL_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: dynamic_forward
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 65535
