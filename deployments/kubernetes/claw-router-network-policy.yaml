# Network policies for sdkwork-clawrouter.
# Implements zero-trust segmentation: deny-all default + explicit allow rules
# for each component's required ingress traffic.

---
# Default deny-all ingress for the clawrouter namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-clawrouter-default-deny
  labels:
    app: sdkwork-clawrouter
spec:
  podSelector:
    matchLabels:
      app: sdkwork-clawrouter
  policyTypes:
    - Ingress
    - Egress
---
# Edge: accept external traffic on port 3900.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-clawrouter-edge-ingress
  labels:
    app: sdkwork-clawrouter
    component: edge
spec:
  podSelector:
    matchLabels:
      app: sdkwork-clawrouter
      component: edge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3900
---
# Gateway: accept traffic from edge on port 18080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-clawrouter-gateway-ingress
  labels:
    app: sdkwork-clawrouter
    component: gateway
spec:
  podSelector:
    matchLabels:
      app: sdkwork-clawrouter
      component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: edge
      ports:
        - protocol: TCP
          port: 18080
---
# Admin API: accept traffic from edge on port 18081.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-clawrouter-admin-api-ingress
  labels:
    app: sdkwork-clawrouter
    component: admin-api
spec:
  podSelector:
    matchLabels:
      app: sdkwork-clawrouter
      component: admin-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: edge
      ports:
        - protocol: TCP
          port: 18081
---
# App API: accept traffic from edge on port 18082.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-clawrouter-app-api-ingress
  labels:
    app: sdkwork-clawrouter
    component: app-api
spec:
  podSelector:
    matchLabels:
      app: sdkwork-clawrouter
      component: app-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: edge
      ports:
        - protocol: TCP
          port: 18082
---
# Redis: accept traffic from gateway/admin-api/app-api/edge on port 6379
# and from other Redis pods on port 26379 (sentinel gossip).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-clawrouter-redis-ingress
  labels:
    app: sdkwork-clawrouter
    component: redis
spec:
  podSelector:
    matchLabels:
      app: sdkwork-clawrouter
      component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: gateway
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: admin-api
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: app-api
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: edge
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
---
# Egress: allow all clawrouter pods to reach DNS, Postgres, and Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-clawrouter-egress
  labels:
    app: sdkwork-clawrouter
spec:
  podSelector:
    matchLabels:
      app: sdkwork-clawrouter
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - ports:
        - protocol: TCP
          port: 5432
    # Redis (internal)
    - to:
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
              component: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Internal service-to-service (edge → gateway/admin-api/app-api)
    - to:
        - podSelector:
            matchLabels:
              app: sdkwork-clawrouter
      ports:
        - protocol: TCP
          port: 18080
        - protocol: TCP
          port: 18081
        - protocol: TCP
          port: 18082
    # HTTPS egress for upstream provider APIs (OpenAI, Anthropic, etc.)
    #
    # H-2 security fix: the previous rule had no `to` selector, which allowed
    # egress to ANY destination IP on port 443 and broke the zero-trust
    # segmentation enforced by `sdkwork-clawrouter-default-deny`. Native
    # Kubernetes NetworkPolicy cannot perform FQDN-based filtering, so this
    # rule now pins HTTPS egress to the dedicated `egress-gateway` namespace
    # and its labeled proxy pods. Operators must run an L7-aware policy engine
    # (Istio, Cilium, or equivalent) in that namespace that enforces an FQDN
    # allowlist for the upstream AI providers below.
    #
    # Expected upstream provider FQDN allowlist (enforced at the egress
    # gateway, NOT by this NetworkPolicy, because Kubernetes NetworkPolicy
    # only sees IP:port):
    #   - api.openai.com
    #   - api.anthropic.com
    #   - generativelanguage.googleapis.com
    #   - dashscope.aliyuncs.com
    #   - tcloudmarket.tencentcloudapi.com
    #
    # Deployment options when an L7 egress gateway is not available:
    #   1. Stand up the `egress-gateway` namespace containing proxy pods
    #      labeled `app: egress-gateway` and apply a Cilium `CiliumNetworkPolicy`
    #      or Istio `AuthorizationPolicy` that allows only the FQDNs above; or
    #   2. Replace the `to` selector below with one or more `to.ipBlock`
    #      entries listing the resolved provider CIDRs. Provider IPs are
    #      dynamic and region-specific, so this option requires a continuous
    #      DNS-to-CIDR refresh process and is weaker than FQDN allowlisting.
    #
    # Leaving the rule without a `to` selector is forbidden because it would
    # permit data exfiltration to any HTTPS endpoint.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress-gateway
          podSelector:
            matchLabels:
              app: egress-gateway
      ports:
        - protocol: TCP
          port: 443
